[tool.poetry]
name = "dotmac_starter_mt"
version = "0.4.0"
description = "Multi-tenant FastAPI starter"
authors = ["DotMac"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
fastapi = "^0.115"
uvicorn = {extras = ["standard"], version = "^0.30"}
gunicorn = "^22.0"
sqlalchemy = "^2.0"
psycopg = {extras = ["binary"], version = "^3.2"}
alembic = "^1.13"
pydantic = "^2.9"
pydantic-settings = "^2.5"
email-validator = "^2.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"
httpx = "^0.27"
ruff = "^0.6"
mypy = "^1.11"
pytest-cov = "^7.1.0"
import-linter = "^2.13"
bandit = "^1.9.4"
pre-commit = "^4.6.0"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "S", "RUF"]
ignore = [
    "B008",  # FastAPI dependency injection uses calls in defaults.
    "S101",  # asserts (tests; also narrowed per-file below)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"alembic/*" = ["E501"]
"scripts/*" = ["S603", "S607"]  # trusted local ops tooling invoking git/docker

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true
warn_unused_ignores = true

[tool.bandit]
exclude_dirs = ["tests", "alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Features are independent of each other"
type = "independence"
modules = [
    "app.features.tenants",
    "app.features.auth",
    "app.features.persons",
    "app.features.rbac",
    "app.features.settings",
]

[[tool.importlinter.contracts]]
name = "Core must not import features"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = ["app.features"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
