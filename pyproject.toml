# The OIDC client is a PROTOCOL package: it speaks to an identity provider and
# ends at a verified (issuer, subject). It must not reach the kernel, because
# "which local party is that" is `dotmac_kernel.external_identity`'s question
# and "may they" is `authorize_party`'s — a client that could query a Party
# would grow both, which is exactly the coupling that makes ERP's copy
# unreusable.
#
# Only the INTERNAL packages are listed, exactly as the `dotmac_ui` contract
# above does: naming an external distribution here would require
# `include_external_packages` on the whole configuration, changing analysis for
# every other contract to express one package's rule. The ORM/web-framework/
# Alembic half lives in the companion pytest guard
# (`tests/architecture/test_auth_oidc_public_surface.py`), which also carries
# the checks import-linter cannot express at all — no local-identity or session
# vocabulary, and no provider name.
[[tool.importlinter.contracts]]
name = "The OIDC client must not import the kernel or the assembly"
type = "forbidden"
source_modules = ["dotmac_auth_oidc"]
forbidden_modules = ["dotmac_kernel", "app"]

[[tool.importlinter.contracts]]
name = "Connector plugins depend only on the integration SPI"
type = "forbidden"
source_modules = ["dotmac_connector_whatsapp"]
forbidden_modules = [
    "app",
    "dotmac_kernel",
    "dotmac_ui",
