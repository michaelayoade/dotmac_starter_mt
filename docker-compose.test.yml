services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: starter_test
      # Disposable localhost-only test DB. The initial Alembic migration creates
      # `app_user` with LOGIN but no password, so TCP auth would fail without this;
      # trust auth is acceptable here because the container only binds to 127.0.0.1
      # on a throwaway port and never holds real data.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "${TEST_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 15
