[tool.poetry]
name = "dotmac-projects"
version = "0.1.0a1"
description = "Dotmac Projects — tenant-scoped project, task, template, dependency, scheduling, and assignment ownership"
authors = ["DotMac"]
readme = "README.md"
packages = [{ include = "dotmac_projects", from = "src" }]
include = [
    { path = "src/dotmac_projects/py.typed", format = ["sdist", "wheel"] },
    { path = "src/dotmac_projects/migrations/**/*", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
dotmac-kernel = ">=0.1.0a75"
sqlalchemy = "^2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
