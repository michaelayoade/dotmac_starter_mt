contract = "Tenant-only hosting-account lifecycle behind provider-neutral hosting.account.v1. Immutable specifications publish package rank and closed change rules; Hosting derives package direction and refuses review-required/incomparable changes. Deliveries are closed self-contained secret-free snapshots; enqueued package/suspension/restoration/termination work remains deferred until an independent immutable observation appends applied or superseded completion evidence. First correlation uses a command operation; later correlation uses the frozen binding/account pair. The final approval.approved event and trusted source-event delivery identity are mirrored as immutable local evidence and never leave in provider payloads. The tenant role cannot update/delete the aggregate directly; one database-owned mutation function enforces tenant, version, evidence and legal transitions. Uncorrelated observations are resolved without mutation. NOT price, subscriptions, orders, collections policy, approval decisions, provider transport/retry, credentials, DNS/domain lifecycle, mailbox lifecycle, website workflow or compute. V1 observes aggregate mailbox count only."
