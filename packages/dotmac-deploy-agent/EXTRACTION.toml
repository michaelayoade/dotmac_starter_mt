first_cutover = "Seabone (staging) is the first enrolled host after the Control release, the CP image carrying the target API, the security review and a signed agent build; nothing is enrolled, released or enabled by landing this package."
shadow_and_drift = "No side-by-side run. The wire contract is proved against a CP double that verifies the PoP signature, binding, clock window and nonce and signs every response; Control's params digest vectors and the Foundation pin-rewrite golden test pin the render rule from the other side."
local_copy_retirement = "The Sub agent shell and the frozen CP deploy_agent retire when this launcher has completed the staging drills; the Sub copy is not deleted by this package."
next_action = "Review lane A (launcher, params, secret_id delivery, M11) and lane B (lease client, governed transfer, reconcile observation, packaging); security review (WP6); signed build and release (WP9) only on the owner's go."

