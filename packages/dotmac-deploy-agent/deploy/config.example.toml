# Keys by name; every value below is a placeholder (documentation ranges only).
# Installed as /etc/dotmac/deploy-agent/<product>.toml, mode 0644 root:root (the
# non-root agent must be able to READ it; never 0600), not group/other writable.
# One instance per product: the systemd instance name IS the product segment of
# target_ref (`dotmac-deploy-agent@erp`), so two products run side by side with
# disjoint run, state and lock directories. Read-back: libexec/check-agent-config.sh.
cp_url = "https://cp.example.invalid"
target_ref = "erp/staging/host-a"            # <product>/<environment>/<host_alias>
credential_id = "cred-placeholder"
cp_response_public_keys_b64url = ["<unpadded base64url 32-byte Ed25519 key>"]  # the CP response key, distinct from Control's dispatch key
cp_spki_sha256 = ["<hex sha256 of the pinned CP SPKI>"]
state_dir = "/var/lib/dotmac-deploy-agent/erp"
deploy_dir = "/opt/dotmac/erp"
foundation_argv = ["/opt/dotmac-deploy-agent/venv/bin/dotmac-deploy", "<arguments>"]
openbao_url = "http://192.0.2.10:8200"       # over WireGuard only
openbao_config_dir = "/etc/dotmac/openbao"            # authored, root-owned; the agent only checks and reports
registry_binary = "/usr/local/libexec/dotmac/registry"
registry_binary_sha256 = "<hex, pinned at enrolment>"
skopeo_path = "/usr/bin/skopeo"
skopeo_sha256 = "<hex, pinned at enrolment>"
skopeo_policy = "/etc/dotmac/skopeo/policy.json"      # enrolment-pinned --policy
reconcile_containers = ["erp-app"]
# Enrolment-pinned OpenBao naming (the kit templates use the same values). The
# signed plan must equal them; a plan that differs is refused.
secrets_namespace = "erp"                 # the descriptor's secrets_namespace, not the product code
secrets_environment = "staging"           # the namespace-env of the <env>/<product> layout

# Role jobs (P-SEC rev4): the host fence. Empty (the default) refuses every
# `run_job` dispatch; the enrolment op names the one role, and I-C1/I-C2 removes it.
# job_roles = ["import"]

# Optional, existing apps only (M11): the relocated original, checked by lstat.
# The content is read ONLY through $CREDENTIALS_DIRECTORY/legacy.
# legacy_source_path = "/etc/dotmac/legacy/erp-staging-host-a.env"

# The names the CP bindings already require, from this root-owned file.
[bindings_env]
HOST_ADMISSION_MATERIALS = "/etc/dotmac/bindings/host-admission.json"
EXECUTION_CONTEXT_MATERIALS = "/etc/dotmac/bindings/execution-context.json"
AUTHORIZATION_VERIFICATION_IDENTITY = "/etc/dotmac/identities/authorization.json"
DISPATCH_VERIFICATION_IDENTITY = "/etc/dotmac/identities/dispatch.json"   # also what the agent verifies the dispatch with
RELEASE_EVIDENCE_VERIFICATION_IDENTITY = "/etc/dotmac/identities/release-evidence.json"
RELEASE_EVIDENCE_REPOSITORY = "<release evidence repository>"
