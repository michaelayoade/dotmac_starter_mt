adoption_evidence = []
composition_boundary = "ADR-0024: the vendor control plane installs its own li lineage and owns its own licence rows; no application shares a mod_licensing schema. ADR-0033 s8: the module imports no sibling — agreement and allocation facts arrive as a LicensableGrant value from the assembly. ADR-0006 D2/D4: kernel WS8 is the sole target licence protocol and the dotmac-* schema ids are permanent, so this module issues what dotmac_kernel.licensing already verifies and introduces no second format; the round-trip check makes that structural rather than aspirational. ADR-0009 / hard rule 20: LicenceSigner is a port with no implementation in this package and signing_keys has no private-key column, so custody stays with the product. ADR-0024 / hard rule 28: transport, connection refs, attempt counters, retry outcomes and error codes stayed with the Integrator — this module ends at a signed envelope and resumes at an acknowledgement. ADR-0023 / ADR-0033 s7: platform plane only, and here the plane is a security boundary — issuance must not live inside the deployment it authorises, and the receiving half verifies offline."
inventory_evidence = [
  "docs/inventories/vendor-cp-gap-sources.md",
  "docs/adr/0033-the-vendor-control-plane-composes-existing-owners.md",
]
first_cutover = "Not started. The vendor control plane is the named first adopter and the only candidate: it holds the qualifying implementation, and cutover means retiring the issuer half of src/vendor_cp/licensing/ in favour of an exact pin plus a typed assembly adapter that supplies the LicenceSigner from the product's own secret seam. That change belongs to the Vendor repository and to a later task, which is why this dossier sits at `audit-complete` rather than `adopted` — a module that has never run in a product database has no adoption evidence, and recording one it does not have is the defect ADR-0031 seals against."
shadow_and_drift = "No shadow phase is owed: the capability exists in exactly one product, so there is no second writer to reconcile against and no parallel evaluator to compare. What IS owed at cutover is a data-bearing migration under three constraints that have no equivalent in the other modules. (1) Every issued digest and envelope must be preserved BYTE-FOR-BYTE. An envelope is signed; re-serialising it changes the digest, which invalidates the signature and turns every deployed licence into one the receiver rejects. The migration copies bytes and never rebuilds a payload. (2) Signing keys migrate as PUBLIC material only, and the private half is re-installed through the product's secret seam at the new composition — never read, exported or copied by the migration. (3) The revocation list lineage must continue at the existing list_version, and the first list published after cutover must be a superset of the last one published before it; the cumulative rule spans the cutover, because the fleet's imported state does not reset when the issuer's code does. A populated legacy table encountered at cutover must fail the migration, not be silently skipped."
local_copy_retirement = "Owed by dotmac_vendor_control_plane at cutover: the ISSUER half of src/vendor_cp/licensing/ — service.py, models.py, revocation.py, revocation_models.py, signer.py, ops.py — plus the licences, licence_issuances, licence_signing_keys, licence_revocation_entries and licence_revocation_lists tables. The vendor keeps its routes, its console screens, and a thin adapter that builds a LicenceSigner from OpenBao-materialised key files. It also keeps, unchanged and NOT retired by this extraction, the DELIVERY half — transport.py, delivery_models.py and the delivery portion of projection.py — until that capability is composed onto the Integrator under ADR-0024; conflating the two retirements would strand delivery with no owner. No product may keep a compatibility licences table or a parallel issuer."
next_action = "Compose in the vendor control plane: exact-pin dotmac-licensing 0.1.0a1 and dotmac-kernel 0.1.0a77, install the li lineage with its prerequisite bindings, implement LicenceSigner over the product's existing OpenBao-materialised key files, write the assembly adapter that builds a LicensableGrant from dotmac-entitlement-allocation's staged allocation plus the agreement's activation fact, migrate the existing rows under the byte-for-byte constraints above, retire the local issuer in the same change, and record the adoption evidence here. Separately and later: move the delivery half to the Integrator. Until then this package is built and validated but unadopted, and must not be described as in production."
