[tool.poetry]
name = "dotmac-referrals"
version = "0.1.0a1"
description = "Tenant referral programmes, attribution, conversion and reward-request evidence"
authors = ["DotMac"]
readme = "README.md"
packages = [{ include = "dotmac_referrals", from = "src" }]
include = [
  { path = "src/dotmac_referrals/py.typed", format = ["sdist", "wheel"] },
  { path = "src/dotmac_referrals/migrations/**/*", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
dotmac-kernel = ">=0.1.0a84"
sqlalchemy = "^2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
