[tool.poetry]
name = "dotmac-subscriptions"
version = "0.1.0a3"
description = "DotMac dual-plane recurring commercial contracts and occurrences"
authors = ["DotMac"]
readme = "README.md"
packages = [{ include = "dotmac_subscriptions", from = "src" }]
include = [
    { path = "src/dotmac_subscriptions/py.typed", format = ["sdist", "wheel"] },
    { path = "src/dotmac_subscriptions/migrations/**/*", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
dotmac-kernel = ">=0.1.0a94"
sqlalchemy = "^2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
