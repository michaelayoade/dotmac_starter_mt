owner = "The reusable recurring-commercial core on explicit tenant and platform planes: stable offers, immutable offer and price versions, stable subscription contracts with immutable effective-dated versions and positive-priced lines, composable cadence and calendar arithmetic, declared proration, unique replayable recurring charge occurrences with pre-tax rating provenance, finite complimentary or sponsored arrangements, and append-only non-cash grants."

contract = "Publish immutable offer versions and price children beneath a stable offer identity; record immutable effective-dated subscription contract versions and stable positive-priced line lineage; resolve half-open periods, declared proration and rate units from BillingCadence; approve and prospectively revoke finite complimentary or sponsored treatment; resolve protected drift; and emit exact pre-tax RatedObligationOutputV1, money-free CommercialEntitlementProjectionV1, and positive NonCashGrantOutputV1 facts. NOT invoices, receivables, payments, settlement, allocation, tax, FX, collections policy, product access, licences, sponsor receivables, accounting postings, providers, usage metering, documents, or the general ledger."

