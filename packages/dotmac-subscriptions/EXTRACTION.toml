first_cutover = "dotmac_vendor_control_plane is cutover 1 on the platform plane; it retires its local offer-version writer and capability-code column. dotmac_sub is cutover 2 on the tenant plane and retires generic offer/price, billing-contract, cadence/proration, fixed-recurring occurrence, billing-arrangement and billing-grant owners through measured shadow-and-cutover cohorts."

shadow_and_drift = "Vendor characterizes every offer/version/price/currency/capability reference before backfill and proves exact immutable snapshot parity. Sub writes the cross-tenant canary first, compares effective-at offer, contract and billing-treatment resolution over the complete active cohort, accepts the full cadence/proration matrix, and switches recurrence and non-cash grants only when duplicate, missing, overlap, amount/period drift and fingerprint-conflict counts are zero. Reconciliation repairs only from the named authoritative side."

local_copy_retirement = "Vendor removes vendor_cp.offers writers/models/routes and the local offer_versions table after zero drift. Sub removes generic offer/price writes, billing-contract/version/line writers, nine parallel cadence owners, monthly-only prepaid and separate postpaid recurrence, local billing-arrangement/grant writers and tables, and legacy invoice-line dedupe. Every retirement uses a two-directional ratchet with sensitivity proof; no permanent parallel writer or fallback remains."

next_action = "Subscriptions 0.1.0a2 was registry-verified and tagged at Starter commit f91253d5e193918507e9f2e0768a76aefe5bbce0. Complete the separately reviewable a3 billing-treatment/grant slice from Sub commit 943bc59f8e4ca0849c7de578bc9dbc17c57b116f, rehearse a2-to-a3 on every selected plane, release only after CI, then execute Sub backfill, shadow and writer retirement. Do not count a contract consumer until a real adopter has pinned the released package, composed the selected lineage plane, cut over its writer, and removed its local owner."

