first_cutover = "dotmac_vendor_control_plane is cutover 1 on the platform plane; it retires its local offer-version writer and capability-code column. dotmac_sub is cutover 2 on the tenant plane and retires generic offer/price, billing-contract, cadence/proration, and fixed-recurring occurrence owners through measured shadow-and-cutover cohorts."

shadow_and_drift = "Vendor characterizes every offer/version/price/currency/capability reference before backfill and proves exact immutable snapshot parity. Sub writes the cross-tenant canary first, compares effective-at offer and contract resolution over the complete active cohort, accepts the full cadence/proration matrix, and switches recurrence only when duplicate, missing, overlap and fingerprint-conflict counts are zero. Reconciliation repairs only from the named authoritative side."

local_copy_retirement = "Vendor removes vendor_cp.offers writers/models/routes and the local offer_versions table after zero drift. Sub removes generic offer/price writes, billing-contract/version/line writers, nine parallel cadence owners, monthly-only prepaid and separate postpaid recurrence, and legacy invoice-line dedupe. Every retirement uses a two-directional ratchet with sensitivity proof; no permanent parallel writer or fallback remains."

next_action = "Commit the coordinated Subscriptions/Billing/Collections candidate, obtain exact-revision Observer unit/integration/migration evidence, and release only when authorized. Then wire the real Cloud assembly and execute Vendor CP followed by Sub shadow/cutover retirement. Do not count a contract consumer until a real adopter has pinned the released package, composed the selected lineage plane, cut over its writer, and removed its local owner."
