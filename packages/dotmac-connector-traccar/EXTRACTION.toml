schema_version = 1
package = "dotmac-connector-traccar"
classification = "stateless-protocol-adapter"
status = "audit-complete"
source_mode = "greenfield-after-inventory"

owner = "Traccar 6.15.3 HTTP transport, service-session authentication, strict provider response parsing and provider-neutral Fleet tracking read normalization."

contract = "Implement dotmac-integration REQUEST SPI >=1.6,<2.0 for connector key traccar. Serve provider health, exact device lookup, latest position and bounded position history through four fixed read-only capabilities. Permit only http://traccar:8082, isolate ephemeral provider cookies by opaque Integrator installation_id, perform at most one 401/403 re-authentication and replay, and expose no arbitrary method, URL, query, provider body, cookie or secret. Own no vehicle, tracker assignment, tenant or organization, Fleet permission, retry engine, checkpoint, telemetry persistence, product database or business workflow. Release stays disabled until dotmac-integration a18 is published and the four ERP/provider-owner schemas exist; add their exact claims_contract_digest values before publication."

# ERP's accepted Step 1 built a deliberately dormant transport-injected client,
# mapping owner and tests. It made no provider call and defined no device or
# position normalization to port. No qualifying Traccar connector existed in
# the measured Starter or Sub sources, so this adapter is greenfield after the
# inventory rather than a second implementation beside a live one.
source_repositories = ["dotmac_starter_mt", "dotmac_erp", "dotmac_sub"]

