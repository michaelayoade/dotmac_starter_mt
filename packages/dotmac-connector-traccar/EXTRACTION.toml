first_cutover = "After the REQUEST SPI and Fleet-owned request/result contracts are published, release this connector, exact-pin it in dotmac_integrator and route ERP Fleet reads through the authenticated Integrator machine surface while ERP remains the only vehicle and tracker-mapping owner."

shadow_and_drift = "With no physical tracker required, compare fixed Traccar 6.15.3 device and position fixtures against the normalized contract. During a later zero-device production check, prove authenticated health and an empty exact lookup without registering a device or changing provider state."

local_copy_retirement = "Delete ERP's dormant direct Traccar credential, base-URL and Basic-auth assumptions when ERP adopts the published Integrator request contract. ERP retains VehicleTracker, organization scoping, Fleet RBAC and user-facing behavior."

next_action = "Keep release disabled until dotmac-integration SPI 1.6 is published, the Fleet-owned capability schemas and digests exist, connector conformance is green in Git-hosted CI, and dotmac_integrator can exact-pin the released wheel."

