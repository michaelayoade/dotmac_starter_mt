[tool.poetry]
name = "dotmac-connector-traccar"
version = "0.1.0a1"
description = "Dotmac Integrator request connector for Traccar fleet telemetry"
authors = ["DotMac"]
readme = "README.md"
packages = [{ include = "dotmac_connector_traccar", from = "src" }]
include = [
    { path = "src/dotmac_connector_traccar/py.typed", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
dotmac-integration = ">=0.1.0a18"
httpx = ">=0.27,<1.0"

[tool.poetry.plugins."dotmac_integration.connectors"]
traccar = "dotmac_connector_traccar:PLUGIN"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
