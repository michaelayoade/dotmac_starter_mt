[tool.poetry]
name = "dotmac-procurement"
version = "0.1.0a1"
description = "Tenant requisition, sourcing, award, and purchase-commitment decisions"
authors = ["DotMac"]
readme = "README.md"
packages = [{ include = "dotmac_procurement", from = "src" }]
include = [
  { path = "src/dotmac_procurement/py.typed", format = ["sdist", "wheel"] },
  { path = "src/dotmac_procurement/migrations/**/*", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
# a73 allocates mod_procurement/pc/procurement and publishes the tenant-scope
# and online-role prerequisite contracts consumed by this lineage.
dotmac-kernel = ">=0.1.0a73"
sqlalchemy = "^2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
