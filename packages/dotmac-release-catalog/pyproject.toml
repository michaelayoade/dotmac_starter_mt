[tool.poetry]
name = "dotmac-release-catalog"
version = "0.1.0a4"
description = "DotMac Release Catalogue — immutable, digest-addressed published artifacts and the attestations that vouch for them (ADR-0006 M3)"
authors = ["DotMac"]
readme = "README.md"
packages = [{ include = "dotmac_release_catalog", from = "src" }]
include = [
    # PEP 561 marker — the module's contracts are annotated, and a consuming
    # assembly's type-checker cannot see them without this.
    { path = "src/dotmac_release_catalog/py.typed", format = ["sdist", "wheel"] },
    # The module's OWN Alembic lineage (prefix `rl`, branch label
    # `release_catalog`), composed by a consuming assembly through
    # `version_locations`. No `__init__` in versions/ (Alembic convention), so
    # it is declared explicitly as package data.
    { path = "src/dotmac_release_catalog/migrations/**/*", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
# Floor 3.11 to match the kernel and the products that consume it.
python = ">=3.11,<3.14"
# The one runtime dependency, and the direction ADR-0006 § 2 fixes:
# `assembly → module → dotmac-ui → dotmac-kernel`. A module depends on the
# kernel; never on an assembly, and never on another module.
#
# TWO things set this floor, and the higher one wins.
#
# 1. `0.1.0a44` allocates `mod_rel` in `MIGRATION_OWNER_LEDGER`. An earlier
#    kernel cannot register this module at all — `NamespaceRegistry
#    .from_manifests` raises `UnallocatedNamespaceError`. (a44, not a42: a42 and
#    a43 are claimed by the upstream train — Audit R1 and Application Directory
#    / Workspace — and two branches minting the same kernel version leave
#    consumers unable to say which a42 they pinned.)
# 2. `0.1.0a53` adds `ModuleManifest.platform_tables` and the platform half of
#    the live-catalog contract (ADR-0023). As of `0.1.0a4` this manifest passes
#    that field, so an earlier kernel raises `TypeError` at import — before the
#    allocation check is ever reached.
#
# So the floor is a53. Like `dotmac-ticketing`, and unlike the ordinary case,
# this module's floor is set by a kernel CAPABILITY it consumes rather than by
# its own namespace row.
#
# NOT a61: this module is not selectable (ADR-0028). It declares one plane and
# no `supported_plane_sets`, so it consumes no part of the plane-selection
# mechanism and pinning a61 would exclude adopters for nothing.
dotmac-kernel = ">=0.1.0a53"
sqlalchemy = "^2.0"

# No `alembic` runtime dependency: unlike `dotmac_ticketing.linking`, nothing
# here emits DDL into a consuming product's migration. The module's own lineage
# is data files that a consuming assembly's Alembic reads; this package never
# imports Alembic outside those version files, which run inside the consumer's
# migration process.
#
# No `fastapi` and no `pydantic` yet: this release ships identity, the closed
# vocabularies, the tables and the lineage. Routers and schemas land with the
# first adopter's surface, so the dependency arrives with the code that needs it
# rather than ahead of it.

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
