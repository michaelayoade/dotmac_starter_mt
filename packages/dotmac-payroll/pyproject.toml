[tool.poetry]
name = "dotmac-payroll"
version = "0.1.0a1"
description = "Composable data-driven payroll-calculation and employee-liability owner"
authors = ["DotMac"]
readme = "README.md"
packages = [{ include = "dotmac_payroll", from = "src" }]
include = [
  { path = "src/dotmac_payroll/py.typed", format = ["sdist", "wheel"] },
  { path = "src/dotmac_payroll/migrations/**/*", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
dotmac-kernel = ">=0.1.0a85"
sqlalchemy = "^2.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
