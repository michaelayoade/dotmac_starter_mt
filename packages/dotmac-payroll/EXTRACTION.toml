schema_version = 1
package = "dotmac-payroll"
classification = "optional-module"
status = "audit-complete"
source_mode = "product-first"
owner = "Tenant payroll component policy, immutable structure revisions, employee calculation evidence, and employee/external liabilities"
contract = "Configure component masters and typed structure rules; assign effective revisions to opaque employee references; calculate source-evidenced gross, deductions, net pay and employer liabilities; enforce run separation of duties; materialize liabilities; and record settlement observations. NOT employee identity/lifecycle, compensation authority, time/attendance, leave, statutory tax policy, bank/payment execution, GL accounts, journal entries, fiscal periods, provider exports, or remittance transport."
source_repositories = ["dotmac_erp", "dotmac_sub", "dotmac_crm", "dotmac_backoffice", "dotmac_starter_mt"]
source_paths = [
  "dotmac_erp:app/models/people/payroll",
  "dotmac_erp:app/services/people/payroll",
  "dotmac_erp:tests/people/payroll",
  "dotmac_starter_mt:packages/dotmac-payroll/src/dotmac_payroll/service.py",
]
preserved_tests = [
  "dotmac_starter_mt:tests/unit/test_payroll_service.py",
  "dotmac_starter_mt:tests/architecture/test_payroll_module.py",
  "dotmac_starter_mt:tests/test_financial_modules_isolation.py",
]
contract_consumers = []
candidate_consumers = ["dotmac_erp", "dotmac_backoffice"]
composition_boundary = "The adopting application resolves employee, attendance, compensation and tax facts, then supplies typed source-evidenced component inputs. Payroll stores opaque employee/account/destination references and imports no People, Tax, Banking or Accounting sibling. Payment and journal consequences are projected by assembly adapters."
inventory_evidence = ["docs/inventories/payroll-sources.md"]
first_cutover = "ERP is the qualifying source and first payroll authority to retire after shared accounting and the employee-reference contract exist. Backfill structures/assignments, shadow exact calculations and liabilities read-only, seal one writer switch, and reduce ERP calculation/run/liability writers to zero. Backoffice is a later exact-pin consumer; package creation moves no authority."
shadow_and_drift = "Compare structure revisions, effective assignments, source inputs, every component line, proration, gross/deduction/net/employer totals, run transitions, liability destinations, amounts and settlement coverage. Shadow is read-only and cannot create a second run or liability ledger."
local_copy_retirement = "At sealed cutover disable ERP payroll calculation, approval/finalization and liability writers. Keep employee, attendance, tax, payment and journal owners separate behind versioned ports. Retire formula strings/eval, fixed component-code branches and provider/state exports from the domain owner; no fallback engine survives."
next_action = "Complete the accounting and employee-reference adoption contracts, characterize remaining ERP proration/rounding/retroactive cases, and keep the package unreleased until the ERP cutover is ready. Rebase the provisional kernel allocation/version against concurrent alpha-train work before integration."
