[tool.poetry]
name = "dotmac-finance"
version = "0.1.0a1"
description = "Tenant fixed-asset books, depreciation and immutable accounting consequences"
authors = ["DotMac"]
readme = "README.md"
packages = [{ include = "dotmac_finance", from = "src" }]
include = [
  { path = "src/dotmac_finance/py.typed", format = ["sdist", "wheel"] },
  { path = "src/dotmac_finance/migrations/**/*", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
# a72 allocates mod_finance/fn/finance. The module otherwise consumes only
# the long-standing tenant catalogue, database roles, manifests and Money API.
dotmac-kernel = ">=0.1.0a72"
sqlalchemy = "^2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

