[tool.poetry]
name = "dotmac-finance"
version = "0.2.0a1"
description = "Tenant fixed-asset books, depreciation and immutable accounting consequences"
authors = ["DotMac"]
readme = "README.md"
packages = [{ include = "dotmac_finance", from = "src" }]
include = [
  { path = "src/dotmac_finance/py.typed", format = ["sdist", "wheel"] },
  { path = "src/dotmac_finance/migrations/**/*", format = ["sdist", "wheel"] },
  { path = "src/dotmac_finance/_native*.so", format = "wheel" },
  { path = "src/dotmac_finance/_native*.pyd", format = "wheel" },
  { path = "build.py", format = "sdist" },
  { path = "native/Cargo.toml", format = "sdist" },
  { path = "native/Cargo.lock", format = "sdist" },
  { path = "native/pyproject.toml", format = "sdist" },
  { path = "native/src/**/*", format = "sdist" },
  { path = "native/decimal-core/**/*", format = "sdist" },
  { path = "native/decimal-core/vendor/LICENSE.mpdecimal.txt", format = ["sdist", "wheel"] },
]
exclude = ["native/**/target", "src/**/*.so", "src/**/*.pyd", "src/**/*.dll", "src/**/*.dylib"]

[tool.poetry.build]
script = "build.py"
generate-setup-file = false

[tool.dotmac.native]
python-package = "dotmac_finance"
decimal-core = true

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
# a84 allocates mod_finance/fn/finance. The module otherwise consumes only
# the long-standing tenant catalogue, database roles, manifests and Money API.
dotmac-kernel = ">=0.1.0a85"
sqlalchemy = "^2.0"

[build-system]
requires = ["poetry-core==2.2.1", "maturin==1.14.1"]
build-backend = "poetry.core.masonry.api"
