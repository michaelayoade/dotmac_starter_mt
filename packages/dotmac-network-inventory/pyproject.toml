[tool.poetry]
name = "dotmac-network-inventory"
version = "0.1.0a1"
description = "Tenant managed-site, node, interface, port, VLAN and admission owner"
authors = ["DotMac"]
readme = "README.md"
packages = [{ include = "dotmac_network_inventory", from = "src" }]
include = [{ path = "src/dotmac_network_inventory/py.typed", format = ["sdist", "wheel"] }, { path = "src/dotmac_network_inventory/migrations/**/*", format = ["sdist", "wheel"] }]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
dotmac-kernel = ">=0.1.0a73"
sqlalchemy = "^2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
