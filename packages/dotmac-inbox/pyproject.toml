[tool.poetry]
name = "dotmac-inbox"
version = "0.1.0a2"
description = "Dotmac Inbox — tenant-scoped conversation, message, lifecycle, threading, and read-state ownership"
authors = ["DotMac"]
readme = "README.md"
packages = [{ include = "dotmac_inbox", from = "src" }]
include = [
    { path = "src/dotmac_inbox/py.typed", format = ["sdist", "wheel"] },
    { path = "src/dotmac_inbox/migrations/**/*", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
dotmac-kernel = ">=0.1.0a85"
sqlalchemy = "^2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
