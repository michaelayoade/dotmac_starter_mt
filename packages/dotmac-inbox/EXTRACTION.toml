]
first_cutover = "dotmac_sub is cutover 1 because it is the only active production conversation owner and has the qualifying SOT registry, behavior tests, operator read-state owner, and Integrator messaging.receive.v1 shadow port. First move product-neutral conversation, message, lifecycle, threading, and read-cursor rows into mod_inbox while Sub retains contact/party links, teams, routing, assignments, presence, media links, realtime, delivery, AI intake, and every ISP consequence. ERP remains cutover 2 only after its support-ticket correspondence adopts a real message record; it is candidate demand, not a current consumer."
shadow_and_drift = "Sub shadows owner commands against the module in the same transaction and compares thread identity, status/reason, ordered messages, activity clocks, and per-operator read cursors. Channel declarations replace Sub's hardcoded opaque-channel set and global message-id uniqueness; account-scoped provider ids will admit legitimate events the old global constraint drops, so the shadow report must classify and count that expected delta. The Integrator mirror remains the transport cutover proof and is not replaced by module parity. Cutover requires zero unexplained owner differences, a PostgreSQL cross-tenant canary, a sealed one-writer switch, and product consequence adapters proven against the module outputs."
local_copy_retirement = "After Sub cutover, retire local ownership of inbox_conversations, inbox_messages, inbox_conversation_read_states, the generic lifecycle/threading/dedup writers, and _OPAQUE_CONTACT_CHANNELS. Keep and rebind provider observations until the Integrator producer cutover separately retires them; keep product-owned participant/contact links, teams, routing, assignments, queues, presence, media, realtime, outbound delivery, AI intake, ticket/lead handoff, and product audit consequences. CRM remains retirement evidence under the existing CRM-to-Sub ledger, not a second owner. Two-directional caller/model/table ratchets reach zero before the local conversation owner is declared retired."
next_action = "Validate this audit-complete package on Observe, then land Sub's expand migration and typed adapter as the first adoption slice. Do not compose or publish dotmac-inbox from Starter before that adopter proof, and do not add routers, provider clients, connector configuration, assignment/routing, attachments, realtime, templates, AI, or product subject columns to make the candidate look complete."
