[tool.poetry]
name = "dotmac-surveys"
version = "0.1.0a1"
description = "Dotmac Surveys — tenant-scoped feedback definitions, invitations, responses, and aggregate evidence"
authors = ["DotMac"]
readme = "README.md"
packages = [{ include = "dotmac_surveys", from = "src" }]
include = [
    { path = "src/dotmac_surveys/py.typed", format = ["sdist", "wheel"] },
    { path = "src/dotmac_surveys/migrations/**/*", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
dotmac-kernel = ">=0.1.0a85"
sqlalchemy = "^2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
