first_cutover = "Sub is cutover 1 through dotmac_integrator. Exact-pin the released connector beside dotmac-integration 0.1.0a10, reconcile Sub's authenticated messaging.receive.v1 ProductPort descriptor, then mirror the same Meta request while Sub's direct receiver remains authoritative. Publication and package conformance alone do not make either repository a contract consumer."

shadow_and_drift = "Mirror exact raw bytes and the signature header into Integrator. Compare provider event identity, count, event type, channel, account scope, timestamps, text, attachments and comment thread references for the provider retry horizon. Profile lookup is excluded because the source performs network I/O mid-webhook and the connector deliberately does not. Cut over the provider callback only after parity, then lower Sub's external-connector ratchet in the same change that removes direct Meta verification and normalization."

local_copy_retirement = "Delete Sub's and CRM's Meta webhook signature, challenge and payload traversal surfaces after Sub cutover. Sub retains Team Inbox decisions, contact/profile enrichment, routing, threading, assignment and timeline consequences. CRM is retired and never becomes a connector consumer. Outbound Graph delivery remains outside this ingress-only slice until the product-owned messaging.send.v1 command contract is published."

next_action = "0.1.0a1 is released, registry-verified and tagged (dotmac-connector-meta-social-v0.1.0a1). Publication is supply-chain evidence only and moved no authority. Remaining: exact-pin the released version in dotmac_integrator and execute the Sub shadow/callback cutover. Build outbound Meta delivery as a separate capability slice rather than broadening this package's first release."
