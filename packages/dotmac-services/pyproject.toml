[tool.poetry]
name = "dotmac-services"
version = "0.1.0a1"
description = "Authoritative tenant service-instance lifecycle"
authors = ["DotMac"]
readme = "README.md"
packages = [{ include = "dotmac_services", from = "src" }]
include = [
  { path = "src/dotmac_services/py.typed", format = ["sdist", "wheel"] },
  { path = "src/dotmac_services/migrations/**/*", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
dotmac-kernel = ">=0.1.0a85"
sqlalchemy = "^2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
