contract_consumers = []
candidate_consumers = [
  # The one concrete consumer, and the only one. A speculative vendor-CP entry
  # was removed on review: the control plane has no descriptor cutover, and a
  # candidate named without one inflates the reuse case for a capability with a
  # single consumer. It returns if and when an actual cutover is planned.
