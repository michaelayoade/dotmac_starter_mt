first_cutover = "The Tenant Workspace (`dotmac_workspace`) is the CANDIDATE first cutover, and has not happened: that repository is a local scaffold with no remote, no lock, no CI and no authentication path, so `contract_consumers` is empty and the status is `audit-complete`. Unlike `dotmac-ticketing`, the cutover is not chosen for being greenfield among several candidates — there is exactly one intended adopter, and the module exists because that adopter needs it. It will carry no migration risk: no rows exist anywhere to move."
shadow_and_drift = "No shadow verification is possible or needed: there is no prior implementation to run beside, and no existing rows whose behaviour could diverge. The drift this module must detect is a different kind — between its stored descriptor copy and what the target application currently publishes — and that is a first-class feature rather than a migration concern: `reconcile_descriptor` returns UNCHANGED/UPDATED/REGRESSED/CONFLICT, refuses to adopt a descriptor whose version regressed or whose content changed under a fixed version, and records `reconciliation_status` + `descriptor_refreshed_at` so an unreachable application never looks freshly checked."
local_copy_retirement = "Nothing to retire. No repository holds an implementation of this capability — that is the audit's finding, not an omission, and `application-portfolio-sources.md` records the two sweeps that establish it. The one thing this module must NOT absorb is listed in that inventory's concept-to-owner table: commercial entitlement stays with the vendor CP's allocations/contracts, local capability evaluation stays with `dotmac_kernel.entitlements`, signed licence delivery stays with `dotmac_kernel.licensing`, and who may enter an application stays with the target application."
next_action = "PUBLISH `0.1.0a2` to the private index, then adopt. The allowlist entry in `.github/release-modules.json` landed once the `ad` lineage had live-Postgres proof (`tests/test_application_directory_isolation.py` applies it against a real database in the integration job), following the precedent ADR-0026 §8 set: the release entry lands with the proof rather than ahead of it. Publishing is what unblocks the one intended adopter — `dotmac_workspace` pins released versions from the index and cannot pin a path across repositories, so `first_cutover` was unreachable by construction while this package was unlisted. Publishing does NOT advance the dossier status: the ratchet counts CONSUMERS, not releases, so this stays `audit-complete` (ZERO production consumers) until Workspace actually runs the `mod_appdir` lineage in production, which moves `contract_consumers` from empty to exactly one and the status to `adopted`; `reuse-proven` needs a second real consumer. Note the adoption cost the pin drift hides: Workspace currently pins `dotmac-application-directory 0.1.0a1` and `dotmac-kernel 0.1.0a43`, and `0.1.0a2` raised the kernel floor to `>=0.1.0a56`, so adopting this release forces a kernel jump and a migration-composition update for the `requires`/bindings contract that `0.1.0a2` introduced. Do NOT absorb access requests, approvals, delegation policy, grant sets or acknowledgement: those are `dotmac-application-access`, deferred by ADR-0021 §5 until a generic signed-document mechanism exists. Do NOT add a column naming a person, member, group, role, grant or permission — `test_the_directory_holds_no_authorization_column` fails the build on one, and that test is the executable half of ADR-0021 §3."
