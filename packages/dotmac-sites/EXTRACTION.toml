first_cutover = "Backoffice is cutover 1. This is a measured greenfield adoption: it must pin a released dotmac-sites version, compose and migrate its own tenant plane, prove the legacy-site census is still empty, render the exact ready snapshot locally, and keep all adapters thin. Remote delivery is a later gate through a versioned publishing adapter and Integrator. Sub may later adopt independently with its own database, lineage and rows."
shadow_and_drift = "Because no qualifying writer or data set exists, do not invent a historical backfill or parity subsystem. At Backoffice cutover, repeat the site-builder census and fail if a local writer appeared. Prove that the local renderer consumes the exact ready revision digest, that a newer draft cannot change the served snapshot, and that rebuilding the same release value is deterministic. For remote delivery, reconcile the publishing request snapshot digest and Integrator receipt to the same local revision without treating the remote deployment as the only copy."
local_copy_retirement = "No prior site-builder implementation exists to retire at the audited pins. The enforceable premise is the checked-in six-repository census plus a Backoffice adoption canary that refuses composition if a competing local site/page/revision writer appears. Product landing routes and configurable welcome text are consumers or unrelated presentation, not a hidden site owner. Any future competing writer must be removed before adoption can be claimed."
next_action = "Gate 2 is complete at exact code/evidence revision 8bf12ddc5cb938714d090fc0b0e69b83fa78f2d2: 124 focused cases, make check, 4,028 collected unit/architecture cases and 509 collected disposable-PostgreSQL integration cases passed on a fresh tag-complete Observer checkout with Poetry 2.4.1, including all five Sites isolation/immutability canaries. Keep the package unpublished, unallowlisted, uncomposed and unadopted. Gate 3 remains closed until a typed adapter can pass SiteReleaseV1 to dotmac-publishing without field laundering; Integrator remains the only hosting transport owner. Backoffice adoption still requires separate authorization, released artifact pins and a repeated empty-owner census."
