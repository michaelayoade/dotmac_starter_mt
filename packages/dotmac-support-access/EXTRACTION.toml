composition_boundary = "Approvals owns exact-content decision evidence and is passed as a value. Kernel owns enforcement primitives and audit storage. Application Access owns standing cross-app grant sets. The module stores no credential or provider endpoint and imports no sibling/product; an assembly maps a finite descriptor to kernel enforcement."
inventory_evidence = ["docs/inventories/sub-vnext-parity-sources.md", "docs/inventories/sub-vnext-parity-dispositions.toml", "docs/adr/0040-sub-vnext-parity-capabilities-have-narrow-independent-owners.md"]
source_mode_note = "Sub's read-only impersonation enforcement is production-used but no inspected repository implements the temporary request/consent/grant/revocation workflow. The workflow is greenfield after inventory and ports the enforcement/refusal tests as a boundary reference."
first_cutover = "Vendor control plane is cutover 1. It composes the platform plane, routes approval evidence, hands admitted finite grants to a deployment/kernel enforcement adapter and disables any direct temporary support token issuance."
shadow_and_drift = "Before enforcement, every issued support token/session must correlate to exactly one active finite grant. Zero unexplained issuance, no expiry beyond the policy ceiling and immediate revocation/expiry denial are the cutover gates."
local_copy_retirement = "Retire direct temporary support impersonation issuance paths that lack an admitted grant. Keep kernel enforcement and product-local adapters; keep standing Application Access because it owns a different lifecycle."
next_action = "Implement the platform-only sa lineage with request/grant/event evidence, platform grants and tenant-role revoke, strict TTL/break-glass/refusal canaries and no credential fields."
