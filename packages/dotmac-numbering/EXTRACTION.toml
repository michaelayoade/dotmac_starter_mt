contract = "Preserve existing allocation, formatter, period-counter, forward-only repair and kernel replay behavior. Strict series bind an immutable collision domain and freeze configuration at creation/enrollment, including before first issuance. Scope-specific immutable exact-string claims prevent reuse across replacement codes within a declared domain and partition; historical/external enrollment preserves document/provenance identity without fabricating allocation receipts. Allocation, claims and kernel effects join the caller transaction. Existing unenrolled series retain their prior fingerprints and behavior. Products own trusted document/domain selection and activation, not a second allocator or registry."
