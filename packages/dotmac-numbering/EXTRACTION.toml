# Amendment, 2026-10-15: per ADR-0020 M1/M6/M8, Sub invoice/credit-note
# preparation may proceed independently of ERP sequencing; no release or
# caller activation, backfill, repair, or authority switch is authorized here.
first_cutover = "For the replacement contract, first accept and publish the exact new artifact, then implement ERP business-type bindings and a complete QUOTE activation workflow with explicit business date and stable outer business-command replay. Preserve existing ERP production series/counters; extend collision coverage through owner enrollment only in a separately accepted operational gate. The prior allocation cutover is not reopened. Sub billing preparation remains independent and must use its own exact artifact, date, request identity, collision/domain census and sealed transition. Use offline replay and read-only preview, never two live allocators. No source change authorizes backfill, repair, candidate activation, data correction or production deployment."
shadow_and_drift = "Never shadow two live allocators (Michael fleet ruling, 2026-09-04). Preserve the existing allocation owner and verify with pure offline replay and read-only preview, including period, value, formatting and exact-string collision coverage. The new source extension is not continuity evidence. Product disagreement records must survive rollback/retry in their own transaction through the existing audit owner, identify org/series/domain/input, block unresolved units and require named resolution. Final observation, verification and authority switch share one locked transaction with a declared inverse; earlier reports are rehearsals. Never fabricate normal allocation receipts for historical numbers, auto-repair counters, or infer parity from a sampled clean series."
local_copy_retirement = "ERP retires, in order: SequenceService (app/services/finance/platform/sequence.py) including configure_sequence and reset_sequence; the async NumberingService; SyncNumberingService; NumberingSequence.preview and NumberingService.preview_format, both replaced by one module formatter called with an explicit date; PayrollNumberingService and the residual people.payroll_number_sequence table; and app/services/careers/careers_service.py:318-342, an unregistered sixth allocator that MAX-scans a table-wide-unique column with no lock and must first have its cross-organization series scope decided. sequence_utils.format_number and should_reset are the extraction source and are deleted with their callers. The core_config.numbering_sequence table's native sequence_type PostgreSQL enum becomes the module's open series_code string through an expand/contract migration with a recorded, reversible value mapping. Sub retires generate_number, generate_required_number, generate_number_with_config, the dead reconcile_next_value, the document_sequences table, the three caller-side reconcilers (projects.py:176-193, support.py:1029-1045, sales_orders.py:289-293) and the two collision-retry loops (projects.py:195-213, support.py:987-1004). A two-directional import/caller ratchet reaches zero in each repository before its local owner is deleted. No permanent mirrored counter or parallel allocator is allowed in either product."
next_action = "Implement and accept the replacement contracts on hosted CI, verify the resulting exact published artifact, then build the ERP active-binding and complete QUOTE replacement workflow per docs/inventories/numbering-replacement-sources-2026-10-28.md and ERP docs/architecture/numbering-settings-module-retirement.md at 0e9ab87022b835ebc502624b17bf765f15c5ea4f. Revalidate latest release capabilities before opening the PR; do not pin unpublished source into ERP. The module release, ERP activation and all-27-series legacy retirement remain distinct gates. Sub activation remains independent and frozen money/data mutation constraints continue to apply."
