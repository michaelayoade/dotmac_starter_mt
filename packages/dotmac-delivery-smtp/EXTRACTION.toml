schema_version = 1
package = "dotmac-delivery-smtp"
classification = "optional-module"
status = "audit-complete"
source_mode = "product-first"
owner = "SMTP transport for the kernel delivery-provider seam on channel email: connection settings as typed UI-entered specs, required STARTTLS with certificate verification, MIME construction from OutboundMessage parts, Message-ID derivation from the dispatch id, an injected pre-connect admission hook and the classification of SMTP replies into kernel receipt outcomes"
contract = "Given a product-supplied configuration loader, a password held in the kernel SecretSource, an optional attachment resolver (AttachmentRef to bytes) and an optional admission hook, send one OutboundMessage and return a kernel ProviderResult: recipient-address 5.1.1/2/3/6/10 at RCPT bounced, 5.7.x and other permanent replies rejected, soft RCPT states, 4xx, timeouts and connection errors failed (retryable); sender-side refusals (MAIL-stage 5xx, RCPT 5.1.7/5.1.8) and an admission refusal raise and write no receipt. Settings are read at platform scope only. Plaintext is refused in production, an offered-but-absent STARTTLS refuses the send, credentials never cross plaintext, only declared headers are written, and a reply lost after DATA raises rather than returning failed. The package owns no tables, no queue, no retry, no consent, no rendering, no attachment storage and no secret path."
source_repositories = ["dotmac_academy_app", "dotmac_erp", "dotmac_sub"]
source_revisions = [
  "dotmac_academy_app:fc8d15b686f6a60905c88ee6fc709fee0b7cf6b9",
  "dotmac_erp:74fa788ae562905e4c8a1fcd46616585e4bf7694",
  "dotmac_sub:c7707880232c9298ef89c24a1aea66d35bd3a1e6",
]
source_paths = [
  "dotmac_academy_app:app/services/email.py",
  "dotmac_academy_app:app/config.py",
  "dotmac_academy_app:app/services/settings_store.py",
]
preserved_tests = [
  "dotmac_academy_app:tests/services/test_email.py",
]
contract_consumers = []
candidate_consumers = ["dotmac_academy_app"]
composition_boundary = "The adopter constructs SmtpDeliveryProvider with its own config loader, binds its current password custody to the kernel SecretSource, supplies its attachment resolver and its admission hook (for example its mail-gate lease), and calls dotmac_kernel.delivery_providers.send. Starter names no Academy path. Consent, retries and the outbox stay in the kernel."
inventory_evidence = [
  "docs/inventories/delivery-smtp-sources.md",
]
first_cutover = "Academy adopts after a reviewed release: pin the package exactly, declare the five settings in its admin UI, bind SMTP_PASSWORD custody to a SecretSource name, route email.py sends through delivery_providers.send, and delete the local smtplib code in the same change."
shadow_and_drift = "Not applicable: adoption is proven by the package's local-server tests and a real-record preview in Academy, not by side-by-side sending."
local_copy_retirement = "Delete the smtplib block in dotmac_academy_app:app/services/email.py at adoption; nothing is retired by this package."
next_action = "Review, then release 0.1.0a1 under a separate authorized publication; Academy adoption follows."

