[tool.poetry]
name = "dotmac-delivery-smtp"
version = "0.1.0a1"
description = "SMTP delivery adapter for the kernel delivery-provider seam: STARTTLS-required, classified outcomes, UI-entered settings"
authors = ["DotMac"]
readme = "README.md"
packages = [{ include = "dotmac_delivery_smtp", from = "src" }]
include = [
    { path = "src/dotmac_delivery_smtp/py.typed", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
# Floor: the kernel that ships OutboundMessage parts/headers/AttachmentRef,
# the header-declaring provider protocol and the receipt statuses (S6).
# Standard library only otherwise (smtplib, ssl, email): no new third-party
# dependency.
dotmac-kernel = ">=0.1.0a109"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
