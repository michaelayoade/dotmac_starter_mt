contract_consumers = []
candidate_consumers = ["dotmac_sub"]

authority_boundary = "ADR-0077 under the ADR-0074 section 4 clarification (no I/O, no credentials, no transport in Starter) and ADR-0038 section 6 (OLT vendor protocol I/O is Integrator connector territory; ONT/OLT business logic stays Sub authority). This package is knowledge and dialogue logic only. The paramiko runner, the Postgres advisory-lock store, the pool, metrics, settings, credential decryption and every database read or write stay in the host. Starter is public: tests use synthetic data and RFC 5737 documentation ranges only; real-capture parity stays in Sub."

inventory_evidence = [
  "docs/inventories/device-cli-sources.md",
]

first_cutover = "Dotmac Sub reads: after publication, Sub pins the package, supplies a paramiko-backed channel and a Postgres advisory-lock store adapter, and swaps its read paths to the typed operations behind unchanged public function names. The swap lands before the IPAM W1 switch, never in the same release or freeze window, and device-cli is released only in gaps between billing and IPAM releases. Writes are a later slice behind an explicit WriteGrant."

shadow_and_drift = "Parity is proved by backtest, not by running two implementations side by side: Sub replays its private, anonymised real-capture corpus through the pinned package once, with expectations identical to the old code's, before any Sub file is deleted. The limiter shares slots with Sub's current code through byte-identical lock keys, pinned by golden vectors in this package (Sub pins none today; it mirrors them when it adopts the package) and the device key must be str(olt.id). Starter proves the synthetic corpus replays to hand-written goldens for every claimed capability of every profile."

local_copy_retirement = "At the Sub read swap, Sub deletes each moved file in the pull request that swaps its callers (the dialogue parts of olt_ssh.py, olt_ssh_session.py, the limiter policy, the Huawei parsers and classifier) and keeps its existing tests as parity tests against the package. Ratchets in Sub count raw channel sends, _open_shell call sites and paging-off literals toward zero."

next_action = "Review and merge the ADR, then release 0.1.0a1 in a train gap on the owner's go. Lab hardware for read acceptance (MA5608T V800R013, MA5800) is a separate owner decision; no profile may claim lab_verified without a receipt hash. Slice 2 adds the remaining read operations and the Sub runner adapter design; ZTE, further Huawei models, FiberHome and Nokia arrive as data, a dialect where addressing differs, and transcripts."

