schema_version = 1
package = "dotmac-device-cli"
# NOT an optional-module: nothing installs this. It has no ModuleManifest, no
# namespace or lineage and no kernel floor - a product constructs a session over
# a channel it already authenticated and calls it. Naming it a module would send
# a reader looking for a lineage that does not exist (ADR-0077).
classification = "stateless-protocol-adapter"
status = "audit-complete"
source_mode = "product-first"

owner = "Stateless device CLI knowledge and dialogue logic for network equipment: layered capability profiles (vendor, family, model, firmware) as validated data, a dialect interface per vendor for addressing and parsing, the prompt/mode/pager/continuation/confirmation/logout state machine run over an injected channel, the response classifier, vendor-neutral typed operations and results, the per-device session limiter policy over an injected lock store, and a reusable conformance suite with a synthetic transcript corpus"

contract = "Given an already-authenticated interactive channel and a profile resolved from the CONFIGURED vendor, model and firmware, drive the device CLI safely and return Ok, Unreadable (a closed set of reasons) or Unsupported - never a silent empty and never another vendor's syntax. Absence is a value set only from the device's own words. A read never answers a confirmation; a write answers only the exact question its template declares; a session that cannot prove it is idle at a prompt is closed without typing. The package owns no transport, credential, socket, database, clock or environment access: the host (Dotmac Sub today, Integrator later) authenticates, supplies the channel and a lock-store adapter, and keeps the pool, metrics, settings and credential decryption."

source_repositories = ["dotmac_sub", "dotmac_erp", "dotmac_starter_mt"]

# Read at this Sub release (the prod release deployed 2026-10-25). Device
# knowledge and the limiter key derivation are copied from it; nothing is imported.
source_revisions = [
  "dotmac_sub:7999c3019198ad2ce870e2645da65d73bd22ed6e",
  "dotmac_erp:bcc32dbc179f989d44f791aaff87b3ba45a09e3e",
]

source_paths = [
