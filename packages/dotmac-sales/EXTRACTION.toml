schema_version = 1
package = "dotmac-sales"
classification = "optional-module"
status = "audit-complete"
source_mode = "product-first"
owner = "Commercial intent from Lead qualification through an immutable accepted Quote and its versioned owner-output handoff"
contract = "Own tenant-scoped pipelines, stages, Leads, append-only Lead-origin evidence, Quote authoring, exact money, discount revisions, Quote lifecycle and exactly-once acceptance. Acceptance freezes one canonical snapshot and publishes sales.accepted-quote.v1. Stop there: never create, import or identify a subscriber, SalesOrder, project, work order, invoice, service or campaign; never own delivery transport."
source_repositories = ["dotmac_sub", "dotmac_crm", "dotmac_erp", "dotmac_starter_mt"]
source_paths = [
  "dotmac_sub:app/models/sales.py",
  "dotmac_sub:app/services/quote_authoring.py",
  "dotmac_sub:app/services/quote_acceptance.py",
  "dotmac_sub:docs/designs/SALES_TO_SERVICE_LIFECYCLE_SOT.md",
  "dotmac_crm:app/models/sales.py",
  "dotmac_crm:docs/designs/CRM_WEB_RETIREMENT.md",
  "dotmac_crm:docs/audits/crm_web_retirement_ledger.json",
  "dotmac_starter_mt:packages/dotmac-sales/src/dotmac_sales",
]
preserved_tests = [
  "dotmac_sub:tests/test_quote_authoring.py",
  "dotmac_sub:tests/test_quote_acceptance.py",
  "dotmac_sub:tests/test_sales.py",
]
contract_consumers = []
candidate_consumers = ["dotmac_sub", "dotmac_crm"]
composition_boundary = "ADR-0024: each adopter installs and migrates its own sa lineage. Applications share AcceptedQuoteHandoffV1 over a versioned boundary; they never share mod_sales rows or read another application's database. Sales imports neither an assembly nor another module. Subject, actor and delivery arrive through typed product-neutral ports."
inventory_evidence = [
  "docs/inventories/sales-sources.md",
  "docs/inventories/sales-caller-inventory.md",
  "docs/inventories/sales-extraction-dossier.md",
  "docs/inventories/sales-parity-and-canaries.md",
  "docs/inventories/sales-retirement-ledger.md",
  "docs/adr/0033-sales-authority-stops-at-an-accepted-quote.md",
]
first_cutover = "dotmac_sub is cutover 1 because it is the qualifying production-used and tested source. Install sa, backfill in-scope state, run read-only shadow comparisons and reconcile every mismatch before switching one writer family at a time. CRM supplies parity and retirement evidence only; it cannot become a second owner."
shadow_and_drift = "Compare every Sub row's tenant, lifecycle, stage/probability, subject reference, origin identity/evidence, Quote currency/expiry/lines, exact subtotal/discount/tax/total and discount history. Dual-run authoring and acceptance against captured fixtures while only legacy performs live consequences; compare canonical accepted snapshots. Prove one handoff under replay/concurrency, rollback-safe output, cross-tenant refusal and zero mutable accepted rows."
local_copy_retirement = "After Sub reconciliation, replace its Lead/Pipeline/Quote writers with thin adapters and retire acceptance consequences in favor of a downstream-owned handoff consumer. Then remove corresponding CRM routes, jobs, webhooks and writers. Keep campaigns unverified and untouched; keep SalesOrder/order-line ownership outside. No permanent mirror, parallel writer or forked lifecycle."
next_action = "Implementation and the prescribed check, unit/architecture and PostgreSQL canaries are green in the dedicated Starter worktree. Ship the non-overlapping sales namespace allocation on the next free kernel alpha after concurrent kernel work, update this package to that resolvable floor, then release sales just in time for Sub backfill, shadow comparison and reconciliation. The active Timer workstream owns the generic explicit-schema test-harness repair exposed by the eleventh imported module; do not duplicate it here. Do not cut over or retire CRM writers before the release and adoption evidence is accepted."
