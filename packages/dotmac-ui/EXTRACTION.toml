first_cutover = "Per slice. tokens and empty-state are already reuse-proven. Map-frame and catalog-grid remain pending candidates. List-surface first cuts over one Sub ListDefinition caller to the kernel request contract plus the package renderer, then characterizes one ERP list. Recent-activity first replaces one Sub panel while the Sub service keeps official-timeline ordering, URLs and formatted times. Generic-form-behaviors first replaces one exercised Sub form per factory; no product-local file retires until DOM/event/failure parity is proven. This branch publishes no release and changes no product."
shadow_and_drift = "Per slice. Existing token/empty-state/map/catalog proofs remain. List-surface adds kernel normalization/canonical-URL tests plus clean-host rendering, escaping, owner-projected rows, visible status text, responsive-column and pagination proofs. Recent activity adds clean-host, escaping and display-only-shape proofs. Generic form behaviours are generated/manifested, execute under a dependency-free Node event probe, prove repeatable limits/order/serialization and stable listener teardown, and carry a source deny-list for invoice/tax/money/contact policy. Product parity remains mandatory before retirement."
local_copy_retirement = "Existing retirement statements remain unchanged. No map, catalog, list, activity or JavaScript product copy retires here. List adoption must remove the displaced product renderer and reconcile Sub's six older data-grid callers. Recent activity retirement must leave official timeline selection and formatting in its product owner. Generic behaviour retirement may replace only validated-input feedback, submit guarding, generic add/remove/reorder and unsaved-change mechanics; invoice calculations, contact-role policy and CSV/import behaviour remain with their domain owners."
next_action = "Release only after the full package contract and asset proofs are green, then adopt slice by slice. First: one Sub list on dotmac-kernel.listing plus LIST_SURFACE and reconcile all legacy data-grid callers. Second: recent activity in Sub and CRM. Third: each generic form factory on an exercised product form with DOM/a11y/failure parity. Keep map/catalog adoption separate, delete only displaced local renderers, and preserve the palette ratchet."

# ── Contract slices (schema 2) ──────────────────────────────────────────────
# This package publishes SEVEN contracts whose evidence differs. A single
# package-level state cannot describe that honestly: report the stronger and the
# weaker contract is overstated; report the weaker and the stronger is
# understated. The gate validates each slice independently and DERIVES the
# headline `status` above as the weakest of them.

[[slices]]
name = "tokens"
contract = "Framework-independent foundational semantic tokens and compiled, self-hosted assets; component-owned tokens are evidenced with their component slice"
status = "reuse-proven"
source_paths = [
  "dotmac_sub:static/css/design-system.css",
  "dotmac_starter_mt:packages/dotmac-ui/src/dotmac_ui/tokens.py",
  "dotmac_erp:tailwind.config.js",
]
preserved_tests = [
  "dotmac_starter_mt:tests/unit/test_dotmac_ui_tokens.py",
  "dotmac_starter_mt:tests/unit/test_dotmac_ui_a11y.py",
  "dotmac_starter_mt:tests/unit/test_admin_shell_tokens.py",
  "dotmac_sub:tests/architecture/test_dotmac_ui_adoption.py",
]
contract_consumers = ["dotmac_sub", "dotmac_academy_app"]
reference_consumers = ["dotmac_starter_mt"]
candidate_consumers = ["dotmac_erp", "dotmac_crm"]
local_copy_retirement = "dotmac_erp still builds its own live src/css tree, the fork dotmac_sub abandoned, so its adoption retires nothing until that tree goes. dotmac_sub re-declares the --dmui-* ramps with its own palette through the sanctioned override path, which is a deliberate outcome rather than outstanding debt."

