schema_version = 2
package = "dotmac-ui"
classification = "presentation-foundation"
status = "audit-complete"
source_mode = "product-first"
owner = "Dotmac design system"
contract = "Three published contracts, tracked as slices below: (tokens) framework-independent semantic tokens and compiled self-hosted assets; (components) the adopted empty-state Jinja contract and token-native CSS; (catalog-grid) a display-only catalog card/grid contract. The headline status is the weakest of the three."
source_repositories = ["dotmac_sub", "dotmac_crm", "dotmac_starter_mt", "dotmac_erp", "dotmac_workspace", "dotmac_academy_app"]
source_paths = [
  "dotmac_sub:static/css/design-system.css",
  "dotmac_starter_mt:packages/dotmac-ui/src/dotmac_ui/tokens.py",
  "dotmac_erp:tailwind.config.js",
  "dotmac_erp:templates/components/macros.html",
  "dotmac_sub:templates/components/data/empty_state.html",
  "dotmac_crm:templates/components/data/empty_state.html",
  "dotmac_workspace:src/dotmac_workspace/launcher/web.py",
  "dotmac_workspace:src/dotmac_workspace/static/css/workspace.css",
  "dotmac_academy_app:templates/public/courses.html",
  "dotmac_academy_app:static/public.css",
]
preserved_tests = [
  "dotmac_starter_mt:tests/architecture/test_ui_public_surface.py",
  "dotmac_starter_mt:tests/unit/test_dotmac_ui_tokens.py",
  "dotmac_starter_mt:tests/unit/test_dotmac_ui_a11y.py",
  "dotmac_starter_mt:tests/unit/test_dotmac_ui_consumer.py",
  "dotmac_starter_mt:tests/unit/test_admin_shell_tokens.py",
  "dotmac_sub:tests/architecture/test_dotmac_ui_adoption.py",
  "dotmac_erp:tests/architecture/test_dotmac_ui_adoption.py",
  "dotmac_erp:tests/test_template_macros.py",
]
# INDEPENDENT consumers only. The starter is the assembly that owns this
# package: its consumption proves the wiring works, not that anyone independent
# chose the contract, so it is recorded as reference proof and never counted
# (ADR-0006 section 5).
contract_consumers = ["dotmac_sub", "dotmac_academy_app", "dotmac_erp"]
reference_consumers = ["dotmac_starter_mt"]
candidate_consumers = ["dotmac_crm", "dotmac_workspace"]
inventory_evidence = [
  "docs/inventories/starter-surfaces.md",
  "docs/inventories/sub-surfaces.md",
  "docs/inventories/erp-vendor-surfaces.md",
  "docs/inventories/branding-settings.md",
  "docs/inventories/ui-surface-inventory.md",
  "docs/inventories/catalog-card-sources.md",
]
first_cutover = "Per slice. tokens: done -- dotmac_sub and dotmac_academy_app are merged external consumers on their default branches, serving the packaged asset through assembly-owned composition rather than copied stylesheets. components: done twice over -- dotmac_erp main at 462b6fa and dotmac_sub main at 73c35f4 both pin released 0.1.0a7, resolve the package-owned empty_state template through their real Jinja loaders, and exercise it through product-owned adoption tests. catalog-grid: pending -- this branch publishes no release and changes neither Workspace nor Academy. The starter remains reference proof rather than an independent cutover."
shadow_and_drift = "Per slice. tokens: consumer visual, accessibility, two-brand, CSP, and compiled-asset checks compare the package with the product surface; dotmac_sub additionally carries tests/architecture/test_dotmac_ui_adoption.py. components: clean-host, installed-wheel, registry-installed, escaping, token-native and product-seam sensitivity proofs guard the shared empty-state core; ERP and Sub each pin the release and reject a vendored package template. catalog-grid: clean-host, escaping, display-only-field, optional-action, empty-state, token-native CSS, responsive and contrast proofs exist here; Workspace and Academy must add product-loader parity tests before either local renderer can retire."
local_copy_retirement = "Per slice. tokens: dotmac_erp still builds its own live src/css tree; dotmac_sub's sanctioned green role-token overrides are deliberate. components: ERP and Sub retain only thin empty-state adapters, not markup owners; CRM remains optional. catalog-grid: no retirement is claimed -- Workspace still owns dmws-tile markup/CSS and Academy still owns its course-card markup/CSS until coordinated product cutovers prove parity and delete the overlaps."
next_action = "Keep this catalog-grid slice on the integration train without composing or releasing it. Next, map Workspace and Academy product-owned listing results to CatalogItem, cut over one product at a time with exact loader/escaping/responsive parity tests, and retire each overlapping local card renderer/CSS. Do not add commercial eligibility, stock, selection or money decisions to dotmac-ui."

# ── Contract slices (schema 2) ──────────────────────────────────────────────
# This package publishes THREE contracts whose evidence differs. A single
# package-level state cannot describe that honestly: report the stronger and the
# weaker contract is overstated; report the weaker and the stronger is
# understated. The gate validates each slice independently and DERIVES the
# headline `status` above as the weakest of them.

[[slices]]
name = "tokens"
contract = "Framework-independent semantic tokens and compiled, self-hosted assets"
status = "reuse-proven"
source_paths = [
  "dotmac_sub:static/css/design-system.css",
  "dotmac_starter_mt:packages/dotmac-ui/src/dotmac_ui/tokens.py",
  "dotmac_erp:tailwind.config.js",
]
preserved_tests = [
  "dotmac_starter_mt:tests/unit/test_dotmac_ui_tokens.py",
  "dotmac_starter_mt:tests/unit/test_dotmac_ui_a11y.py",
  "dotmac_starter_mt:tests/unit/test_admin_shell_tokens.py",
  "dotmac_sub:tests/architecture/test_dotmac_ui_adoption.py",
]
contract_consumers = ["dotmac_sub", "dotmac_academy_app"]
reference_consumers = ["dotmac_starter_mt"]
candidate_consumers = ["dotmac_erp", "dotmac_crm"]
local_copy_retirement = "dotmac_erp still builds its own live src/css tree, the fork dotmac_sub abandoned, so its adoption retires nothing until that tree goes. dotmac_sub re-declares the --dmui-* ramps with its own palette through the sanctioned override path, which is a deliberate outcome rather than outstanding debt."

[[slices]]
name = "components"
contract = "Inert Jinja component templates plus their ComponentContract declarations and token-native CSS"
status = "reuse-proven"
source_paths = [
  "dotmac_erp:templates/components/macros.html",
  "dotmac_sub:templates/components/data/empty_state.html",
  "dotmac_crm:templates/components/data/empty_state.html",
]
preserved_tests = [
  "dotmac_erp:tests/test_template_macros.py",
  "dotmac_starter_mt:tests/unit/test_dotmac_ui_components.py",
  "dotmac_starter_mt:tests/unit/test_dotmac_ui_consumer.py",
  "dotmac_starter_mt:tests/architecture/test_ui_release_contract.py",
  "dotmac_erp:tests/architecture/test_dotmac_ui_adoption.py",
  "dotmac_sub:tests/architecture/test_dotmac_ui_adoption.py",
]
# Two independent default-branch consumers establish reuse. The starter is
# recorded separately as reference proof and deliberately does not count:
# consumption by the assembly that OWNS the package proves the wiring, not that
# anyone independent chose the contract.
contract_consumers = ["dotmac_erp", "dotmac_sub"]
reference_consumers = ["dotmac_starter_mt"]
# Candidates are future demand, not products already counted above. CRM is
# technically eligible but unscheduled; Academy has no local renderer to retire.
candidate_consumers = ["dotmac_crm", "dotmac_academy_app"]
local_copy_retirement = "ERP's production macro supplied the product-first semantics; its former renderer is now a thin argument adapter over the package macro, protected by direct macro and architecture tests. Sub's byte-identical renderer is now a thin include-context adapter, protected by its architecture test and six live callers. Neither adapter owns markup. The starter's table macro copy is retired; CRM's copy is optional future cleanup, not part of the active programme."

[[slices]]
name = "catalog-grid"
contract = "Display-only responsive catalog card/grid values, inert Jinja markup and token-native CSS"
status = "audit-complete"
source_paths = [
  "dotmac_workspace:src/dotmac_workspace/launcher/web.py",
  "dotmac_workspace:src/dotmac_workspace/static/css/workspace.css",
  "dotmac_academy_app:templates/public/courses.html",
  "dotmac_academy_app:static/public.css",
]
preserved_tests = [
  "dotmac_starter_mt:tests/unit/test_dotmac_ui_components.py",
  "dotmac_workspace:tests/test_launcher_is_not_authorization.py",
  "dotmac_academy_app:tests/web/test_public_catalog.py",
]
contract_consumers = []
reference_consumers = ["dotmac_starter_mt"]
candidate_consumers = ["dotmac_workspace", "dotmac_academy_app"]
local_copy_retirement = "Pending. Workspace's _tile plus dmws-tile* rules and Academy's public course-card markup plus overlapping card/grid rules remain authoritative. A later cutover must replace each with a thin CatalogItem mapping and delete the overlapping local renderer/CSS; this implementation branch does neither."
