# INDEPENDENT consumers only. The starter is the assembly that owns this
# package: its consumption proves the wiring works, not that anyone independent
# chose the contract, so it is recorded as reference proof and never counted
# (ADR-0006 section 5).
contract_consumers = ["dotmac_sub", "dotmac_academy_app", "dotmac_erp"]
reference_consumers = ["dotmac_starter_mt"]
candidate_consumers = ["dotmac_crm", "dotmac_workspace"]
inventory_evidence = [
  "docs/inventories/starter-surfaces.md",
  "docs/inventories/sub-surfaces.md",
  "docs/inventories/erp-vendor-surfaces.md",
  "docs/inventories/branding-settings.md",
  "docs/inventories/ui-surface-inventory.md",
  "docs/inventories/map-ui-sources.md",
  "docs/inventories/catalog-card-sources.md",
]
first_cutover = "Per slice. tokens: done -- dotmac_sub and dotmac_academy_app are merged external consumers on their default branches, serving the packaged asset through assembly-owned composition rather than copied stylesheets. components: done twice over -- dotmac_erp main at 462b6fa and dotmac_sub main at 73c35f4 both pin released 0.1.0a7, resolve the package-owned empty_state template through their real Jinja loaders, and exercise it through product-owned adoption tests. map-frame: not begun by owner direction; the audited candidates are dotmac_sub dispatch live-map/playback and dotmac_erp geofence editing, and neither is changed or counted by this slice. catalog-grid: pending -- this branch publishes no release and changes neither Workspace nor Academy. The starter remains reference proof rather than an independent cutover."
shadow_and_drift = "Per slice. tokens: consumer visual, accessibility, two-brand, CSP, and compiled-asset checks compare the package with the product surface; dotmac_sub additionally carries tests/architecture/test_dotmac_ui_adoption.py. components: clean-host, installed-wheel, registry-installed, escaping, token-native and product-seam sensitivity proofs guard the shared empty-state core; ERP and Sub each pin the release and reject a vendored package template. map-frame: clean-host rendering, exact state/signature checks, provider/product-policy sensitivity proof, token-native sizing and state contrast protect the candidate; no cross-product drift claim is made before adoption. catalog-grid: clean-host, escaping, display-only-field, optional-action, empty-state, token-native CSS, responsive and contrast proofs exist here; Workspace and Academy must add product-loader parity tests before either local renderer can retire."
local_copy_retirement = "Per slice. tokens: dotmac_erp still builds its own live src/css tree; dotmac_sub's sanctioned green role-token overrides are deliberate. components: ERP and Sub retain only thin empty-state adapters, not markup owners; CRM remains optional. map-frame: no product copy retires in this change; an authorized adoption must replace only the local outer frame and sizing rule while leaving provider and domain behavior local. catalog-grid: no retirement is claimed -- Workspace still owns dmws-tile markup/CSS and Academy still owns its course-card markup/CSS until coordinated product cutovers prove parity and delete the overlaps."
next_action = "Keep both audit-complete slices on the integration train without composing or releasing them. Map-frame adoption may replace only a local outer frame and sizing rule; provider runtime, viewport, data and domain policy remain product-owned. Catalog adoption maps product-owned listing results to CatalogItem without moving commercial eligibility, stock, selection or money decisions into dotmac-ui. Each adopter must prove loader and behavior parity and retire only the displaced local renderer/CSS. Keep the 851 hardcoded-palette baseline as a two-directional maintenance ratchet."

# ── Contract slices (schema 2) ──────────────────────────────────────────────
# This package publishes FOUR contracts whose evidence differs. A single
# package-level state cannot describe that honestly: report the stronger and the
# weaker contract is overstated; report the weaker and the stronger is
# understated. The gate validates each slice independently and DERIVES the
# headline `status` above as the weakest of them.

[[slices]]
name = "tokens"
contract = "Framework-independent foundational semantic tokens and compiled, self-hosted assets; component-owned tokens are evidenced with their component slice"
status = "reuse-proven"
source_paths = [
  "dotmac_sub:static/css/design-system.css",
  "dotmac_starter_mt:packages/dotmac-ui/src/dotmac_ui/tokens.py",
  "dotmac_erp:tailwind.config.js",
]
preserved_tests = [
  "dotmac_starter_mt:tests/unit/test_dotmac_ui_tokens.py",
  "dotmac_starter_mt:tests/unit/test_dotmac_ui_a11y.py",
  "dotmac_starter_mt:tests/unit/test_admin_shell_tokens.py",
  "dotmac_sub:tests/architecture/test_dotmac_ui_adoption.py",
]
contract_consumers = ["dotmac_sub", "dotmac_academy_app"]
reference_consumers = ["dotmac_starter_mt"]
candidate_consumers = ["dotmac_erp", "dotmac_crm"]
local_copy_retirement = "dotmac_erp still builds its own live src/css tree, the fork dotmac_sub abandoned, so its adoption retires nothing until that tree goes. dotmac_sub re-declares the --dmui-* ramps with its own palette through the sanctioned override path, which is a deliberate outcome rather than outstanding debt."

[[slices]]
name = "components"
contract = "The reuse-proven empty-state inert Jinja component, its ComponentContract declaration and token-native CSS"
status = "reuse-proven"
source_paths = [
  "dotmac_erp:templates/components/macros.html",
  "dotmac_sub:templates/components/data/empty_state.html",
  "dotmac_crm:templates/components/data/empty_state.html",
]
preserved_tests = [
  "dotmac_erp:tests/test_template_macros.py",
  "dotmac_starter_mt:tests/unit/test_dotmac_ui_components.py",
  "dotmac_starter_mt:tests/unit/test_dotmac_ui_consumer.py",
  "dotmac_starter_mt:tests/architecture/test_ui_release_contract.py",
  "dotmac_erp:tests/architecture/test_dotmac_ui_adoption.py",
  "dotmac_sub:tests/architecture/test_dotmac_ui_adoption.py",
]
# Two independent default-branch consumers establish reuse. The starter is
# recorded separately as reference proof and deliberately does not count:
# consumption by the assembly that OWNS the package proves the wiring, not that
# anyone independent chose the contract.
contract_consumers = ["dotmac_erp", "dotmac_sub"]
reference_consumers = ["dotmac_starter_mt"]
# Candidates are future demand, not products already counted above. CRM is
# technically eligible but unscheduled; Academy has no local renderer to retire.
candidate_consumers = ["dotmac_crm", "dotmac_academy_app"]
local_copy_retirement = "ERP's production macro supplied the product-first semantics; its former renderer is now a thin argument adapter over the package macro, protected by direct macro and architecture tests. Sub's byte-identical renderer is now a thin include-context adapter, protected by its architecture test and six live callers. Neither adapter owns markup. The starter's table macro copy is retired; CRM's copy is optional future cleanup, not part of the active programme."

