schema_version = 2
package = "dotmac-ui"
classification = "presentation-foundation"
status = "audit-complete"
source_mode = "product-first"
owner = "Dotmac design system"
contract = "Framework-independent semantic tokens and compiled self-hosted UI assets"
source_repositories = ["dotmac_sub", "dotmac_starter_mt", "dotmac_erp"]
source_paths = [
  "dotmac_sub:static/css/design-system.css",
  "dotmac_starter_mt:packages/dotmac-ui/src/dotmac_ui/tokens.py",
  "dotmac_erp:tailwind.config.js",
]
preserved_tests = [
  "dotmac_starter_mt:tests/architecture/test_ui_public_surface.py",
  "dotmac_starter_mt:tests/unit/test_dotmac_ui_tokens.py",
  "dotmac_starter_mt:tests/unit/test_dotmac_ui_a11y.py",
  "dotmac_starter_mt:tests/unit/test_dotmac_ui_consumer.py",
  "dotmac_sub:tests/architecture/test_dotmac_ui_adoption.py",
]
# INDEPENDENT consumers only. The starter is the assembly that owns this
# package: its consumption proves the wiring works, not that anyone independent
# chose the contract, so it is recorded as reference proof and never counted
# (ADR-0006 section 5).
contract_consumers = ["dotmac_sub", "dotmac_academy_app"]
reference_consumers = ["dotmac_starter_mt"]
candidate_consumers = ["dotmac_erp", "dotmac_crm"]
inventory_evidence = [
  "docs/inventories/starter-surfaces.md",
  "docs/inventories/sub-surfaces.md",
  "docs/inventories/erp-vendor-surfaces.md",
  "docs/inventories/branding-settings.md",
  "docs/inventories/ui-surface-inventory.md",
]
first_cutover = "Done, and twice over. dotmac_sub and dotmac_academy_app are both merged external consumers on their default branches: each pins the released 0.1.0a3 and serves the packaged asset through an assembly-owned app/ui.py rather than a copied stylesheet. Verified 2026-08-13 against each repository default branch, not a feature branch."
shadow_and_drift = "Consumer visual, accessibility, two-brand, CSP, and compiled-asset checks compare the package with the product surface during cutover. dotmac_sub additionally carries tests/architecture/test_dotmac_ui_adoption.py, which holds its adoption seam in place after the fact; a further consumer brings its own equivalent rather than relying on the starter tests alone."
local_copy_retirement = "Two overlapping local owners remain and neither is retired. dotmac_erp still builds its own live src/css tree, the fork dotmac_sub abandoned, so its adoption retires nothing until that tree goes. dotmac_sub re-declares the --dmui-* ramps with its own green palette through the override path COMPATIBILITY.md sanctions, so it shares the vocabulary and keeps its values; that is a deliberate outcome, not outstanding debt."
next_action = "The COMPONENT slice is what gates this package now: it has zero independent consumers. Publish empty_state as an audit-complete CANDIDATE release so a product can adopt it -- a candidate carries no reuse claim and is what breaks the circularity of 'needs two consumers to release, needs a release to be consumed' -- then promote the slice to reuse-proven once two INDEPENDENT products are on it. The token slice needs nothing further. See docs/superpowers/plans/2026-08-13-presentation-system-programme.md."

# ── Contract slices (schema 2) ──────────────────────────────────────────────
# This package publishes TWO contracts whose evidence differs. A single
# package-level state cannot describe that honestly: report the stronger and the
# weaker contract is overstated; report the weaker and the stronger is
# understated. The gate validates each slice independently and DERIVES the
# headline `status` above as the weakest of them.

[[slices]]
name = "tokens"
contract = "Framework-independent semantic tokens and compiled, self-hosted assets"
status = "reuse-proven"
source_paths = [
  "dotmac_sub:static/css/design-system.css",
  "dotmac_starter_mt:packages/dotmac-ui/src/dotmac_ui/tokens.py",
  "dotmac_erp:tailwind.config.js",
]
preserved_tests = [
  "dotmac_starter_mt:tests/unit/test_dotmac_ui_tokens.py",
  "dotmac_starter_mt:tests/unit/test_dotmac_ui_a11y.py",
  "dotmac_sub:tests/architecture/test_dotmac_ui_adoption.py",
]
contract_consumers = ["dotmac_sub", "dotmac_academy_app"]
reference_consumers = ["dotmac_starter_mt"]
local_copy_retirement = "dotmac_erp still builds its own live src/css tree, the fork dotmac_sub abandoned, so its adoption retires nothing until that tree goes. dotmac_sub re-declares the --dmui-* ramps with its own palette through the sanctioned override path, which is a deliberate outcome rather than outstanding debt."

[[slices]]
name = "components"
contract = "Inert Jinja component templates plus their ComponentContract declarations and token-native CSS"
status = "audit-complete"
source_paths = [
  "dotmac_sub:templates/components/data/empty_state.html",
  "dotmac_crm:templates/components/data/empty_state.html",
  "dotmac_starter_mt:packages/dotmac-kernel/src/dotmac_kernel/templates/components/table_macros.html",
]
preserved_tests = [
  "dotmac_starter_mt:tests/unit/test_dotmac_ui_components.py",
  "dotmac_starter_mt:tests/unit/test_dotmac_ui_consumer.py",
]
# ZERO independent consumers. The starter is recorded below as reference proof
# and deliberately does not count: consumption by the assembly that OWNS the
# package proves the wiring, not that anyone independent chose the contract.
contract_consumers = []
reference_consumers = ["dotmac_starter_mt"]
local_copy_retirement = "dotmac_sub and dotmac_crm each carry a byte-identical local empty_state; neither is retired, and neither may be until that product pins a released candidate and its own tests pass against it. The starter's local macro in table_macros.html IS retired by this change."
