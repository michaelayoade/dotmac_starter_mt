source_mode_note = "No qualifying production-used composition engine exists in Sub, ERP or Starter (docs/inventories/device-config-composition-sources.md section 2). The initial code is Dotmac Sub draft PR 3625 at ab2d08e0e8f4cadca0fd4b3c2e65d334ea03bcdc, ported with its review fixes H1 and L1-L4 and its spec tests; that PR was never merged or used in production and is reviewed initial code, not a qualifying source."
owner = "Stateless layered-configuration composition: deterministic merge of weighted, tiered layers into an effective state with per-leaf provenance, typed conflicts, dated exceptions, widening classification and a drift vocabulary, through a provider-neutral plug-in protocol"
contract = "Accept immutable layer revisions, a subject, dated exceptions and a caller-supplied date by value; apply the plug-in's tiers, field specs, derived rules and module schemas; return an Effective state with per-module effective parameters, provenance for every effective leaf, conflicts, exception statuses, lapsed exceptions and stable hashes. Same inputs give the same output in any input order. The engine owns no rows, transactions, clocks, environment, external I/O, credentials or provider vocabulary; the plug-in supplies every domain fact and the consuming assembly supplies storage and decisions."

