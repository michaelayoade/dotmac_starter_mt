authority_boundary = "ADR-0074 and its ADR-0017 owner-directed exception. dotmac-config-layers owns only deterministic composition. A plug-in (dotmac-routeros-config for RouterOS) owns the domain's tiers, field specs and module vocabulary; dotmac-network-config owns durable layer revisions and commands; dotmac-network-control owns change-set execution. No product vocabulary, credential, transport or provider client enters this package."
inventory_evidence = [
  "docs/inventories/device-config-composition-sources.md",
]
first_cutover = "Dotmac Sub router control plane is the first candidate: Sub pins the released engine and the RouterOS plug-in and runs composition and drift reports from its CLI. Sub has no local engine to retire, so the cutover is a first adoption and not a replacement; nothing is adopted until a Sub commit exercises the released package in a running system."
shadow_and_drift = "Port parity: every ported source file equals Sub draft PR 3625 at the recorded revision after the declared lint-only deltas. The spec vectors T1 to T25, the M10 and M11 permutation and idempotence checks, provenance completeness, equal-rank ties and widening classification run against this package unchanged. At adoption, Sub compares composed effective state and hashes for the same layers and subjects against its own reports before any enforcement."
local_copy_retirement = "None required: Sub holds no local copy once draft PR 3625 is closed in favour of this package. Sub must not keep a fork of the engine; any engine change lands here first."
next_action = "Hosted CI green on the first slice; architect review; Michael merges. Release only by the named release captain in a gap between billing releases, before dotmac-routeros-config. Kernel floor a88 is conservative and not probe-proven minimal (see COMPATIBILITY.md); any floor at or below a98 is acceptable. Product adoption additionally requires an exact Sub pin and adoption evidence at an immutable Sub commit."

