[tool.poetry]
name = "dotmac-customers"
version = "0.1.0a1"
description = "Tenant customer accounts, profiles, and party references"
authors = ["DotMac"]
readme = "README.md"
packages = [{ include = "dotmac_customers", from = "src" }]
include = [
    { path = "src/dotmac_customers/py.typed", format = ["sdist", "wheel"] },
    { path = "src/dotmac_customers/migrations/**/*", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
dotmac-kernel = ">=0.1.0a78"
sqlalchemy = "^2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
