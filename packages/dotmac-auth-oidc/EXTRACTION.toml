schema_version = 1
package = "dotmac-auth-oidc"
# NOT an optional-module: nothing installs this. It has no ModuleManifest, no
# namespace, no lineage and no release-allowlist shape — a consumer constructs
# an `OIDCClient` and calls it. Naming it a module would send a reader looking
# for a lineage that does not exist.
classification = "stateless-protocol-adapter"
status = "adopted"

# NOT "product-first", and the distinction is the whole story of this dossier.
# ERP has the fleet's only real OIDC implementation, so the reflex is to port it.
# Rule 24 makes a *qualifying production-used, tested* implementation the
# mandatory source, and ERP's qualifies on neither count:
#
#   - production adoption UNVERIFIED. Every repository-side artifact a
#     deployment would touch says it is off — `.env.example` default
#     `OIDC_ENABLED=false`, no compose or systemd reference, one commit
#     (bded8aa9, 2026-07-20), contract document written as a future cutover
#     gate. That is evidence of absence in git, NOT proof: the live value is
#     environment-supplied and the host has not been read (Michael must name
#     it first). This half is therefore unproven either way.
#   - untested where it matters. `_validate_id_token` and `_exchange_code` are
#     monkeypatched out in EVERY existing test, so signature verification, the
#     algorithm allowlist, `kid` handling, nonce mismatch and every claim-
#     validation failure path have zero real coverage.
#
# So the DESIGN and the written contract port with confidence; the crypto and
# HTTP internals do not port as trusted code. That is greenfield-after-inventory,
# and the inventory is what earns it.
source_mode = "greenfield-after-inventory"

owner = "The OIDC relying-party ceremony: discovery, JWKS, Authorization Code + PKCE, server-side single-use state, and ID-token validation — ending at a verified (issuer, subject)."

contract = "Run an OIDC login and say which external subject authenticated. NOT which local party that is (dotmac_kernel.external_identity), NOT whether they may do anything (dotmac_kernel.deps.authorize_party), NOT a session (the product's own identity facet), NOT a user record (nothing here provisions), and NOT provider-specific behaviour (no Keycloak/Entra/Google/Auth0 branch, per ADR-0024)."

source_repositories = [
  "dotmac_erp",
  "dotmac_sub",
  "dotmac_crm",
  "dotmac_academy_app",
  "dotmac_vendor_control_plane",
  "dotmac_starter_mt",
]

source_paths = [
  "dotmac_erp:app/services/sso/oidc.py",
  "dotmac_erp:docs/oidc_identity_contract.md",
  "dotmac_erp:tests/architecture/test_identity_protocol_boundary.py",
  "dotmac_crm:app/services/oauth_state.py",
  "dotmac_sub:app/services/authentication_mechanism_registry.py",
  "dotmac_starter_mt:packages/dotmac-auth-oidc/src/dotmac_auth_oidc",
]

preserved_tests = [
  "dotmac_starter_mt:tests/unit/test_auth_oidc_state.py",
  "dotmac_starter_mt:tests/unit/test_auth_oidc_id_token.py",
  "dotmac_starter_mt:tests/unit/test_auth_oidc_discovery.py",
  "dotmac_starter_mt:tests/architecture/test_auth_oidc_public_surface.py",
]

contract_consumers = ["dotmac_workspace"]
candidate_consumers = ["dotmac_workspace", "dotmac_erp"]

inventory_evidence = [
  "docs/inventories/external-identity-sources.md",
  "docs/adr/0021-the-tenant-workspace-is-a-third-plane.md",
  "docs/adr/0017-adoption-is-the-scarce-resource.md",
]

first_cutover = "DONE 2026-08-15. `dotmac_workspace` PR #2 (`ef38693`) merged with `dotmac-auth-oidc 0.1.0a1` exact-pinned and its own `identity/oidc.py` DELETED — discovery, JWKS, the algorithm allow-list, PKCE, the exchange and ID-token verification all gone, replaced by an ~80-line `relying_party.py` that decides only which config, which lifetime and where the store comes from. It supplies a production `StateStore`: a PostgreSQL table whose `take` is one `DELETE ... RETURNING`, proven under real concurrency in its own `tests/db/test_state_store_atomicity.py`. The verified subject is resolved through `dotmac_kernel.external_identity.finalize_external_login` and the Workspace issues its OWN `dmws_session` — the package mints nothing. The pilot also CHANGED this package before earning the release (starter PR #194): a database-backed store belongs to one request's transaction, so `state_store` became a per-ceremony argument with a `PER_REQUEST_STATE_STORE` declaration, while the client stays process-lifetime to keep its `ProviderCache`. That gap was only findable by trying to be a consumer, which is the argument for pilot-before-publish stated as evidence rather than as principle. ERP remains the SECOND candidate and the more valuable proof, since it is the only repository with an existing implementation to retire; its OIDC was confirmed NOT live by host inspection, so that is a deletion (ERP PR #302) rather than a login migration."
local_copy_retirement = "ERP's `app/services/sso/oidc.py` is the only local copy and it is retired by adoption, not by this package's existence. Retirement is cheap IF the host inspection confirms it is off: no rows, no sessions, no migration. If it is on, this becomes a live-login migration and a different, much more careful piece of work — the reason the host reading is still worth doing even though it no longer changes the source ruling. Its `federated_identities` table is a SEPARATE retirement, governed by `dotmac_kernel.external_identity` rather than by this package — do not conflate them, the protocol client and the local binding are two capabilities with two owners (see the inventory's headline table). CRM's and Sub's forked `meta_oauth.py` pair is NOT retired by this package: Meta OAuth2 for API access is not SSO, has no ID token and no JWKS, and belongs to the Integrator connector story."

shadow_and_drift = "SETTLED 2026-08-15, and settled by a reading rather than by an argument. This field used to say a shadow comparison was unavailable because ERP's implementation had no VERIFIED production usage, and that if a host inspection later showed it live, a shadow comparison became both possible and necessary before retirement. The inspection happened: on erp.dotmac.io, OIDC_ENABLED is unset in the running dotmac_erp_app container, no issuer/client id/secret is configured, and federated_identities holds zero rows. There is no live behaviour to diff against, so no shadow phase is owed and ERP's retirement is a deletion. What stands in for a shadow is DIFFERENTIAL testing against the source's known gaps — each of the six defects the inventory measured in ERP (no JWKS/discovery caching, no clock-skew leeway, no `azp` check when `aud` is multi-valued, no one-time-use state, a borrowed state-signing key, an old pinned python-jose) is a named test here that fails if the behaviour regresses to ERP's. The FIRST consumer adds a second kind of evidence the differential tests cannot give: dotmac_workspace's suite mints real signed ID tokens against a provider double, so this package's verification runs for real from a consumer's side rather than only from its own. The ongoing drift risk is different in kind — a provider rotating signing keys — and is handled in the code (bounded forced JWKS refetch on an unknown `kid`, rate-limited against amplification) rather than by reconciliation, because there is no local projection to drift."

next_action = "`reuse-proven` needs a SECOND real consumer, and ERP is not it: its cutover is a deletion of an implementation that was never live, which removes a duplicate without proving reuse. The honest second consumer is a product that actually federates a login — recorded here so nobody books the ERP deletion as the second data point. Unchanged and non-negotiable: this package must never gain a knob that widens `ALLOWED_ALGORITHMS`, a `plain` PKCE method, a way to put the ceremony back on the wire, or a provider-name branch; the pyjwt floor `>=2.13` is a SECURITY floor (GHSA-jq35-7prp-9v3f, an algorithm allow-list bypass through 2.12.1) and must not be lowered for compatibility; and the client secret is resolved by the product and installed at startup (ADR-0009 — a secret is HELD, never dereferenced on a request path). One consumer-side lesson worth carrying to the next adopter: `InMemoryStateStore` is single-process only, and the Workspace kept its equivalent OUT of its shipped package entirely rather than guarding against selecting it."
