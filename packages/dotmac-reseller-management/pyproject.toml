[tool.poetry]
name = "dotmac-reseller-management"
version = "0.1.0a1"
description = "Tenant reseller identity, hierarchy, delegated authority and lifecycle"
authors = ["DotMac"]
readme = "README.md"
packages = [{ include = "dotmac_reseller_management", from = "src" }]
include = [
  { path = "src/dotmac_reseller_management/py.typed", format = ["sdist", "wheel"] },
  { path = "src/dotmac_reseller_management/migrations/**/*", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
dotmac-kernel = ">=0.1.0a84"
sqlalchemy = "^2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
