first_cutover = "After kernel 0.1.0a69, Integration 0.1.0a6 and both owner catalogues 0.1.0a1 are published, release this connector and exact-pin it in dotmac_integrator. On Seabone, create a disposable inbound-only firewall through an approved command, prove observe and idempotent re-apply, force a post-mutation timeout into ambiguous reconciliation, then delete it and prove absence. No instance/network/volume/DNS binding may be activated from this manifest."

shadow_and_drift = "Compare public firewall status and normalized inbound-rule digest against the official Contabo GET response. Name/marker collision, foreign provider rule shape and unsupported provider state fail closed. Mutation uncertainty becomes Integration-owned ambiguous reconciliation; the connector owns no retry state."

