next_action = "Publish and verify kernel 0.1.0a69, dotmac-integration 0.1.0a6, dotmac-managed-infrastructure-contracts 0.1.0a1 and dotmac-domains-contracts 0.1.0a1. Then add this package to the connector release lane in a separate change, run package and installed-wheel conformance on Observer CI, publish 0.1.0a1, exact-pin in dotmac_integrator, and complete disposable Seabone acceptance before any production binding."
