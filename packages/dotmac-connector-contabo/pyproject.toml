[tool.poetry]
name = "dotmac-connector-contabo"
version = "0.1.0a1"
description = "Bounded Contabo provisioning connector for Dotmac Integrator"
authors = ["DotMac"]
readme = "README.md"
packages = [{ include = "dotmac_connector_contabo", from = "src" }]
include = [
    { path = "src/dotmac_connector_contabo/py.typed", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
dotmac-domains-contracts = "0.1.0a1"
dotmac-integration = ">=0.1.0a6"
dotmac-managed-infrastructure-contracts = "0.1.0a1"
httpx = ">=0.27,<1.0"

[tool.poetry.plugins."dotmac_integration.connectors"]
contabo = "dotmac_connector_contabo:PLUGIN"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
