source_mode_note = "The initial typed owner boundary was designed after the recorded ERP/Sub inventory. Successor cash-credit, multiline, WHT and non-cash grant algorithms now extract qualifying Sub behavior behind that boundary; immutable persistence and contract gaps are explicit PORT-DELTAs, not claims of source cutover. Opening-window admission and sealing are a PORT-DELTA inventoried before implementation in docs/inventories/billing-opening-window-extraction.md; existing immutable import, account-serialization and inverse owners are retained. Repeatable opening rehearsal reporting is inventoried in docs/inventories/billing-opening-rehearsal-report-extraction.md; typed Sub observations and real V2 preflights remain their existing owners, and unavailable original-documentary evidence blocks nonempty rehearsals. V2 import qualification composes trusted complete-source and exact-operation grant providers through existing digest/preflight owners; its PORT-DELTA inventory is docs/inventories/billing-opening-qualification-extraction.md. Operational source authentication remains external."
owner = "Operational receivables on explicit tenant and platform planes: immutable rated-obligation acceptance, invoice and credit-note meaning, independently confirmed settlement facts, invoice-bound noncash withholding discharges, source-specific ordinary non-cash grants and their application/correction effects, allocation/correction effects, applied tax/FX/party-tax snapshots, separate per-currency account positions and invoice exposures, financial resolution, official document artifact relations and immutable accounting facts; immutable cash-only V1 and atomic evidenced receivables-plus-cash V2 opening receipts and source lots, original historical invoice backing and discharge replay bindings, complete mixed-source credit draws/inverses and independently evidenced refund/correction/full-unwind lifecycle; permanent scope-wide opening-window custody, restricted principal admission, immutable closure and pure typed rehearsal reporting"
contract = "Accept AcceptRatedObligationV1 and AcceptSettlementV1 exactly once; issue immutable invoice/credit-note facts; append allocation, deallocation, reallocation, refund and reversal posting groups; derive collectible_receivable, available_credit and prepaid_funding separately with dotmac_kernel.money.Money; publish account/currency ReceivablePositionV1 and invoice-grained ReceivableExposureV1 facts with Billing-owned financial state; publish InvoiceDocumentFactV1 and unchanged AccountingFactV1 plus WHT-only AccountingFactV2 and non-cash-only AccountingFactV3; grant ordinary non-tax value, apply one restricted or unrestricted grant to an explicit invoice, reverse applications partially or fully, reduce only unused grant room, and publish separate ReceivablePositionV2 for every subsequent posting group; accept exactly evidenced invoice WHT and append its exact inverse without creating cash; record one official opaque file relation through RecordDocumentArtifactV1 and append physical replacements only through RepairDocumentArtifactV1 with strict semantic-digest matching. Reversal is a movement that may reopen a fact, never a steady state. NOT offers/contracts/cadence/proration, collections policy/cases/consequences, PSP clients/credentials/webhook verification/retry/checkpoints, numbering-series state, document rendering/bytes, product access consequences, GL/journals/chart of accounts/fiscal periods/statutory accounting/treasury/tax returns. Cash-only import requires a complete qualified manifest, import-specific assembly authority, exact target fingerprint/watermark and pristine account admission. Permanent source claims bind one settlement or opening lot. Mixed-source draws/inverses, evidenced unused refunds/full corrections and full import unwind publish distinct AccountingFactV4 and immutable scoped queries. No automatic source reimport, partial principal amendment, unsupported opening-lane admission or production authority switch. V2 extends the account import atomically to authenticated historical invoice residuals and supported cash, with permanent historical source bindings, native-versus-imported receivable backing, distinct AccountingFactV5 and ReceivableExposureV2 preserving unknown collection provenance, supported discharge/inverse lifecycle and full evidenced unwind. No rated obligation, fresh invoice number, native issuance, new revenue or historical money replay is manufactured. New imports require the bound restricted principal and complete frozen scope window; new admission after seal fails closed, authenticated exact retries and separate linked inverses remain. Rehearsal reports reconcile identity and separate documentary/discharge/residual controls without qualifying cash or activating authority."
