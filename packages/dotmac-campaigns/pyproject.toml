[tool.poetry]
name = "dotmac-campaigns"
version = "0.1.0a1"
description = "Provider-neutral outbound campaign lifecycle, immutable audiences and ordered recipient progression"
authors = ["DotMac"]
readme = "README.md"
packages = [{ include = "dotmac_campaigns", from = "src" }]
include = [
  { path = "src/dotmac_campaigns/py.typed", format = ["sdist", "wheel"] },
  { path = "src/dotmac_campaigns/migrations/**/*", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
# a71 allocates mod_campaigns/ca/campaigns and already publishes every kernel
# facility this module consumes: consent, idempotency, outbox, tenant scopes,
# module manifests and migration prerequisite verification.
dotmac-kernel = ">=0.1.0a71"
sqlalchemy = "^2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
