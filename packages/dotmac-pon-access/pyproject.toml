[tool.poetry]
name = "dotmac-pon-access"
version = "0.1.0a1"
description = "Tenant provider-neutral OLT, ONT, PON commissioning, desired-state and reconciliation owner"
authors = ["DotMac"]
readme = "README.md"
packages = [{ include = "dotmac_pon_access", from = "src" }]
include = [{ path = "src/dotmac_pon_access/py.typed", format = ["sdist", "wheel"] }, { path = "src/dotmac_pon_access/migrations/**/*", format = ["sdist", "wheel"] }]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
dotmac-kernel = ">=0.1.0a76"
sqlalchemy = "^2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
