[tool.poetry]
name = "dotmac-learning"
version = "0.1.0a1"
description = "Reusable tenant learning results, progress, completion and certificates"
authors = ["DotMac"]
readme = "README.md"
packages = [{ include = "dotmac_learning", from = "src" }]
include = [
    { path = "src/dotmac_learning/py.typed", format = ["sdist", "wheel"] },
    { path = "src/dotmac_learning/migrations/**/*", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
# In-tree source qualification only. This is not a published Kernel floor.
# Replace with the proven published minimum before release enrollment.
dotmac-kernel = { path = "../dotmac-kernel", develop = true }
sqlalchemy = "^2.0"
pydantic = "^2.9"
alembic = ">=1.13"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
