[tool.poetry]
name = "dotmac-work-orders"
version = "0.1.0a1"
description = "DotMac Work Orders — tenant-scoped physical work execution, assignment, evidence and work logs"
authors = ["DotMac"]
readme = "README.md"
packages = [{ include = "dotmac_work_orders", from = "src" }]
include = [
  { path = "src/dotmac_work_orders/py.typed", format = ["sdist", "wheel"] },
  { path = "src/dotmac_work_orders/migrations/**/*", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
# a71 allocates mod_workorders/wo/work_orders in the immutable namespace ledger.
dotmac-kernel = ">=0.1.0a75"
sqlalchemy = "^2.0"
pydantic = "^2.9"
alembic = ">=1.13"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
