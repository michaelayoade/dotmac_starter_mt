composition_boundary = "Each adopter installs its own tenant-only dm lineage and owns only its local Digital Media rows. The module imports the kernel but no sibling/product/provider. Files, approvals, durable timers, content, documents, publishing and records synchronize typed opaque references/observations through the adopting assembly or versioned application APIs; no shared database, ORM or cross-module foreign key exists."
first_cutover = "Backoffice is cutover 1 because it is the selected adopter for the parked marketing surface and has no competing DAM. Pin an exact released package, compose its own tenant plane, classify/backfill every selected Mkt Asset and creative relation, verify opaque file UUID/checksum parity, shadow reads, switch the reusable-asset writer and retire Mkt's asset service. Content rewrites only contextual creative references to exact media revisions. Sub and Academy are later independent adopters."
shadow_and_drift = "For each selected Mkt Asset compare stable id mapping, kind, title/description/default alt text, creator credits, exact opaque file UUID/checksum and every Campaign/Post contextual relation. For new revision/rights/rendition behavior compare deterministic command fingerprints, current pointers, rights decisions and rendition source/output digests against the module itself; no source parity is claimed where the inventory found no owner. Require zero unexplained drift before the writer switch and keep an idempotent reconciler after cutover."
local_copy_retirement = "Delete Mkt's reusable Asset writer and raw reusable-file identity only after Backoffice's sealed authority cutover and rollback window. Keep Content-owned role/order/caption/context alt text, but migrate its raw file_ref to exact media-revision references and prohibit new raw file refs. ERP/Sub/CRM attachment services retire nothing merely because the DAM exists; a domain slice moves only when explicitly selected and reconciled. No mirrored DAM writer or permanent compatibility fork remains."
next_action = "Keep the package uncomposed, unallowlisted and unpublished. After review, resolve the parallel a74/ADR-0033 merge ordering by rebasing to the next free coordinates if necessary, obtain separate publication authorization, then complete Backoffice's exact-pin composition, Mkt shadow/cutover and writer retirement before naming a contract consumer."
