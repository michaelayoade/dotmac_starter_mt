local_copy_retirement = "For each adopted ERP domain, remove local retention/hold/disposition columns, jobs and deletion decisions after the sealed switch and rollback window; the domain keeps attachment/business meaning and a Records deletion gate. A two-directional caller/table ratchet reaches zero. Sub repeats per domain. Files never gains a retention fallback and Records never writes source-domain lifecycle."
next_action = "Sub's account-disposition inventory is DONE (docs/inventories/subscriber-account-disposition-sources.md, measured at dotmac_sub@883a0ff1a): retention is one unversioned integer setting with no record series, schedule version, trigger observation, legal hold, approval or disposition evidence, and `purge_expired_from_recovery_queue` DESTROYS NOTHING \u2014 it stamps a flag whose only effect is that restore then refuses, while the code's own docstring and comment claim a personal-data purge that exists nowhere. Adoption therefore implements destruction rather than replacing it, and needs characterization tests first because no test exercises the deletion, restore or purge paths at all. Complete exact-commit Observer validation, then write ERP's retention/deletion writer inventory and cutover plan. Keep kernel a84 and Records a1 unpublished until package, lineage and adopter gates are green; keep destructive execution disabled until one sealed product cutover."
