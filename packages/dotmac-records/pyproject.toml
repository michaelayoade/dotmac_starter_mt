[tool.poetry]
name = "dotmac-records"
version = "0.1.0a1"
description = "Declared-record retention, holds, preservation and disposition authority"
authors = ["DotMac"]
readme = "README.md"
packages = [{ include = "dotmac_records", from = "src" }]
include = [
  { path = "src/dotmac_records/py.typed", format = ["sdist", "wheel"] },
  { path = "src/dotmac_records/migrations/**/*", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
dotmac-kernel = ">=0.1.0a74"
sqlalchemy = "^2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
