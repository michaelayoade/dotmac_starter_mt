[tool.poetry]
name = "dotmac-party"
version = "0.1.0a1"
description = "Tenant Party roles, relationships, memberships, and reachability evidence"
authors = ["DotMac"]
readme = "README.md"
packages = [{ include = "dotmac_party", from = "src" }]
include = [
    { path = "src/dotmac_party/py.typed", format = ["sdist", "wheel"] },
    { path = "src/dotmac_party/migrations/**/*", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
dotmac-kernel = ">=0.1.0a73"
sqlalchemy = "^2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
