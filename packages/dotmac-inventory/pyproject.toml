[tool.poetry]
name = "dotmac-inventory"
version = "0.2.0a1"
description = "Dotmac Inventory — tenant-local stock ledger, reservations, traceability, and valuation"
authors = ["Dotmac"]
readme = "README.md"
packages = [{ include = "dotmac_inventory", from = "src" }]
include = [
  { path = "src/dotmac_inventory/py.typed", format = ["sdist", "wheel"] },
  { path = "src/dotmac_inventory/migrations/**/*", format = ["sdist", "wheel"] },
  { path = "src/dotmac_inventory/_native*.so", format = "wheel" },
  { path = "src/dotmac_inventory/_native*.pyd", format = "wheel" },
  { path = "build.py", format = "sdist" },
  { path = "native/Cargo.toml", format = "sdist" },
  { path = "native/Cargo.lock", format = "sdist" },
  { path = "native/pyproject.toml", format = "sdist" },
  { path = "native/src/**/*", format = "sdist" },
  { path = "native/decimal-core/**/*", format = "sdist" },
  { path = "native/decimal-core/vendor/LICENSE.mpdecimal.txt", format = ["sdist", "wheel"] },
]
exclude = ["native/target", "native/**/target", "src/**/*.so", "src/**/*.pyd", "src/**/*.dll", "src/**/*.dylib"]

[tool.poetry.build]
script = "build.py"
generate-setup-file = false

[tool.dotmac.native]
python-package = "dotmac_inventory"
decimal-core = true

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
dotmac-kernel = ">=0.1.0a83"
sqlalchemy = "^2.0"

[build-system]
requires = ["poetry-core==2.2.1", "maturin==1.14.1"]
build-backend = "poetry.core.masonry.api"
