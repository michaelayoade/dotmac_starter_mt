composition_boundary = "The adopter pins the package exactly, declares one ResendFence over its own consequence/authority models, and runs its own command inside prepare/enter/finish. The fence reads and fences the caller's session only; it never opens an engine, commits, or issues business policy. Kernel durable-timers owns scheduling and the kernel outbox relay owns claim/lease/retry; this package fences one human-triggered resend inside a caller transaction and nothing else."
inventory_evidence = [
  "docs/inventories/delivery-resend-sources.md",
]
first_cutover = "Academy adopts after a Forgejo release: add exact pin, construct the fence in app/services/reminder_resend.py, re-point the four suites with import-line changes only, delete app/services/reminder_resend_unit.py in the same change (no shim: dual import would double-register process-global Session listeners), full Academy CI green."
shadow_and_drift = "Behavior proof is the unmodified Academy suites (64 test functions, 670+ cases) against the packaged fence; any assertion change required is an extraction defect, not a test edit."
local_copy_retirement = "Delete dotmac_academy_v2:app/services/reminder_resend_unit.py at adoption; the command layer app/services/reminder_resend.py stays in the product."
next_action = "Review scaffold, run Starter isolation test, then release 0.1.0a1 to Forgejo and adopt in Academy."

