package = "dotmac-delivery-resend"
classification = "optional-module"
status = "audit-complete"
source_mode = "product-first"
owner = "Caller-transaction classification and refusal, SQL authority admission, native flush/rollback abort handling, swallowed-commit latching, write-phase admission, receipt pinning and helper-rollback inventory verification for a human-triggered delivery resend"
contract = "Given a product-declared ResendFence (consequence tables each exposing id+tenant_id, authority models, and a write-phase map), a product command running inside an arbitrary caller transaction is fenced: pending authority mutations are refused before command reads, participant writes outside the declared phase tables are refused pre-dispatch, raw transaction-control SQL is refused at admission, and the command's receipts are pinned against pre-command inventories and verified under fresh authority re-reads. The package owns no tables, no lineage, no engine, no enqueue and no audit write; the product command performs its own effects inside the fence. Runtime refuses anything but SQLAlchemy 2.0.51 on postgresql+psycopg in a non-autocommit, non-twophase caller."
