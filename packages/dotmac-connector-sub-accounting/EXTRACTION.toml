schema_version = 1
package = "dotmac-connector-sub-accounting"
classification = "stateless-protocol-adapter"
status = "audit-complete"
source_mode = "greenfield-after-inventory"

owner = "Sub invoice-accounting-sync feed transport: authenticated (X-API-Key) paged GET polling of Sub's invoices/accounting-sync/v2 feed through an engine-owned cursor, response and per-item shape validation, disposition/issues consistency checking, and translation into the provider-neutral invoices.accounting_sync.observation.v1 POLL observation, including the projection_fingerprint computation."

contract = "Implement dotmac-integration SPI >=1.3,<2.0 for connector key sub_accounting. Serve invoices.accounting_sync.observation.v1 in POLL only. Page GET /api/v1/invoices/accounting-sync/v2 on selfcare.dotmac.io with X-API-Key auth, a canonical {after_id, after_updated_at} cursor (both fields or neither), always-sent limit and optional updated_since; validate strictly-increasing (updated_at, source_invoice_id) page positions and refuse a non-monotonic page. Emit only source-derived fields (source_invoice_id, source_account_id, source_updated_at, source_kind, disposition, source_total_amount/currency, optional source_issued_at/source_due_at, issues with line_id renamed to source_line_id, contract_version, projection_fingerprint) — never organization_id or an idempotency_key-shaped field, which are the generic Integration engine's and the destination ObservationPortClient's responsibility. Refuse a blocked observation with no issues, or a non-blocked observation carrying issues, before emitting. Own no database, product identity, destination-org mapping, delivery idempotency, retry/checkpoint engine or ERP-side consistency enforcement."

# ── Greenfield, not ported — and one open evidence gap stated rather than
# hidden ───────────────────────────────────────────────────────────────────
#
# No qualifying implementation of this specific feed's POLL client existed
# anywhere in the fleet at the time this package was built. The wire contract
# (path, headers, cursor params, response and item shape) and the target
# fingerprint algorithm are taken from a description gathered in the same
# session that built this connector (citing dotmac_sub's
# app/schemas/billing.py and app/services/auth_dependencies.py, and
# dotmac_erp's app/services/dotmac_sub/client.py and
# app/services/dotmac_sub/invoice_sync_shadow.py) — NOT from direct access to
# either repository, which were unreachable from this worktree. The
# `dotmac_sub`/`dotmac_erp` entries in `source_paths` below are therefore
# UNVERIFIED CITATIONS: they record what this connector was built against,
# not confirmed line-for-line evidence, and no `source_revisions`/
# `product_writers` claim is made for either repository because no commit
# coordinate for them was independently confirmed this session — inventing
# one would be exactly the fabricated-evidence failure this gate exists to
# catch. The highest-risk unverified item is the fingerprint algorithm
# (`mapping.py`'s module docstring and this package's `README.md` "Fingerprint
# risk" section): it must be reconciled against ERP's real
# `invoice_sync_shadow.py` before either side trusts computed fingerprints for
# drift detection.

