shadow_and_drift = "Compare every polled item's mapped fields, disposition/issues consistency verdict and projection_fingerprint against ERP's own independently-computed shadow record for the same source item, over a full accounting cycle. The fingerprint comparison is the load-bearing one and is explicitly UNPROVEN today (see the note above) — a mismatch there is expected until the canonicalization algorithms are reconciled line-for-line, not a surprise to investigate as a runtime bug."

