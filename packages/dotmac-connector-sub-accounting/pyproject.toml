[tool.poetry]
name = "dotmac-connector-sub-accounting"
version = "0.1.0a1"
description = "Sub invoice-accounting-sync feed, POLL-only observation connector"
authors = ["DotMac"]
readme = "README.md"
packages = [{ include = "dotmac_connector_sub_accounting", from = "src" }]
include = [
    { path = "src/dotmac_connector_sub_accounting/py.typed", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
dotmac-integration = ">=0.1.0a14"
httpx = ">=0.27,<1.0"

[tool.poetry.plugins."dotmac_integration.connectors"]
sub_accounting = "dotmac_connector_sub_accounting:PLUGIN"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
