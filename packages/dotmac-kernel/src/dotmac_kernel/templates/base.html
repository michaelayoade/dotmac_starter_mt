<!doctype html>
<html lang="en" x-data :class="{ 'dark': $store.dark.on }">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="htmx-config" content='{"defaultSwapStyle":"innerHTML"}' />
    <title>{% block title %}{{ brand.name if brand and brand.name else "Admin" }}{% endblock %}</title>

    <!-- Fonts: Outfit (display) + Plus Jakarta Sans (body) — VENDORED
         (static/fonts/, latin subset woff2) per the cross-Dotmac no-CDN
         standard: external font hosts are a prod reliability + CSP surface
         (control-plane security Task 5 dropped the fonts.googleapis.com /
         fonts.gstatic.com origins from the Content-Security-Policy). -->
    <link rel="stylesheet" href="{{ static_asset_url('/static/fonts/fonts.css') }}">

    <!-- Tailwind CSS (built from static/css/src/main.css via `npm run css:build`) -->
    <link rel="stylesheet" href="{{ static_asset_url('/static/css/main.css') }}">

    <!-- Installed presentation packages' compiled stylesheets (a `dotmac-ui`
         release, a packaged theme), declared by the assembly as
         `ProductAssemblySpec.stylesheets` and installed as this global by
         `dotmac_kernel.templating.install_stylesheets`. The kernel does not
         know what they are — ADR-0006 § 2's dependency direction runs
         assembly → dotmac-ui → dotmac-kernel, never the other way, so this is
         a slot, not a reference. LAST, so a design system's tokens and its
         focus-indicator contract win over the compiled utility CSS above on
         equal specificity. Each URL already carries its own cache-busting
         query; they are package-resolved, self-hosted paths, never a CDN. -->
    {% for href in extra_stylesheets %}
    <link rel="stylesheet" href="{{ href }}">
    {% endfor %}

    {% block head %}{% endblock %}
</head>
<body class="min-h-screen bg-[var(--dmui-surface-background)] text-[var(--dmui-text-primary)] antialiased">
    <!-- HTMX + Alpine. `components.js` registers Alpine.data()/Alpine.store()
         components on the `alpine:init` event, so it must load BEFORE the
         (deferred) alpine.min.js core so its listener is attached in time. -->
    <script src="{{ static_asset_url('/static/js/htmx.min.js') }}"></script>
    <script src="{{ static_asset_url('/static/js/components.js') }}"></script>
    <script defer src="{{ static_asset_url('/static/js/alpine.min.js') }}"></script>

    <!-- CSRF header bridge — see static/js/csrf.js docstring. Loaded early so
         the htmx:configRequest listener is registered before any htmx call
         can fire. NOTE: plain `<form method="post">` is NOT covered by this
         bridge — every mutating form/link in these templates MUST use
         hx-post/hx-put/hx-delete instead; see csrf.js for why. -->
    <script src="{{ static_asset_url('/static/js/csrf.js') }}"></script>

    {% block body %}
    {% block content %}{% endblock %}
    {% endblock %}

    <!-- Toast notifications, driven by `toastStore` (static/js/components.js)
         and the `show-toast` window event (dispatched via
         `window.showToast(message, type)` or an `HX-Trigger: {"showToast":
         {...}}` response header). -->
    <div id="toast-container"
         x-data="toastStore"
         x-on:show-toast.window="addToast($event.detail)"
         role="status"
         aria-live="polite"
         aria-atomic="true"
         class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none">
        <template x-for="toast in toasts" :key="toast.id">
            <div x-show="toast.visible"
                 x-transition:enter="transition ease-out duration-300"
                 x-transition:enter-start="translate-y-2 opacity-0"
                 x-transition:enter-end="translate-y-0 opacity-100"
                 x-transition:leave="transition ease-in duration-200"
                 x-transition:leave-start="translate-y-0 opacity-100"
                 x-transition:leave-end="translate-y-2 opacity-0"
                 :class="{
                     'bg-[var(--dmui-status-positive-surface)] border-[var(--dmui-status-positive-border)] text-[var(--dmui-status-positive-foreground)]': isSuccess(toast),
                     'bg-[var(--dmui-status-negative-surface)] border-[var(--dmui-status-negative-border)] text-[var(--dmui-status-negative-foreground)]': isError(toast),
                     'bg-[var(--dmui-status-warning-surface)] border-[var(--dmui-status-warning-border)] text-[var(--dmui-status-warning-foreground)]': isWarning(toast),
                     'bg-[var(--dmui-status-info-surface)] border-[var(--dmui-status-info-border)] text-[var(--dmui-status-info-foreground)]': isInfo(toast)
                 }"
                 class="px-4 py-3 rounded-lg border shadow-lg text-sm font-medium pointer-events-auto flex items-center gap-2 max-w-sm">
                <span x-text="toast.message"></span>
                <button x-on:click="removeToast(toast.id)" aria-label="Dismiss notification" class="ml-2 hover:opacity-75">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
        </template>
    </div>

    <!-- No inline <script> blocks in any template: CSP serves script-src
         'self' without 'unsafe-inline' (Task 5). The toast bridge that used
         to live here is in static/js/components.js. -->
    {% block scripts %}{% endblock %}
</body>
</html>
