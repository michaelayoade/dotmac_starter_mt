first_cutover = "The starter reference assembly consumes the extracted settings, consent, delivery, and channel-policy facilities; product-by-product released-pin cutovers follow the existing-product adoption plan. MACHINE CREDENTIALS (2026-08-22): not started. dotmac_sub is the first cutover and the licence destination, so its descriptor route (Vendor ADR-0010 gate 2b) is the first caller. It did not PULL the facility: the demand came from a separate ISP assembly that needed an authenticated descriptor route and had no kernel guard that fitted, and ADR 0012's conversion amendment then ended that assembly. The distinction is worth keeping — a facility attributed to whoever adopts it first loses the reason it exists, and the reason is what a later reader checks the design against. CORRECTED the same day: this said dotmac-isp composes the released kernel greenfield and \"has no legacy verifier to retire, so its cutover proves the facility rather than a migration\". Governance ADR 0012's conversion amendment ended the separate ISP assembly — Sub is not retired, it becomes the thin assembly in place — and Sub DOES hold a legacy verifier. So this is a migration, not a greenfield proof, and it inherits the Sub reissuance gate recorded in local_copy_retirement below: Sub's verification key is derived from the connector-credential encryption key, so every credential must be reissued before app/services/auth.py's hash_api_key, hash_api_key_candidates, _maybe_upgrade_api_key_hash and _touch_api_key_last_used can retire."
shadow_and_drift = "Each product must run parity, profile, migration, and product behaviour tests before removing its local implementation."
local_copy_retirement = "A product-local owner is removed only after its released kernel cutover and parity gate; task #22 owns the outstanding ERP/Sub settings-domain repair, while Sub's communication eligibility, notification receipt, and channel-policy paths retire only after their kernel adapters pass the preserved behavior proofs. MACHINE CREDENTIALS: adoption is credential REISSUANCE, never a hash migration — a stored digest holds neither the raw key nor material to re-key from, so no conversion or backfill exists. Sub: scope semantics already match, but its verification key is derived from the connector-credential encryption key, so every credential must be reissued before app/services/auth.py's hash_api_key, hash_api_key_candidates, _maybe_upgrade_api_key_hash and _touch_api_key_last_used retire. ERP: gated on resolving every active null/empty-scoped key — inventory by IDENTIFIER only, assign an owner and explicit minimum scopes, revoke unused and reissue retained, and treat every unresolved active key as a CUTOVER BLOCKER. An empty scope list may never be translated into a wildcard or all-current-permissions. ERP runs a bounded old/new verification transition with a checked retirement deadline; that legacy verifier stays in ERP and never enters the kernel, which has one scheme and no fallback."
next_action = "Publish the demand-pulled product-manifest contract, make Sub's release path emit it from SUB_ASSEMBLY, and replace Vendor's configured capability lists and duplicate catalogue protocol with digest-verified snapshots before the Entitlement Allocation writer cutover. The broader adoption sequence remains Sub settings first, then ERP. MACHINE CREDENTIALS: release the hardened facility (tenant-scoped RLS-protected credential, X-Api-Key against a dedicated held key, exact scopes with empty authorizing nothing, active/expiry/revocation, typed MachinePrincipal, require_machine_scope inside an established tenant scope, and no admin access, wildcard, human-user requirement, commit, rollback or authentication-time telemetry write), then pin it in dotmac_sub under the reissuance gate above; ERP adopts separately under its own. There is no separate ISP assembly to pin it in."
