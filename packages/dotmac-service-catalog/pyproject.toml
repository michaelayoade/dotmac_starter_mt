[tool.poetry]
name = "dotmac-service-catalog"
version = "0.1.0a1"
description = "Technical service specifications, plan families, characteristics, and eligibility inputs"
authors = ["DotMac"]
readme = "README.md"
packages = [{ include = "dotmac_service_catalog", from = "src" }]
include = [
  { path = "src/dotmac_service_catalog/py.typed", format = ["sdist", "wheel"] },
  { path = "src/dotmac_service_catalog/migrations/**/*", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
dotmac-kernel = ">=0.1.0a91"
sqlalchemy = "^2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
