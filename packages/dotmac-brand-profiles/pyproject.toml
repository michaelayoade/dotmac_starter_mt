[tool.poetry]
name = "dotmac-brand-profiles"
version = "0.1.0a1"
description = "DotMac Brand Profiles — the data that makes one released artifact appear as different brands: identity, colours, file references, host bindings and per-field precedence with locking (ADR-0033 § 2)"
authors = ["DotMac"]
readme = "README.md"
packages = [{ include = "dotmac_brand_profiles", from = "src" }]
include = [
    { path = "src/dotmac_brand_profiles/py.typed", format = ["sdist", "wheel"] },
    { path = "src/dotmac_brand_profiles/migrations/**/*", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
# Two runtime dependencies, and the second is the interesting one.
#
# `dotmac-ui` is the ONLY cross-package dependency any module in this programme
# declares, and it is the permitted direction: ADR-0006 § 2 fixes the chain as
# `assembly -> module -> dotmac-ui -> dotmac-kernel`. It is not a sibling module,
# and the `Modules are independent of each other` contract does not name it.
#
# The dependency is what makes ADR-0006 D8 structural rather than remembered:
# this package stores two hex values and `dotmac_ui.BrandOverride` validates them
# at construction. There is no CSS column, no token map and no colour parser
# here, because `dotmac-ui` owns all three. Vendoring a hex parser to avoid the
# dependency would create exactly the second colour authority D8 retired.
#
# `dotmac-ui` is itself dependency-free (no kernel, no ORM, no web framework, no
# templating), so this adds no transitive weight.
#
# The kernel floor is the ALLOCATION: a77 carries the `mod_brand` ledger row.
dotmac-kernel = ">=0.1.0a77"
dotmac-ui = ">=0.1.0a7"
sqlalchemy = "^2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
