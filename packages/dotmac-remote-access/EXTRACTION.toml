composition_boundary = "Approvals supplies decision evidence as a value and is never imported. Network Control consumes activation/revocation intents and returns observations through the assembly/Integrator; this module never runs a command or stores a provider credential. Target references are opaque and no FK leaves mod_remote."
inventory_evidence = ["docs/inventories/sub-vnext-parity-sources.md", "docs/inventories/sub-vnext-parity-dispositions.toml", "docs/adr/0040-sub-vnext-parity-capabilities-have-narrow-independent-owners.md"]
source_mode_note = "Fleet search found production expiry/reconciliation behavior in Sub but no generic request/grant/revocation owner in any inspected repository. The implementation is therefore greenfield after inventory while porting Sub's finite-expiry and fail-closed parity tests as references."
first_cutover = "Sub is cutover 1. A Network Control adapter must require an admitted module grant before toggling device access, shadow intended/observed grant state, then delete every direct bypass path."
shadow_and_drift = "Because no legacy generic ledger exists, compare every direct device toggle during observation against an admitted module grant and require zero unexplained activations before enforcing the gate. Expired/revoked grants must produce revocation intent and deny reuse."
local_copy_retirement = "Retire only direct device/network remote-access mutation paths that bypass the new grant. Keep Network Control reconcilers and device observations: they execute and observe, they do not own authorization."
next_action = "Implement the tenant-only ra lineage with request/grant/observation tables, strict TTL and approval-digest checks, RLS/FORCE and expiry/revocation canaries."
