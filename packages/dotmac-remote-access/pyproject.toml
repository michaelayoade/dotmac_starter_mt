[tool.poetry]
name = "dotmac-remote-access"
version = "0.1.0a1"
description = "Tenant approval-bound finite remote-access grants and evidence"
authors = ["DotMac"]
readme = "README.md"
packages = [{ include = "dotmac_remote_access", from = "src" }]
include = [{ path = "src/dotmac_remote_access/py.typed", format = ["sdist", "wheel"] }, { path = "src/dotmac_remote_access/migrations/**/*", format = ["sdist", "wheel"] }]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
dotmac-kernel = ">=0.1.0a88"
sqlalchemy = "^2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
