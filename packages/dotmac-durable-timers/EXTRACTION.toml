schema_version = 1
package = "dotmac-durable-timers"
classification = "optional-module"
status = "audit-complete"
source_mode = "product-first"
owner = "Durable timer identity, generation, supersession, cancellation, trigger acceptance and terminal-history retention on separately declared tenant and platform planes"
contract = "Given a TenantScope or PlatformScope, an open TimerIdentity, an explicit timezone-aware due_at and recorded_at, and a typed TimerOutput, schedule exactly one current generation under a transaction-scoped advisory identity lock, supersede any previous current generation, and enqueue the output through the matching dotmac_kernel outbox with available_at=due_at in the same caller transaction. Trigger acceptance serializes on the same identity, refuses stale and canceled generations before the consumer effect, records one append-only acceptance for the current generation, and reports replay explicitly. Cancellation distinguishes canceled, already fired, already canceled and nothing scheduled. Retention deletes only terminal history older than caller-supplied evidence and never reads a clock. The module owns no due scan, claim loop, lease, retry, dead-letter policy, product command vocabulary, business deadline policy, or consumer effect."
