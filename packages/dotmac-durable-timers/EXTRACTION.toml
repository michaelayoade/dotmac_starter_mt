contract_consumers = []
candidate_consumers = ["dotmac_sub", "dotmac_vendor_control_plane", "dotmac_crm"]
composition_boundary = "ADR-0024: each adopter pins the package, selects its own plane set, runs the dt lineage in its own database and owns its own timer and outbox rows. Applications exchange only versioned observations through Integrator; they never share mod_timers tables or read another application's database. ADR-0028: tenant tables carry tenant_id NOT NULL with FORCE RLS and platform tables carry no tenant column and are fully revoked from app_user; the planes share behavior but never a row or foreign key. dotmac_kernel.outbox_relay.v1 is the sole claim/lease/retry/dead-letter owner. TimerIdentity and TimerOutput are provider-neutral open values; product command names and business policy remain in the adopter."
inventory_evidence = [
  "docs/inventories/durable-timers-sources.md",
  "docs/inventories/p11-adoption-status.md",
  "docs/adr/0024-apps-compose-by-synchronizing-data.md",
]
first_cutover = "dotmac_sub tenant plane, financial.walled_account_healing first and billing.contracts second, after the package's ten PostgreSQL proofs pass on Observe and the exact released kernel/module revisions are pinned. Each family shadows the module output against the existing timer owner, proves stale-generation rejection and replay safety, then switches the sole schedule/cancel/accept writer before the local durable-timer copy and due scanner are retired."
shadow_and_drift = "For each Sub timer family, schedule through the module in shadow with the same explicit identity, due instant and source version while leaving the legacy owner authoritative. Compare generation, supersession, cancellation and emitted output for every transition; record divergence without allowing the shadow to cause the consumer effect. Exercise relay lease recovery and poison isolation against PostgreSQL. Cut over only after no divergence remains, then make the module acceptance verdict the gate immediately before the local consumer effect. A two-directional caller and import ratchet prevents either copy returning."
local_copy_retirement = "dotmac_sub retires direct DurableTimer imports and queries, current_timer, schedule_timer, cancel_timer, fire_due_timers, the durable_timers table, app/tasks/durable_timers.py and the durable_timer_dispatch_runner after both named first families cut over. Product business vocabulary, command dispatch and source-state validation stay in Sub; only timing mechanics leave. The collections.case_action_due output moves with its collections owner or is removed. The lifecycle schedule command ledger remains a separate decision: only its duplicated timing claim/lease/retry behavior is eligible, not its commands. ERP has no qualifying durable timer implementation and gains no parallel local copy."
next_action = "Review the integrated Starter module PR, where Billing and Durable Timers have independent namespace allocations on kernel 0.1.0a71. After separate release authorization, publish and verify that kernel and this module, pin their exact releases in Sub, and begin the typed shadow adoption. Production deployment and authority switching remain separately authorized."
