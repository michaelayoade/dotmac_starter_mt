composition_boundary = "ADR-0024: each adopter installs its own fi lineage, owns its own metadata rows and binds its own provider adapter. Applications share the package contract, never a mod_files schema, object-key authority or provider credential. Cross-app file data moves only through the owning application's versioned API/webhook; any local copy is a provenance-bearing repairable projection. Provider codes and SDK/wire mappings remain assembly declarations/adapters, never product/provider branches in dotmac-files."
inventory_evidence = [
  "docs/inventories/files-sources.md",
  "docs/adr/0022-files-own-stored-bytes-not-domain-meaning.md",
]
first_cutover = "dotmac_erp is cutover 1 because the checked-in product-first procedure requires a qualifying source product to retire its local owner first; ERP supplies the production S3 provider, broad admission policy (including image/PDF/XLS/XLSX signatures), and real callers. It is not yet a contract consumer: ERP's E8 Organization-to-Tenant and composed-migration decision currently classifies dotmac_kernel.db and stateful module lineages as defer-db. The cutover begins only after that gate provides one transaction authority and maps organization scope to the module's TenantScope without a parallel tenant writer. dotmac_academy_app is cutover 2, using its avatar flow as the independent tenant-plane slice. dotmac_vendor_control_plane is candidate cutover 3 on PlatformScope, preserving the exact offline licence bundle handed to an authenticated operator when durable artifact evidence is required; licensing retains the relation and delivery authority."
shadow_and_drift = "During ERP cutover, inventory every domain-owned key/path reference, create its opaque file relation, compare provider key, organization-to-tenant mapping, byte length and SHA-256, shadow authenticated reads against the same object, and run missing-object/orphan reconciliation in report-only mode before switching reads. Academy then imports each static avatar into an immutable tenant key, compares bytes and SHA-256, shadows the authenticated avatar response, and removes the legacy path only after every row has a verified file id. Vendor CP compares the exact exported bundle bytes and digest with the platform file target while its existing delivery-attempt record remains authoritative for the handoff. Upload creates immutable keys, so rollback drift is repairable by the split list/decide/delete orphan reconciler; deletion is pending-first and idempotently repairable after a crash."
local_copy_retirement = "ERP must replace app/services/file_upload.py as the lifecycle/policy owner and reduce app/services/storage.py to (or replace it with) an assembly-owned StorageProvider adapter over the exact pinned dotmac-files release; a two-directional import/caller ratchet reaches zero before the local owner is deleted. Domain tables retain attachment meaning but reference the module-owned opaque file id. Academy then removes direct static/avatars writes and retires Person.avatar_path after its backfill and fallback-read count reach zero. Vendor CP is greenfield for durable storage: its export route must delegate byte persistence to dotmac-files and keep only the licensing-owned relation/attempt, never create a second generic storage facade. No permanent mirrored lifecycle or path authority is allowed."
next_action = "Release exact dotmac-kernel >=0.1.0a54 and dotmac-files versions after the dual-plane catalog canaries pass. Finish ERP's E8 Organization-to-Tenant/composed-lineage decision, then cut ERP over through an assembly MinIO adapter plus a measured caller ratchet. After ERP retires its local generic owner, pin the same release in Academy, compose the fi lineage, migrate the avatar relation and remove direct disk I/O. Then compose the same fi lineage in Vendor CP and implement the platform bundle relation through PlatformScope without introducing a tenant. Open a separate dotmac-imports dossier only when import work starts."
