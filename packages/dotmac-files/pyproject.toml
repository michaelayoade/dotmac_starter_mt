[tool.poetry]
name = "dotmac-files"
version = "0.1.0a1"
description = "DotMac dual-plane stored-object lifecycle and validation"
authors = ["DotMac"]
readme = "README.md"
packages = [{ include = "dotmac_files", from = "src" }]
include = [
    { path = "src/dotmac_files/py.typed", format = ["sdist", "wheel"] },
    { path = "src/dotmac_files/migrations/**/*", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
dotmac-kernel = ">=0.1.0a54"
sqlalchemy = "^2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
