[tool.poetry]
name = "dotmac-connector-freeradius"
version = "0.1.0a1"
description = "FreeRADIUS SQL projection, observation polling and CoA connector"
authors = ["DotMac"]
readme = "README.md"
packages = [{ include = "dotmac_connector_freeradius", from = "src" }]
include = [
    { path = "src/dotmac_connector_freeradius/py.typed", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
dotmac-integration = ">=0.1.0a19"
httpx = ">=0.27,<1.0"
sqlalchemy = ">=2.0,<3.0"

[tool.poetry.plugins."dotmac_integration.connectors"]
freeradius = "dotmac_connector_freeradius:PLUGIN"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
