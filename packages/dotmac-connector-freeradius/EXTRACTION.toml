first_cutover = "Inside the single network-suite-v1 Sub cutover (ADR-0038): after the SPI 1.7 integration release is tagged and this connector is released and exact-pinned in dotmac_integrator, shadow the connector against Sub's incumbent writer to row parity, then flip the single writer. This dossier does not authorize activation."

shadow_and_drift = "For every login in a full sweep, compare the connector's rendered rows against the incumbent writer's rows byte-for-byte (password by presence), and its observed fingerprints against Sub's expected fingerprints. Test-access (TEST_RADIUS_*) logins are a named expected difference in v1 and must be enumerated, not silently absorbed."

local_copy_retirement = "At the suite cutover, delete Sub's local writers/readers (radius_population, direct radacct import tasks, enforcement CoA) in the same change that flips the single writer; Sub retains commercial decisions, credential ownership and composition over dotmac-network-access."

next_action = "Keep release disabled until the integration version carrying SPI 1.7 and ig_0017 is tagged, the assembly secret-fetch endpoint is live, and shadow parity is green. Then enable release by reviewed diff."

