[tool.poetry]
name = "dotmac-network-topology"
version = "0.2.0a1"
description = "Tenant declared/observed link, path, reachability and topology-projection owner"
authors = ["DotMac"]
readme = "README.md"
packages = [{ include = "dotmac_network_topology", from = "src" }]
include = [
    { path = "src/dotmac_network_topology/py.typed", format = ["sdist", "wheel"] },
    { path = "src/dotmac_network_topology/migrations/**/*", format = ["sdist", "wheel"] },
    { path = "src/dotmac_network_topology/_native*.so", format = "wheel" },
    { path = "src/dotmac_network_topology/_native*.pyd", format = "wheel" },
    { path = "build.py", format = "sdist" },
    { path = "native/Cargo.toml", format = "sdist" },
    { path = "native/Cargo.lock", format = "sdist" },
    { path = "native/pyproject.toml", format = "sdist" },
    { path = "native/src/**/*", format = "sdist" },
]
exclude = ["native/target", "src/**/*.so", "src/**/*.pyd", "src/**/*.dll", "src/**/*.dylib"]

[tool.poetry.build]
script = "build.py"
generate-setup-file = false

[tool.dotmac.native]
python-package = "dotmac_network_topology"

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
dotmac-kernel = ">=0.1.0a83"
sqlalchemy = "^2.0"

[build-system]
requires = ["poetry-core==2.2.1", "maturin==1.14.1"]
build-backend = "poetry.core.masonry.api"
