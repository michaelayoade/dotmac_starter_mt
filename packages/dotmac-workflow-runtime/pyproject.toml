[tool.poetry]
name = "dotmac-workflow-runtime"
version = "0.1.0a1"
description = "Tenant user-authored resumable workflow execution and repair evidence"
authors = ["DotMac"]
readme = "README.md"
packages = [{ include = "dotmac_workflow_runtime", from = "src" }]
include = [
  { path = "src/dotmac_workflow_runtime/py.typed", format = ["sdist", "wheel"] },
  { path = "src/dotmac_workflow_runtime/migrations/**/*", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
dotmac-kernel = ">=0.1.0a88"
sqlalchemy = "^2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
