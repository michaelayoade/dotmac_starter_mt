first_cutover = "Sub through dotmac_integrator, in mirror mode, and INGRESS FIRST. This package release is supply-chain evidence only: Sub's direct Paystack receiver remains authoritative until the same verified webhook stream produces zero unexplained identity, signature, amount, fee, currency, reference and provider-status drift over a full billing cycle. The OUTBOUND capabilities do not cut over with it and are not eligible on the ingress proof — the outbound direction is where a mistake takes money from a customer twice, so each command capability cuts over separately, behind its own product-owned command contract, after its own shadow period."

shadow_and_drift = "Ingress: mirror the exact raw body and signature header into Integrator while Sub's existing receiver remains the sole producer of financial consequences; compare provider-event coverage, verification verdict, payload digest and normalized fields. Outbound: shadow is NOT a second send. A command capability is proven by replaying real product commands through the connector against Paystack's TEST integration and comparing the wire body field-for-field against the product's existing client (endpoint, minor-unit amount, currency, reference derivation, and for a refund the merchant_note), plus a classification comparison over recorded provider responses — declines, duplicate-reference refusals, in-flight status tokens, 5xx and induced read timeouts. The drift class that must NOT be waived: any case where this connector answers SUCCEEDED and the product's own client did not, and any case where it answers RETRYABLE for a money-moving command. Deliberately NOT emitted on either side: Sub metadata, invoice targeting, net amount, PaymentStatus, or any allocation."

local_copy_retirement = "Retire only provider transport. Sub keeps payment_provider_events.py, payment_reconciliation.py, autopay's mandate/failure-count/suspension policy, every intent service, allocation, coverage and lifecycle decision; ERP keeps GL posting, expense-claim and payment allocation policy, its FOR UPDATE intent locking and its bounded poll sweep. This release can retire direct paged reconciliation clients and their private checkpoints after ingress shadow proof. On the command side it can retire, per capability and only after that capability's own cutover, Sub's PaymentGatewayRunner Paystack branch and ERP's paystack_client.py transport methods — never the product-side reference bookkeeping those clients feed, and never ERP's paystack_* columns, whose rename is a separate expand/contract migration. Flutterwave is a separate distribution and cutover."

next_action = "REFUND-ONLY SLICE DECLARED AS 0.1.0a3, NOT YET RELEASED (D5, 2026-11-04): it changed the manifest of the already-tagged 0.1.0a2, whose exact contract is retained as SETTLEMENT_MANIFEST and whose digest is recorded in docs/inventories/released-manifest-digests.json. Publish 0.1.0a3 after dotmac-integration 0.1.0a14, exact-pin it in dotmac_integrator, reconcile the authenticated payments.settlement.observation.v1 ProductPort descriptor, wire refund.processed/refund.failed observations to Payments ObserveCashOutcome, and run the refund smoke on the Paystack TEST integration. WIRING-PR OBLIGATIONS (Integrator/Payments): enqueue the refund with idempotency_key = the instruction's provider_reference (rf1-...); treat zero find_refund matches as conclusive only after a settle interval since the ambiguous send; route on observation_kind so a refund/refund_failed observation (which carries the original merchant_reference) never reaches capture or confirmation; publish the settlement observation schema admitting refund_failed, refund_reference, provider_refund_reference and an optional occurred_at; publish find_refund's result_schema. WIRING-PR RULES (more): any result_schema published for this capability MUST ACCEPT NULL, because the engine skips the result check only when the capability has no schema and the result is None, and there is one schema per capability: a schema that requires find_refund's shape would reject a successful refund (result None), leave it in_flight, let the lease expire and claim_delivery re-POST /refund, i.e. repeated refunds; the wiring PR must test that a successful refund with result=None is recorded against the published schema. A refund_reference that matches no instruction (the shape check admits hand-typed notes such as customer-requested-refund) is PARKED, never discarded and never applied. A worker crash after the POST and before the outcome is recorded re-sends the refund on lease expiry; the wiring PR must address it (for example by calling find_refund before any re-claim of an in-flight refund). Open: the refund webhook is not documented to carry merchant_note, so confirm on TEST whether it does; if it does not, matching falls to find_refund. DEFERRED: dispute ingress, and any payment-intent, payout or customer capability (each needs a named product owner and a durable command-response seam in dotmac-integration first)."

# ── Residual duplicate-refund risk, stated rather than implied ───────────────
#
# 1. REFUND has no provider-side reference field. The engine key travels in
#    `merchant_note`, and `find_refund` decides an ambiguous refund by exact
#    match on it — but nothing at Paystack REFUSES a second refund. The product's
#    reconciler must call `find_refund` before any replacement is issued; this
#    connector reports what the list holds and does not choose whether an
#    existing refund satisfies the intent.
# 2. A product that issues a NEW delivery (hence a new engine key, hence a new
#    reference) for a refund that already landed defeats every protection
#    here. The connector cannot see that and must not try to; the engine's
#    at-most-once ledger and the product's own refund state are what close it.

