owner = "Paystack provider transport in both directions: exact-byte HMAC-SHA512 verification, authenticated transaction-list polling, provider-event identity, charge-success normalization, acknowledgement bytes, and the nine outbound provider-neutral commands (payment initialization, saved-authorization charge, refund, bank-account resolution, transfer-recipient creation, transfer initiation, and customer create/update/read) with their wire translation, exact-money conversion and outcome classification."

contract = "Implement dotmac-integration SPI >=1.4,<2.0 for connector key paystack. Serve payments.settlement.observation.v1 in INGRESS and POLL, and payments.intent.v1, payments.refund.v1, payments.payout.v1 and payments.customer.v1 in DELIVERY, each capability mapped to its own mode so an observation binding never carries command authority. Emit exact amount and provider-fee decimal strings with explicit currency, provider status verbatim, merchant reference and transport evidence; reconcile through the authenticated paged transaction list. On the command side: carry the engine's idempotency key through to Paystack's own duplicate protection (the client-supplied unique reference, and merchant_note where no reference field exists), convert exact major-unit decimal strings to provider minor units without float and without rounding, classify each attempt as succeeded/declined/retryable/terminal/ambiguous, and report the provider reference and transaction id as evidence on every outcome including the ones that received no answer. Own no product identifier, tenant, allocation, coverage, balance, receivable state, net-amount arithmetic, settlement admissibility, invoice targeting, refund warrant, retry/checkpoint engine, row, session or product database."

