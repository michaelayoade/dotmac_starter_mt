first_cutover = "Sub through dotmac_integrator, in mirror mode. This package release is supply-chain evidence only: Sub's direct Paystack receiver remains authoritative until the same verified webhook stream produces zero unexplained identity, signature, amount, fee, currency, reference and provider-status drift over a full billing cycle."

shadow_and_drift = "Mirror the exact raw body and signature header into Integrator while Sub's existing receiver remains the sole producer of financial consequences. Compare provider-event coverage, verification verdict, payload digest and normalized fields. The connector deliberately does not emit Sub metadata, invoice targeting, net amount or PaymentStatus. Cut over the callback only after zero unexplained drift, then remove Sub's direct Paystack verification/normalization and lower its external-connector ratchet in the same change. ERP follows as a separate cutover after its product port exists."

local_copy_retirement = "Retire only provider transport. Sub keeps payment_provider_events.py, payment_reconciliation.py, every intent service, allocation, coverage and lifecycle decision. ERP keeps GL posting, expense-claim and payment allocation policy. The later outbound/poll Paystack slice retires the provider HTTP clients and tasks; this ingress-only release does not pretend that work is complete. Flutterwave is a separate distribution and cutover."

next_action = "dotmac-connector-paystack 0.1.0a1 is published, installed back from the private index, conformance-checked and tagged from exact main SHA deedb35 by release run 32368987719. Exact-pin it in dotmac_integrator, reconcile the authenticated payments.settlement.observation.v1 ProductPort descriptor, and run the Sub mirror/callback cutover. Keep status audit-complete until that cutover retires the direct transport. Add provider I/O only as later payments.intent.v1, payments.refund.v1 and payments.reconcile.v1 slices after their product-owned command contracts are published."
