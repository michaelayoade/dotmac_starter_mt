first_cutover = "Sub through dotmac_integrator, in mirror mode, and INGRESS FIRST. This package release is supply-chain evidence only: Sub's direct Paystack receiver remains authoritative until the same verified webhook stream produces zero unexplained identity, signature, amount, fee, currency, reference and provider-status drift over a full billing cycle. The OUTBOUND capabilities do not cut over with it and are not eligible on the ingress proof — the outbound direction is where a mistake takes money from a customer twice, so each command capability cuts over separately, behind its own product-owned command contract, after its own shadow period."

shadow_and_drift = "Ingress: mirror the exact raw body and signature header into Integrator while Sub's existing receiver remains the sole producer of financial consequences; compare provider-event coverage, verification verdict, payload digest and normalized fields. Outbound: shadow is NOT a second send. A command capability is proven by replaying real product commands through the connector against Paystack's TEST integration and comparing the wire body field-for-field against the product's existing client (endpoint, minor-unit amount, currency, reference derivation, and for a refund the merchant_note), plus a classification comparison over recorded provider responses — declines, duplicate-reference refusals, in-flight status tokens, 5xx and induced read timeouts. The drift class that must NOT be waived: any case where this connector answers SUCCEEDED and the product's own client did not, and any case where it answers RETRYABLE for a money-moving command. Deliberately NOT emitted on either side: Sub metadata, invoice targeting, net amount, PaymentStatus, or any allocation."

local_copy_retirement = "Retire only provider transport. Sub keeps payment_provider_events.py, payment_reconciliation.py, autopay's mandate/failure-count/suspension policy, every intent service, allocation, coverage and lifecycle decision; ERP keeps GL posting, expense-claim and payment allocation policy, its FOR UPDATE intent locking and its bounded poll sweep. This release can retire direct paged reconciliation clients and their private checkpoints after ingress shadow proof. On the command side it can retire, per capability and only after that capability's own cutover, Sub's PaymentGatewayRunner Paystack branch and ERP's paystack_client.py transport methods — never the product-side reference bookkeeping those clients feed, and never ERP's paystack_* columns, whose rename is a separate expand/contract migration. Flutterwave is a separate distribution and cutover."

next_action = "Publish 0.1.0a2 after dotmac-integration 0.1.0a14, exact-pin it in dotmac_integrator, reconcile the authenticated payments.settlement.observation.v1 ProductPort descriptor, and run ingress plus paged-poll shadow cutover. The four outbound capabilities remain blocked on two named gates: (1) product-owned command contracts for payment intent, refund, payout and customer synchronization — the connector performs commands, and nobody may issue one until a product owner is named for the decision behind it; and (2) a durable command-response seam in dotmac-integration, because DELIVERY returns an Outcome and cannot preserve a reply, so a checkout URL, a resolved account name and a new recipient code have nowhere to land. Until (2) exists, only commands whose reply is pure evidence (charge, refund, transfer) are usable through DELIVERY at all."

# ── Residual duplicate-charge risk, stated rather than implied ───────────────
#
# 1. REFUND has no provider-side reference field. The derived key travels in
#    `merchant_note`, which makes an ambiguous refund DECIDABLE by listing the
#    provider's refunds for the transaction — but nothing at Paystack REFUSES a
#    second refund. Closed by the product's reconciler, which must read the
#    refund list before issuing a replacement. This connector deliberately does
#    not read it: choosing whether an existing refund satisfies the intent is a
#    product decision.
# 2. CUSTOMER CREATE has undocumented duplicate semantics. Classified ambiguous
#    for that reason; no money is at stake, and `GET /customer/{email}` answers
#    it in one call.
# 3. A product that issues a NEW delivery (hence a new engine key, hence a new
#    reference) for a command that already landed defeats every protection
#    here. The connector cannot see that and must not try to; the engine's
#    at-most-once ledger and the product's own intent state are what close it.
