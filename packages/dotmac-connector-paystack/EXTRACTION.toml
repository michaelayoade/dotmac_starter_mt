owner = "Paystack provider transport: exact-byte HMAC-SHA512 verification, authenticated transaction-list polling, provider-event identity, charge-success and refund-outcome normalization, acknowledgement bytes, and the refund path (the refund command and the read that decides an ambiguous one) with wire translation, exact-money conversion and outcome classification."

contract = "Implement dotmac-integration SPI >=1.4,<2.0 for connector key paystack. Serve payments.settlement.observation.v1 in INGRESS and POLL and payments.refund.v1 in DELIVERY, each capability mapped to its own mode so an observation binding never carries command authority. Emit exact amount and provider-fee decimal strings with explicit currency, provider status verbatim, merchant reference and transport evidence; reconcile through the authenticated paged transaction list; observe refund.processed and refund.failed as refund and refund_failed observations carrying the refund reference (the stamped note, when it has the reference shape). On the refund side: carry the engine's idempotency key verbatim into merchant_note after a shape check (Paystack accepts no client reference on /refund), decide an ambiguous refund with find_refund (given the refund's reference; exact match on that note, zero matches not found as of this read, one found, more than one for a human; the verdict travels in Outcome.result) and never by re-sending, convert exact major-unit decimal strings to provider minor units without float and without rounding, classify each attempt as succeeded/declined/retryable/terminal/ambiguous, and report the provider reference and refund id as evidence on every outcome including the ones that received no answer. Payment intent, saved-authorization charge, payout and customer commands are not part of this contract. Own no product identifier, tenant, allocation, coverage, balance, receivable state, net-amount arithmetic, settlement admissibility, invoice targeting, refund warrant, retry/checkpoint engine, row, session or product database."

# ── Narrowed to refunds (Michael's decision D5, 2026-11-04) ──────────────────
#
# 0.1.0a3 carries the refund path ONLY. The payment-intent, saved-authorization
# charge, payout and customer commands and the capabilities
# `payments.intent.v1`, `payments.payout.v1` and `payments.customer.v1` were
# REMOVED, not disabled: `delivery._MISALLOCATED`'s import-time bijection forbids
# an operation no capability can reach, so the OPERATIONS rows and the
# ACTIONS_BY_CAPABILITY entries left in one change. Nothing is deprecated,
# because the published a2 never carried them.
#
# Why each left (the references stay in the ADRs, not here):
#   * payout     ADR-0061: the payout decision is ERP's and its provider is a
#                binding behind `submit_payout`; that refactor and its result
#                seam are not in this release.
#   * customer   ADR-0061 A5 removes `payments.customer.v1` outright.
#   * intent     `charge_authorization` is autopay, which is out of scope for
#                the cutover (B5), and `initialize_payment` has no named
#                product owner for its command contract.
#
# What the refund path now carries:
#   * `refund`       POST /refund. Paystack accepts NO client reference, so the
#                    engine's idempotency key is stamped VERBATIM into
#                    `merchant_note`; a key not matching
#                    ^[a-z0-9][a-z0-9-]{15,63}$ is refused before sending
#                    (`idempotency_key_shape`). Payments' `rf1-`+32 hex qualifies,
#                    so one identity joins instruction, provider and outcome.
#                    FIXED once a3 is tagged. An unanswered send is AMBIGUOUS
#                    and is never retried.
#   * `find_refund`  GET /refund?transaction=. Pure read, its own delivery with
#                    its own key, so it takes a required `refund_reference`
#                    and matches it exactly against `merchant_note`: zero
#                    matches = NOT FOUND AS OF THIS READ, one = found (id and
#                    status as evidence), more than one = needs a human; an
#                    unreadable or paged-past list decides nothing. A SUCCEEDED
#                    lookup carries {matches, refund_id?, refund_status?} in
#                    Outcome.result. The reconciler calls it and NEVER re-sends.
#   * ingress        `refund.processed` / `refund.failed` become `refund` /
#                    `refund_failed` observations on the settlement observation
#                    capability, carrying `refund_reference` (only when the
#                    note has the reference shape above) so Payments can feed
#                    ObserveCashOutcome. In-flight refund events stay record-only.
#   * disputes       DEFERRED. Dispute events stay record-only
#                    (`event_not_in_ingress_slice`); chargebacks enter through
#                    staff confirmation until volume says otherwise.
#
# The refund OWNER is not named here (ADR-0061 A9): a refund reverses a
# receivable, and this package only translates a decided command and classifies
# the answer.

