[tool.poetry]
name = "dotmac-connector-paystack"
version = "0.1.0a3"
description = "Paystack settlement ingress and reconciliation connector"
authors = ["DotMac"]
readme = "README.md"
packages = [{ include = "dotmac_connector_paystack", from = "src" }]
include = [
    { path = "src/dotmac_connector_paystack/py.typed", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
dotmac-integration = ">=0.1.0a11"
httpx = ">=0.27,<1.0"

[tool.poetry.plugins."dotmac_integration.connectors"]
paystack = "dotmac_connector_paystack:PLUGIN"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
