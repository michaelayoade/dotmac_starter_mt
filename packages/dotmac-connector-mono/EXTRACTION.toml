first_cutover = "ERP banking through dotmac_integrator. Reconcile ERP's authenticated banking.transaction.observation.v1 ProductPort, then run Integrator polling beside ERP's direct Mono sync while ERP remains the only writer of bank statements and reconciliation state."

shadow_and_drift = "For every configured account and overlap window compare provider transaction identity, lowest-denomination amount, currency, debit/credit direction, timestamp and optional running balance. Require complete event coverage and zero unexplained field drift across back-dated postings and at least one pagination boundary. Only then activate the Integrator poll and disable ERP's provider schedule."

local_copy_retirement = "Delete ERP's Mono HTTP client, secret readers, provider schedule, refresh/webhook transport and connector checkpoint code after cutover, lowering the external-connector ratchet in the same change. ERP keeps account-link intent, bank statement ownership, deduplication, matching, reconciliation and every accounting consequence."

next_action = "Run the new poll engine and connector suites on Observer and GitHub CI. After dotmac-integration 0.1.0a11 and this package are published, exact-pin them in dotmac_integrator and execute the ERP shadow/cutover; publication alone creates no consumer."
