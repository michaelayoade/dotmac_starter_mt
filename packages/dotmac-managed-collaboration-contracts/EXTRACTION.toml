next_action = "First land and release the Integration a6 executable-schema gate for plan/observe/cancel as well as apply; decorative operation pins are not admissible. Then admit and publish 0.1.0a1 through the contract-catalogue profile, replace Vendor CP synthetic evidence with the exact artifact, and require the collaboration connector fake and isolated acceptance to satisfy every schema and check. Message/share behavior remains blocked on a separately owned provider-neutral contract rather than being inferred from the file-roundtrip family."
