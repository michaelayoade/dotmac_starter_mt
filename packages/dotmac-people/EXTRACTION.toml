composition_boundary = "Each adopting application pins the released package, runs the pe lineage in its own database, binds party_person_catalog.v1 to its own qualifying Party provider, and owns its sessions and authorization. The module imports only dotmac-kernel, never an assembly, sibling module, ERP model, or product adapter."
inventory_evidence = ["docs/inventories/people-directory-sources.md"]
first_cutover = "dotmac-erp is the first exact-pin consumer and replacement authority. ERP remains sole writer during backfill and read-only shadow. A separately authorized sealed switch makes the Dotmac ERP product sole writer and reduces ERP employment-lifecycle writers to zero; the existing ERP employee key then remains only as a rebuildable compatibility projection for the measured 131 foreign-key declarations while dependent domains move."
shadow_and_drift = "Backfill kernel Party identities first, then module catalogues, employees, positions and assignments from a narrow versioned ERP read projection. Reconcile missing, extra, conflicting and stale rows plus employee codes, lifecycle state/dates, hierarchy, active assignments, vacancy routing and explicit-date manager results. Shadow is read-only; it cannot write either owner."
local_copy_retirement = "A two-directional ERP writer ratchet reaches zero for employee identity, code, lifecycle state/dates, organization catalogues, positions and assignments at cutover. ERP's compatibility projection has a separate writer/fallback ratchet and cannot originate decisions. Delete the legacy hr.employee and related tables only after all 131 foreign-key dependants have moved or been retired; zero ledger rows without zero authority is not success."
next_action = "Kernel a71 and dotmac-people a1 are registry-verified releases. Compose those exact versions in dotmac-erp, then build the narrow ERP projection/backfill/shadow contract before requesting the irreversible sole-writer cutover."
