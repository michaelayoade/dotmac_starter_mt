first_cutover = "dotmac_sub is first: it is the qualifying source, has the live finite funding gate and reconciler, and has already retired the generic operator payment path that could manufacture funding. Cut over the eligibility requirement/evidence decision first, then immutable order acceptance/lines, then submission/cancellation and fulfillment publication. Dotmac Cloud is a later greenfield consumer and proves reuse, not the first authority transfer."

shadow_and_drift = "Sub writes the module in shadow beside sales_orders and compares identity, frozen values, version provenance, totals, finite requirement membership, addressed evidence, reasoned eligibility and fulfillment identity for every active cohort. Missing price-version, terms or specification provenance is a blocking remediation row, never a guessed default. The module reconciler repairs only missing fulfillment publication from module-owned snapshots and never from live product catalogue rows."

local_copy_retirement = "After accepted shadow parity, Sub retires SalesOrderLines.create/update, PATCH /sales-order-lines/{id}, the admin line-edit branch, generic sales-order ownership of funding fields, is_active soft-delete cancellation, the local finite funding writer, and live-line reads in sales_fulfillment._funding_contract_snapshots. CRM's push writers and local sales-order tables retire only after Sub cutover; ERP's physical warehouse sales order remains ERP-owned and retires nothing."

next_action = "Orders is the named fulfillment-eligibility decision owner: Sales freezes finite requirement membership, explicit external owners publish addressed evidence, and evaluate_fulfillment_eligibility returns the askable reasoned result. Billing 0.1.0a1 continues to keep allocation/coverage internal; neither Orders nor an assembly may infer evidence from ReceivablePositionV1, allocation arithmetic or balances. Sales AcceptedQuoteHandoffV1 now carries terms content, specification and price provenance, component taxes, explicit minor units and finite eligibility membership, with an architecture canary proving mechanical SubmitOrderCommand construction without live catalogue reads. Validate the combined Sales/Orders static, unit, PostgreSQL isolation/concurrency/replay, migration and clean-wheel proofs on Observe from the exact committed branch. Keep both modules unreleased and outside every release allowlist until Sub's separate shadow/cutover change maps its existing funding receipts, proves parity and removes displaced local writers; only then release the exact kernel floor followed by the module alphas and mark the dossiers adopted."
