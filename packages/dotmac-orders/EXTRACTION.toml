owner = "The tenant-scoped customer-order aggregate: stable order identity, immutable accepted line snapshots with exact price/terms/specification provenance, refused-by-default submission/acceptance/cancellation, a reasoned fulfillment-eligibility decision over finite accepted requirement membership and explicitly addressed owner receipts, and one replayable fulfillment request identity per frozen line."

contract = "Accept a typed checkout snapshot under a required TenantScope and kernel idempotency key; persist one order with immutable exact-money line snapshots, captured price/terms/specification version references, and totals derived only from those snapshots; register the finite accepted set of opaque fulfillment-eligibility requirements; record deduplicated evidence explicitly addressed by each external owner; own the reasoned complete/incomplete decision without inferring another owner's meaning; and publish one typed, replayable fulfillment request per frozen line through the kernel outbox once acceptance and eligibility both hold. NOT quote/cart authoring, offer or price ownership, invoice/receivable/settlement/allocation meaning, subscription recurrence, fulfillment execution, stock/shipment, service lifecycle, numbering policy, provider transport, or the general ledger."

