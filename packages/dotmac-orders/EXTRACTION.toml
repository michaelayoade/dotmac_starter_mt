owner = "The tenant-scoped customer-order aggregate: stable order identity, immutable accepted line snapshots with exact price/terms/specification provenance, refused-by-default submission/acceptance/cancellation, finite coverage-obligation receipts, and one replayable fulfillment request identity per frozen line."

contract = "Accept a typed checkout snapshot under a required TenantScope and kernel idempotency key; persist one order with immutable exact-money line snapshots, captured price/terms/specification version references, and totals derived only from those snapshots; record a finite set of opaque coverage obligations and deduplicated satisfying receipts; and publish one typed, replayable fulfillment request per frozen line through the kernel outbox once acceptance and complete coverage both hold. NOT quote/cart authoring, offer or price ownership, invoice/receivable/settlement, subscription recurrence, fulfillment execution, stock/shipment, service lifecycle, numbering policy, provider transport, or the general ledger."

