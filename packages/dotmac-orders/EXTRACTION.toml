first_cutover = "dotmac_sub is first: it is the qualifying source, has the live finite funding gate and reconciler, and has already retired the generic operator payment path that could manufacture funding. Cut over coverage first, then immutable order acceptance/lines, then submission/cancellation and fulfillment publication. Dotmac Cloud is a later greenfield consumer and proves reuse, not the first authority transfer."

shadow_and_drift = "Sub writes the module in shadow beside sales_orders and compares identity, frozen values, version provenance, totals, finite obligation membership, coverage state and fulfillment identity for every active cohort. Missing price-version, terms or specification provenance is a blocking remediation row, never a guessed default. The module reconciler repairs only missing fulfillment publication from module-owned snapshots and never from live product catalogue rows."

local_copy_retirement = "After accepted shadow parity, Sub retires SalesOrderLines.create/update, PATCH /sales-order-lines/{id}, the admin line-edit branch, generic sales-order ownership of funding fields, is_active soft-delete cancellation, the local finite funding writer, and live-line reads in sales_fulfillment._funding_contract_snapshots. CRM's push writers and local sales-order tables retire only after Sub cutover; ERP's physical warehouse sales order remains ERP-owned and retires nothing."

next_action = "Integrate Orders on the shared kernel a70 foundation and generate the root lock with exactly Poetry 2.4.1. Before adoption, close both cross-owner inputs. Billing 0.1.0a1 explicitly keeps allocation/coverage internal and is not the eligibility owner; Michael must name a different owner-decided fact mechanically translatable to RecordCoverageResolutionCommand, or the adopted Orders profile must omit the financial gate. Orders and an assembly adapter must not infer eligibility from ReceivablePositionV1, allocation arithmetic or balances. Sales AcceptedQuoteHandoffV1 correctly stops before SalesOrder, but its current V1 omits the terms content, specification provenance, tax components, minor-unit contract and finite coverage membership Orders requires; extend that owner output until an assembly can translate it mechanically without live catalogue reads or a new commercial decision. Validate the package's static, unit, PostgreSQL isolation/concurrency/replay, migration and clean-wheel proofs on Observe from the exact committed branch. Keep the module unreleased and outside every release allowlist until Sub's separate shadow/cutover change removes the displaced local writers; only then release the exact kernel floor followed by dotmac-orders 0.1.0a1 and mark the dossier adopted."
