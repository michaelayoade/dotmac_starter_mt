[tool.poetry]
name = "dotmac-orders"
version = "0.1.0a1"
description = "Dotmac Orders — tenant-scoped customer orders, immutable accepted line snapshots, coverage receipts, and fulfillment publication"
authors = ["Dotmac"]
readme = "README.md"
packages = [{ include = "dotmac_orders", from = "src" }]
include = [
    { path = "src/dotmac_orders/py.typed", format = ["sdist", "wheel"] },
    { path = "src/dotmac_orders/migrations/**/*", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
dotmac-kernel = ">=0.1.0a70"
sqlalchemy = "^2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
