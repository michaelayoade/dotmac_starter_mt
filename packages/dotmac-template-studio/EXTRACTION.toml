first_cutover = "Sub, on the notification contract only, once the renderer is re-based per ADR-0006 5b. The package cannot receive Sub's rows as built: its double-brace substitution syntax is the syntax Sub rejects at save time after it leaked a literal placeholder to customers."
shadow_and_drift = "Sub's 7 notification_template_renderer tests are the parity proof; shadow rendering against the live single-brace renderer is required before Sub retires its local writer."
next_action = "ADR-0006 5b IMPLEMENTED in 0.2.0a1 (2026-08-10): kind=document dropped, renderer re-based on Sub's single-brace allowlisted contract with its 7 tests ported, identity moved to (tenant, slug, channel), RenderContext registry added, migration ts_0002. Remaining to leave PRE_RULE_DEBT and reach `adopted`: add the seeding mechanism (Sub's upsert-by-identity, never-clobber, derived-from-executable-spec), then cut Sub over and retire its local renderer — that cutover is the transition. `reuse-proven` follows when a second consumer moves onto an exact pin. Out of this package by ruling (5c): consent/suppression, channel policy, delivery/outbox and document generation are four separate foundation owners, each needing its own dossier, with consent sequenced before delivery. Do not absorb them here."
local_copy_retirement = "The selected source product must consume the released module and retire or gate its local writer before a second product cutover."
