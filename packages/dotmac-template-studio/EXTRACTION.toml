first_cutover = "Sub, on the notification contract only, in a later cohort cutover. The module now carries Sub's single-brace renderer and its upsert-by-(slug, channel), never-clobber seeding contract; Sub remains authoritative until an exact released pin passes shadow rendering and its local renderer and seeder are retired together."
shadow_and_drift = "Sub's 7 notification_template_renderer tests and Starter's seeding tests are the behavior parity proof. Before authority moves, shadow-render the same live contexts and verify every executable Sub seed maps to one (slug, channel) declaration without changing operator-edited rows."
next_action = "AUDIT-COMPLETE, NOT RELEASED OR ADOPTED: the 2026-08-10 source audit selected Sub's notification contract; 0.2.0a1 ported the single-brace renderer and seven parity tests, and 0.2.0a2 added upsert-by-identity, never-clobber seeding derived from executable TemplateSeed declarations. Keep the package unreleased until the deferred ERP-module cohort has a cutover window. Before allowlisting, retire the asserted no-DATABASE_URL import exemption by making the kernel engine lazy; a configured-DSN wheel smoke passes, but the standard release verifier intentionally imports with no database configuration. Then publish the exact reviewed version just in time, shadow-render Sub, seed without clobbering edits, switch authority once, and retire Sub's local renderer and seeder in that cutover. `adopted` is earned only then; `reuse-proven` follows after a second real consumer. Consent/suppression, channel policy, delivery/outbox and document generation remain separate owners under ADR-0006 5c and must not be absorbed here."
local_copy_retirement = "The selected source product must consume the released module and retire or gate its local writer before a second product cutover."
