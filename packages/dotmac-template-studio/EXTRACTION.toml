first_cutover = "Academy, as the first adopter, through the ADR-0006 5f send path: Template Studio authors the message (subject, html and text parts, sections), the kernel delivery owner sends it, and the product keeps only eligibility. Proved on the ADR-0006 2026-11-16 verification rails. Sub remains a candidate consumer for its notification contract once its renderer is re-based; it is no longer the first cutover."
shadow_and_drift = "Sub's 7 notification_template_renderer tests are the parity proof. Before a consumer retires its local renderer, its seeded templates are proved by differential render plus backtest: saved golden tests against that renderer's output, backtest against stored sent messages and real-record preview on a restored copy, then rolled out per tenant behind a flag (ADR-0006 2026-11-16 amendment). No shadow rendering, side-by-side run or N-day gate."
next_action = "ADR-0006 5b, 5h and 5i are implemented: context v2, the part-aware renderer with sections, the optional sanitized html part (ts_0004), the draft editor with sandboxed preview, diff, confirmed publish/restore and an own-address test send through a product-supplied seam, and the deploy-time check (`python -m dotmac_template_studio.deploycheck`). To reach `adopted`, exact-pin a verified release in Academy, register its send-path contexts, seed its templates and prove them on the verification rails, run the deploy check before each pin bump, then retire Academy's local sender in the same sealed cutover. `reuse-proven` follows only when a second consumer moves onto an exact pin. Out of this package by ruling (5c): consent/suppression, channel policy, delivery/outbox and document generation are separate foundation owners. Do not absorb them here."
local_copy_retirement = "The selected source product must consume the released module and retire or gate its local writer before a second product cutover."
