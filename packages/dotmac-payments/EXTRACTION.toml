composition_boundary = "Adopters compose pm locally and correlate provider observations through commands. Payer, receivable, document and provider identifiers are opaque references; no sibling module import or foreign application database read is permitted."
first_cutover = "Sub remains payment-intent owner until its history is backfilled, the saved tests and backtest below pass, and a separately authorized writer switch occurs. No shadow run, side-by-side period or N-day gate is part of adoption."
shadow_and_drift = "No shadow run or comparison period. Adoption is verified by saved tests plus a backtest. Saved tests: committed tests drive intent opening, confirmation, refund instruction (over-refund refusal, in-flight and failed-refund accounting, replay by request id) and every cash-outcome kind (unknown confirmation parked in attention, replay idempotent) through the module, with PostgreSQL proofs for concurrent refunds and the database-boundary guards. Backtest: replay Sub's recorded intents, confirmations, refunds and chargebacks through the module in a scratch database and compare intent reference, payer, purpose, currency and amount, terminal status and settlement time, every confirmation by source, provider type, external reference, confirmed amount and observation instant, and every refund and outcome by amount and terminal result; record any divergence as a defect to fix before the writer switch. Invoice allocation and ledger posting themselves remain outside."
local_copy_retirement = "After cutover, reduce Sub's topup-intent and payment-confirmation writers to zero while Billing keeps allocation and Integrator keeps provider transport."
next_action = "Published 0.1.0a3 remains immutable. Proposed, unpublished 0.1.0a4 adds refund instruction and post-confirmation cash outcome observation (pm_0007) with no fee or mandate field; it needs hosted PostgreSQL acceptance on its exact head, security review of the money-egress bound, and separate release-owner authorization. Then compose the verified artifact in Sub, run the saved tests and backtest above, and implement the intent/confirmation/refund backfill. Provider verification, webhook and reconciliation callers resolve persisted intent bindings through the owner query and retain the original expiry; provider metadata cannot select the account or invoice. Sub remains the writer until a separately authorized cutover."
