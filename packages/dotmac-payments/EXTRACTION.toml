  "dotmac_starter_mt:tests/architecture/test_payments_module.py",
  "dotmac_starter_mt:tests/test_payments_isolation.py",
]
contract_consumers = []
candidate_consumers = ["dotmac_sub"]
composition_boundary = "Adopters compose pm locally and correlate provider observations through commands. Payer, receivable, document and provider identifiers are opaque references; no sibling module import or foreign application database read is permitted."
first_cutover = "Sub remains payment-intent owner until history backfill, read-only shadow and zero-drift correlation comparison complete and a separately authorized writer switch occurs."
shadow_and_drift = "Compare intent reference, payer, purpose, currency and requested amount, terminal status and settlement time, and every confirmation by source, provider type, external reference and confirmed amount; invoice allocation and ledger posting themselves remain outside."
local_copy_retirement = "After cutover, reduce Sub's topup-intent and payment-confirmation writers to zero while Billing keeps allocation and Integrator keeps provider transport."
next_action = "Compose in Sub and implement the intent/confirmation backfill plus the zero-drift correlation shadow."
