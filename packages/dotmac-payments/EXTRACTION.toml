contract = "Own the payment intent lifecycle, submitted transfer proof and its review, immutable reviewed merchant-context authority, mandatory-authority qualification of original provider cash facts and the append-only correlation between an intent and an external settlement fact, append-only refund instructions bounded by confirmed cash less prior and in-flight refunds (the request id is the idempotency key and the provider reference is derived from it), and append-only post-confirmation cash outcomes (refund completed or failed, chargeback, bounce, admin correction) where an unmatched outcome is parked in an attention state rather than dropped. Preserve physical economic identity separately from provenance and require fresh transaction-scoped admission for new financial use. Payer, purchase/obligation or receivable target, document and original transport/configuration identifiers are opaque. Merchant context alone does not qualify cash; an installed authenticated original-evidence authority remains required. NOT receivables, settlement allocation, invoice or credit application, bank accounts, general-ledger posting, deciding what a refund or reversal means for a receivable, provider fees, saved-payment mandates, provider credentials or provider transport."
