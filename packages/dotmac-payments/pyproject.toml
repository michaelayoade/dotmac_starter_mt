[tool.poetry]
name = "dotmac-payments"
version = "0.1.0a1"
description = "Payment intent and confirmation correlation"
authors = ["DotMac"]
readme = "README.md"
packages = [{ include = "dotmac_payments", from = "src" }]
include = [
  { path = "src/dotmac_payments/py.typed", format = ["sdist", "wheel"] },
  { path = "src/dotmac_payments/migrations/**/*", format = ["sdist", "wheel"] },
]
[tool.poetry.dependencies]
python = ">=3.11,<3.14"
dotmac-kernel = ">=0.1.0a91"
sqlalchemy = "^2.0"
[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
