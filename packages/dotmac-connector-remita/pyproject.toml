[tool.poetry]
name = "dotmac-connector-remita"
version = "0.1.0a1"
description = "Dotmac Integrator connector for Remita RRR status observations"
authors = ["DotMac"]
readme = "README.md"
packages = [{ include = "dotmac_connector_remita", from = "src" }]
include = [
    { path = "src/dotmac_connector_remita/py.typed", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
dotmac-integration = ">=0.1.0a11"
httpx = ">=0.27,<1.0"

[tool.poetry.plugins."dotmac_integration.connectors"]
remita = "dotmac_connector_remita:PLUGIN"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
