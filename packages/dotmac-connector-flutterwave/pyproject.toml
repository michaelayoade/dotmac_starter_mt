[tool.poetry]
name = "dotmac-connector-flutterwave"
version = "0.1.0a1"
description = "Ingress-only Flutterwave settlement connector for Dotmac Integrator"
authors = ["DotMac"]
readme = "README.md"
packages = [{ include = "dotmac_connector_flutterwave", from = "src" }]
include = [
    { path = "src/dotmac_connector_flutterwave/py.typed", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
dotmac-integration = ">=0.1.0a10"

[tool.poetry.plugins."dotmac_integration.connectors"]
flutterwave = "dotmac_connector_flutterwave:PLUGIN"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
