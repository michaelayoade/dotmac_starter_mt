[tool.poetry]
name = "dotmac-connector-flutterwave"
version = "0.1.0a2"
description = "Flutterwave API v4 settlement ingress and reconciliation connector"
authors = ["DotMac"]
readme = "README.md"
packages = [{ include = "dotmac_connector_flutterwave", from = "src" }]
include = [
    { path = "src/dotmac_connector_flutterwave/py.typed", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
# a14 is the release that publishes SPI 1.4 — `CapabilityDeclaration.modes`,
# which this connector uses to map each capability to one executable mode. An
# a11 install would fail to construct the manifest at import, so the floor is
# a correctness requirement rather than a preference. Tag
# `dotmac-integration-v0.1.0a14` is the oracle.
dotmac-integration = ">=0.1.0a14"
httpx = ">=0.27,<1.0"

[tool.poetry.plugins."dotmac_integration.connectors"]
flutterwave = "dotmac_connector_flutterwave:PLUGIN"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
