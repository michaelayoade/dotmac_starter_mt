first_cutover = "Sub through dotmac_integrator, after the published Paystack evidence. Sub's v3 callback remains authoritative while a separately configured Flutterwave v4 callback feeds Integrator. Only exact-byte HMAC-SHA256 v4 events enter the settlement-observation path; this connector provides no version fallback."

shadow_and_drift = "Run the v4 callback into Integrator while Sub's existing v3 receiver remains the sole producer of financial consequences. Correlate by merchant reference and compare provider-event coverage, terminal status, exact amount, currency and transaction identity; app_fee cannot be compared because v4 does not carry it. Require independent payments.reconcile.v1 confirmation before product acceptance. Cut over only after zero unexplained drift, then remove Sub's v3 verification/normalization and lower its external-connector ratchet in the same change."

local_copy_retirement = "Retire only Flutterwave transport: Sub's provider branch, direct callback, authentication, manifest and later provider HTTP client. Sub keeps payment_provider_events.py, payment_reconciliation.py, every intent service, allocation, coverage and lifecycle decision. The later outbound/poll slice retires provider I/O only after payments.intent.v1, payments.refund.v1 and payments.reconcile.v1 have product-owned command contracts."

next_action = "dotmac-connector-flutterwave 0.1.0a1 is published, installed back from the private index, conformance-checked and tagged from exact protected-main SHA 401f0006 by release run 32473143050. Publication moved no authority and made nobody a consumer. Still owed, unchanged by the release: exact-pin it in dotmac_integrator, reconcile the payments.settlement.observation.v1 ProductPort, configure the v4 callback, and run the Sub v3-to-v4 shadow/callback cutover. Keep status audit-complete until that cutover retires direct transport; Sub's v3 receiver is NOT retired by this publication."
