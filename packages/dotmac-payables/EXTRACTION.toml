first_cutover = "ERP is source and first exact-pin adopter after its Accounting cutover. Backfill and shadow invoice/credit lifecycle, recognized liability, obligation due/outstanding state, credit availability/application, settlement observations and accounting receipt reconciliation while legacy AP is sole writer; switch and retire legacy AP writers in a separately authorized sealed cutover."
shadow_and_drift = "Compare tenant/supplier/document identity, dates/currency/exchange rate, immutable line totals/account references, approval references, liability events, obligation schedules/outstanding values, supplier-credit availability/applications, settlement source fingerprints and accounting consequence/receipt fingerprints. Product supplier, tax, procurement and bank ids are adapter evidence, not module foreign keys."
local_copy_retirement = "ERP removes supplier-invoice, credit-note, liability, payment-allocation and coverage decision writers after the sealed switch. Purchase-order/goods-receipt, supplier-directory, tax, inventory and bank/payment execution services remain independent and call typed ports only. No legacy invoice-status or GL-posting adapter remains as a second Payables writer."
next_action = "Complete the Starter package/canaries and exact-commit Observer validation, then publish only with the ERP Accounting prerequisite and Payables cutover slice ready. Keep the package audit-complete and unallowlisted before adoption."

