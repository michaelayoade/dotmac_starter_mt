[tool.poetry]
name = "dotmac-payables"
version = "0.1.0a1"
description = "Tenant supplier-liability and payment-obligation authority"
authors = ["DotMac"]
readme = "README.md"
packages = [{ include = "dotmac_payables", from = "src" }]
include = [
  { path = "src/dotmac_payables/py.typed", format = ["sdist", "wheel"] },
  { path = "src/dotmac_payables/migrations/**/*", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
dotmac-kernel = ">=0.1.0a85"
sqlalchemy = "^2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
