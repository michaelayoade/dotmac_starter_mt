schema_version = 1
package = "dotmac-document-rendering"
classification = "optional-module"
status = "audit-complete"
source_mode = "product-first"
owner = "Stateless selection, semantic projection, exact formatting, and renderer provenance for issued billing documents"
contract = "Accept immutable V1 input or a separately versioned V2 Billing-shaped stored-fact projection by value; select one immutable template through an assembly-declared document-profile binding; produce one canonical semantic projection; and render complete HTML or PDF bytes with stable provenance and typed permanent/retryable failures. Billing remains authoritative for document meaning, numbering, frozen facts, and the official artifact relation; dotmac-files owns bytes at rest; the consuming assembly owns orchestration, idempotency, retry, and reconciliation. The renderer owns no rows, transactions, clocks, external I/O, delivery, numbering, invoice decisions, or storage."

source_repositories = ["dotmac_sub", "dotmac_erp", "dotmac_starter_mt"]

source_revisions = [
  "dotmac_sub:457882482cc938bfe70f48ca2fb282dab98beee6",
  "dotmac_erp:0dc07e4b6dd36260c9510a7115dbdc656e2a19a5",
]
