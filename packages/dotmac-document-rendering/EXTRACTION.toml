contract_consumers = []
candidate_consumers = ["dotmac_vendor_control_plane", "dotmac_sub"]
authority_boundary = "ADR-0017 P11 as amended on 2026-08-17 and ADR-0030. Billing publishes immutable InvoiceDocumentFactV1 and owns the official-artifact relation. dotmac-document-rendering owns only deterministic stage-two semantic projection and stage-three byte rendering. dotmac-files stores opaque bytes. An assembly reconciler composes those owners; no renderer looks up live invoice, customer, settings, template, brand, payment, tax, FX, or storage state."
inventory_evidence = [
  "docs/inventories/document-rendering-sources.md",
  "docs/inventories/document-rendering-extraction-dossier.md",
  "docs/inventories/billing-source-variance.md",
  "docs/inventories/billing-extraction-dossier.md",
]
first_cutover = "Vendor Control Plane invoice rendering is the first candidate because ADR-0030 already requires the shared owner and no product-local renderer should be created. Compose a released renderer with Billing facts and dotmac-files through one assembly reconciler. Sub is the parity cutover after its billing authority transition; it must replace the f-string invoice, quote, statement and receipt paths without moving official-artifact authority out of Billing. Starter itself is not a consumer."
shadow_and_drift = "For identical fact, immutable template, profile binding, and renderer version, compare canonical projection digest, every projected source field, ordered rows, exact currency/scale/text, omission decisions, byte length, checksum, and typed refusal class. The canary fixture contains nine lines to expose Sub's seven-row fallback truncation. Layout-only byte changes are allowed when the semantic projection remains identical; missing, reordered, rounded, live-looked-up, silently truncated, or synthetic values block cutover."
local_copy_retirement = "At first adoption, forbid new product-local renderers and remove the displaced local document-generation path only after semantic parity and stored-artifact reconciliation pass. Sub retires app/services/billing/{invoice_document,quote_document,statement_document,receipt_document}.py and rebinds storage through Billing's official-artifact relation plus dotmac-files. ERP's automation generator is not a billing authority and is not copied; any later generic-template adoption needs a separate typed contract and must retire its DB-bound mutation/storage owner rather than coexist."
next_action = "Qualify unpublished 0.1.0a2 V2 source against the public stored Billing fact, hosted CI, published Kernel103 floor and explicit no-link producer mapping; then obtain renderer release and install-back proof. Published a1 remains the released surface. Product adoption additionally requires exact pins, Sub Kernel98 qualification, semantic parity, an assembly-owned Billing/files reconciler and retirement of displaced writers."

