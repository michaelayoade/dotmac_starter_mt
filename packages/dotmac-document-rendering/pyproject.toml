[tool.poetry]
name = "dotmac-document-rendering"
version = "0.1.0a2"
description = "Deterministic issued-document projection and rendering from immutable facts"
authors = ["DotMac"]
readme = "README.md"
packages = [{ include = "dotmac_document_rendering", from = "src" }]
include = [
    { path = "src/dotmac_document_rendering/py.typed", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
# V2 uses the public shared canonical encoder first published in Kernel a103.
# V1 encoding remains unchanged; a88 remains the historical a1 floor.
dotmac-kernel = ">=0.1.0a103"
# Strict in-memory PDF validation; no encryption/image/font extras are selected.
pypdf = ">=6.19.0,<7"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
