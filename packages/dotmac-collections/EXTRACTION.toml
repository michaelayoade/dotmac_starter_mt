first_cutover = "dotmac_sub tenant plane after total writer classification, backfill, shadow comparison, reconciliation and a one-writer authority watermark. Vendor CP remains demand-gated and gets no speculative platform plane."
shadow_and_drift = "Compare live Sub and module shadow decisions for the complete candidate cohort by exact subject, reason, currency, source version, case state, pinned policy/step, next-action instant and timer generation, suppression, arrangement/grace scope, requested consequence and owner receipt. Every mismatch is classified; no unexplained bucket passes. During Billing's coupled authority switch, an unavailable receivables read blocks only the case and emits no consequence."
local_copy_retirement = "Retire Sub's dunning_runner, DunningWorkflow, prepaid_balance_sweep/planner, transitional cycle/timer columns, direct credential and invoice/overlap writes, hardcoded notice path and both local case implementations only after shadow parity and rollback proof. Each displaced writer stays behind a sensitivity-proven two-directional ratchet whose baseline is lowered in the same change. Historical rows may remain read-only; no product-local copy of the extracted engine may survive."
next_action = "The canonical typed flush-only persistence services and tenant-plane PostgreSQL concurrency/RLS canaries are complete and validated on Observe. Prepare the Sub Billing-reader, Durable-Timers and consequence-owner adapters plus backfill, full-cohort shadow comparison, reconciliation, rollback and two-directional retirement ratchets without switching production authority or deleting legacy data. Durable Timers remains a separately released typed dependency; Collections implements no timer scanner, claim or retry engine. Vendor CP remains behind its real-case platform-plane demand gate."
