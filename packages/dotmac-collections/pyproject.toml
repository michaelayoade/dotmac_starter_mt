[tool.poetry]
name = "dotmac-collections"
version = "0.1.0a1"
description = "DotMac dual-plane collections policy and case owner"
authors = ["DotMac"]
readme = "README.md"
packages = [{ include = "dotmac_collections", from = "src" }]
include = [
    { path = "src/dotmac_collections/py.typed", format = ["sdist", "wheel"] },
    { path = "src/dotmac_collections/migrations/**/*", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
dotmac-kernel = ">=0.1.0a89"
sqlalchemy = "^2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
