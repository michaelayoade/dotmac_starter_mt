composition_boundary = "ADR-0030: Dotmac Cloud installs this tenant-only module in its own database. The Cloud assembly translates immutable offer/order/coverage facts into domain commands and domain outputs into Fulfillment inputs. Integrator owns registrar/DNS transport, credentials, wire payloads, delivery retries, checkpoints and health; connector observations never write domain tables. The kernel TenantDomain routing catalogue is a separate platform-plane owner and app_user cannot write it."
