]
first_cutover = "Dotmac Cloud registration request -> registrar sandbox acknowledgement -> independently identified registrar observation -> domain reconciliation for one paid order line. The exact released module must be pinned, and provider-success/callback-loss must converge through a poll before authority is claimed."
shadow_and_drift = "There is no local lifecycle writer to shadow. Before external customers, run the provider-free conformance kit and a registrar sandbox: compare callback and poll observations, drop a callback deliberately, prove the same reconciled terminal state, and surface expiry/contact/nameserver drift without repairing either source fact."
local_copy_retirement = "None: the fleet inventory found no domain lifecycle implementation. TenantDomain remains the platform routing owner and is not retirement scope. Any temporary Cloud-side domain state created before cutover must be deleted rather than retained as a parallel writer."
next_action = "Restack onto the final shared-commerce train after its Orders defects are fixed; rerun the full Dotmac Observer suite and wheel smoke; release only with separate authorization after the required kernel floor is published. Then prove the first Cloud sandbox cutover."
