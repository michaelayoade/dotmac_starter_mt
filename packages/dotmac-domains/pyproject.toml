[tool.poetry]
name = "dotmac-domains"
version = "0.1.0a1"
description = "Provider-neutral Dotmac domain-service lifecycle owner"
authors = ["DotMac"]
readme = "README.md"
packages = [{ include = "dotmac_domains", from = "src" }]
include = [
    { path = "src/dotmac_domains/py.typed", format = ["sdist", "wheel"] },
    { path = "src/dotmac_domains/migrations/**/*", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
dotmac-kernel = ">=0.1.0a76"
sqlalchemy = "^2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
