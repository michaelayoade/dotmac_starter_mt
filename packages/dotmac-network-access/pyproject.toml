[tool.poetry]
name = "dotmac-network-access"
version = "0.1.0a1"
description = "Tenant provider-neutral access projection, authentication/accounting fact and session owner"
authors = ["DotMac"]
readme = "README.md"
packages = [{ include = "dotmac_network_access", from = "src" }]
include = [{ path = "src/dotmac_network_access/py.typed", format = ["sdist", "wheel"] }, { path = "src/dotmac_network_access/migrations/**/*", format = ["sdist", "wheel"] }]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
dotmac-kernel = ">=0.1.0a73"
sqlalchemy = "^2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
