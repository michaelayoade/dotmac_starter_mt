[tool.poetry]
name = "dotmac-network-control"
version = "0.1.0a1"
description = "Tenant provider-neutral network command, dispatch, execution-evidence and recovery owner"
authors = ["DotMac"]
readme = "README.md"
packages = [{ include = "dotmac_network_control", from = "src" }]
include = [{ path = "src/dotmac_network_control/py.typed", format = ["sdist", "wheel"] }, { path = "src/dotmac_network_control/migrations/**/*", format = ["sdist", "wheel"] }]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
dotmac-kernel = ">=0.1.0a76"
sqlalchemy = "^2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
