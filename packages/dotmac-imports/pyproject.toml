[tool.poetry]
name = "dotmac-imports"
version = "0.2.0a1"
description = "DotMac bulk-import run ledger, dry-run/apply promotion and column mapping"
authors = ["DotMac"]
readme = "README.md"
packages = [{ include = "dotmac_imports", from = "src" }]
include = [
    { path = "src/dotmac_imports/py.typed", format = ["sdist", "wheel"] },
    { path = "src/dotmac_imports/migrations/**/*", format = ["sdist", "wheel"] },
    { path = "src/dotmac_imports/_native*.so", format = "wheel" },
    { path = "src/dotmac_imports/_native*.pyd", format = "wheel" },
    { path = "build.py", format = "sdist" },
    { path = "native/Cargo.toml", format = "sdist" },
    { path = "native/Cargo.lock", format = "sdist" },
    { path = "native/pyproject.toml", format = "sdist" },
    { path = "native/src/**/*", format = "sdist" },
]
exclude = ["native/target", "src/**/*.so", "src/**/*.pyd", "src/**/*.dll", "src/**/*.dylib"]

[tool.poetry.build]
script = "build.py"
generate-setup-file = false

[tool.dotmac.native]
python-package = "dotmac_imports"

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
dotmac-kernel = ">=0.1.0a56"
sqlalchemy = "^2.0"

[build-system]
requires = ["poetry-core==2.2.1", "maturin==1.14.1"]
build-backend = "poetry.core.masonry.api"
