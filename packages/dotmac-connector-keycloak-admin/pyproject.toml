[tool.poetry]
name = "dotmac-connector-keycloak-admin"
version = "0.1.0a1"
description = "Realm-scoped Keycloak realm, client, and user connector for Dotmac Integrator"
authors = ["DotMac"]
readme = "README.md"
packages = [{ include = "dotmac_connector_keycloak_admin", from = "src" }]
include = [
    { path = "src/dotmac_connector_keycloak_admin/py.typed", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
dotmac-integration = ">=0.1.0a6"
dotmac-managed-identity-contracts = "0.1.0a1"
httpx = ">=0.27,<1.0"

[tool.poetry.plugins."dotmac_integration.connectors"]
keycloak_admin = "dotmac_connector_keycloak_admin:PLUGIN"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
