  "docs/inventories/approval-workflow-dispositions.toml",
  "docs/adr/0026-approvals-decide-approval-never-the-transition.md",
]
first_cutover = "dotmac_vendor_control_plane is cutover 1: it already needs content-bound approval for fleet plans, its plane carries no tenant_id prerequisite so nothing gates on ERP's E8 decision, and its local implementation is two tables and one service rather than three plus a routing service. Its adoption is a capability GAIN as well as a relocation — it has policy versions and per-actor approval records only, with no request id, requester, rejection, cancellation or terminal state — so the request lifecycle is new capability there rather than relocated code. dotmac_erp is cutover 2, after its E8 Organization-to-Tenant and composed-lineage decision, because tenant_id NOT NULL cannot be satisfied before it; ERP gains immutable policy versions, content binding, idempotency, distinct-actor quorum and fail-closed evaluation it demonstrably lacks, and keeps its threshold/FX routing. Neither dotmac_sub nor dotmac_crm is a candidate: the A1 audit measured zero approval rows in either."
shadow_and_drift = "Vendor CP's cutover shadow-compares ONLY the six safety properties it actually implements: policy-version selection for an exact (policy_code, version), quorum arithmetic over the same distinct-actor set, self-approval refusal, fail-closed refusal on a missing policy or version, content-hash mismatch, and idempotent re-recording. Comparing terminal request state is impossible there and would pass for the wrong reason — both sides would be empty — so the request lifecycle is proven instead by ERP parity plus this package's own tests. Its policy versions are imported directly with version and stored hash preserved; an import that recomputed a hash would silently revalidate content nobody re-approved, and document_digest is what makes that check mechanical. Its historical approval_records cannot become full requests losslessly (no requester, no terminal state): whether they remain read-only historical evidence or receive an explicit lossy-import model with synthesised fields marked as synthesised is a decision that cutover makes, not this dossier. ERP's cutover is the opposite shape: the lifecycle exists and is compared directly — same workflow selected for the same amount/currency/FX date on ERP's side of the boundary, same level advancement, same eligibility verdicts, same SoD refusals, same requester-only cancellation — while the six safety properties have no old-path counterpart and are proven by the ported Vendor CP tests. ERP's open requests are reconciled explicitly before cutover: each is re-expressed against an immutable policy version and a computed content digest, and any whose subject content has changed since submission is surfaced as stale rather than migrated as approved. That reconciliation is the one drift class this port creates, and it is a decision rather than a backfill."
local_copy_retirement = "dotmac_vendor_control_plane retires the writer in src/vendor_cp/approvals/service.py and its approval_policies / approval_records tables after the six-property comparison is clean and rollback/retention requirements are satisfied; a two-directional import/caller ratchet reaches zero before the local models are deleted. dotmac_erp retires the three audit.approval_* writers in app/services/finance/platform/approval_workflow.py and its direct commit() calls. What must NOT migrate into the module and stays in ERP as finance domain code: check_workflow_required's threshold selection and its FXService conversion, the document_type vocabulary, the approval_workflow row's threshold_amount/threshold_currency_code columns, and every downstream consequence (posting a journal, releasing a reconciliation package). ERP's WorkflowEntityType enum belongs to the automation family and is adjudicated separately. No permanent compatibility projection, mirrored decision table or parallel evaluation path is allowed in either product; a temporary shadow adapter is acceptable only with a deletion gate. After each retirement a boundary test must fail if the old approval writer returns."
next_action = "The lineage is proven on live Postgres — tests/test_approvals_isolation.py migrates the ap lineage into a scratch database in the integration job and asserts FORCEd RLS per tenant table, app_user revoked from every platform table with platform_api still able to operate, no cross-plane foreign key in the live catalog, and the duplicate-vote constraint refusing a second vote — and the .github/release-modules.json entry landed with that proof, pinning kernel_floor 0.1.0a59 and db_schema mod_approvals. PUBLISH ORDER, and it is not optional: dotmac-kernel 0.1.0a59 first, because registry verification of the module resolves its floor against a kernel that must already exist on the index, then dotmac-approvals 0.1.0a1. Neither has been published. Then Vendor CP composes the platform plane behind a shadow comparison of the six safety properties, decides the disposition of its historical approval_records, and retires its local writer; ERP follows after E8. dotmac-automation (ERP workflow_rule, workflow_rule_version, workflow_execution) and dotmac-forms (ERP's seven forms.* tables) each require their own product-first audit and decision and are not covered here."
