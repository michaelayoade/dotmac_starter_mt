[tool.poetry]
name = "dotmac-approvals"
version = "0.1.0a5+dev"
description = "DotMac dual-plane approval policy revisions, content-bound requests and decisions"
authors = ["DotMac"]
readme = "README.md"
packages = [{ include = "dotmac_approvals", from = "src" }]
include = [
    { path = "src/dotmac_approvals/py.typed", format = ["sdist", "wheel"] },
    { path = "src/dotmac_approvals/migrations/**/*", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
# a100: this module's manifest now declares `database_catalog=`
# (ModuleDatabaseCatalogContributionV1), importing
# `dotmac_kernel.product_database_catalog` — first published in a100, which
# `outbox_relay.v1` (a67) predates. (a104 later fixed a DROP-COLUMN
# physical-ordinal-gap false positive in the separate comparator module that
# VERIFIES this declaration, kernel PR #715, but nothing this manifest imports
# needs a104 to load.)
dotmac-kernel = ">=0.1.0a100"
sqlalchemy = "^2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
