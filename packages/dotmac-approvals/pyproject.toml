[tool.poetry]
name = "dotmac-approvals"
version = "0.1.0a5+dev"
description = "DotMac dual-plane approval policy revisions, content-bound requests and decisions"
authors = ["DotMac"]
readme = "README.md"
packages = [{ include = "dotmac_approvals", from = "src" }]
include = [
    { path = "src/dotmac_approvals/py.typed", format = ["sdist", "wheel"] },
    { path = "src/dotmac_approvals/migrations/**/*", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
# a104: this module's manifest now declares `database_catalog=`
# (ModuleDatabaseCatalogContributionV1); a104 fixed a DROP-COLUMN
# physical-ordinal-gap false positive in the comparator that verifies it
# (kernel PR #715).
dotmac-kernel = ">=0.1.0a104"
sqlalchemy = "^2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
