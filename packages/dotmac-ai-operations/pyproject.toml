[tool.poetry]
name = "dotmac-ai-operations"
version = "0.1.0a1"
description = "Provider-neutral tenant AI policy, execution evidence and advisory insights"
authors = ["DotMac"]
readme = "README.md"
packages = [{ include = "dotmac_ai_operations", from = "src" }]
include = [{ path = "src/dotmac_ai_operations/py.typed", format = ["sdist", "wheel"] }, { path = "src/dotmac_ai_operations/migrations/**/*", format = ["sdist", "wheel"] }]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
dotmac-kernel = ">=0.1.0a87"
sqlalchemy = "^2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
