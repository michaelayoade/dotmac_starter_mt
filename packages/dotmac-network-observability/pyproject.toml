[tool.poetry]
name = "dotmac-network-observability"
version = "0.1.0a1"
description = "Tenant network observation, measurement, availability, alert-evidence and health-projection owner"
authors = ["DotMac"]
readme = "README.md"
packages = [{ include = "dotmac_network_observability", from = "src" }]
include = [{ path = "src/dotmac_network_observability/py.typed", format = ["sdist", "wheel"] }, { path = "src/dotmac_network_observability/migrations/**/*", format = ["sdist", "wheel"] }]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
dotmac-kernel = ">=0.1.0a76"
sqlalchemy = "^2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
