[tool.poetry]
name = "dotmac-service-changes"
version = "0.1.0a1"
description = "Durable customer service-change requests and cross-domain checkpoints"
authors = ["DotMac"]
readme = "README.md"
packages = [{ include = "dotmac_service_changes", from = "src" }]
include = [
  { path = "src/dotmac_service_changes/py.typed", format = ["sdist", "wheel"] },
  { path = "src/dotmac_service_changes/migrations/**/*", format = ["sdist", "wheel"] },
]
[tool.poetry.dependencies]
python = ">=3.11,<3.14"
dotmac-kernel = ">=0.1.0a91"
sqlalchemy = "^2.0"
[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
