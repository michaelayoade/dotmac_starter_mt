[tool.poetry]
name = "dotmac-publishing"
version = "0.1.0a1"
description = "Tenant publication requests, target attempts, and reconciled outcomes"
authors = ["DotMac"]
readme = "README.md"
packages = [{ include = "dotmac_publishing", from = "src" }]
include = [
  { path = "src/dotmac_publishing/py.typed", format = ["sdist", "wheel"] },
  { path = "src/dotmac_publishing/migrations/**/*", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
# a74 allocates mod_publishing/pb/publishing. The module also consumes the
# older tenant-scope, database-role, idempotency-ledger and outbox contracts.
dotmac-kernel = ">=0.1.0a74"
sqlalchemy = "^2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
