local_copy_retirement = "Apply the ten-row two-directional ledger in docs/inventories/publishing-writer-retirement.toml. Retire Mkt publishing fields, PostDelivery writers, replacement/reschedule service, direct publish/update/delete calls and the 60-second SessionLocal poller only after their named module behavior is authoritative. Move Channel credentials/provider clients into Integrator and replace direct-query/commit web paths with thin Backoffice adapters. A runtime flag leaving both writers callable is not retirement."
