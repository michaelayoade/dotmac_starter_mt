first_cutover = "Backoffice is cutover 1. It must pin a released dotmac-publishing version, compose and migrate its own tenant plane, totally classify Mkt Post/PostDelivery/Channel publication facts, backfill immutable snapshots and outcome history, shadow one complete scheduling cycle, switch one writer at a time and retire the old Mkt/provider path. Installation without writer retirement is not adoption. Sub is a later independent adopter with its own rows and lineage."
