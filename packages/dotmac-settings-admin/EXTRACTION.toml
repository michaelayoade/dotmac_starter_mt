  "dotmac_starter_mt:tests/unit/test_settings_api.py",
  "dotmac_starter_mt:tests/unit/test_display_settings.py",
  "dotmac_starter_mt:tests/architecture/test_settings_admin_module.py",
  "dotmac_starter_mt:tests/unit/test_settings_admin.py",
]
contract_consumers = []
candidate_consumers = ["dotmac_erp_v2", "dotmac_sub_thin"]
composition_boundary = "An assembly composes the module and grants its permissions through role grant profiles; the module never names a prefix, facet or another module."
