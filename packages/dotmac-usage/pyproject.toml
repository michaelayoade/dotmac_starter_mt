[tool.poetry]
name = "dotmac-usage"
version = "0.1.0a1"
description = "Normalized usage observations, corrections, and projections"
authors = ["DotMac"]
readme = "README.md"
packages = [{ include = "dotmac_usage", from = "src" }]
include = [
  { path = "src/dotmac_usage/py.typed", format = ["sdist", "wheel"] },
  { path = "src/dotmac_usage/migrations/**/*", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
dotmac-kernel = ">=0.1.0a85"
sqlalchemy = "^2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
