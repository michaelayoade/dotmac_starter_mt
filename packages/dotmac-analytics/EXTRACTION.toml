]
first_cutover = "dotmac_erp is first. Declare the exact legacy dashboard vocabulary, adapt each ERP-owned computer to dual-write a typed batch while OrgMetricSnapshot remains live, compare latest/history/explicit-period results and projection digests, move DashboardMetricsService and coach readers, then cut over one computer family at a time. Backoffice follows on the same released package to prove an independent second consumer."
shadow_and_drift = "For every ERP legacy metric coordinate, compare legacy and module values, missingness, dimensions, ordering, exact-period delta and zero-prior behavior. Corrections must create new observations and choose the same deterministic winner after rebuild. Record digest differences and classify declaration, calculation, period, dimension, decimal or replay variance; do not silently fall back to source-table queries. Run the rebuild against retained observations before any reader cutover and prove its digest equals the live projection."
local_copy_retirement = "After each ERP metric family passes shadow, delete that family's OrgMetricSnapshot upsert and direct MetricStore read paths. Once all families are cut over, retire OrgMetricSnapshot, the shared BaseComputer store/upsert behavior and MetricStore, guarded by a two-directional caller/import ratchet. ERP domain computers remain with their owning domains. Sub's inert KPIConfig/KPIAggregate generic path is retired only when its callers are proven absent or migrated; operational domain reports remain local. dotmac-insights direct cross-domain ORM queries and hardcoded data explorer are decomposed into typed source feeds and local projection reads rather than copied. No permanent dual writer, source-table fallback or second analytical projection owner remains."
next_action = "Obtain exact-revision Observer evidence for the contract, service, architecture, migration, FORCE-RLS and live-catalog canaries; then implement ERP's declaration registry and shadow adapter without moving any ERP domain computer into the package."
