[tool.poetry]
name = "dotmac-platform-health"
version = "0.1.0a1"
description = "Platform runtime-health observations, freshness projections and summaries"
authors = ["DotMac"]
readme = "README.md"
packages = [{ include = "dotmac_platform_health", from = "src" }]
include = [
  { path = "src/dotmac_platform_health/py.typed", format = ["sdist", "wheel"] },
  { path = "src/dotmac_platform_health/migrations/**/*", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
dotmac-kernel = ">=0.1.0a88"
sqlalchemy = "^2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
