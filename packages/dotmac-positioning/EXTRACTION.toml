first_cutover = "Dotmac Sub is cutover 1 after its corrected position owner passes the parity suite. Sub composes the tenant plane, creates product-owned technician-to-tracked-unit links, shadows observation dispositions/current/trail/grant/refusal/retention/geofence-fact digests, switches reads and writes, then removes its local position writer and mixed-row location projection. Dotmac ERP is cutover 2 through a product-owned vehicle-to-tracked-unit link while fleet and attendance authority remain in ERP."
shadow_and_drift = "Feed the same typed Sub observations to the corrected local owner and this module in one bounded shadow. Compare accepted, rejected, replay, and collision dispositions; current observation identity, captured/received time, coordinates and accuracy; ordered trail digests; purpose-grant refusal and expiry; prune outcomes; and neutral geofence facts for the exact product-selected fence ids. Prove unselected fences receive no state and stale observations cannot regress fence state. Product consequences are compared by the product owner and never emitted by this module. Seal full-column digests and effective privileges before cutover, then remove the shadow so it cannot become a permanent second writer."
local_copy_retirement = "Sub deletes or migration-seals the FieldTechLocationPing writer, removes current coordinates and collection-grant columns from the mixed FieldTechPresence authority, and retains only its product-owned workforce status and disclosure/consequence policies. CRM's fork retires through the existing CRM-to-Sub convergence. ERP must not create a parallel Vehicle location writer after adoption; it replaces those scalar projection columns with a product-owned tracked-unit link while retaining vehicle, dispatch, and attendance decisions."
next_action = "dotmac-positioning 0.1.0a1 is published, installed back from the private index, conformance-checked and tagged from exact protected-main SHA 75a26ab by release run 32460582571. Publication moved no authority. Before Sub adoption, settle the two source-shape questions: Sub's nullable accuracy_m against this module's NOT NULL column, and replacement of Sub's location_sharing_enabled boolean by a purpose/expiry/revocation grant. Then let Sub compose the exact pin, create its product-owned technician-to-tracked-unit link, shadow the disposition/current/trail/grant/refusal/retention/geofence-fact digests, switch reads and writes, and remove its local position writer and mixed-row location projection. ERP remains cutover 2. Do not claim adoption until the local writer is gone."
