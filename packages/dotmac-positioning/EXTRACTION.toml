authority_boundary = "ADR-0032. dotmac-positioning owns only observation identity/provenance, current and trail projections, collection/share grants, retention and geofence facts. Sub keeps technician, shift, dispatch, route and work-order lifecycle plus customer-sharing decisions. ERP keeps vehicle lifecycle and attendance consequences. Plant/GIS owners keep static asset and qualification geometry. Integrator connector plugins keep provider transport, credentials and wire mappings. dotmac-ui and each product keep map presentation, endpoint authorization, popups and actions. Product-owned link tables map local subjects to opaque tracked-unit ids; the module imports no product or sibling module."

inventory_evidence = [
  "docs/inventories/positioning-sources.md",
  "docs/inventories/fleet-decomposition-matrix.md",
  "docs/inventories/fleet-fact-level-decomposition.md",
]

first_cutover = "dotmac_sub is cutover 1 after defects D1-D7 in positioning-sources.md are corrected canary-first. The module is then installed in Sub's tenant plane, local and module ingest/read results are shadow-compared, ADR-0031 cutover evidence is sealed, and Sub's local ping/current writer is retired. dotmac_crm is the same retiring product lineage and routes its deletion into this cutover; it is never counted as an independent adopter. dotmac_erp is cutover 2 through a product-owned vehicle-to-tracked-unit link and moves the contract to reuse-proven only after a real released adoption."

shadow_and_drift = "Before Sub cutover, feed the same typed observations to the corrected local owner and the module in a bounded shadow. Compare accepted/rejected/replay/conflict counts; current-position identity, captured/received time, coordinates and accuracy; ordered trail digests; expiry/prune outcomes; collection/share-grant refusals; and geofence entry/exit facts. A business consequence is compared by Sub's owning service, never emitted by the module. Seal the full-column typed digest and effective privileges under ADR-0031 before switching reads/writes. The shadow is removed at cutover and cannot become a permanent dual writer."

local_copy_retirement = "Sub deletes or migration-seals the FieldTechLocationPing writer and removes current coordinates from the mixed FieldTechPresence authority after module cutover; shift/work status and customer-sharing policy remain product-owned. Direct service commits and post-commit best-effort geofence consequences are retired. CRM's field-location fork and retention task are deleted through the existing CRM-to-Sub retirement, not copied into Sub. ERP removes any future/current direct writer to Vehicle.last_known_location and last_location_update when the vehicle link adopts the module; its fleet and attendance owners remain."

next_action = "Do not allocate a namespace or write module behavior yet. First land the Sub RED canaries and corrections for status/work-context contract drift, rejected-row persistence, client_observation_id replay/conflict, device captured_at/accuracy, server-side collection/share grants, customer freshness, retention and geofence consequence separation. Then port the corrected behavior and CRM parity tests, add the tenant-plane manifest/models/migration and allocate its immutable namespace in the same change. The initial dossier remains audit-complete until Sub actually cuts over; map presentation remains deferred until Sub and ERP are released consumers."
