first_cutover = "Sub is the first product destination, through the independently deployed dotmac_integrator assembly. The outbound connector is published after dotmac-integration 0.1.0a14, then both are exact-pinned. The assembly derives secret and egress policy from the installed manifest, runs a provider-neutral delivery pump and delivers typed messaging.receive.v1 observations to Sub's product-owned port. Sub shadows both its direct WhatsApp receiver and local Graph outbox before either authority changes; publication alone is not a cutover and does not enter contract_consumers."

shadow_and_drift = "Mirror the exact raw body and signature header into Integrator without changing Sub's current response path. Compare provider event identities, observation count, event type, typed message/status/location content, and refusal reason; never compare product consequences the old source cannot express. Duplicate observations are safe only through mod_intg's binding-scoped receipt identity and the product port's own idempotency. Cut over the provider callback after the corpus and live shadow agree for the configured retry horizon, then lower Sub's external-connector ratchet in the same change that removes the displaced direct verification/normalization surface."

local_copy_retirement = "Retire only Sub's provider transport surface: webhook signature verification, provider payload traversal, provider event identity construction and provider acknowledgement. Sub retains the authoritative messaging decision, contact/conversation resolution and timeline consequences behind its typed observation port. No ERPNext or CRM connector is recreated; retired product connections stay retired."

next_action = "Complete and release the additive DELIVERY and POLL slice: typed provider evidence and terminal outbound-content retention in dotmac-integration, text/template/media parity plus the approved-template catalogue and attachment gates in this connector, then exact-pin both in dotmac_integrator and run its provider-neutral command intake, catalogue poll and delivery pump. Sub must declare messaging.templates.read.v1 and grow a local reader/reconciler for the whatsapp.message_template.v1 observations before its own `list_approved_templates` Graph call is retired; publication alone retires nothing. Shadow Sub's local outbox against Integrator before retiring the direct Graph client and lowering the external-connector ratchet. Move status to adopted only after ingress and outbound cutovers are both complete."

