[extraction_notes]
ported = [
  "whatsapp_runtime._read_template: endpoint /{graph_version}/{waba_id}/message_templates, fields name,status,language,category,components, limit 200, optional name filter.",
  "whatsapp_runtime._template_variables: BODY-component arity as the sorted DISTINCT {{n}} index set, pattern r'\\{\\{\\s*(\\d+)\\s*\\}\\}'.",
  "whatsapp_runtime._ordered_template_parameters: numeric keys sorted numerically, other keys trailing in insertion order.",
  "whatsapp_capability.list_approved_templates: case-insensitive status == 'approved', a process-local monotonic-clock memo, and a hard 300 s TTL under which stale is treated exactly as cold.",
  "whatsapp_runtime template-read outcome codes: template_provider_unavailable, template_provider_retryable, template_provider_rejected, template_response_invalid, template_not_found, waba_id_required.",
  "whatsapp_runtime.build_media_payload: caption on image/document/video only, filename on document only, and the 1024/255 limits.",
  "team_inbox_media MIME normalization: split(';')[0].strip().lower(), so a charset parameter cannot defeat the comparison.",
  "team_inbox_commands: the send is blocked when the catalogue cannot be read (fail closed).",
  "architecture/test_team_inbox_boundaries: the ordering guard that the catalogue read precedes the committing step.",
]
not_present_in_sub = [
  "Arity VALIDATION. Sub derives the placeholder count only to render form fields and never compares a submission against it, so a body needing three values is sent with one and fails at Meta as the generic template_unavailable.",
  "A per-media-type byte limit table. Sub enforces one flat MAX_OUTBOUND_ATTACHMENT_BYTES = 10 MiB at upload-staging time, which is a product policy about what an operator may stage, not the provider's contract; it stays in Sub.",
  "A MIME-to-media-type consistency check. Sub's flat allowlist admits image/gif, audio/wav, video/quicktime, application/zip and text/csv, which Meta accepts for no media type.",
  "Catalogue pagination. Sub reads one page of 200 and ignores paging.next, so a large account silently truncates and a missing template is indistinguishable from an unapproved one.",
  "A distinct reason for a non-approved template. Sub raises a generic rejection whose only distinguishing feature is an English message.",
  "Cache eviction and bounds. Sub's dict is unbounded, leaks an entry per superseded config revision, and leaves the expired tuple in place after a failed refresh.",
  "Any test of the catalogue fetch, the TTL, or the failure paths: list_approved_templates is monkeypatched out of every test that touches it.",
]
deliberate_deviations = [
  "The upload's application/octet-stream default is RETIRED. Meta accepts that type for no media kind, so every upload it produced was streamed in full and then rejected; an upload with no declared supported type is now a local terminal refusal. The `attachment` filename default is kept.",
  "Caption and filename over-length REFUSE instead of truncating, and a caption on audio refuses instead of being dropped. Editing product content to fit a provider constraint is a decision belonging to whoever wrote the message, not to the wire adapter.",
  "A catalogue read timeout is RETRYABLE, not RECONCILIATION_REQUIRED. The send path keeps the ambiguous classification because a message may have landed; a catalogue GET has no effect to duplicate, and calling it ambiguous would park a message the provider never saw.",
  "A catalogue longer than MAX_CATALOGUE_PAGES fails rather than truncating, because a short catalogue reads exactly like a withdrawn approval.",
]
