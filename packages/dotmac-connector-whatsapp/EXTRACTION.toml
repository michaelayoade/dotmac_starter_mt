first_cutover = "Sub is the first product destination, through the independently deployed dotmac_integrator assembly. The connector is published first, then exact-pinned beside dotmac-integration 0.1.0a5. The assembly records provider-neutral verification evidence and delivers the typed messaging.receive.v1 observation to Sub's product-owned port. Sub shadows the direct WhatsApp receiver before the provider callback changes; publication alone is not a cutover and does not enter contract_consumers."

shadow_and_drift = "Mirror the exact raw body and signature header into Integrator without changing Sub's current response path. Compare provider event identities, observation count, event type, typed message/status/location content, and refusal reason; never compare product consequences the old source cannot express. Duplicate observations are safe only through mod_intg's binding-scoped receipt identity and the product port's own idempotency. Cut over the provider callback after the corpus and live shadow agree for the configured retry horizon, then lower Sub's external-connector ratchet in the same change that removes the displaced direct verification/normalization surface."

local_copy_retirement = "Retire only Sub's provider transport surface: webhook signature verification, provider payload traversal, provider event identity construction and provider acknowledgement. Sub retains the authoritative messaging decision, contact/conversation resolution and timeline consequences behind its typed observation port. No ERPNext or CRM connector is recreated; retired product connections stay retired."

next_action = "Exact-pin released dotmac-connector-whatsapp 0.1.0a1 with dotmac-integration 0.1.0a5 in dotmac_integrator, add the provider-neutral verification observer and Sub ProductPort transport-evidence/location mapping, then run the Sub shadow and callback cutover. Move status to adopted only after the assembly is deployed and Sub's direct provider surface is removed with a measured ratchet reduction."
