owner = "Meta WhatsApp Cloud API protocol edge: subscription challenge, exact-byte request verification, provider event identity, typed message/status/error observations, text/template/media delivery wire shapes, provider response classification, and provider acknowledgement bytes."

contract = "Implement dotmac-integration SPI >=1.4,<2.0 for connector key meta_whatsapp and capabilities messaging.receive.v1 plus messaging.send.v1. INGRESS verifies immutable request bytes and returns provider facts. DELIVERY receives product-decided text/template/media commands and already-materialized access material, performs only Meta Graph wire translation and I/O, and returns typed engine outcomes. The connector owns no rows, sessions, retries, checkpoints, product identity, customer-window decision, template selection, conversation state, tickets, subscribers, or destination decision."

