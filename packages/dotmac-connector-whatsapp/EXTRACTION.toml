owner = "Meta WhatsApp Cloud API protocol edge: subscription challenge, exact-byte request verification, provider event identity, typed message/status/error observations, approved message-template catalogue reads and their in-process freshness policy, provider attachment constraints (type, size, caption, filename), text/template/media delivery wire shapes, provider response classification, and provider acknowledgement bytes."

contract = "Implement dotmac-integration SPI >=1.4,<2.0 for connector key meta_whatsapp and capabilities messaging.receive.v1, messaging.send.v1 plus messaging.templates.read.v1. INGRESS verifies immutable request bytes and returns provider facts. POLL reads the WABA's message-template catalogue and returns typed provider observations, so the product owns a rebuildable projection of what is approved. DELIVERY receives product-decided text/template/media commands and already-materialized access material, refuses before the wire call what the provider would reject anyway (unapproved template, variable arity the catalogue does not describe, unsupported MIME type, oversize attachment, caption or filename a media type cannot carry), performs only Meta Graph wire translation and I/O, and returns typed engine outcomes. The template catalogue is memoized in process under a configured freshness policy and is never persisted: it is a rebuildable memo of provider facts, never a second authority on approval. The connector owns no rows, sessions, retries, checkpoints, product identity, customer-window decision, template selection, conversation state, tickets, subscribers, or destination decision."

