[tool.poetry]
name = "dotmac-connector-whatsapp"
version = "0.1.0a4"
description = "Meta WhatsApp Cloud API ingress and delivery connector for Dotmac Integrator"
authors = ["DotMac"]
readme = "README.md"
packages = [{ include = "dotmac_connector_whatsapp", from = "src" }]
include = [
    { path = "src/dotmac_connector_whatsapp/py.typed", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
dotmac-integration = ">=0.1.0a14"
httpx = ">=0.27,<1.0"

[tool.poetry.plugins."dotmac_integration.connectors"]
meta_whatsapp = "dotmac_connector_whatsapp:PLUGIN"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
