first_cutover = "ERP is source and first exact-pin adopter. Backfill and read-only shadow keep ERP GL as sole writer. The final full-column comparison and authority switch occur under the legacy writer boundary in a separately authorized ADR-0031 cutover; the module then becomes sole chart/period/journal/ledger writer and legacy mutation paths are retired."
shadow_and_drift = "Compare tenant chart/category identities, fiscal date ranges/status/reopen authority, dimension definitions/values, journal/line/source fingerprints, functional debit/credit totals, posted ledger line and dimension snapshots, reversal links and period-event fingerprints. A rehearsal report never authorizes a switch; reconciliation is idempotent and source provenance is not domain identity."
local_copy_retirement = "An ERP writer ratchet reaches zero for chart, fiscal period, journal, posting, reversal and ledger mutation paths at the sealed cutover. Ledger query/report adapters move to the module contract. Fixed-asset, AP, AR, inventory and tax owners retain only typed consequence production and cannot write GL tables. No permanent mirror or fallback writer remains."
next_action = "Complete the Starter package/canaries and exact-commit Observer validation, then publish kernel/accounting only when ERP's composition and sealed cutover slice is ready. Keep the module audit-complete and unallowlisted until that adoption proof exists."
