first_cutover = "ERP is source and first exact-pin adopter. Its clean installation starts from reviewed masters, explicitly admitted live operational items and one Finance-approved governed opening state; it never replays legacy journal, posted-ledger or posting-batch history. Legacy ERP remains the read-only owner of pre-cutover history. Behavioural rehearsal and writer retirement precede a separately authorized switch; the cross-database sealing protocol is an explicit unresolved gate under ADR-0031."
shadow_and_drift = "On independently migrated clean databases, compare governed-opening counts, exact totals and content digests plus versioned business-fixture journal, line, account, dimension, lifecycle and refusal outcomes. Prove retry no-op, changed-fingerprint conflict and synthetic-second-tenant isolation. Legacy full-history digests remain forensic evidence, not import or parity targets; a rehearsal report never authorizes a switch."
local_copy_retirement = "An ERP writer ratchet reaches zero for chart, fiscal period, journal, posting, reversal and ledger mutation paths at the sealed cutover. Ledger query/report adapters move to the module contract. Fixed-asset, AP, AR, inventory and tax owners retain only typed consequence production and cannot write GL tables. No permanent mirror or fallback writer remains."
next_action = "ERP implements the governed clean-bootstrap manifest and module adapters, proves two fresh-database rehearsals, then retires its writer/caller ratchets in coherent domain slices. Finance approval of the opening pack and an accepted cross-database sealing protocol remain final cutover gates."
