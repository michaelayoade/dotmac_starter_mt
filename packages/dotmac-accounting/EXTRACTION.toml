composition_boundary = "Each adopter pins the released package, runs the independent ac lineage in its own database, binds tenant/role/idempotency prerequisites to its own qualifying providers, and supplies approval, numbering and producer facts through typed assembly adapters. The module imports only dotmac-kernel, never an assembly, sibling module or product ORM."
