[tool.poetry]
name = "dotmac-accounting"
version = "0.1.0a1"
description = "Tenant chart, fiscal-period and immutable balanced-ledger authority"
authors = ["DotMac"]
readme = "README.md"
packages = [{ include = "dotmac_accounting", from = "src" }]
include = [
  { path = "src/dotmac_accounting/py.typed", format = ["sdist", "wheel"] },
  { path = "src/dotmac_accounting/migrations/**/*", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
dotmac-kernel = ">=0.1.0a73"
sqlalchemy = "^2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

