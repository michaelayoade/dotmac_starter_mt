[tool.poetry]
name = "dotmac-forms"
version = "0.1.0a1"
description = "Tenant form definitions, immutable versions and validated submission evidence"
authors = ["DotMac"]
readme = "README.md"
packages = [{ include = "dotmac_forms", from = "src" }]
include = [
  { path = "src/dotmac_forms/py.typed", format = ["sdist", "wheel"] },
  { path = "src/dotmac_forms/migrations/**/*", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
dotmac-kernel = ">=0.1.0a87"
sqlalchemy = "^2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
