# Build-only intermediate; the public distribution remains Poetry-owned.
[project]
name = "dotmac-forms-native-build"
version = "0.0.0"
requires-python = ">=3.11,<3.14"

[build-system]
requires = ["maturin==1.14.1"]
build-backend = "maturin"

[tool.maturin]
module-name = "dotmac_forms._native"
python-source = "../src"
bindings = "pyo3"
