[tool.poetry]
name = "dotmac-integration"
version = "0.1.0a6"
description = "DotMac Integration — the external connector control plane: installations, immutable configuration revisions, capability bindings, secret references and a versioned connector SPI (ADR-0024)"
authors = ["DotMac"]
readme = "README.md"
packages = [{ include = "dotmac_integration", from = "src" }]
include = [
    # PEP 561 marker — the module's contracts are annotated, and a consuming
    # assembly's type-checker cannot see them without this.
    { path = "src/dotmac_integration/py.typed", format = ["sdist", "wheel"] },
    # The module's OWN Alembic lineage (prefix `ig`, branch label
    # `integration`), composed by a consuming assembly through
    # `version_locations`. No `__init__` in versions/ (Alembic convention), so
    # it is declared explicitly as package data.
    { path = "src/dotmac_integration/migrations/**/*", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
# a69 publishes the product-owned CapabilityContractSnapshot consumed by every
# PROVISION declaration. The older a58 namespace/a66 prerequisite floors are
# therefore necessary but no longer sufficient.
dotmac-kernel = ">=0.1.0a69"
# Product owners publish full Draft 2020-12 schemas. Validation is deliberately
# generic here; a hand-written subset would turn each unsupported keyword into
# an accidental provider/product branch.
jsonschema = ">=4.23,<5"
sqlalchemy = "^2.0"

# No `fastapi`, and deliberately no `httpx`. This module is the control plane,
# not a transport: it decides WHICH connector serves a capability and never
# performs provider I/O itself. Keeping an HTTP client out of the dependency
# list is what makes that boundary checkable rather than asserted — and it is
# the same boundary `dotmac-integration-client` sits on the other side of.

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
