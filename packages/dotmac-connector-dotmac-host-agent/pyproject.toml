[tool.poetry]
name = "dotmac-connector-dotmac-host-agent"
version = "0.1.0a1"
description = "Constrained mTLS host-agent client for Dotmac Integrator"
authors = ["DotMac"]
readme = "README.md"
packages = [{ include = "dotmac_connector_dotmac_host_agent", from = "src" }]
include = [
    { path = "src/dotmac_connector_dotmac_host_agent/py.typed", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
dotmac-integration = ">=0.1.0a6"
dotmac-managed-host-contracts = "0.1.0a1"
httpx = ">=0.27,<1.0"

[tool.poetry.plugins."dotmac_integration.connectors"]
dotmac_host_agent = "dotmac_connector_dotmac_host_agent:PLUGIN"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
