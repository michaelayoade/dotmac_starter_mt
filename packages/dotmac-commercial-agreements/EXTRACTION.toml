adoption_evidence = []
composition_boundary = "ADR-0024: the vendor control plane installs its own cg lineage and owns its own agreement rows; no application shares a mod_agreements schema, an agreement row or a history row. ADR-0033 § 8: the module imports no sibling. dotmac-approvals supplies ApprovalEvidence as a VALUE through the assembly and dotmac-entitlement-allocation consumes agreement.activated.v1 the same way — neither is imported, and the module never executes another owner's consequence (ADR-0026 § 6). ADR-0006 D1: no foreign key leaves mod_agreements; counterparty_ref, release_ref, offer_ref and approval_decision_ref are opaque and unconstrained, so an executed agreement outlives a superseded release, a retired approval policy and a merged counterparty record. ADR-0019 § 1 and ruling A3: the counterparty reference is opaque and this module defines no counterparty master. ADR-0023 / ADR-0033 § 7: platform plane only, declared from the one consumer that exists today; tables is empty and no tenant plane is declared for later use."
inventory_evidence = [
  "docs/inventories/vendor-cp-gap-sources.md",
  "docs/adr/0033-the-vendor-control-plane-composes-existing-owners.md",
]
first_cutover = "Not started. The vendor control plane is the named first adopter and the only candidate: it holds the qualifying implementation, and cutover means retiring src/vendor_cp/contracts/ in favour of an exact pin plus a typed assembly adapter. That change belongs to the Vendor repository and to a later task, which is why this dossier sits at `audit-complete` rather than `adopted` — a module that has never run in a product database has no adoption evidence, and recording one it does not have is the defect ADR-0031 seals against."
shadow_and_drift = "No shadow phase is owed, and the reason is measurable rather than convenient. The capability exists in exactly one product (Knowledge `vendor-cp-capability-gaps-and-composable-plan`, Tier B: contracts 972 LOC / 2 tables), so there is no second writer to reconcile against and no parallel evaluator to compare. What IS owed at cutover is a data-bearing migration of the existing vendor_cp.contracts and contract_lines rows, because those rows are real: preserve every content_hash unchanged (an agreement whose digest moves invalidates its own approval), map pending_approval -> proposed, synthesise one AgreementEvent per historical transition from the platform audit log rather than inventing a clean history, and prove the pre- and post-cutover accepted snapshots digest identically. A populated legacy table encountered at cutover must fail the migration, not be silently skipped."
local_copy_retirement = "Owed by dotmac_vendor_control_plane at cutover: src/vendor_cp/contracts/{models,service,schemas,router,feature}.py, the contracts and contract_lines tables, and the ContractService call sites in the allocations consumer. The vendor keeps its own routes, its console screens and its vendor_accounts binding — a thin adapter that translates its account id into this module's opaque counterparty_ref. No product may keep a compatibility contracts table or a parallel lifecycle evaluator."
next_action = "Compose in the vendor control plane: exact-pin dotmac-commercial-agreements 0.1.0a1 and dotmac-kernel 0.1.0a74, install the cg lineage with its prerequisite bindings, write the typed assembly adapter that supplies ApprovalEvidence from dotmac-approvals and the capability catalogue port from the kernel, migrate the existing rows under the shadow_and_drift obligations above, retire the local copy in the same change, and record the adoption evidence here. Until then this package is built and validated but unadopted, and must not be described as in production."
