source_mode_note = "CARRIED, essentially verbatim: the `findings` function and every rule inside it, the register's TOML shape and status vocabulary, the permanence argument, the `next_free`-as-one-scalar serialization argument, and nine of ERP's planted proofs. ADAPTED: ERP's `authored_without_prior_reservation` compared HEAD against `origin/main`'s TIP and returned a bare set of numbers; the Starter's `unreserved_authorings` compares against the MERGE BASE and returns a message per number, because the tip moves under a branch and because the message is what teaches the next author. ERP's single `contested` bucket became two — `contested` for a number no branch has landed, and `[[branch_collision]]` for a number `main` already holds that a branch spells differently — because ERP's four collisions were all off-`main` while every one of the Starter's seven is against an authored `main` record. NOT CARRIED: `readme_index_numbers`, `test_the_readme_index_lists_exactly_the_authored_rows` and `test_the_readme_parser_reads_a_real_row`. ERP's `docs/adr/README.md` carries an index table; the Starter's `docs/adr/` has no README at all, so the rule would be a check over a file that does not exist — which passes for the wrong reason. AUTHORED HERE: requirement 6's rules (`allocate` takes no directory argument; `directory_next_free` exists only to name the mistake in a refusal) and requirement 5's branch half (`branch_claim_findings`), neither of which the source has."

