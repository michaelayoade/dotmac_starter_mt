first_cutover = "This repository, 2026-09-04, in the change that seeds the register with all 76 numbers claimed on `main` and on unmerged branches. The cutover is complete on landing: `AGENTS.md` rule 40's directory-reading procedure is replaced in the same change, so there is no window in which both allocators are live."

shadow_and_drift = "None, and none is possible. A number register has no shadow mode: running the old procedure alongside it would mean allocating from `docs/adr/` again, which is the defect. Drift between the register and the directory IS the failure the checker reports, in both directions — an authored row with no file, and a file with no row."

local_copy_retirement = "The old procedure was not code and leaves nothing to delete. What retires is the SENTENCE: `AGENTS.md` rule 40's 'a number written on a branch is not a reservation; the first decision to reach `main` keeps it' is replaced, because it is a tie-break applied after a collision rather than a mechanism that prevents one — and on 2026-09-04 it gave no answer at all, since neither 0074 claimant had reached `main`."

next_action = "Nothing outstanding for the mechanism. Michael's ruling of 2026-09-04 (branch disposition) closed the first of the two data items: NONE of the seven `[[branch_collision]]` entries needs a renumber — there are no active collision repairs to perform — and each now carries its disposition and its successor or resumption rule. Two follow-ups survive it, both recorded in the rows themselves: the archived Digital Media claimant is `dormant` pending a seven-property comparison against DM1 (`incubate/digital-media/slice-1`), and ADR-0071's remote branch `origin/docs/adr-0071-build-once-bind-late` is authorized for deletion now that its tip, rescue ref and rescue tag are recorded — a deletion no check performs. Separately, `AGENTS.md`'s own rule numbering has the same defect one level up — rule 48 names 'a version name binds to ONE source and ONE artifact' on `main` and 'a contract catalogue is what it HOLDS' on `feat/agents-rule-43-catalogue-enforcement` @ ee07bf04. Whether AGENTS.md rule numbers get a register of their own is Michael's call and is not decided here."
