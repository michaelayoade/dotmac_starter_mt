# Product-first extraction dossier for the ADR number register.
#
# NOT a package dossier. It lives here, beside what it governs, rather than
# under `packages/`, because the mechanism is not a distribution: it is one
# TOML file and one architecture test, and Michael's ruling is that it stays
# REPOSITORY-LOCAL because each repository owns its own ADR namespace. There is
# nothing to publish, nothing to pin and nothing to install.
#
# It follows the `EXTRACTION.toml` grammar anyway, because ADR-0006's amended
# rule 24 governs the ACT of copying a working implementation out of another
# Dotmac repository regardless of what the result is packaged as, and a port
# with no dossier is indistinguishable from a fork.
#
# `tests/architecture/test_product_first_extraction.py` iterates `packages/*`
# and does not read this file. That is deliberate and is the honest state: this
# record is review evidence, not a gated claim.

schema_version = 1
dossier_kind = "repository-local-mechanism"
unit = "adr-number-allocation"
classification = "repository-local-governance"
status = "adopted"
source_mode = "product-first"

owner = "Which ADR number belongs to which decision in dotmac_starter_mt, and the order in which a number and its document may be claimed"

contract = "docs/adr/reservations.toml is the sole allocator of ADR numbers in this repository. An author takes `next_free`, appends a `[[reservation]]` row and lands that change ALONE on `main`; the ADR itself is written in a later change cut from a `main` that already carries the row. `next_free` is one scalar on one line, so two concurrent allocations conflict in git rather than auto-merging. A number is never reused, including after withdrawal. tests/architecture/test_adr_number_allocation.py refuses an ADR document whose number was not reserved at the branch's MERGE BASE, refuses a register that has gaps, a stale `next_free`, a duplicate number or slug, a document on a retired number, an unregistered document, a row carrying a field nothing reads, and a new entry in the branch-collision backlog. Michael's ruling of 2026-09-04 (branch disposition) added the second half of that gate: every `[[branch_collision]]` row carries a disposition from a CLOSED SIX-VALUE set (`active`, `dormant`, `superseded`, `closed_unmerged`, `never_merge`, `historical_equivalent`), and every NON-ACTIVE row names its successor or its explicit resumption rule in `successor_or_resumption` — a row that omits it is refused, because abandoned history with no forwarding address is what later gets read as authority. The checker additionally refuses a disposition that contradicts its own recorded evidence (`active` over a pull request closed unmerged), and refuses an authorization to delete a remote branch that does not carry the coordinates surviving the deletion (full tip, rescue ref, rescue tag)."

