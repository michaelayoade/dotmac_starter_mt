composition_boundary = "Repository-local by ruling. Each Dotmac repository owns its own ADR namespace, and the Starter's 0001-0009 band shares its spelling with ERP's own decisions, so a shared register would make one number name two decisions by construction. ERP keeps its own `docs/adr/reservations.toml`; the two files are independent and neither imports, reads or pins the other. What is shared is the MECHANISM, ported once and recorded here, not the data."

