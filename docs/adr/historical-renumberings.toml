# Historical renumberings — NOT the live collision queue.
#
# Thirty-one cases where an unmerged branch spells a number that `main` later
# gave to the SAME decision under a DIFFERENT number. These are the pre-register
# rule ("the first decision to reach `main` keeps it; a later decision renumbers
# before merge") working exactly as designed, on decisions that have since
# landed. They are history, not claims.
#
# WHY THEY ARE HERE AND NOT IN `reservations.toml`
#
# Michael's ruling, 2026-09-04: "The 31 excluded historical pairs should remain
# excluded, with their equivalence evidence preserved. Mixing them into the live
# collision queue would make the register less useful." A register whose
# collision block held thirty-eight entries, thirty-one of them already
# reconciled, would bury the seven that a human still has to act on — one of
# these pairs alone (`campaigns-own-outbound-progression` at 0032) appears on
# 303 refs. So the exclusion is deliberate, and the evidence for it is preserved
# in its own file with its own pin rather than deleted or left as a claim in a
# commit message.
#
# THE EQUIVALENCE EVIDENCE, AND WHY IT IS CHECKABLE OFFLINE
#
# Each row's claim is: the slug on the branch HAS ITS OWN AUTHORED ROW in
# `reservations.toml`, at `landed_at`, which differs from the `number` the
# branch spells. That is what makes it a stale copy of an older numbering rather
# than a competing claim — the decision landed, and the register knows where.
# The checker re-derives exactly that from the register alone, so this file
# cannot drift into a set of assertions nobody verifies, and it needs no network
# and no ref scan to be verified.
#
# `refs` is the ref count observed by the all-ref audit scan on 2026-09-04 over
# 1,278 local and remote refs. It is CONTEXT, not a checked assertion: refs come
# and go, and the audit scan is supplementary rather than authoritative (see
# `reservations.toml`, "THE AUTHORITY IS THE MERGE-BASE RESERVATION GATE").
#
# THE LIMIT THIS ACCEPTS, stated rather than hidden: a branch that deliberately
# re-spells a LANDED decision under a wrong number reads exactly like one of
# these. That case is caught where it matters, at merge, by
# `test_adr_numbering.py::test_every_adr_number_is_unique`.
#
# Two-directional per ADR-0018: the count is pinned. A row is added only when a
# branch is genuinely found carrying an older numbering of a landed decision,
# and removed only in the change that retires the ref carrying it.

