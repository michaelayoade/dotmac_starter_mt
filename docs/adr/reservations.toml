# ---------------------------------------------------------------------------
# Pre-existing branch collisions, DECLARED. A number already `authored` on
# `main` that an unmerged branch also spells with a DIFFERENT decision. These
# are not `contested` rows — `main` holds the number and the decision on it is
# settled; what is unsettled is the branch, which must renumber before it can
# merge.
#
# This block is DECLARED, NOT DETECTED. A checker reading one worktree cannot
# see another branch, and calling this coverage would be a claim the mechanism
# cannot honour. `branch_claim_findings` in the checker WILL compare this block
# against a real ref scan, but only where the refs are actually present, and it
# reports the coverage it had rather than passing silently over an empty one.
#
# THE AUTHORITY IS THE MERGE-BASE RESERVATION GATE, NOT THE REF SCAN.
# `unreserved_authorings` runs against the branch's merge base on every CI run
# of every branch, and the merge gate
# `test_adr_numbering.py::test_every_adr_number_is_unique` fails the moment a
# colliding document actually lands. The all-ref scan is a SUPPLEMENTARY AUDIT:
# CI usually sees one branch and a shallow ref set, so a scan there can only
# ever be a sample. It is wired to state its own coverage and to declare
# NON-EXECUTION when the coverage is inadequate, so that "zero collisions
# found" can never be read as "only one branch was visible".
#
# Two-directional per ADR-0018: this block may not grow, and it may only shrink
# in the change that reconciles the entry it removes.
#
# Not listed here, deliberately: thirty-one cases where a branch spells a
# number that `main` later gave to the SAME decision — `campaigns-own-outbound-
# progression` sitting at 0032 on 303 refs while `main` has it at 0056, and so
# on. Those are the old rule's renumber-before-merge working as designed on
# decisions that have since landed. They are history, not claims, and putting
# them here would bury the seven entries that are. They are preserved WITH
# their equivalence evidence in `docs/adr/historical-renumberings.toml`,
# deliberately a separate file and a separate pin, so that the live queue stays
# seven entries long and stays useful.
#
# ---------------------------------------------------------------------------
# DISPOSITION — Michael's ruling, 2026-09-04 (branch disposition). This
# vocabulary REPLACES the first classification vocabulary of the same day.
#
#   "There are no active collision repairs to perform. What remains is
#    preventing abandoned history from accidentally becoming authority."
#
# That is the whole purpose of this block now. Not one of the seven needs a
# number, a rebase or a renumber; every one of them needs to be unable to
# become authority by accident — by being merged, revived, cited or read as
# current by someone who never saw this file.
#
# The set is CLOSED and has SIX values. The checker reads it, and an invented
# seventh fails:
#
#   active                 intended for promotion. Reserve a NEW number on
#                          `main` FIRST, rebase the claimant, rename the ADR,
#                          update its citations one at a time BY MEANING,
#                          re-run the semantic citation verification, and
#                          confirm that unrelated references to the same number
#                          are unchanged. `main`'s ADR always keeps the number.
#   dormant                a CANDIDATE, not a corpse. The problem it addresses
#                          may still be real; the branch is simply not being
#                          worked. It is the one non-active value that keeps a
#                          future, so its `successor_or_resumption` states the
#                          conditions under which it may be picked up again —
#                          and resuming it is a new allocation, never a revival
#                          of the number or the ref.
#   superseded             a later decision replaced it. The successor is named
#                          and the branch is never merged.
#   closed_unmerged        its pull request was closed without merging, and
#                          that closure IS the disposition. Requires `pr`,
#                          `pr_state = "closed_unmerged"` and `pr_closed_at`.
#   never_merge            ruled unmergeable, whatever its pull-request state
#                          says. Stronger than `closed_unmerged`, because a
#                          closed pull request can be reopened by anyone with
#                          the button and a branch on `origin` can be merged
#                          without a pull request at all.
#   historical_equivalent  the SAME decision already lives on `main`, under
#                          another number or as the shipped contract it
#                          decided. `represented_by` names the number that
#                          carries it, and semantic identity was confirmed by
#                          reading BOTH documents — not by matching topics. The
#                          duplicate branch is retired, not renumbered.
#
# EVERY NON-ACTIVE ROW RECORDS ITS SUCCESSOR OR ITS EXPLICIT RESUMPTION RULE.
# `successor_or_resumption` is MANDATORY on every row whose disposition is not
# `active`, and the checker REFUSES a row that omits it. This is the defect the
# ruling exists to prevent: a branch classified as not-active with nothing
# saying where its decision went or on what terms it could come back is exactly
# the abandoned history that later gets read as authority, because the only
# thing a reader can then do is open the branch and believe it. A disposition
# is where the work went; the successor or the resumption rule is what a reader
# does next. A row is not classified until it carries both.
#
# A BRANCH NAME IS EVIDENCE OF STORAGE LOCATION, NOT INTENT. `archive/*` says a
# commit was parked somewhere; it does not say the decision was abandoned, and
# `rescue/*` does not say it was worth rescuing. This is why the previous
# `rescue-only` value is gone: it named where a commit lives, and Michael's
# ruling is that the row must name what is to be DONE with it. The two archive
# refs below now carry three different dispositions between them, which is only
# possible once the name stops being the classifier.
#
# WHAT THE THREE RETIRED VALUES BECAME:
#
#   `pushed-open`         is not a disposition at all. Whether a branch is on
#                         `origin` and whether its pull request is open are
#                         EVIDENCE — recorded structurally in `pr`/`pr_state`
#                         — and the disposition states intent. A pushed, open
#                         claimant is `active` if it is meant to land and
#                         `never_merge` if it is not; the row says which.
#   `rescue-only`         splits by intent: `dormant` where the lane may be
#                         resumed, `superseded`/`never_merge` where it may not.
#   `represented-on-main` is renamed `historical_equivalent`, unchanged in
#                         meaning, and keeps `represented_by`.
#
# COORDINATES BEFORE DELETION. A remote branch that must never merge is safest
# deleted, and a deleted branch is unreachable history unless its coordinates
# were written down first. `remote_deletion_authorized = true` states that
# Michael has authorized deleting the remote ref, and the checker then REQUIRES
# `tip`, `rescue_ref` and `rescue_tag` on the same row — so the authorization
# cannot be recorded before the commit is durably reachable without it. NOTHING
# HERE DELETES A REF; the register records, the human deletes.
#
# FIELDS. `number`, `main_slug`, `branch_slug` and `where` identify the
# collision; `disposition` states intent; `evidence` states what was READ (ref
# tips and dates, whether the ref is on `origin`, pull-request state, and what
# `main` does or does not carry — a bucket asserted with no reading is a guess
# about a branch name); `successor_or_resumption` is mandatory off `active`;
# `represented_by` belongs to `historical_equivalent` alone; `tip` is the full
# forty-character commit; `document` is the ADR path on the branch, whose
# number must equal `number`; `pr`, `pr_state` and `pr_closed_at` record the
# pull request; `rescue_ref`, `rescue_tag` and `remote_deletion_authorized`
# record durable reachability. Every one of them is READ by the checker — a
# field nothing reads is a claim nothing checks.
#
# As disposed on 2026-09-04, NONE of the seven is `active`. `active` and
# `closed_unmerged` are nevertheless live vocabulary, exercised by the planted
# proofs in the checker, because the next collision may well be one.
# ---------------------------------------------------------------------------

