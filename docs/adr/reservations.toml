# The Starter ADR number register — the allocator, not a summary of one.
#
# Starter allocated ADR numbers by reading `docs/adr/` and taking the next free
# one. That is a read-then-write with no lock, performed on branches that
# cannot see each other. On 2026-09-04 it produced the race it looks like:
# THREE decisions were authored against 0074 within eighty minutes — the Tax
# ownership record (`0f8b0746`, 09:39:14) and the two Foundation records
# (`92f3b977`, 09:40:58) — by two authors who each did the correct thing under
# the old rule and neither of whom could see the other. This file replaces that
# rule with a serialized allocator.
#
# Ported from `dotmac_erp` at `5b2a035f` under ADR-0006's product-first
# extraction rule; the dossier is `docs/adr/EXTRACTION.toml`. It stays
# repository-local because each repository owns its own ADR namespace, and the
# 0001-0009 band here shares its spelling with ERP's own decisions.
#
# HOW TO CLAIM A NUMBER
#
#   1. Take `next_free`. That is your number. Do NOT look at `docs/adr/` and
#      take the next gap — see WHY THE DIRECTORY IS NOT THE ALLOCATOR below.
#   2. Append a `[[reservation]]` row with `status = "reserved"`, and raise
#      `next_free` by one.
#   3. Commit THAT ALONE, and land it on `main` before you write the ADR.
#   4. Cut the authoring branch from a `main` that already carries your row.
#      Write the ADR and flip your row to `status = "authored"` in that change.
#
# WHY IT SERIALIZES
#
# `next_free` is one scalar on one line. Two branches that both allocate must
# both rewrite it, so git cannot silently auto-merge them — it raises a
# conflict, and a conflict is the lock being contended rather than a duplicate
# being created. Appended rows alone would not be enough: git will often merge
# two appends at the end of a file without complaint, and that is precisely how
# 0074 came to name three decisions.
#
# WHY THE DIRECTORY IS NOT THE ALLOCATOR
#
# `docs/adr/` on a feature branch shows what has merged plus what that branch
# wrote. It cannot show what a sibling branch wrote, and it cannot show what
# landed on `main` after the branch was cut. Every one of the three 0074
# authors read the directory, found 0073 the highest, took 0074, and was right
# about everything they could see. A procedure that is correct from every
# vantage point and still produces a collision is not a procedure anyone can
# follow more carefully; it is the wrong procedure. The register is the only
# allocator, and step 3 is what makes a claim visible to the next author.
#
# Step 3 is also the load-bearing one for the gate. A number claimed in the
# same change that authors the ADR was claimed on a branch, and a claim on a
# branch is not a claim — `unreserved_authorings` in the checker refuses an ADR
# whose number was not already reserved at the branch's MERGE BASE.
#
# PERMANENCE
#
# A number, once in this file, is never removed, reused, or reassigned to a
# different decision. An abandoned ADR takes `status = "withdrawn"` and keeps
# its number forever. Reuse is not a tidy-up: the number appears in commit
# messages, review threads, other repositories' pins, `docs/inventories/`
# snapshots and cross-repository ADR citations, and none of those are updated
# by deleting a row. A withdrawn record may be re-authored under a NEW number,
# declaring `replaces = <old number>` so the trail survives.
#
# STATUS VALUES
#
#   reserved   number claimed, no document on `main`. A branch that authors it
#              flips the row to `authored` in the same change.
#   authored   `NNNN-<slug>.md` exists in this directory.
#   withdrawn  abandoned. The number is spent forever. No file may exist.
#   contested  PRE-EXISTING DEBT ONLY. More than one unmerged decision claims
#              this number and none is on `main`. Empty today, and the checker
#              refuses a new one — the register exists to prevent one.

next_free = 77

