schema_version = 1
audit_id = "A1"
as_of = "2026-08-14"
# Accepted 2026-08-14. The ADR takes the source ruling (`module ← ERP` plus
# Vendor CP's six mandatory port deltas) with THREE corrections recorded in
# `approvals-workflow-source-audit.md` § "Corrections adopted on review":
# threshold/FX routing stays in ERP and is not in the shared contract; an
# individual `policy_code` is operator-owned data, not manifest-declared
# vocabulary; and Vendor CP's cutover is a capability gain as well as a
# relocation, so only the six safety properties it implements can be
# shadow-compared.
#
# The ADR creates NOTHING — no package, no namespace allocation, no lineage, no
# release row; the module change allocates its own namespace and opens its
# dossier in the same diff. Implementation itself is authorised by ADR-0017's
# 2026-08-14 owner-directed exception and is unwritten.
decision_status = "accepted"
adr = "docs/adr/0026-approvals-decide-approval-never-the-transition.md"
