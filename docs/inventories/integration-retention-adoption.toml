schema_version = 1
subject = "dotmac-integration payload retention"
as_of = "2026-08-15"

# WHAT THIS FILE IS
#
# `ig_0006_retention` destroys provider payload content on a schedule. The
# period, its anchor, who owns the policy and what survives redaction are
# operational decisions with a legal consequence: the Nigeria Data Protection
# Act requires a STATED retention period and storage no longer than necessary,
# so the period has to appear in Dotmac's privacy notice / record of processing
# before content is destroyed under it.
#
# Merging the code does not do that, and no test can. What a test CAN do is
# refuse to call the module adopted until the accepted notice revision is
# recorded here — which is what `tests/architecture/
# test_retention_adoption_gate.py` does.
#
# This is deliberately NOT a prose-grep over a notice document. Grepping a legal
# text for "30 days" passes on a sentence that says the opposite, breaks when a
# lawyer rewords a clause that means the same thing, and tempts an author to
# write for the regex. The gate keys on a REVISION IDENTIFIER a human accepted.

[decision]
# Ruled by Michael, 2026-08-15.
status = "accepted"
period_days = 30
# From RECEIPT, not from processing. Anchoring on processing would make a
# permanently stuck receipt immortal — the row most likely to hold a message
# body.
period_anchor = "received_at"
legal_policy_owner = "Dotmac Data Protection Officer (role, never a person)"
recording_rule_seconds = 2592000

[behaviour]
# The facts the notice has to describe, listed here so the person updating it
# is not reading source to find them.
legal_hold = "An active hold on a receipt refuses redaction regardless of age, until released."
refused_states = [
  "processing",
  "retryable",
  "reconciliation_required",
  "dead_letter",
]
refused_states_reason = "Age alone never authorises destroying content that still has an open question against it. These are alerted separately rather than silently retained."
# The approved fleet standard: content and replay identity have separate
# lifetimes. Redaction keeps enough to recognise a replay or a collision.
replay_evidence_retained = [
  "provider_event_id",
  "payload_digest",
  "capability_binding_id",
  "delivery outcome and product_ref",
  "a redaction tombstone (never NULL, which also means 'the provider sent no content')",
]
replay_evidence_period_days = 180
replay_evidence_period_anchor = "received_at"
replay_evidence_period_note = "Ruled by Michael 2026-08-16, and a SEPARATE decision from the 30-day content period rather than an extension of it. Content is destroyed at 30 days; the identity, digest, outcome evidence and tombstone that make a replay recognisable survive to 180. Justification: a provider redelivery arriving after the identity has been destroyed is indistinguishable from a new event, so the consequence is applied twice — the window has to outlast realistic provider retry and backfill behaviour, not merely the content period. IMPLEMENTATION IS NOT DONE: no second sweep enforces this yet, so today the evidence is retained indefinitely, which is longer than the ruling permits."
replay_evidence_implemented = false

[known_defects]
# Found 2026-08-16 while recording the standards, and verified in source rather
# than inferred.

# `receipt_legal_holds.receipt_id` is `ON DELETE CASCADE` to `inbox_receipts.id`
# (ig_0006_retention.py:81). Deleting a receipt therefore destroys its
# legal-hold history — including the record that someone FORBADE destruction,
# which is the one thing a hold exists to be. A hold is evidence about a
# refusal; evidence that disappears with the row it protected is not evidence.
#
# Not a release blocker, and the reason is specific rather than optimistic:
# retention REDACTS and never DELETES, and no path in the module deletes a
# receipt. It becomes live the moment anything does — an operator purge, an
# adopter's own cleanup, a future purge feature — and it fails silently, which
# is why it is recorded here rather than left to be rediscovered.
legal_hold_history_cascades_on_receipt_delete = true
legal_hold_cascade_evidence = "packages/dotmac-integration/src/dotmac_integration/migrations/versions/ig_0006_retention.py:81"
legal_hold_cascade_disposition = "Blocks production adoption, not the release. Fix belongs in the version that adds any receipt-delete path, and must be in place BEFORE one exists."

[notice]
# The adoption gate. `revision` stays "PENDING" until Michael accepts a privacy
# notice / ROPA revision that states the period, the anchor, the owner, the
# legal-hold behaviour and the retained replay evidence above.
#
# While it is PENDING, `adopted` below MUST be false: the module may be
# installed, released and exercised, but a deployment must not run the sweep
# against real provider content.
revision = "PENDING"
accepted_on = ""
accepted_by = ""
document = "Dotmac privacy notice / record of processing (owner: DPO role)"

[adoption]
# Two independent things, deliberately not collapsed. The code shipped; the
# authority to destroy content under it has not.
code_released = true
code_released_as = "dotmac-integration 0.1.0a3"
adopted = false
blocked_on = [
  "notice.revision is PENDING",
  "known_defects.legal_hold_history_cascades_on_receipt_delete",
  "behaviour.replay_evidence_implemented is false — the 180-day period is ruled but nothing enforces it, so evidence is currently kept indefinitely",
]
