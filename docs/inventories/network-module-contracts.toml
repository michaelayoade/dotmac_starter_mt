schema_version = 1
contract_date = "2026-08-19"
adoption_cohort = "network-suite-v1"
decision = "docs/adr/0043-network-capabilities-decompose-sub-first.md"
dispositions = "docs/inventories/network-module-dispositions.toml"
rule = "Each package publishes immutable commands, queries, snapshots, and events. Public services return snapshots/results, never ORM instances. Cross-owner identity is opaque and no module imports a sibling."

[[modules]]
name = "dotmac-ipam"
package = "dotmac-ipam"
contract_module = "dotmac_ipam.contracts"
returns_orm_instances = false
uses_opaque_cross_owner_refs = true
commands = ["CreateAddressSpace", "CreatePool", "ReserveAddress", "AssignAddress", "ReleaseAssignment", "RecordUtilization", "RepairAssignment"]
queries = ["AddressLookup", "AssignmentLookup", "UtilizationQuery"]
snapshots = ["AddressSpaceSnapshot", "PoolSnapshot", "AddressSnapshot", "AssignmentSnapshot", "UtilizationSnapshot", "RepairReport"]
events = ["AddressReserved", "AddressAssigned", "AssignmentReleased", "AssignmentRepaired"]

