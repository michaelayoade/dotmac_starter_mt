commands = ["RegisterSite", "AdmitNode", "RegisterInterface", "RegisterPort", "DefineVlan", "AttachVlan", "RecordConfigurationSnapshot", "ArchiveNode"]
queries = ["SiteLookup", "NodeLookup", "InterfaceLookup", "VlanLookup"]
snapshots = ["SiteSnapshot", "NodeSnapshot", "InterfaceSnapshot", "PortSnapshot", "VlanSnapshot", "AdmissionResult", "ConfigurationSnapshot"]
events = ["NodeAdmitted", "NodeArchived", "InterfaceChanged", "VlanAttachmentChanged"]

