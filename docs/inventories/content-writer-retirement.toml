schema_version = 1
as_of = "2026-08-18"
target_package = "dotmac-content"
first_adopter = "dotmac-erp"
source_repository = "dotmac_mkt"
source_revision = "7f14ee598ceefed7ac3ba0963e5a36f5c4c5082d"
status_vocabulary = ["not-started", "shadowing", "cut-over", "retired"]
rule = "A row reaches retired only when the named old writer is deleted or made structurally unreachable and its two-directional ratchet is lowered in the same change. A feature flag that leaves both writers available is not retirement."

[[writer]]
id = "CNT-R1"
source_paths = ["app/models/campaign.py", "app/services/campaign_service.py"]
source_behavior = "Creates, updates, archives, lists and counts the Mkt Campaign editorial container."
target_owner = "dotmac-content ContentPlanService"
disposition = "replace"
shadow_proof = "One ContentPlan per classified Mkt Campaign with exact id mapping, text, date range, mapped status and creator reference; zero unexplained read mismatches for a complete planning cycle."
ratchet = "Count construction, status assignment and mutation of Campaign outside the migration reader. It must fail on an unrecorded rise or fall and include a planted-writer sensitivity proof."
status = "not-started"

[[writer]]
id = "CNT-R2"
source_paths = ["app/models/post.py", "app/services/post_service.py"]
source_behavior = "Owns canonical post title/body, plan relation and editorial draft/planned mutation, mixed with publishing fields."
target_owner = "dotmac-content ContentItemService for editorial fields; dotmac-publishing for release fields"
disposition = "split"
shadow_proof = "Every Post is totally classified; editorial fields map to one ContentItem, planned maps to ready, and published/release fields have an explicit publishing disposition with no default bucket."
ratchet = "Count writes to Post.title/content/campaign_id/status/scheduled_at and hard deletes. Lower each field-specific baseline only as its one target owner cuts over."
status = "not-started"

[[writer]]
id = "CNT-R3"
source_paths = ["app/services/post_service.py:replace_deliveries", "app/services/post_service.py:reschedule", "app/models/post_delivery.py"]
source_behavior = "Creates per-target delivery rows, mutates delivery content overrides and treats scheduled_at as both calendar and remote delivery time."
target_owner = "dotmac-publishing"
disposition = "exclude-from-content"
shadow_proof = "Publishing dossier proves target selection, desired delivery time, immutable content snapshot and delivery state before these branches retire. Content proves only planned_for and provider-neutral variants."
ratchet = "Count delivery row writes and mutations of remote scheduling fields outside dotmac-publishing adapters; this row cannot retire in the content-only cutover."
status = "not-started"

[[writer]]
id = "CNT-R4"
source_paths = ["app/models/campaign.py:campaign_assets", "app/services/asset_service.py:link_to_campaign", "app/services/asset_service.py:unlink_from_campaign"]
source_behavior = "Links ordered creative assets to an editorial campaign."
target_owner = "dotmac-content content_plan_creatives using opaque file_ref"
disposition = "replace-relation"
shadow_proof = "Exact plan/file identity and order for every link, after each source Asset is resolved to a durable file reference or explicitly classified as missing."
ratchet = "Count campaign_assets inserts/deletes outside the migration adapter; lower to zero only when all links read from mod_content."
status = "not-started"

[[writer]]
id = "CNT-R5"
source_paths = ["app/models/asset.py:post_assets", "app/services/post_asset_service.py"]
source_behavior = "Links creative assets to canonical post content."
target_owner = "dotmac-content content_item_creatives using opaque file_ref"
disposition = "replace-relation"
shadow_proof = "Exact item/file identity and order for every link, with no FK or import from dotmac-content to dotmac-files."
ratchet = "Count post_assets inserts/deletes outside the migration adapter; lower to zero only when all links read from mod_content."
status = "not-started"

[[writer]]
id = "CNT-R6"
source_paths = ["app/models/asset.py", "app/services/asset_service.py", "app/services/drive_service.py"]
source_behavior = "Owns Drive identifiers, URLs, thumbnails, MIME/size metadata, provider health and soft deletion alongside editorial relations."
target_owner = "dotmac-files for stored bytes and file lifecycle; Integrator for Drive transport; no dotmac-content writer"
disposition = "split-and-delete"
shadow_proof = "Every referenced source Asset has an explicit file disposition; provider transport evidence is retained by Integrator; content retains only opaque references and relation metadata."
ratchet = "Count provider identifiers, URLs, credentials and Drive client calls in Backoffice/content paths; all must reach zero before the Asset owner is retired."
status = "not-started"

[[writer]]
id = "CNT-R7"
source_paths = ["app/models/campaign.py:campaign_members", "app/services/campaign_member_service.py", "app/web/campaigns.py:_can_edit_campaign"]
source_behavior = "Stores campaign member roles and queries them directly to decide whether an actor can edit content."
target_owner = "Backoffice authentication/authorization policy; no dotmac-content table or decision"
disposition = "delete-after-policy-cutover"
shadow_proof = "Backoffice route and command tests prove the same allowed/denied actor cohort through declared permissions before the direct membership query is removed."
ratchet = "Count campaign_members writes and direct membership authorization queries in content entry points; target zero with a planted direct-query sensitivity proof."
status = "not-started"

[[writer]]
id = "CNT-R8"
source_paths = ["app/models/campaign.py:tasks", "app/web/tasks.py"]
source_behavior = "Couples generic task rows to the Mkt Campaign container."
target_owner = "Independent project/work owner; no dotmac-content table"
disposition = "exclude-from-suite"
shadow_proof = "Every surviving task relation has an explicit target owner and opaque ContentPlan correlation where needed; no task row is silently dropped."
ratchet = "Count generic task model/service imports from content adapters; target zero after the separate work-owner decision."
status = "not-started"

[[writer]]
id = "CNT-R9"
source_paths = ["app/web/campaigns.py", "app/web/calendar.py", "app/api/posts.py"]
source_behavior = "Web/API adapters query models directly, authorize with local membership queries, commit and invoke mixed content/publishing services."
target_owner = "Thin Backoffice adapters over dotmac-content and dotmac-publishing owning services; kernel transaction authority"
disposition = "replace-adapters"
shadow_proof = "Route parity covers create/edit/archive/list/calendar behavior and declared guards while service tests prove the same decisions without direct adapter queries or commits."
ratchet = "Starter/Backoffice thin-adapter guard plus a focused count of Campaign/Post/Asset queries and db.commit/db.rollback in migrated entry points."
status = "not-started"
