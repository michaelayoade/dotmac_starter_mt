composition_boundary = "One tenant-scoped namespace and lineage, independent of Academy app imports and sibling modules. Preserve learner UUID meaning and tenant-safe references; never copy identity tables or weaken references to make composition compile. Existing kernel prerequisites are bound by the assembly, not to product revision IDs inside module migrations. Typed result and delivery/event seams retain admissions, labs, identity, presentation and ERP ownership. No Party facade or private Kernel API workaround."
inventory_evidence = ["docs/inventories/learning-sources.md"]
first_cutover = "Academy alone is first adopter. Qualify the complete activity-result to best-result/course progress/completion/certificate vertical, including its seven-table storage dependency closure and final-lab consequence. All selected domain writes delegate typed commands; course/activity authoring decisions retain their current owner until ported. Preserve ERP sync checkpoint values in an explicitly Academy-owned checkpoint and retire direct ERP updates to module completion rows. Then extend the same owner through full curriculum, durable reading/annotations, enrolment/access, assessment using the existing exam engine and attempt policy, learning delivery and learner support until Academy's displaced local learning implementations are retired. A second consumer is not required and none is claimed."
shadow_and_drift = "Read-only comparison of exact results, best-result ordering, progress, completion timestamps/regression, certificate identity, learning events, enrolment/access refusals and migrated references on fresh and populated PostgreSQL fixtures. Preserve RLS/grants and stable IDs. Stop request/background writers for one qualified table/lineage transfer and writer switch; no dual writes. Verify rollback before and after new writes with preserved records and event state."
local_copy_retirement = "Remove Academy's displaced domain model/service implementations and direct learning writers as each released-package cutover is proved; preserve only thin authorized adapters and explicit product boundaries. ERP's pre-existing nonauthoritative LMS retirement remains its separately tracked ADR0004 obligation, not a new module consumer or an authority transfer."
next_action = "2026-10-17: Academy source correction PR177 is merged at61f69194d6591c6a2d13472a5e38c3a5ecf34454 with hosted PR/push CI and resulting main CI and engineering standards green; initial source pins are retained and accepted-source revalidation is recorded. This qualifies the source correction, not a released or adopted learning module. Allocation PR873 remains under qualification; merge its isolated namespace allocation before learning src is written. Publish a separately authorized Kernel containing the allocation before naming a pinnable module floor. Establish current Sub-first lineage and Academy UI05/identity prerequisite evidence; reuse their existing owners. Then implement, qualify, release and adopt each coherent slice of the full scoped learning module and retire local writers."

