disposition = "active_executor"
targets = ["config:DEPLOY_DIR"]
note = """
THE Starter executor, and the one whose retirement this machinery exists for.
Its target is LATE-BOUND: `DEPLOY_DIR` and the sourced `.env` decide at
invocation which host and which database it acts on. That is recorded as the
target rather than a hostname because it is the truth, and because a
late-bound target is the more dangerous shape — nothing pins what this script
can reach. The Foundation's `local_copy_retirement` clause names this as the
cheapest of the three retirements. It is still `active_executor`: nothing has
been displaced, because no product has run two controller-owned cycles.
"""

