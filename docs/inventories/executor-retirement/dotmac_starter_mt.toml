# The Starter's own entrypoint-family census.
#
# The Starter runs the gate it publishes. That is not symmetry for its own
# sake: a contract whose own repository does not satisfy it is a contract whose
# first real exercise happens in somebody else's pull request, and this one
# is about to be handed to ERP and Sub.
#
# `revision` is the commit the census was TAKEN at, not a pin. It goes stale by
# design; what keeps the census true is `reconcile()`, which re-walks the live
# tree on every run and fails on any artifact the tree holds and this file does
# not. A stale revision beside a passing reconciliation is a dated observation
# that still holds. A stale revision beside a FAILING one is the census having
# drifted, and it says exactly which artifact drifted.
#
# Nothing here is retired. The Starter's `scripts/deploy.sh` is `active_executor`
# and stays that way until the Foundation has two successful controller-owned
# cycles against a real target — which has not happened for any product.

schema = "ExecutorInventory.v1"
product = "dotmac_starter_mt"
revision = "fccb10244dd13e4dd46ef7df73fb7da94f4d59ff"

# The fleet DEPLOYMENT targets a Starter entrypoint must never reach. Declared
# HERE rather than inferred, because this is what makes
# `non_production_executor` an enforceable premise instead of an assertion: a
# rehearsal script that grew a line naming one of these would be refused that
# verdict on the next run.
#
# `registry.dotmac.io` is deliberately NOT in this list, and the reason is
# worth keeping. It was, on the first run of this sweep against the real tree,
# and the check fired: `deployment-conformance.yml` installs the published
# facility from that index, so a verdict of `non_production_executor` was
# refused for a workflow that reaches no host at all. The list means "a place a
# deployment LANDS", and a package index is an artifact store, not a deployment
# target. Widening it to every fleet hostname makes the check fire on reads and
# teaches reviewers to override it, which is how a premise stops being load-
# bearing.
production_targets = [
  "selfcare.dotmac.io",
  "erp.dotmac.io",
  "observability.dotmac.io",
]

# Every family named, present or absent. A family nobody named is unmonitored,
# not empty — which is why the parser refuses an inventory that omits one.
families_present = ["workflow", "script", "runtime_reactivation"]
families_absent = [
  "cron",
  "systemd_unit",
  "ssh_credential",
  "webhook",
  "manual_runbook",
]

# `runtime_reactivation` moved from absent to PRESENT in the 2026-08-31
# amendment. It was never absent; it was unmodelled, which is a different and
# worse thing — five Compose files were carrying supervisor directives that no
# family named, so nothing walked them and nothing could have said so.

# An absence is a POSITIVE CLAIM and needs the observation that established it.
# Every one below is scoped `repository_tree`, which is the honest limit of what
# this checkout can establish: the tree holds no member. None of them claims
# anything about a host, and the coverage block prints that bound on every run
# rather than letting a clean walk read as a clean estate. The Starter has no
# deployed host to inspect; a product that does — ERP — owes a `host_observed`
# record naming the host, and that is precisely the record whose absence let
# `dotmac-books.service` sit installed and disabled for as long as it did.

[[family_absence]]
family = "cron"
scope = "repository_tree"
observed_at = "2026-08-30"
observed_by = "michaelayoade"
method = "walked deploy/cron, deploy/cron.d, cron, cron.d, etc/cron.d; no file"

[[family_absence]]
family = "systemd_unit"
scope = "repository_tree"
observed_at = "2026-08-30"
observed_by = "michaelayoade"
method = "walked deploy/systemd, systemd, etc/systemd; no unit, timer or socket"

[[family_absence]]
family = "ssh_credential"
scope = "repository_tree"
observed_at = "2026-08-30"
observed_by = "michaelayoade"
method = """
No tree walk is possible: a deploy key lives in a secret store and a host's
authorized_keys, and one that appeared in a tree would be a leak. This record
therefore establishes only that no Starter workflow or script in this tree
holds a deployment SSH credential, which was read from their `secrets.*`
references. `probe-host-ssh-key` is held by the exposure rehearsal and belongs
to a disposable probe host, not to a deployment target.
"""

[[family_absence]]
family = "webhook"
scope = "repository_tree"
observed_at = "2026-08-30"
observed_by = "michaelayoade"
method = """
No tree walk is possible: the registration lives in the sender's configuration.
This record establishes only that the Starter exposes no deployment-triggering
receiver route in this tree. Whether a third party has a webhook pointed at a
Starter deployment is UNOBSERVED, and unobserved is not absent.
"""

[[family_absence]]
family = "manual_runbook"
scope = "repository_tree"
observed_at = "2026-08-30"
observed_by = "michaelayoade"
method = """
Walked docs/runbooks, docs/operations, docs/ops and runbooks; none exists. The
Starter's deployment procedure is stated inside scripts/deploy.sh, which is
declared as a script rather than duplicated as a runbook. A procedure someone
follows from memory or from a chat message remains unobservable by any walk.
"""

