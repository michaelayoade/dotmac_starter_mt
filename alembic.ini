[alembic]
script_location = alembic
prepend_sys_path = .
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
# Two composed lineages (kernel-boundary Task 1c): the KERNEL base migrations
# ship as kernel package data, the ASSEMBLY owns its own versions dir. This is
# the REFERENCE assembly's composition — the kernel is an editable install at a
# known relative path here; a downstream assembly consuming the wheel writes its
# own alembic.ini pointing at its kernel's `dotmac_kernel/migrations/versions`.
version_locations = %(here)s/packages/dotmac-kernel/src/dotmac_kernel/migrations/versions %(here)s/alembic/versions
path_separator = space
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
