[alembic]
script_location = alembic
prepend_sys_path = .
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
# THREE composed lineages: the KERNEL base migrations (kernel package data), the
# ASSEMBLY's own versions dir, and every INSTALLED STATEFUL MODULE's lineage —
# here `dotmac-template-studio` (prefix `ts`, schema `mod_tstudio`). This is the
# REFERENCE assembly's composition; the kernel and the module are editable
# installs at known relative paths, and a downstream assembly consuming the
# wheels writes its own alembic.ini pointing at their installed package paths.
#
# Installing a module's migrations is exactly two edits (ADR-0006 D1): its
# version location here, and its ledger row in `dotmac_kernel.namespaces` —
# which ships in the kernel, so a module cannot quietly allocate its own
# namespace. `make migration-gate` rejects the composition if the lineages
# collide on a revision id, prefix, branch label, schema claim, or table.
version_locations = %(here)s/packages/dotmac-kernel/src/dotmac_kernel/migrations/versions %(here)s/alembic/versions %(here)s/packages/dotmac-template-studio/src/dotmac_template_studio/migrations/versions %(here)s/packages/dotmac-ticketing/src/dotmac_ticketing/migrations/versions %(here)s/packages/dotmac-inbox/src/dotmac_inbox/migrations/versions
path_separator = space
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
