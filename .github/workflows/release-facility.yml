name: Release facility

# Publish ONE universal facility to the PRIVATE Forgejo index at
# registry.dotmac.io. The same security sequence as `release-kernel.yml`,
# `release-ui.yml`, `release-module.yml` and `release-adapter.yml` — build once
# on the exact current protected-main SHA -> require a successful rehearsal on
# that SHA -> inspect the bytes -> smoke the CLI -> re-assert the run SHA is
# STILL main's tip -> publish THOSE SAME bytes -> install the published release
# from the index and re-smoke the CLI -> tag only then.
#
# WHY THIS LANE HAD TO EXIST BEFORE THE PACKAGE COULD SHIP
#
# `dotmac-deployment-foundation` is `EXTRACTION.toml`'s fourth classification,
# `universal-facility` (ADR-0070). No existing lane accepted it:
# `release-modules.json` wants a `db_schema`/`manifest_attr`/`kernel_floor` a
# facility does not have, and `release-adapters.json` proves an IMPORT
# surface (`__all__` on the installed bytes) for a package that is CALLED
# FROM a product's own process — a facility is the opposite shape, a
# build-time CLI a product's CI shells out to and never imports. Before this
# file existed, `dotmac-deployment-foundation` could not be published by
# anything in this repository, which made `deployment-conformance.yml`'s
# `pip install dotmac-deployment-foundation==<version>` gated shut by
# construction: it named a version nothing could ever publish. This lane
# closes that loop.
#
# WHY A CLI SMOKE, NOT AN IMPORT SMOKE
#
# `scripts/release_facility.py`'s docstring makes the full argument; the short
# version is that an importable module proves nothing about a console
# script. `pip install` can produce a wheel whose `[project.scripts]` entry
# point is broken — a missing `console_scripts` line, a typo'd target — while
# `import dotmac_deployment_foundation` still succeeds cleanly. So this lane
# never imports the package. It installs the wheel into a clean venv and runs
# the INSTALLED `dotmac-deploy` binary: `--help` (needs nothing but a working
# entry point) and `validate` against a real descriptor (needs the whole
# parse/refuse path intact).
#
# THE LANE IS CLOSED, AND OPEN FOR EXACTLY ONE FACILITY. The target is
# resolved from `.github/release-facilities.json`, which lists
# `dotmac-deployment-foundation` and nothing else; every other dispatch value
# fails at the gate. Unlike `release-adapters.json`'s history, this entry is
# not gated behind a pilot consumer — `.github/release-facilities.json`'s own
# `$comment` explains why: the package decides no business fact and holds no
# rows, and its own `EXTRACTION.toml next_action` names a first release as
# the immediately next, unblocked step.
#
# `facility` is a `choice` for the same reason `adapter` is one in
# `release-adapter.yml`: a `workflow_dispatch` choice must offer at least one
# option, and `tests/architecture/test_deployment_release_lane.py` requires
# the `choice` list to match the allowlist exactly, so neither half can drift
# from the other. The enforced layer is `resolve`, not the input.
#
# Credential: `FORGEJO_PUBLISH_TOKEN`, a protected `registry-release`
# environment secret whose canonical source is OpenBao
# (secret/dotmac/forgejo/ci-publisher-token). Third-party actions are pinned
# to the same reviewed full commit SHAs as the other release workflows.

on:
  workflow_dispatch:
    inputs:
      facility:
        description: >-
          Which allowlisted universal facility to publish. The list below is
          a convenience; the enforced layer is `resolve`, which reads
          `.github/release-facilities.json` and fails closed.
        required: true
        type: choice
        options:
          - dotmac-deployment-foundation
      version:
        description: "Version to publish (MUST equal the package's pyproject version)"
        required: true
        type: string

permissions:
  contents: read

# The private index root, one knob with a documented default rather than a
# literal repeated per step (AGENTS.md, "Everything by config"). Credential
# FREE on purpose: the read credential is supplied in the environment, and the
# by-name fetch refuses an index URL carrying userinfo.
env:
  REGISTRY_SIMPLE_INDEX: ${{ vars.REGISTRY_SIMPLE_INDEX || 'https://registry.dotmac.io/api/packages/dotmac/pypi/simple' }}

# One release of one version at a time, and NEVER cancelled in flight.
#
# Two dispatches of the same facility+version could previously run
# concurrently. Both would pass `assert_current_main.sh` (same tip), both would
# build, and both would reach `twine upload` — so which bytes ended up as that
# version was decided by a race, and the tag `verify` writes could name the
# loser's SHA.
#
# `cancel-in-progress: false` rather than true, deliberately. This lane
# publishes to a registry and writes a tag; cancelling it midway can leave a
# version published with no tag, which is worse than making the second dispatch
# wait. The queued run then re-asserts freshness on its own and fails cleanly
# if main moved.
concurrency:
  group: release-facility-${{ inputs.facility }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # `actions: read` is REQUIRED, not tidiness: the rehearsal oracle below
    # calls the workflow-runs API, and the job token's default `contents: read`
    # gets HTTP 403 there. The checker fails closed on an unreadable oracle, so
    # without this the FIRST release refuses — correctly, and for a reason that
    # has nothing to do with the rehearsal.
    permissions:
      actions: read
      contents: read
    outputs:
      package_dir: ${{ steps.resolve.outputs.package_dir }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Fail closed unless THIS run is the exact current tip of protected main
      # (not merely an ancestor) — a stale or side-branch dispatch cannot
      # publish. AGENTS.md rule 32: a protected environment can sit pending
      # for hours, so freshness is asserted again in `publish`, below.
      - name: Assert run is on the current protected main SHA
        run: bash scripts/assert_current_main.sh "${GITHUB_SHA}"

      # NO `setup-poetry`, and its absence is the point. This job used to build
      # the wheel it published; it now fetches the one
      # `foundation-candidate.yml` already built. Leaving the build toolchain
      # installed "in case" would leave `poetry build` one edit away from being
      # reachable again on the path to the publish credential, which is exactly
      # the reachability this change removes. Enforced by
      # `test_deployment_release_lane.py`.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # A version binds to ONE source and ONE artifact, and a CONSUMED version
      # is never reissued. `--purpose release` deliberately does not refuse on
      # this version's own CandidateArtifact.v1 receipt -- publishing the exact
      # bytes `foundation-candidate.yml` already built IS the designed release
      # path, and refusing there would block the bootstrap sequence that lane
      # exists for. A published tag and an unpublishable disposition still
      # refuse, which is what stops a republication and what stops an
      # invalidated candidate from ever reaching the index.
      - name: Refuse a version that is already bound
        run: |
          python scripts/version_binding_guard.py check \
            "${{ inputs.facility }}" --version "${{ inputs.version }}" \
            --purpose release

      # THE GATE. Refuses an unallowlisted distribution, a pyproject whose
      # name disagrees with the dispatch, a version that was not typed
      # exactly, an entry carrying module-only facts, and a package whose
      # dossier does not declare the universal-facility classification.
      # Everything after this step uses only its output.
      - name: Resolve the allowlisted facility
        id: resolve
        run: |
          python scripts/release_facility.py resolve \
            "${{ inputs.facility }}" --version "${{ inputs.version }}" \
            | tee -a "${GITHUB_OUTPUT}"

      # THE CANDIDATE'S COORDINATES, READ FROM THE COMMITTED RECEIPT.
      #
      # Repository included. Nothing below takes an owning repository, a run,
      # an artifact or a digest from a dispatch input or from a literal:
      #
      #   * a dispatch input lets someone name a version whose receipt says
      #     something else, and the two disagree silently. One already-validated
      #     record makes that unrepresentable;
      #   * a hard-coded `michaelayoade/dotmac_starter_mt` becomes wrong the day
      #     the Foundation's lanes move to their own repository. The receipt
      #     travels with the artifact and names its own home, so that migration
      #     edits a record rather than this lane.
      - name: Resolve the recorded candidate
        id: candidate
        run: |
          python scripts/release_facility.py resolve-candidate \
            "${{ inputs.facility }}" --version "${{ inputs.version }}" \
            | tee -a "${GITHUB_OUTPUT}"

      # Fetch by run + artifact ID, the same way a consumer resolves it.
      # `CANDIDATE_SOURCE_TOKEN` is optional and unset today: the job token can
      # read this repository's own artifacts. It exists so the split does not
      # need a workflow edit — after it, the candidate lives in another
      # repository and the job token cannot read it.
      - name: Fetch the candidate artifact
        env:
          GH_TOKEN: ${{ secrets.CANDIDATE_SOURCE_TOKEN || github.token }}
          REPOSITORY: ${{ steps.candidate.outputs.candidate_repository }}
          ARTIFACT_ID: ${{ steps.candidate.outputs.candidate_artifact_id }}
        run: |
          set -euo pipefail
          mkdir -p candidate-dist
          gh api "/repos/${REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > candidate.zip
          python -c "import sys,zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" \
            candidate.zip candidate-dist
          ls -l candidate-dist

      # THE DIGEST GATE, and it lives HERE deliberately. This job declares no
      # `environment:`, so `FORGEJO_PUBLISH_TOKEN` is unreachable from it: a
      # mismatched artifact fails where the publish credential does not exist,
      # rather than after an upload. `dotmac-deployment-control` 0.1.0a3 is the
      # precedent — a run that published and then failed its own verification,
      # leaving bytes on an index that are permanently unprovable. Verification
      # after upload is not verification.
      - name: Refuse anything that is not the recorded candidate
        run: |
          python scripts/release_facility.py verify-candidate \
            "${{ inputs.facility }}" --version "${{ inputs.version }}" \
            --dist candidate-dist

      # The second oracle must be interpreted by the same Foundation bytes the
      # rehearsal executed and this lane will publish. Importing the checkout
      # here would let a source change teach the verifier to accept a receipt
      # emitted by an older candidate without ever exercising that candidate's
      # verification contract.
      - name: Install the verified candidate for receipt verification
        run: |
          set -euo pipefail
          python -m venv .foundation-candidate
          .foundation-candidate/bin/python -m pip install --no-deps candidate-dist/*.whl

      # THE REHEARSAL ORACLE. This package executes migrations, backup, the
      # warm-candidate handoff and rollback. In-repo fakes cannot prove the real
      # socket, firewall and proxy behaviour, so publication needs two oracles:
      # a successful Lane 3 run on this exact SHA and its sixteen-item receipt.
      # The receipt is parsed by the digest-verified candidate installed above.
      - name: Require a passing Lane 3 rehearsal on this exact SHA
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="$(gh run list --workflow exposure-rehearsal.yml \
            --commit "${GITHUB_SHA}" --limit 1 \
            --json databaseId -q '.[0].databaseId // empty')"
          if [ -z "${run_id}" ]; then
            echo "REFUSED: no Lane 3 exposure rehearsal run exists for ${GITHUB_SHA}." >&2
            echo "Run exposure-rehearsal.yml against this exact commit first." >&2
            exit 1
          fi
          mkdir -p .rehearsal
          gh run download "${run_id}" -n lane3-rehearsal-receipt -D .rehearsal
          .foundation-candidate/bin/python scripts/require_rehearsal.py \
            "${GITHUB_SHA}" --receipt .rehearsal/receipt.json

      # Wheel-content policy: the declared surface and py.typed present, no
      # assembly/test/tooling content, NO migration lineage anywhere under the
      # import package, zero third-party dependencies (this package declares
      # none), no secret-shaped files. Run against the FETCHED bytes, which are
      # the bytes that will be published.
      - name: Inspect artifacts
        run: |
          python scripts/release_facility.py inspect "${{ inputs.facility }}" \
            --dist candidate-dist

      # Release-artifact smoke: install the freshly built wheel into a clean
      # venv and prove the CONSOLE SCRIPT it exposes runs against a real
      # descriptor. `deploy/product.toml` is this repository's own descriptor
      # and doubles as the fixture — `packages/dotmac-deployment-foundation`
      # carries none of its own (it is a library and a CLI, not a product),
      # and this file is deliberately the smallest COMPLETE descriptor in the
      # repository, so it needs no digest realism to prove the CLI's whole
      # parse/validate path. Digest realism is `require-real-digests`'s job
      # in `deployment-conformance.yml`, a separate concern from "does the
      # entry point work".
      - name: Release wheel CLI smoke
        run: |
          python scripts/release_facility.py verify-wheel "${{ inputs.facility }}" \
            --dist candidate-dist \
            --descriptor deploy/product.toml

      - name: Upload the verified candidate for the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.facility }}-dist
          path: candidate-dist/*
          retention-days: 90

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: registry-release    # main-only credential boundary; no reviewer wait
    permissions:
      contents: read
    steps:
      # RE-check freshness at the irreversible boundary, before anything is
      # published. `build` proved this run was main's tip at dispatch time, and
      # that is no longer enough by the time this job starts: `registry-release`
      # is now a credential boundary with no reviewer wait (AGENTS.md rule 31 as
      # amended), but a job still QUEUES, and main can move while it waits for a
      # runner or while `build` is running. Removing the reviewer shortened that
      # window; it did not close it. Without this check, commits landing in the
      # gap are silently absent from a release that claims to be current, and
      # the tag `verify` writes would point at a SHA that is no longer the tip.
      # First step in the job, so it fails before the artifact is fetched or the
      # publish token is used.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Re-assert the run SHA is still the current protected main
        run: bash scripts/assert_current_main.sh "${GITHUB_SHA}"

      # Defence in depth: the allowlist is re-checked on the publish side, so
      # a tampered `build` output cannot smuggle a target past the gate.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Re-assert the target is allowlisted
        run: |
          python scripts/release_facility.py resolve \
            "${{ inputs.facility }}" --version "${{ inputs.version }}" >/dev/null

      # Re-checked in the job that actually holds the registry credential, for
      # the same reason the allowlist above is. The build job's answer was
      # correct when it ran; this is the job that can publish, and a gate that
      # only runs where it cannot act is a gate on the wrong side of the seam.
      - name: Re-assert the version is not already bound
        run: |
          python scripts/version_binding_guard.py check \
            "${{ inputs.facility }}" --version "${{ inputs.version }}" \
            --purpose release

      - name: Download the exact verified bytes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.facility }}-dist
          path: dist

      # Defence in depth, and cheap. `build` already refused anything that is
      # not the recorded candidate; this re-derives the digest from the bytes
      # actually in hand on the credentialed side, so a corrupted or swapped
      # inter-job artifact cannot reach `twine`. Same comparison, same receipt,
      # different job.
      - name: Re-assert these are the recorded candidate's bytes
        run: |
          python scripts/release_facility.py verify-candidate \
            "${{ inputs.facility }}" --version "${{ inputs.version }}" \
            --dist dist

      # Publish the SAME bytes `foundation-candidate.yml` built, that `build`
      # fetched by run + artifact ID, digest-checked against the committed
      # receipt, inspected and smoked. Nothing on this path can build a wheel:
      # `poetry` is not installed in either job.
      # A version is CREATE-ONLY. Publishing is the moment a name stops being
      # ours to redefine: every pin, lockfile and receipt that later cites this
      # version assumes the bytes behind it never changed.
      #
      # `--skip-existing` is deliberately absent, and the guard test asserts it
      # stays absent. It turns a duplicate into a SILENT SUCCESS, so a re-run
      # that should have screamed "this version already exists, and the bytes
      # you just built are not the ones behind it" instead reports a green
      # publish that published nothing.
      - name: Publish to the Forgejo private index
        env:
          TWINE_USERNAME: ci-publisher
          TWINE_PASSWORD: ${{ secrets.FORGEJO_PUBLISH_TOKEN }}
        run: |
          python -m pip install --quiet twine
          python -m twine upload \
            --repository-url "https://registry.dotmac.io/api/packages/dotmac/pypi" dist/*

  verify:
    needs: [build, publish]
    runs-on: ubuntu-latest
    environment: registry-release
    permissions:
      contents: write                # create the post-verification tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # The index may lag a few seconds after publish.
      - name: Wait for the release on the Forgejo index
        env:
          IDX: https://ci-publisher:${{ secrets.FORGEJO_PUBLISH_TOKEN }}@registry.dotmac.io/api/packages/dotmac/pypi/simple/${{ inputs.facility }}/
        run: |
          for i in $(seq 1 30); do
            if curl -sf "$IDX" | grep -q "${{ inputs.version }}"; then
              echo "available on the Forgejo index"; exit 0
            fi
            echo "not yet on the Forgejo index (attempt $i)…"; sleep 10
          done
          echo "::error::${{ inputs.facility }} ${{ inputs.version }} did not appear in time"
          exit 1

      # THE BYTES PROOF, and it is a fetch BY NAME rather than a resolution.
      #
      # What stood here resolved the pin with `pip download --no-deps
      # --only-binary :all:` and compared the one wheel that came back. That
      # asks the resolver's question, not the release's: `publish` runs `twine
      # upload dist/*`, so the index holds a wheel AND an sdist, and a resolver
      # has no reason to retrieve the second. The candidate receipt records the
      # sdist's digest and nothing read it — so the sdist's published bytes
      # were compared with nothing, at every seam from the candidate fetch to
      # the index.
      #
      # `dotmac-deployment-control` 0.1.0a3 is the recorded precedent, in those
      # exact terms: the sdist was on the index the whole time and nothing had
      # ever compared its bytes, and the version was ruled unprovable. Every
      # filename the receipt binds is now requested from the index BY NAME, the
      # index must list each exactly once, and every one is compared against
      # the receipt — never against what `publish` uploaded, which would
      # compare an upload with itself.
      #
      # Read as `ci-reader`, not as the publisher: whether the PUBLISHER can
      # read its own upload is a different claim, and the step above already
      # makes it. The credential travels in the environment, never in the index
      # URL and never in argv.
      - name: Fetch every published artifact by name and re-smoke the CLI
        env:
          REGISTRY_PASSWORD: ${{ secrets.FORGEJO_READ_TOKEN }}
        run: |
          python scripts/release_facility.py verify-registry \
            --index "${REGISTRY_SIMPLE_INDEX}" \
            --login ci-reader \
            --pin "${{ inputs.facility }}==${{ inputs.version }}" \
            --descriptor deploy/product.toml

      # Only AFTER registry verification: tag the published SHA.
      - name: Tag the verified release
        run: |
          TAG="${{ needs.build.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" \
            -m "${{ inputs.facility }} ${{ inputs.version }} (verified on the Forgejo registry; installed and CLI entry point proved alone)" \
            "${GITHUB_SHA}"
          git push origin "${TAG}"
          echo "tagged ${TAG} on ${GITHUB_SHA}"

      # Universal facilities own no migration lineage, but publication still
      # retires their declared-unpublished row. Keep the same tag -> record
      # consequence as every other release family.
      - name: Mint the narrow release-recorder App token
        id: recorder-token
        if: always()
        uses: ./.github/actions/release-recorder-token
        with:
          client-id: ${{ vars.RELEASE_RECORDER_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_RECORDER_PRIVATE_KEY }}

      - name: Open the post-release record
        if: always()
        env:
          GH_TOKEN: ${{ steps.recorder-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/open_release_record_pr.sh \
            --distribution "${{ inputs.facility }}" \
            --version "${{ inputs.version }}" \
            --tag "${{ needs.build.outputs.tag }}" \
            --package-dir "${{ needs.build.outputs.package_dir }}"
