name: Recover module release
defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

# Recover a module release whose `publish` succeeded and whose `verify` then
# FAILED, leaving an artifact on the private index with no tag.
#
# Why recover rather than delete and re-upload: delete-and-reupload makes one
# version identify two different sets of bytes. Anyone who already resolved
# `name==version` — a lockfile, a cached wheel, a running deployment — would be
# holding something the index no longer serves, and no error would ever say so.
# A version is an identity, not a slot. Deletion is for compromise, leaked
# secrets, or legal necessity, and nothing else.
#
# So this workflow proves the PUBLISHED bytes are the ones the original run
# built and inspected, verifies them the way the fixed release path does, and
# only then writes the tag the failed run never wrote.
#
# THE TAG POINTS AT THE ORIGINAL RUN'S SOURCE SHA, not at current main. The
# artifact was built from that tree; tagging today's main would attach the
# release to code it does not contain — including, in the first use of this
# workflow, the very fix that made verification possible (#124).
#
# It does NOT re-upload, and it cannot: no publish step, no write token beyond
# the tag. If the hashes differ, or the published wheel will not install
# cleanly, it refuses — at that point the correct move is to burn the version
# and release the next one, leaving the published artifact in place and
# documented as unverified and unsupported.

on:
  workflow_dispatch:
    inputs:
      module:
        description: "Which allowlisted module to recover"
        required: true
        type: choice
        options:
          - dotmac-accounting
          - dotmac-ai-operations
          - dotmac-analytics
          - dotmac-application-directory
          - dotmac-approvals
          - dotmac-assets
          - dotmac-banking
          - dotmac-billing
          - dotmac-brand-profiles
          - dotmac-campaigns
          - dotmac-collections
          - dotmac-commercial-agreements
          - dotmac-compliance-reporting
          - dotmac-content
          - dotmac-document-rendering
          - dotmac-documents
          - dotmac-durable-timers
          - dotmac-entitlement-allocation
          - dotmac-expenses
          - dotmac-fiber-plant
          - dotmac-files
          - dotmac-finance
          - dotmac-forms
          - dotmac-fulfillment
          - dotmac-imports
          - dotmac-inbox
          - dotmac-inbox-operations
          - dotmac-integration
          - dotmac-inventory
          - dotmac-ipam
          - dotmac-licensing
          - dotmac-media-observations
          - dotmac-network-access
          - dotmac-network-assurance
          - dotmac-network-control
          - dotmac-network-inventory
          - dotmac-network-observability
          - dotmac-network-topology
          - dotmac-numbering
          - dotmac-operational-escalations
          - dotmac-response-obligations
          - dotmac-customers
          - dotmac-fx-policy
          - dotmac-qualification
          - dotmac-sales
          - dotmac-service-access-policy
          - dotmac-services
          - dotmac-template-studio
          - dotmac-usage
          - dotmac-usage-rating
          - dotmac-workforce
          - dotmac-party
          - dotmac-payables
          - dotmac-payments
          - dotmac-payroll
          - dotmac-people
          - dotmac-platform-health
          - dotmac-pon-access
          - dotmac-positioning
          - dotmac-procurement
          - dotmac-projects
          - dotmac-publishing
          - dotmac-records
          - dotmac-referrals
          - dotmac-release-catalog
          - dotmac-remote-access
          - dotmac-reseller-management
          - dotmac-service-catalog
          - dotmac-service-changes
          - dotmac-service-orders
          - dotmac-sites
          - dotmac-subscriptions
          - dotmac-support-access
          - dotmac-surveys
          - dotmac-tax
          - dotmac-ticketing
          - dotmac-web-analytics
          - dotmac-work-orders
          - dotmac-workflow-runtime
      version:
        description: "The already-published version to recover, e.g. 0.1.0a1"
        required: true
        type: string
      original_run_id:
        description: >-
          The failed release run whose `publish` succeeded. Supplies BOTH the
          retained build artifacts to compare against and the source SHA to tag.
        required: true
        type: string
      compose_kernel:
        description: "Exact PUBLISHED kernel version to register against, e.g. 0.1.0a45"
        required: true
        type: string
      compose_with:
        description: >-
          Space-separated exact pins of already-published siblings to register
          alongside this one, e.g. "dotmac-release-catalog==0.1.0a1".
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    # Same protected environment as a release: recovery ends in a tag that
    # states a version was verified, which is a claim worth an approval.
    environment: registry-release
    permissions:
      contents: write
    env:
      MODULE: ${{ inputs.module }}
      VERSION: ${{ inputs.version }}
      ORIGINAL_RUN_ID: ${{ inputs.original_run_id }}
      COMPOSE_KERNEL: ${{ inputs.compose_kernel }}
      COMPOSE_WITH: ${{ inputs.compose_with }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - name: Resolve the original run's source SHA
        id: origin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ORIGINAL_RUN_ID}" -q .head_sha)"
          CONCLUSION="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ORIGINAL_RUN_ID}" -q .conclusion)"
          if [ -z "${SHA}" ]; then
            echo "::error::could not resolve a head SHA for run ${ORIGINAL_RUN_ID}"
            exit 1
          fi
          # A SUCCESSFUL run needs no recovery, and pointing this at one would
          # write a second tag for an already-tagged release.
          if [ "${CONCLUSION}" = "success" ]; then
            echo "::error::run ${ORIGINAL_RUN_ID} succeeded — there is nothing to recover"
            exit 1
          fi
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "recovering from ${SHA} (original run conclusion: ${CONCLUSION})"

      # Check out MAIN, not the original tree — deliberately, and it is the
      # opposite of what the release path does.
      #
      # The original tree predates the fix that made verification possible
      # (#124) and predates `compare-published` itself, so running the checks
      # from it would run the broken tooling that caused this recovery. What
      # ties the release to the original tree is the HASH COMPARISON, not which
      # checkout performed it: the artifact is proven to be those bytes, and the
      # tag is then written onto that SHA.
      #
      # `fetch-depth: 0` so the original SHA is present to tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      # `runner.temp` is only available in step/job `run:` context, never in
      # `jobs.<id>.env:` — GitHub silently leaves that interpolation empty
      # there. Resolve it once, right after checkout, into `GITHUB_ENV` so
      # every later step in this job sees the same `RECOVERED_DIST`.
      - name: Resolve the shared recovered-artifact directory
        run: echo "RECOVERED_DIST=${RUNNER_TEMP}/recovered-dist" >> "$GITHUB_ENV"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Gate on the release allowlist
        id: target
        run: |
          set -euo pipefail
          python scripts/release_module.py resolve \
            "$MODULE" --version "$VERSION" \
            | tee -a "${GITHUB_OUTPUT}"

      - name: Download the original run's build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RECOVERED_DIST"
          gh run download "$ORIGINAL_RUN_ID" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "${MODULE}-dist" \
            --dir "$RECOVERED_DIST"
          ls -l "$RECOVERED_DIST"

      # The load-bearing check: the bytes on the index are the bytes that run
      # built. `compare-published` refuses on any difference.
      - name: Prove the published artifact matches the original build
        env:
          INDEX: https://ci-publisher:${{ secrets.FORGEJO_PUBLISH_TOKEN }}@registry.dotmac.io/api/packages/dotmac/pypi/simple
        run: |
          python scripts/release_module.py compare-published "$MODULE" \
            --version "$VERSION" \
            --index "${INDEX}" \
            --dist "$RECOVERED_DIST"

      # The verification the original run never completed — now with the public
      # index available, which is what #124 fixed.
      - name: Install from the registry, register, and compose
        env:
          INDEX: https://ci-publisher:${{ secrets.FORGEJO_PUBLISH_TOKEN }}@registry.dotmac.io/api/packages/dotmac/pypi/simple
        run: |
          set -euo pipefail
          PINS=(--pin "${MODULE}==${VERSION}")
          for sibling in ${COMPOSE_WITH}; do
            PINS+=(--pin "${sibling}")
          done
          python scripts/release_module.py verify-registry \
            --index "${INDEX}" \
            --kernel "${COMPOSE_KERNEL}" \
            "${PINS[@]}"

      # Only after every check: write the tag the failed run never wrote, on the
      # ORIGINAL SHA. Same canonical `ModuleReleaseTagEvidence.v1` evidence and
      # fail-closed refusal as an ordinary release — no separate "RECOVERED"
      # free-text message.
      - name: Tag the recovered release
        env:
          ORIGIN_SHA: ${{ steps.origin.outputs.sha }}
        run: |
          set -euo pipefail
          # `resolve` emits key=value lines, and its `tag=` line already pairs
          # the allowlisted prefix with the PACKAGE's own version — so a
          # dispatched version that disagrees with the tree has already been
          # refused by the resolve gate above.
          TAG="$(python scripts/release_module.py resolve "$MODULE" --version "$VERSION" | sed -n 's/^tag=//p')"
          if [ -z "${TAG}" ]; then
            echo "::error::could not resolve a tag name"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python scripts/tag_module_release.py \
            --distribution "$MODULE" \
            --version "$VERSION" \
            --tag "$TAG" \
            --commit "$ORIGIN_SHA" \
            --artifact-dir "$RECOVERED_DIST" \
            --run-id "$RUN_ID" \
            --remote origin

      # Recovery writes the same irreversible tag as an ordinary release and
      # therefore owes the same record. Without this step a successful recovery
      # repairs the artifact while deliberately leaving checked-in truth red.
      - name: Mint the narrow release-recorder App token
        id: recorder-token
        if: always()
        uses: ./.github/actions/release-recorder-token
        with:
          client-id: ${{ vars.RELEASE_RECORDER_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_RECORDER_PRIVATE_KEY }}

      - name: Open the post-release record
        if: always()
        env:
          GH_TOKEN: ${{ steps.recorder-token.outputs.token || secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.target.outputs.tag }}
          PACKAGE_DIR: ${{ steps.target.outputs.package_dir }}
        run: |
          bash scripts/open_release_record_pr.sh \
            --distribution "$MODULE" \
            --version "$VERSION" \
            --tag "$TAG" \
            --package-dir "$PACKAGE_DIR" \
            --artifact-dir "$RECOVERED_DIST"
