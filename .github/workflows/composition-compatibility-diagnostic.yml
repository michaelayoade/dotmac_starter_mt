name: Kernel compatibility diagnostic only

# Candidate code measures facts here. This job is never trusted acceptance and
# cannot replace or clear the separately pinned compatibility requirement.
on:
  pull_request:
    branches: [main]
  push:
    branches: [integration/all-starter-module-prs-20261029]

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

jobs:
  diagnostic:
    name: Kernel compatibility diagnostic only
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out candidate source and all published tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Check out exact public Academy observations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: michaelayoade/dotmac_academy_app
          ref: ca1f9058a6483fe52207556fa2d17c56b1e237c7
          path: .compat-gate-clones/dotmac_academy_app
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Check out exact public ERP observations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: michaelayoade/dotmac_erp
          ref: 134abce8a74a205bd9636cafcf232178acb70874
          path: .compat-gate-clones/dotmac_erp
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Check out exact public Sub observations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: michaelayoade/dotmac_sub
          ref: 272a897b778899b110c5790fcaf43bbb54efe27c
          path: .compat-gate-clones/dotmac_sub
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up the foreign parser and the 3.11 host
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: |-
            3.12
            3.11

      - name: Measure candidate compatibility without inherited environment
        run: |
          mkdir -p "$RUNNER_TEMP/compatibility-diagnostic-home"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/compatibility-diagnostic-home" \
            LANG=C.UTF-8 GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null \
            GIT_TERMINAL_PROMPT=0 \
            python3.11 -I scripts/compatibility_diagnostic.py \
              --workspace "$GITHUB_WORKSPACE" \
              --output "$GITHUB_WORKSPACE/compatibility-diagnostic.json"

      - name: Preserve diagnostic facts even on refusal
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compatibility-diagnostic-only
          path: compatibility-diagnostic.json
          if-no-files-found: error
          retention-days: 7
