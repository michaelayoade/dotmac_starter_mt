name: Kernel successor source records (unqualified)

on:
  push:
    branches: ["chore/kernel-successor-source-*"]

permissions:
  contents: read

jobs:
  generate-unqualified-records:
    if: github.repository == 'michaelayoade/dotmac_starter_mt'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_SOURCE_SHA: ${{ github.sha }}
      GIT_NO_LAZY_FETCH: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Run canonical owners on this exact source checkout
        shell: bash --noprofile --norc -eo pipefail {0}
        run: |
          git diff --exit-code
          python - <<'PY'
          import hashlib
          import importlib.util
          import json
          import sys
          from pathlib import Path
          
          paths = (
              "packages/dotmac-kernel/src/dotmac_kernel/public_exports.json",
              "docs/MODULE_CATALOG.md",
              "docs/inventories/release-authority.json",
              "tests/architecture/published_source_drift_baseline.json",
          )
          before = {path: hashlib.sha256(Path(path).read_bytes()).hexdigest() for path in paths}
          Path("kernel-successor-before.json").write_text(json.dumps(before) + "\n")
          root = Path("packages/dotmac-kernel/src/dotmac_kernel")
          spec = importlib.util.spec_from_file_location(
              "kernel_public_exports_owner", root / "public_exports.py"
          )
          if spec is None or spec.loader is None:
              raise SystemExit("canonical public-export owner is unavailable")
          owner = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = owner
          spec.loader.exec_module(owner)
          (root / "public_exports.json").write_bytes(owner.derive_public_exports(root))
          PY
          python scripts/module_catalog.py
          python scripts/release_authority.py write
          python scripts/published_source_drift.py --write-baseline
      - name: Bind bounded unqualified records to their source
        shell: bash --noprofile --norc -eo pipefail {0}
        run: |
          git rev-parse HEAD > kernel-successor-checkout.txt
          git rev-parse 'HEAD^{tree}' > kernel-successor-tree.txt
          git rev-list --parents -n 1 HEAD > kernel-successor-parents.txt
          git diff --name-only -- > kernel-successor-changed.txt
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import re
          from pathlib import Path
          
          expected = os.environ["EXPECTED_SOURCE_SHA"]
          checkout = Path("kernel-successor-checkout.txt").read_text().strip()
          if re.fullmatch(r"[0-9a-f]{40}", expected) is None or checkout != expected:
              raise SystemExit("source checkout identity mismatch")
          paths = (
              "packages/dotmac-kernel/src/dotmac_kernel/public_exports.json",
              "docs/MODULE_CATALOG.md",
              "docs/inventories/release-authority.json",
              "tests/architecture/published_source_drift_baseline.json",
          )
          changed = set(Path("kernel-successor-changed.txt").read_text().splitlines())
          if changed - set(paths):
              raise SystemExit("canonical owners changed unexpected paths")
          before = json.loads(Path("kernel-successor-before.json").read_text())
          if set(before) != set(paths):
              raise SystemExit("source record snapshot scope mismatch")
          records = []
          for path in paths:
              data = Path(path).read_bytes()
              if len(data) > 262144:
                  raise SystemExit("canonical record exceeds review bound")
              if path.endswith(".json"):
                  json.loads(data)
              else:
                  data.decode("utf-8")
              records.append(
                  {
                      "path": path,
                      "before_sha256": before[path],
                      "sha256": hashlib.sha256(data).hexdigest(),
                      "content_base64": base64.b64encode(data).decode("ascii"),
                  }
              )
          packet = {
              "schema_version": 1,
              "kind": "unqualified_kernel_successor_source_records",
              "source_sha": expected,
              "checkout_sha": checkout,
              "checkout_tree": Path("kernel-successor-tree.txt").read_text().strip(),
              "checkout_parents": Path("kernel-successor-parents.txt").read_text().split()[1:],
              "records": records,
          }
          encoded = json.dumps(packet, ensure_ascii=True, separators=(",", ":"))
          if len(encoded.encode("ascii")) > 1048576:
              raise SystemExit("record packet exceeds review bound")
          Path("kernel-successor-source-records.json").write_text(encoded + "\n")
          print("BEGIN_UNQUALIFIED_KERNEL_SUCCESSOR_RECORDS")
          print(encoded)
          print("END_UNQUALIFIED_KERNEL_SUCCESSOR_RECORDS")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: unqualified-kernel-successor-source-records
          path: |
            packages/dotmac-kernel/src/dotmac_kernel/public_exports.json
            docs/MODULE_CATALOG.md
            docs/inventories/release-authority.json
            tests/architecture/published_source_drift_baseline.json
            kernel-successor-source-records.json
          if-no-files-found: error
