name: Release module
run-name: Release module ${{ inputs.module }} ${{ inputs.version }}
defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

# Publish ONE installable module to the PRIVATE Forgejo index at
# registry.dotmac.io. The same security sequence as `release-kernel.yml`, and
# deliberately not a generalisation of it: a kernel wheel MUST ship compiled
# CSS and a module wheel must NOT, so one workflow covering both would have to
# weaken whichever check the other cannot satisfy.
#
# Flow, unchanged from the kernel path: build once (on the exact current
# protected-main SHA) -> inspect the bytes -> smoke them -> enter the main-only
# release environment -> re-assert the run SHA is still main's tip -> publish THOSE
# SAME bytes -> install the published release from the index and verify ->
# tag only then.
#
# The lane accepts both persistence shapes declared by ModuleManifest. Every
# allowlist row still carries `db_schema`: a `mod_*` string for stateful code or
# explicit null for stateless code. The resolver compares that fact to the
# manifest before build, and the installed-wheel smoke checks it again through
# ModuleRegistry. Stateless does not mean adapter: it still has a manifest and a
# kernel floor, but its wheel must contain no migration lineage.
#
# A release may also run the COMPOSITION check (level 2) when it completes a
# set: `compose_with` lists already-published siblings, `compose_kernel` pins the
# exact published kernel, and the check installs all of them from the index and
# registers every manifest in one ModuleRegistry before the tag is written.
# The standalone `verify-module-composition.yml` remains, for re-checking a set
# without cutting a release.
#
# ONE MODULE PER RUN, on purpose. Releasing two in a single dispatch would read
# as transactional when it is not: the second upload can fail with the first
# already public, leaving a "failed" run that published half its subject. Two
# dispatches for two releases is the honest shape, and the composition proof runs
# afterwards against both published versions.
#
# The target is resolved from `.github/release-modules.json` — a CLOSED,
# reviewed allowlist. `scripts/release_module.py resolve` fails on anything
# absent from it, so a dispatch cannot build an arbitrary directory. The
# `choice` input below constrains the same set at the UI layer;
# `tests/architecture/test_module_release_allowlist.py` asserts the two agree,
# so the convenience list cannot drift from the enforced one.
#
# Credential: `FORGEJO_PUBLISH_TOKEN`, a protected `registry-release`
# environment secret whose canonical source is OpenBao
# (secret/dotmac/forgejo/ci-publisher-token). Third-party actions are pinned to
# reviewed full commit SHAs.

on:
  workflow_dispatch:
    inputs:
      module:
        description: "Which allowlisted module to publish"
        required: true
        type: choice
        options:
          - dotmac-accounting
          - dotmac-ai-operations
          - dotmac-analytics
          - dotmac-application-directory
          - dotmac-approvals
          - dotmac-assets
          - dotmac-banking
          - dotmac-billing
          - dotmac-brand-profiles
          - dotmac-campaigns
          - dotmac-collections
          - dotmac-commercial-agreements
          - dotmac-compliance-reporting
          - dotmac-content
          - dotmac-document-rendering
          - dotmac-documents
          - dotmac-durable-timers
          - dotmac-entitlement-allocation
          - dotmac-expenses
          - dotmac-fiber-plant
          - dotmac-files
          - dotmac-finance
          - dotmac-forms
          - dotmac-fulfillment
          - dotmac-imports
          - dotmac-inbox
          - dotmac-inbox-operations
          - dotmac-integration
          - dotmac-inventory
          - dotmac-ipam
          - dotmac-licensing
          - dotmac-media-observations
          - dotmac-network-access
          - dotmac-network-assurance
          - dotmac-network-control
          - dotmac-network-inventory
          - dotmac-network-observability
          - dotmac-network-topology
          - dotmac-numbering
          - dotmac-operational-escalations
          - dotmac-response-obligations
          - dotmac-customers
          - dotmac-fx-policy
          - dotmac-qualification
          - dotmac-sales
          - dotmac-service-access-policy
          - dotmac-services
          - dotmac-template-studio
          - dotmac-usage
          - dotmac-usage-rating
          - dotmac-workforce
          - dotmac-party
          - dotmac-payables
          - dotmac-payments
          - dotmac-payroll
          - dotmac-people
          - dotmac-platform-health
          - dotmac-pon-access
          - dotmac-positioning
          - dotmac-procurement
          - dotmac-projects
          - dotmac-publishing
          - dotmac-records
          - dotmac-referrals
          - dotmac-release-catalog
          - dotmac-remote-access
          - dotmac-reseller-management
          - dotmac-service-catalog
          - dotmac-service-changes
          - dotmac-service-orders
          - dotmac-sites
          - dotmac-subscriptions
          - dotmac-support-access
          - dotmac-surveys
          - dotmac-tax
          - dotmac-ticketing
          - dotmac-web-analytics
          - dotmac-work-orders
          - dotmac-workflow-runtime
          - dotmac-learning
      version:
        description: "Version to publish (MUST equal the package's pyproject version)"
        required: true
        type: string
      compose_kernel:
        description: >-
          Optional. Exact PUBLISHED kernel version to run the composition check
          against, e.g. 0.1.0a45. Required when compose_with is set.
        required: false
        default: ""
        type: string
      compose_with:
        description: >-
          Optional. Space-separated exact pins of already-published sibling
          modules to register ALONGSIDE this one, e.g.
          "dotmac-release-catalog==0.1.0a1". Left empty for the first module of
          a set, when there is nothing yet to compose with.
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build:
    # Matches native qualification: GLIBC 2.35 wheels load on Debian 12 (2.36).
    runs-on: ubuntu-22.04
    outputs:
      package_dir: ${{ steps.resolve.outputs.package_dir }}
      tag: ${{ steps.resolve.outputs.tag }}
      kernel_floor: ${{ steps.resolve.outputs.kernel_floor }}
    env:
      MODULE: ${{ inputs.module }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Fail closed unless THIS run is the exact current tip of protected main
      # (not merely an ancestor) — a stale or side-branch dispatch cannot publish.
      - name: Assert run is on the current protected main SHA
        run: bash scripts/assert_current_main.sh "${GITHUB_SHA}"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-poetry

      # THE GATE. Refuses an unallowlisted distribution, a pyproject whose name
      # disagrees with the dispatch, a version that was not typed exactly, and a
      # kernel floor that no longer matches the release which allocated this
      # module's schema. Everything after this step uses only its output.
      - name: Resolve the allowlisted module
        id: resolve
        run: |
          set -euo pipefail
          python scripts/release_module.py resolve \
            "$MODULE" --version "$VERSION" \
            | tee -a "${GITHUB_OUTPUT}"

      - name: Build wheel + sdist
        working-directory: ${{ steps.resolve.outputs.package_dir }}
        run: poetry build

      # Wheel-content policy: py.typed and the migration lineage present, no
      # assembly/test/tooling content, dependency closure limited to the
      # per-module reviewed set, no secret-shaped files. A stateless module is
      # additionally refused if any migration lineage appears in its wheel.
      - name: Inspect artifacts
        env:
          PACKAGE_DIR: ${{ steps.resolve.outputs.package_dir }}
        run: |
          python scripts/release_module.py inspect "$MODULE" \
            --dist "$PACKAGE_DIR/dist"

      # The smoke needs a kernel ARTIFACT. The module floors at the release
      # that allocated its schema, and that kernel may not be published yet —
      # this step runs before any publication. Building it here keeps the smoke
      # self-contained; proving the module against the PUBLISHED kernel is the
      # verify job's separate, stronger claim.
      - name: Build the kernel wheel for the smoke
        working-directory: packages/dotmac-kernel
        run: poetry build --output "${GITHUB_WORKSPACE}/kernel-dist"

      # Reviewed logical module_dependencies pins supply the required manifest
      # closure. Python dependencies stay separately limited by allowed_requires.
      # The build job has no registry credential, so build both reviewed sets
      # from this exact main checkout and supply their wheels by explicit path.
      # Merely existing in the repository never opts a package into the release.
      - name: Build allowed first-party dependency wheels for the smoke
        run: |
          python scripts/release_module.py build-local-dependencies \
            "$MODULE" \
            --output "${GITHUB_WORKSPACE}/dependency-dist"

      # Release-artifact smoke: install the freshly built wheel into a clean
      # venv and register its required dependency closure through ModuleRegistry
      # (which includes
      # NamespaceRegistry for stateful members). Proves the bytes about to be
      # published are installable and registrable, not merely well-formed.
      - name: Bootstrap the hash-locked release verifier
        run: |
          verifier="$(mktemp -d "${RUNNER_TEMP}/release-verifier.XXXXXX")"
          python -m venv "$verifier"
          "$verifier/bin/python" -m pip install --disable-pip-version-check \
            --require-hashes --only-binary=:all: \
            -r .github/bootstrap/release-verifier-requirements-py312.txt
          echo "$verifier/bin" >> "$GITHUB_PATH"

      - name: Release wheel smoke
        env:
          PACKAGE_DIR: ${{ steps.resolve.outputs.package_dir }}
        run: |
          python scripts/release_module.py verify-wheel "$MODULE" \
            --dist "$PACKAGE_DIR/dist" \
            --kernel-dist "${GITHUB_WORKSPACE}/kernel-dist" \
            --dependency-dist "${GITHUB_WORKSPACE}/dependency-dist" \
            --emit-dependency-manifest "${GITHUB_WORKSPACE}/smoke-dependencies/smoke-dependencies.json"

      # The exact kernel/dependency wheels the smoke installed, by filename and
      # SHA-256 — carried into the tag evidence and the verification row.
      - name: Upload the smoke dependency manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.module }}-smoke-dependencies
          path: smoke-dependencies/smoke-dependencies.json
          retention-days: 90

      # The native wheel is built once above. Load those SAME bytes in the
      # first adopter's compiler-free Debian 12 / CPython 3.12 runtime before
      # publication, so a newer runner GLIBC cannot silently reach consumers.
      - name: Verify native wheel in the supported Debian runtime
        if: steps.resolve.outputs.native_package != ''
        env:
          PACKAGE_DIR: ${{ steps.resolve.outputs.package_dir }}
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/source:ro" --workdir /source \
            python:3.12-slim-bookworm \
            sh -ec '
              python -m venv /tmp/release-verifier
              /tmp/release-verifier/bin/python -m pip install \
                --disable-pip-version-check --require-hashes --only-binary=:all: \
                -r .github/bootstrap/release-verifier-requirements-py312.txt
              exec /tmp/release-verifier/bin/python scripts/release_module.py \
                verify-wheel "$@"
            ' sh "$MODULE" --dist "$PACKAGE_DIR/dist" \
              --kernel-dist /source/kernel-dist \
              --dependency-dist /source/dependency-dist

      - name: Upload built artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.module }}-dist
          path: ${{ steps.resolve.outputs.package_dir }}/dist/*
          retention-days: 90

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: registry-release    # main-only release credential boundary; no reviewer wait
    permissions:
      contents: read
    env:
      MODULE: ${{ inputs.module }}
      VERSION: ${{ inputs.version }}
    steps:
      # RE-check freshness at the irreversible boundary. `build` proved this
      # run was main's tip at dispatch time, but a queued job can start after
      # main moves. First step in the job, so it fails before the artifact is
      # fetched or the publish token is used.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Re-assert the run SHA is still the current protected main
        run: bash scripts/assert_current_main.sh "${GITHUB_SHA}"

      # Defence in depth: the allowlist is re-checked on the publish side, so a
      # tampered `build` output cannot smuggle a target past the gate.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Re-assert the target is allowlisted
        run: |
          python scripts/release_module.py resolve \
            "$MODULE" --version "$VERSION" >/dev/null

      - name: Download the exact built bytes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.module }}-dist
          path: dist

      # Qualify these SAME candidate bytes against already-published inputs.
      # No candidate upload, rebuild or additional credential boundary occurs.
      - name: Snapshot the build-once candidate artifacts
        run: |
          echo "CANDIDATE_BASELINE=${RUNNER_TEMP}/candidate-original-artifacts.json" >> "$GITHUB_ENV"
          echo "CANDIDATE_QUALIFIED=${RUNNER_TEMP}/candidate-qualified" >> "$GITHUB_ENV"
          python - <<'PYCODE'
          import hashlib, json, os, pathlib
          root = pathlib.Path('dist')
          paths = sorted(root.iterdir())
          assert paths and all(p.is_file() and not p.is_symlink() for p in paths)
          rows = {p.name: {'bytes': p.stat().st_size, 'sha256': hashlib.sha256(p.read_bytes()).hexdigest()} for p in paths}
          pathlib.Path(os.environ['RUNNER_TEMP'], 'candidate-original-artifacts.json').write_text(json.dumps(rows, sort_keys=True, indent=2) + '\n')
          PYCODE

      - name: Bootstrap hash-locked candidate qualification tools
        run: |
          verifier="$(mktemp -d "${RUNNER_TEMP}/candidate-verifier.XXXXXX")"
          python -m venv "$verifier"
          "$verifier/bin/python" -m pip install --disable-pip-version-check \
            --require-hashes --only-binary=:all: \
            -r .github/bootstrap/candidate-qualification-requirements-linux-py312.txt
          echo "$verifier/bin" >> "$GITHUB_PATH"

      - name: Qualify the candidate against published dependency wheels
        env:
          INDEX: https://ci-publisher:${{ secrets.FORGEJO_PUBLISH_TOKEN }}@registry.dotmac.io/api/packages/dotmac/pypi/simple
        run: |
          python scripts/release_module.py qualify-candidate "$MODULE" \
            --dist dist --index "$INDEX" --output "$CANDIDATE_QUALIFIED"

      # Fixed regression protocol for the repaired Fulfillment release. Generic
      # candidate qualification above derives every dependency from policy.
      - name: Prove genuine Fulfillment dependency closure and refusal canaries
        if: inputs.module == 'dotmac-fulfillment' && inputs.version == '0.1.0a2'
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          test -d "$CANDIDATE_QUALIFIED"
          export MODULE_RELEASE_CLOSURE_WHEEL_DIR="$CANDIDATE_QUALIFIED"
          python -I -m pytest --noconftest -c /dev/null -p no:cacheprovider \
            --junitxml="${RUNNER_TEMP}/candidate-closure.xml" \
            tests/unit/test_module_release_dependency_closure.py::test_genuine_installed_fulfillment_timer_closure \
            tests/unit/test_module_release_dependency_closure.py::test_installed_manifest_must_independently_match_plan \
            tests/unit/test_module_release_dependency_closure.py::test_genuine_checkout_import_refused \
            tests/unit/test_module_release_dependency_closure.py::test_required_native_extension_cannot_be_missing
          python - <<'PYCODE'
          import os, pathlib, xml.etree.ElementTree as ET
          root = ET.parse(pathlib.Path(os.environ['RUNNER_TEMP'], 'candidate-closure.xml')).getroot()
          cases = root.findall('.//testcase')
          assert len(cases) == 7, len(cases)
          assert all(not c.findall('skipped') and not c.findall('failure') and not c.findall('error') for c in cases)
          PYCODE

      - name: Bind required qualification evidence to the actual source and build
        run: |
          python - <<'PYCODE'
          import hashlib, json, os, pathlib, subprocess
          baseline_path = pathlib.Path(os.environ['CANDIDATE_BASELINE'])
          baseline = json.loads(baseline_path.read_bytes())
          receipt_path = pathlib.Path(os.environ['CANDIDATE_QUALIFIED'], 'CandidateQualification.v1.json')
          assert receipt_path.is_file() and not receipt_path.is_symlink()
          receipt_bytes = receipt_path.read_bytes()
          receipt = json.loads(receipt_bytes)
          candidate = receipt['candidate']
          assert candidate['name'] == os.environ['MODULE']
          assert candidate['version'] == os.environ['VERSION']
          assert candidate['filename'] in baseline
          assert candidate['sha256'] == baseline[candidate['filename']]['sha256']
          assert candidate['filename'].endswith('.whl')
          source = receipt['source']
          assert source and 'scripts/release_module.py' in source
          for relative, digest in source.items():
              path = pathlib.Path(relative)
              assert not path.is_absolute() and '..' not in path.parts
              assert hashlib.sha256(path.read_bytes()).hexdigest() == digest
          junit = pathlib.Path(os.environ['RUNNER_TEMP'], 'candidate-closure.xml')
          fixed_protocol = os.environ['MODULE'] == 'dotmac-fulfillment' and os.environ['VERSION'] == '0.1.0a2'
          if fixed_protocol:
              assert junit.is_file() and not junit.is_symlink()
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          assert git('rev-parse', 'HEAD') == os.environ['GITHUB_SHA']
          packet = {'schema_version': 1, 'kind': 'candidate_qualification_observation',
                    'publication_authority': False, 'admission_authority': False,
                    'head': git('rev-parse', 'HEAD'), 'tree': git('rev-parse', 'HEAD^{tree}'),
                    'parents': git('show', '-s', '--format=%P', 'HEAD').split(),
                    'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                    'module': os.environ['MODULE'], 'version': os.environ['VERSION'],
                    'candidate': candidate, 'original_artifacts': baseline,
                    'receipt': {'bytes': len(receipt_bytes), 'sha256': hashlib.sha256(receipt_bytes).hexdigest()},
                    'genuine_regression_protocol': {'required_cases': 7} if fixed_protocol else None}
          if junit.is_file():
              data = junit.read_bytes()
              packet['junit'] = {'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()}
          pathlib.Path(os.environ['RUNNER_TEMP'], 'candidate-qualification-packet.json').write_text(json.dumps(packet, sort_keys=True, indent=2) + '\n')
          PYCODE

      - name: Retain candidate qualification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.module }}-candidate-qualification
          path: |
            ${{ runner.temp }}/candidate-original-artifacts.json
            ${{ runner.temp }}/candidate-qualification-packet.json
            ${{ runner.temp }}/candidate-qualified/CandidateQualification.v1.json
            ${{ runner.temp }}/candidate-closure.xml
          if-no-files-found: error
          retention-days: 30

      - name: Recheck build-once bytes and current main before publication
        run: |
          python - <<'PYCODE'
          import hashlib, json, os, pathlib
          root = pathlib.Path('dist')
          expected = json.loads(pathlib.Path(os.environ['CANDIDATE_BASELINE']).read_bytes())
          paths = sorted(root.iterdir())
          assert paths and all(p.is_file() and not p.is_symlink() for p in paths)
          actual = {p.name: {'bytes': p.stat().st_size, 'sha256': hashlib.sha256(p.read_bytes()).hexdigest()} for p in paths}
          assert actual == expected
          PYCODE
          bash scripts/assert_current_main.sh "${GITHUB_SHA}"

      # Publish the SAME bytes `build` inspected and smoked — downloaded, never
      # rebuilt.
      - name: Publish to the Forgejo private index
        env:
          TWINE_USERNAME: ci-publisher
          TWINE_PASSWORD: ${{ secrets.FORGEJO_PUBLISH_TOKEN }}
        run: |
          python -m pip install --quiet twine
          python -m twine upload \
            --repository-url "https://registry.dotmac.io/api/packages/dotmac/pypi" dist/*

  verify:
    needs: [build, publish]
    runs-on: ubuntu-latest
    environment: registry-release
    permissions:
      contents: write                # create the post-verification tag
    env:
      MODULE: ${{ inputs.module }}
      VERSION: ${{ inputs.version }}
      TAG: ${{ needs.build.outputs.tag }}
      PACKAGE_DIR: ${{ needs.build.outputs.package_dir }}
      RUN_ID: ${{ github.run_id }}
      COMPOSE_WITH: ${{ inputs.compose_with }}
      COMPOSE_KERNEL: ${{ inputs.compose_kernel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # `runner.temp` is only available in step/job `run:` context, never in
      # `jobs.<id>.env:` — the `runner` context is not available
      # there and GitHub refuses the workflow. Resolve it once, in the first step, into `GITHUB_ENV` so every
      # later step in this job sees the same `ARTIFACT_DIR`.
      - name: Resolve the shared artifact directory
        run: |
          echo "ARTIFACT_DIR=${RUNNER_TEMP}/module-release-dist" >> "$GITHUB_ENV"
          echo "SMOKE_MANIFEST=${RUNNER_TEMP}/smoke-dependencies/smoke-dependencies.json" >> "$GITHUB_ENV"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Carry the exact build-once bytes into the verification/record job. The
      # recorder hashes this wheel after the annotated tag exists; it never
      # rebuilds a release or predicts a digest from source.
      - name: Download exact built bytes for the publication record
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.module }}-dist
          path: ${{ runner.temp }}/module-release-dist

      - name: Download the smoke dependency manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.module }}-smoke-dependencies
          path: ${{ runner.temp }}/smoke-dependencies

      # The index may lag a few seconds after publish.
      - name: Wait for the release on the Forgejo index
        env:
          IDX: https://ci-publisher:${{ secrets.FORGEJO_PUBLISH_TOKEN }}@registry.dotmac.io/api/packages/dotmac/pypi/simple/${{ inputs.module }}/
        run: |
          for i in $(seq 1 30); do
            if INDEX_PAGE="$(curl -sf "$IDX")" \
              && grep -q "$VERSION" <<<"${INDEX_PAGE}"; then
              echo "available on the Forgejo index"; exit 0
            fi
            echo "not yet on the Forgejo index (attempt $i)…"; sleep 10
          done
          echo "::error::$MODULE $VERSION did not appear in time"
          exit 1

      # A successful registry installation does not prove that its wheel is
      # the build-once wheel retained for this run. Compare every published
      # artifact byte-for-byte before the immutable tag or record can exist.
      - name: Prove published bytes match the retained build artifact
        env:
          INDEX: https://ci-publisher:${{ secrets.FORGEJO_PUBLISH_TOKEN }}@registry.dotmac.io/api/packages/dotmac/pypi/simple
        run: |
          python scripts/release_module.py compare-published "$MODULE" \
            --version "$VERSION" \
            --index "${INDEX}" \
            --dist "${ARTIFACT_DIR}"

      # Install the PUBLISHED release from the index into a clean venv and
      # register it with its required dependency closure. Requires the kernel at `kernel_floor` to already be
      # published — an earlier kernel raises UnallocatedNamespaceError, which is
      # why the kernel release always precedes a module release.
      - name: Bootstrap the hash-locked release verifier
        run: |
          verifier="$(mktemp -d "${RUNNER_TEMP}/release-verifier.XXXXXX")"
          python -m venv "$verifier"
          "$verifier/bin/python" -m pip install --disable-pip-version-check \
            --require-hashes --only-binary=:all: \
            -r .github/bootstrap/release-verifier-requirements-py312.txt
          echo "$verifier/bin" >> "$GITHUB_PATH"

      - name: Install from the Forgejo registry and verify
        env:
          INDEX: https://ci-publisher:${{ secrets.FORGEJO_PUBLISH_TOKEN }}@registry.dotmac.io/api/packages/dotmac/pypi/simple
        run: |
          python scripts/release_module.py verify-registry \
            --index "${INDEX}" \
            --pin "${MODULE}==${VERSION}"

      # LEVEL 2 — composition, when this release completes a set.
      #
      # Level 1 above proves this module installs and registers with its required dependency closure. That is
      # not the question a consuming assembly asks: it installs every module
      # beside ONE kernel and registers them together. ModuleRegistry validates
      # identities, dependencies and contracts, and delegates the stateful set
      # to NamespaceRegistry for distinct schemas, prefixes, branch labels and
      # tables. Two modules that each pass with their required dependency closure can still collide.
      #
      # Runs BEFORE the tag, deliberately. The module is already published by
      # this point and a composition failure cannot unpublish it — but the tag
      # is this repository's assertion that the release is good, and it should
      # not be written for a version whose set does not compose. The honest
      # intermediate state is "published, verified with required dependency closure, composition failed",
      # and a bad SET is repaired by a NEW release, never by mutating a
      # published one.
      #
      # Skipped when `compose_with` is empty, which is correct for the first
      # module of a set: there is nothing published to compose with yet, and a
      # composition check against one module is just level 1 again.
      - name: Verify the published composition
        if: inputs.compose_with != ''
        env:
          INDEX: https://ci-publisher:${{ secrets.FORGEJO_PUBLISH_TOKEN }}@registry.dotmac.io/api/packages/dotmac/pypi/simple
        run: |
          if [ -z "${COMPOSE_KERNEL}" ]; then
            echo "::error::compose_with is set but compose_kernel is empty — the"
            echo "::error::composition must pin an EXACT published kernel, or it"
            echo "::error::proves the set against whatever pip happens to resolve."
            exit 1
          fi
          ARGS=""
          for pin in ${COMPOSE_WITH}; do ARGS="${ARGS} --pin ${pin}"; done
          python scripts/release_module.py verify-registry \
            --index "${INDEX}" \
            --kernel "${COMPOSE_KERNEL}" \
            --pin "${MODULE}==${VERSION}" ${ARGS}

      # Only AFTER registry verification: tag the published SHA. The tag
      # message is canonical `ModuleReleaseTagEvidence.v1` evidence, computed
      # from the SAME retained artifact directory `compare-published` just
      # verified — never a free-text NOTE. Fail-closed: refuses an existing
      # tag rather than force/recreate.
      - name: Tag the verified release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python scripts/tag_module_release.py \
            --distribution "$MODULE" \
            --version "$VERSION" \
            --tag "$TAG" \
            --commit "${GITHUB_SHA}" \
            --artifact-dir "${ARTIFACT_DIR}" \
            --run-id "$RUN_ID" \
            --source-run-id "$RUN_ID" \
            --smoke-dependencies "${SMOKE_MANIFEST}" \
            --remote origin

      # The tag makes the publication-ledger row false THE MOMENT it lands, and
      # any released migration becomes bytes that must not change. The exact
      # verified wheel and annotated tag also need a producer-owned immutable
      # coordinate row. Five gates fail from that instant until the record is
      # written. Leaving that to
      # memory put `main` red four times in two days, so the record PR is
      # opened HERE rather than remembered. `if: always()` is deliberate: the
      # tag is pushed by the step above, so a later failure must not leave a
      # tag with no record — the exact state this exists to prevent.
      - name: Mint the narrow release-recorder App token
        id: recorder-token
        if: always()
        uses: ./.github/actions/release-recorder-token
        with:
          client-id: ${{ vars.RELEASE_RECORDER_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_RECORDER_PRIVATE_KEY }}

      - name: Open the post-release record
        if: always()
        env:
          GH_TOKEN: ${{ steps.recorder-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/open_release_record_pr.sh \
            --distribution "$MODULE" \
            --version "$VERSION" \
            --tag "$TAG" \
            --package-dir "$PACKAGE_DIR" \
            --artifact-dir "${ARTIFACT_DIR}" \
            --expected-run-id "$RUN_ID" \
            --expected-commit "${GITHUB_SHA}"
