# Lane 3 — the EXPOSURE rehearsal, and the oracle publication now depends on.
#
# Lane 2 (`deployment-rehearsal.yml`) proves a real engine, database, ingress
# handoff, restore and observability loop on a disposable runner. It is a real
# proof of a different thing: it never watches an IPv6 socket refuse the
# internet, which is the property `0.3.0a1` is named after. `require_rehearsal.py`
# therefore reads THIS workflow, not that one.
#
# Two things make this lane different from Lane 2, and both are deliberate:
#
#   * it cannot run on a GitHub-hosted runner. The lane exists to observe real
#     sockets, real `docker-proxy` processes and real firewall chains on a
#     leased host, probed from a separately qualified external vantage. A
#     runner that IS the host cannot tell a loopback bind from a routable one.
#   * it emits a `RehearsalReceipt.v1` artifact. The run's conclusion says a job
#     exited zero; the receipt says WHAT it established. Publication needs both,
#     because a green run whose receipt is full of `blocked` rows is exactly the
#     shape a single oracle misses.
#
# Every input is required and none has a default. A rehearsal missing one is
# not a partial rehearsal, it is a different activity.
name: Exposure rehearsal (Lane 3)
defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

on:
  workflow_dispatch:
    inputs:
      authorization_run:
        description: "Platform CP authorization run id (the lease references it)"
        required: true
      # An authorization document-digest input WAS here and is deliberately gone.
      #
      # It was free text that nothing could check: the runner never imported
      # `provenance.py` or `authorization.py`, built no `ExecutionGrant`, and
      # `build_receipt` only asserted the digest equalled the descriptor digest —
      # a value any caller computes locally from a file in this repository. So a
      # fabricated run id and a computed digest drove this lane green with no
      # authorization in existence, which is exactly what "Foundation cannot
      # self-authorize" forbids.
      #
      # The signed DOCUMENT replaces it, and it is not a dispatch field either:
      # it is resolved on the control runner beside the controller key, the same
      # way `--controller-key` already is, so no dispatcher can hand the lane its
      # own proof. Nothing can issue one yet — the runner reports `unanswerable`
      # and exits 2 naming every precondition (`scripts/lane3_authorization.py`).
      facility:
        description: >-
          Which allowlisted universal facility supplies the rehearsal engine.
          The candidate receipt, not this input, supplies artifact coordinates.
        required: true
        type: choice
        options:
          - dotmac-deployment-foundation
      # EXACTLY what `ssh-keygen -lf <pub>` prints as its second field:
      # `SHA256:` and 43 characters of unpadded base64. The runner parses it
      # before it opens the descriptor and refuses anything else as
      # `precondition_unfit`, with the host untouched — a hexadecimal digest is
      # a different kind of value and is not accepted here.
      controller_identity:
        description: "controller key fingerprint, as `ssh-keygen -lf` prints it"
        required: true
      # The Fleet host_id, and ONLY that: the address, the Proxmox SLOT the
      # release binds (`node/vmid`) and every vantage come from the private
      # vantage-topology record, bound by this id (docs/LANE3_EXECUTION_TOPOLOGY.md
      # section 4). A dispatch can no longer type an address or a slot. Required
      # and undefaulted: a default would hardcode which machine this lane may
      # release.
      host_id:
        description: "the Fleet host_id of the leased rehearsal target"
        required: true
      candidate_version:
        description: "the Foundation candidate version under test"
        required: true

permissions:
  contents: read
  # The releasing principal is the AUTHENTICATED workload, read from an identity
  # token this job requests for itself. Without this the runner cannot prove who
  # closed the lease, writes no release, and the host stays held — which is the
  # designed outcome rather than a failure to route around.
  id-token: write

concurrency:
  # One exposure rehearsal per commit, and NEVER cancelled in flight. This lane
  # rewrites shared firewall chains and holds a host lease; a cancelled run
  # would skip its rollback and leave both in an unreviewed state.
  group: exposure-rehearsal-${{ github.sha }}
  cancel-in-progress: false

jobs:
  # Refuse before anything targets the self-hosted label.
  #
  # An unmatched `runs-on` label does not fail a job — it QUEUES it, for up to
  # 24 hours. `dotmac-control-runner` is registered nowhere yet, so today this
  # lane's observable behaviour on dispatch is an indefinite hang that looks
  # identical to "a rehearsal is already running". This job runs on a
  # GitHub-HOSTED runner precisely so the check cannot be blocked by the
  # absence it is checking for, and `rehearse` needs it.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Can this SOURCE produce a Lane 3 rehearsal receipt at all?
      #
      # `foundation-candidate.yml` already runs this exact check before it will
      # build a candidate; this lane executes the candidate and had never asked
      # the same question of its own source. It runs BEFORE the control runner
      # is even queried, for the same reason `foundation-candidate.yml` runs it
      # before the version binding, the facility resolve and the build: refusing
      # after querying a runner would spend a runner-availability check — and
      # here, a held host lease — on a revision that was never eligible to
      # rehearse in the first place. Stdlib only; no dependencies needed, which
      # is why it can run in `preflight` before any Foundation package exists.
      #
      # The check itself lives in `scripts/lane3_rehearse.sh preflight`
      # (D-S2c C1), so it is asserted on the script and outlives this file.
      - name: Refuse a source whose runner cannot produce a rehearsal receipt
        run: |
          bash scripts/lane3_rehearse.sh preflight

      # Preserved whatever the verdict, because a refusal is the more useful
      # record of the two: it names which reasons blocked this revision, and the
      # next attempt is measured against it rather than against a recollection.
      - name: Upload the capability record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lane3-runner-capability
          path: lane3-runner-capability.json
          retention-days: 90
          # `error`, matching every other upload in this lane. The record is
          # written before the script exits on either verdict, so an absent file
          # means the step did not run to completion — and a missing capability
          # record must not pass quietly, which is the whole failure this gate
          # exists to end.
          if-no-files-found: error

      # RUNNER_QUERY_TOKEN needs `administration: read`, which a workflow
      # `permissions:` block cannot grant — the job token is structurally unable
      # to list runners. The script REFUSES when the secret is absent rather
      # than skipping, because "could not determine" is not "available".
      - name: Refuse if the control runner is absent, offline or busy
        env:
          RUNNER_QUERY_TOKEN: ${{ secrets.RUNNER_QUERY_TOKEN }}
        run: |
          python scripts/require_runner.py \
            --repository "${GITHUB_REPOSITORY}" \
            --label self-hosted \
            --label dotmac-control-runner

  rehearse:
    needs: preflight
    # Self-hosted, and specifically the registered control runner: the
    # controller identity is bound to the authorization run and lives there, so
    # a rehearsal driven from anywhere else is driven by a different actor than
    # the one the receipt names.
    runs-on: [self-hosted, dotmac-control-runner]
    # Defence in depth on main's own copy, not an access control: a branch can
    # dispatch a modified copy of this file, which is why Lane 3 moves to an
    # organization runner group restricted to one ref-pinned workflow
    # (docs/LANE3_EXECUTION_TOPOLOGY.md).
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Every rehearsal step is `scripts/lane3_rehearse.sh rehearse` (D-S2c C1):
      # resolve, fetch and verify the recorded candidate, install it isolated
      # (`-E -P`), ask the authorization gate, qualify the external vantage,
      # then drive the runner. Its order and content are asserted on the
      # script, so the org launcher (C3) inherits them by calling it rather
      # than by copying this file.
      #
      # Inputs reach the script as ENVIRONMENT VARIABLES only. Interpolating a
      # dispatch value into a `run:` body makes it shell; as an env value it is
      # only ever data.
      - name: Rehearse Lane 3 through the Starter-owned script
        env:
          GH_TOKEN: ${{ secrets.CANDIDATE_SOURCE_TOKEN || github.token }}
          LANE3_FACILITY: ${{ inputs.facility }}
          LANE3_CANDIDATE_VERSION: ${{ inputs.candidate_version }}
          LANE3_AUTHORIZATION_RUN: ${{ inputs.authorization_run }}
          LANE3_CONTROLLER_IDENTITY: ${{ inputs.controller_identity }}
          LANE3_HOST_ID: ${{ inputs.host_id }}
          LANE3_JUMP_KEY: ${{ vars.LANE3_JUMP_KEY }}
          LANE3_OBSERVER_KEY: ${{ vars.LANE3_OBSERVER_KEY }}
        run: |
          bash scripts/lane3_rehearse.sh rehearse

      # `if: always()` so a FAILED rehearsal still publishes its receipt. A
      # failure that records nothing is indistinguishable from a run that never
      # happened, and the next person re-runs instead of reading why.
      - name: Publish the receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lane3-rehearsal-receipt
          path: |
            receipt.json
            probe-evidence.json
            docs/inventories/deployment-exposure-rehearsal-status.md
          if-no-files-found: error

      # A SECOND artifact, and its own step, because the terminal record must
      # reach the store on runs where NO receipt exists. The step above lists
      # `receipt.json` under `if-no-files-found: error`; folding these paths into
      # it would tie the record of a refusal to the presence of a receipt, and a
      # refused run is precisely the case where there is none.
      #
      # `warn`, not `error`, and the difference is the whole point of this lane's
      # terminal contract: absence here means the process died before it could
      # say anything, the lease is still HELD, and turning that into a second red
      # step would replace the real signal with a different one.
      - name: Publish the terminal lease record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lane3-terminal-release
          path: |
            lane3-lease-release.json
            lane3-terminal-evidence.json
          if-no-files-found: warn
