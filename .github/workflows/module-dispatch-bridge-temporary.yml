name: Temporary module dispatch bridge
run-name: Temporary module dispatch bridge (request in source)
on:
  push:
    branches:
      - 'chore/module-release-dispatch-*'
permissions: {}
concurrency:
  group: temporary-module-release-dispatch-bridge
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
      checks: read
      statuses: read
    outputs:
      dispatch: ${{ steps.preflight.outputs.dispatch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Source syntax and offline hosted guard canaries (includes RED sensitivity)
        run: |
          python -m py_compile scripts/module_dispatch_bridge_temporary.py tests/dispatch_bridge_temporary/test_bridge.py
          python -m unittest discover -s tests/dispatch_bridge_temporary -p 'test_*.py' -v
      - name: Evaluate committed fixed-path request
        id: preflight
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/module_dispatch_bridge_temporary.py
  dispatch:
    needs: preflight
    if: needs.preflight.outputs.dispatch == 'true' && github.run_attempt == 1
    runs-on: ubuntu-22.04
    permissions:
      actions: write
      contents: read
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Repeat live guards and submit exactly one protected-main release dispatch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/module_dispatch_bridge_temporary.py --dispatch
