name: Draft README for review
on:
  workflow_run:
    workflows: [CI]
    types: [requested]
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: readme-draft-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false
jobs:
  draft:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # workflow_run checks out trusted default-branch code only. PR source
      # is read as API data and is never checked out, imported or executed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Draft README on eligible same-repository PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.draft_readme_update
