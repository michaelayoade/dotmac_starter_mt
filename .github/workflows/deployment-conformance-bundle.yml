name: Deployment conformance from a verified bundle
defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

# Additive secret-free successor to deployment-conformance.yml. It preserves
# descriptor and image checks while replacing both private-index installs with
# the immutable Starter verified-bundle action. The calling product owns the
# plan coordinates and must prove they derive from its actual dependency
# manifest; this workflow checks their exact foundation wheel/version shape. Until
# both current callers repin, the old and new workflow copies coexist as named
# transition debt, not as two permanent owners. No credential is accepted here.

on:
  workflow_call:
    inputs:
      descriptor:
        description: Path to the product's ProductDeploymentSpec.v1 descriptor.
        required: false
        type: string
        default: deploy/product.toml
      rendered-dir:
        description: Directory holding the committed rendered deployment assets.
        required: false
        type: string
        default: deploy/rendered
      thresholds:
        description: >-
          JSON file supplying the product's alert thresholds. Thresholds live in
          the deployment, never in the process: "how late is too late" is a
          deployment's decision, and a number compiled into the code would fork
          from the rule that fires on it.
        required: false
        type: string
        default: deploy/alerts/thresholds.json
      foundation-version:
        description: >-
          The EXACT released dotmac-deployment-foundation version this product
          pins. A range is refused: a conformance gate that resolves to
          "whatever is newest" cannot tell a product that drifted from a
          foundation that changed.
        required: true
        type: string
      bundle-plan-digest:
        description: >-
          Product-owned dependency plan digest. This workflow cannot prove how
          the caller derived it from its dependency manifest.
        required: true
        type: string
      bundle-wheel-filename:
        required: true
        type: string
      bundle-wheel-sha256:
        required: true
        type: string
      bundle-run-id:
        required: true
        type: number
      bundle-archive-artifact-id:
        required: true
        type: number
      bundle-sidecar-artifact-id:
        required: true
        type: number
      bundle-producer-workflow-path:
        required: true
        type: string
      bundle-archive-artifact-name:
        required: true
        type: string
      bundle-sidecar-artifact-name:
        required: true
        type: string
      python-version:
        required: false
        type: string
        default: "3.12"
      strict-image-audit:
        description: >-
          Fail when the image audit cannot be performed. Off by default because
          a pull-request build has no built image yet; the release lane turns it
          on, where the image exists and skipping would be a hole.
        required: false
        type: boolean
        default: false
      require-real-digests:
        description: >-
          Keep the aggregate conformance check's placeholder-digest findings.
          On by default: an all-zeros digest PARSES (it satisfies spec.py's
          sha256-shape pattern) but is not a real digest. False removes only
          findings returned by check_no_placeholder_digests, for a
          deliberately-not-yet-real reference descriptor; every other
          conformance finding still fails. Never turn it off for a release
          gate.
        required: false
        type: boolean
        default: true
permissions:
  contents: read
  actions: read

jobs:
  descriptor:
    name: Deployment descriptor conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Refuse a non-exact foundation pin
        shell: bash --noprofile --norc -eo pipefail {0}
        env:
          FOUNDATION_VERSION: ${{ inputs.foundation-version }}
        run: |
          set -euo pipefail
          version="$FOUNDATION_VERSION"
          # A release is identified by an exact version, never a range. The
          # rule is the one AGENTS.md rule 30 states for every other release
          # claim: a coordinate, or it is not evidence.
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([ab][0-9]+)?$'; then
            echo "::error::foundation-version '$version' is not an exact version." >&2
            echo "A conformance gate pinned to a range cannot distinguish a product" >&2
            echo "that drifted from a foundation that changed." >&2
            exit 2
          fi
          echo "pinned to dotmac-deployment-foundation==$version"

      - name: Materialize the one-wheel expected artifact set
        id: expected
        env:
          FOUNDATION_VERSION: ${{ inputs.foundation-version }}
          PLAN_DIGEST: ${{ inputs.bundle-plan-digest }}
          WHEEL_FILENAME: ${{ inputs.bundle-wheel-filename }}
          WHEEL_SHA256: ${{ inputs.bundle-wheel-sha256 }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          version = os.environ["FOUNDATION_VERSION"]
          plan_digest = os.environ["PLAN_DIGEST"]
          filename = os.environ["WHEEL_FILENAME"]
          wheel_sha256 = os.environ["WHEEL_SHA256"]
          if re.fullmatch(r"[0-9a-f]{64}", plan_digest) is None:
              raise SystemExit("bundle plan digest is not canonical sha256")
          if re.fullmatch(r"[0-9a-f]{64}", wheel_sha256) is None:
              raise SystemExit("foundation wheel digest is not canonical sha256")
          wheel = re.fullmatch(
              rf"dotmac_deployment_foundation-{re.escape(version)}-[^-]+-[^-]+-[^-]+[.]whl",
              filename,
          )
          if wheel is None:
              raise SystemExit("wheel filename does not bind the exact foundation version")
          expected = {
              "schema_version": 1,
              "plan_digest": plan_digest,
              "artifacts": [{
                  "package_normalised_name": "dotmac-deployment-foundation",
                  "filename": filename,
                  "sha256": wheel_sha256,
              }],
          }
          output = Path(os.environ["RUNNER_TEMP"]) / "foundation-expected.json"
          output.write_text(json.dumps(expected, sort_keys=True, separators=(",", ":")) + "\n")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"path={output}\n")
          PY

      - name: Verify the foundation bundle and build an offline index
        id: bundle
        uses: michaelayoade/dotmac_starter_mt/.github/actions/verified-dependency-bundle@7ec614c7b8051e7d399d80381ffdb6344d50dbc6
        with:
          operation: verify-and-index
          expected-file: ${{ steps.expected.outputs.path }}
          producer-repository: ${{ github.repository }}
          producer-repository-id: ${{ github.repository_id }}
          producer-workflow-path: ${{ inputs.bundle-producer-workflow-path }}
          archive-artifact-name: ${{ inputs.bundle-archive-artifact-name }}
          sidecar-artifact-name: ${{ inputs.bundle-sidecar-artifact-name }}
          archive-artifact-id: ${{ inputs.bundle-archive-artifact-id }}
          run-id: ${{ inputs.bundle-run-id }}
          sidecar-artifact-id: ${{ inputs.bundle-sidecar-artifact-id }}
          github-token: ${{ github.token }}

      - name: Install the pinned foundation from the verified offline index
        env:
          FOUNDATION_VERSION: ${{ inputs.foundation-version }}
          BUNDLE_INDEX_ROOT: ${{ steps.bundle.outputs.index-root }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-index --no-deps \
            --find-links "$BUNDLE_INDEX_ROOT/simple/dotmac-deployment-foundation" \
            "dotmac-deployment-foundation==$FOUNDATION_VERSION"

      - name: Check out the evaluated product revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the descriptor
        shell: bash --noprofile --norc -eo pipefail {0}
        env:
          DESCRIPTOR: ${{ inputs.descriptor }}
        run: dotmac-deploy -f "$DESCRIPTOR" validate

      # The parse succeeding is necessary, not sufficient. `check_all` runs
      # every descriptor-level CONFORMANCE rule — liveness/readiness
      # separation, credential separation, digest pinning, no duplicate log
      # shipping, justified security exceptions — the actual gate this
      # workflow exists to be, not merely a demonstration that the TOML is
      # well-formed. `check_all` returns a LIST rather than raising
      # specifically so every finding is reported together, in one review
      # cycle rather than five.
      - name: Run the descriptor conformance checks
        shell: bash --noprofile --norc -eo pipefail {0}
        env:
          DESCRIPTOR: ${{ inputs.descriptor }}
          REQUIRE_REAL_DIGESTS: ${{ inputs.require-real-digests }}
        run: |
          python <<'PY'
          import os
          import sys

          from dotmac_deployment_foundation.conformance import (
              check_all,
              check_no_placeholder_digests,
          )
          from dotmac_deployment_foundation.spec import ProductDeploymentSpec

          spec = ProductDeploymentSpec.load(os.environ["DESCRIPTOR"])
          problems = check_all(spec)
          require_real_digests = os.environ["REQUIRE_REAL_DIGESTS"].lower()
          if require_real_digests not in {"true", "false"}:
              print(
                  "::error::REQUIRE_REAL_DIGESTS must be the workflow boolean "
                  f"true or false, got {require_real_digests!r}"
              )
              sys.exit(2)
          if require_real_digests == "false":
              # Remove only the findings from the dedicated placeholder check.
              # Calling the same function rather than matching prose keeps every
              # other aggregate finding load-bearing if its wording changes.
              for permitted in check_no_placeholder_digests(spec):
                  problems.remove(permitted)
          if problems:
              print("::error::deployment conformance checks failed:")
              for problem in problems:
                  print(f"::error::  - {problem}")
              sys.exit(1)
          print(f"{len(problems)} conformance findings — all checks passed")
          PY

      - name: The rendered assets match the descriptor
        shell: bash --noprofile --norc -eo pipefail {0}
        env:
          DESCRIPTOR: ${{ inputs.descriptor }}
          RENDERED_DIR: ${{ inputs.rendered-dir }}
          THRESHOLDS: ${{ inputs.thresholds }}
        run: |
          set -euo pipefail
          args=(-f "$DESCRIPTOR" render --check -o "$RENDERED_DIR")
          if [ -f "$THRESHOLDS" ]; then
            args+=(--thresholds "$THRESHOLDS")
          else
            echo "::notice::no thresholds file at $THRESHOLDS"
          fi
          dotmac-deploy "${args[@]}"

      # The renderer emits TEXT. Nothing in the foundation's own test suite can
      # say whether an engine will load that text — a unit test asserting a
      # rendered key proves the key is present, never that the document is
      # valid. That gap shipped a real defect: `pids_limit` was emitted beside
      # a `deploy.resources.limits` block listing only cpus and memory, and
      # because the two keys are ALIASES, Compose rejected every project with
      #   can't set distinct values on 'pids_limit' and
      #   'deploy.resources.limits.pids'
      # It was caught by the first disposable-host rehearsal, 45 minutes in.
      # This asks the engine the same question in about a second.
      #
      # `config` parses, interpolates and validates WITHOUT starting anything —
      # no image is pulled, no container runs, no network is created. The
      # descriptor's runtime variables are supplied as obvious placeholders
      # because interpolation fails closed on an unset variable, and an
      # interpolation error would mask the structural verdict this step exists
      # for. Placeholder VALUES cannot leak anything: real values never appear
      # in a rendered asset (that is what `secrets_guard` enforces), and these
      # are literally the string "conformance-placeholder".
      - name: The rendered compose file is valid to a real engine
        shell: bash --noprofile --norc -eo pipefail {0}
        env:
          RENDERED_DIR: ${{ inputs.rendered-dir }}
        run: |
          set -euo pipefail
          compose="$RENDERED_DIR/docker-compose.yml"
          if [ ! -f "${compose}" ]; then
            echo "::error::no rendered compose file at ${compose}"
            exit 1
          fi
          env_args=()
          while read -r name; do
            [ -n "${name}" ] || continue
            env_args+=("${name}=conformance-placeholder")
          done < <(grep -oE '\$\{[A-Z_][A-Z0-9_]*' "${compose}" | sed 's/\${//' | sort -u)
          echo "interpolating ${#env_args[@]} runtime variable(s) with placeholders"
          env "${env_args[@]}" docker compose -f "${compose}" config >/dev/null
          echo "the engine accepts the rendered project"

      - name: Show the deployment plan
        # Not a gate — a reviewer artefact. The plan draws the boundary between
        # the steps that mutate nothing and the steps that can change the world,
        # which is the one fact somebody authorising a run needs first.
        shell: bash --noprofile --norc -eo pipefail {0}
        env:
          DESCRIPTOR: ${{ inputs.descriptor }}
        run: dotmac-deploy -f "$DESCRIPTOR" plan

      - name: Show the gates that run before any mutation
        shell: bash --noprofile --norc -eo pipefail {0}
        env:
          DESCRIPTOR: ${{ inputs.descriptor }}
        run: dotmac-deploy -f "$DESCRIPTOR" preflight

      - name: Show the backup policy and what verification means
        shell: bash --noprofile --norc -eo pipefail {0}
        env:
          DESCRIPTOR: ${{ inputs.descriptor }}
        run: dotmac-deploy -f "$DESCRIPTOR" backup

  image:
    name: Hardened image contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: descriptor
    steps:
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Materialize the one-wheel expected artifact set
        id: expected
        env:
          FOUNDATION_VERSION: ${{ inputs.foundation-version }}
          PLAN_DIGEST: ${{ inputs.bundle-plan-digest }}
          WHEEL_FILENAME: ${{ inputs.bundle-wheel-filename }}
          WHEEL_SHA256: ${{ inputs.bundle-wheel-sha256 }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          version = os.environ["FOUNDATION_VERSION"]
          plan_digest = os.environ["PLAN_DIGEST"]
          filename = os.environ["WHEEL_FILENAME"]
          wheel_sha256 = os.environ["WHEEL_SHA256"]
          if re.fullmatch(r"[0-9a-f]{64}", plan_digest) is None:
              raise SystemExit("bundle plan digest is not canonical sha256")
          if re.fullmatch(r"[0-9a-f]{64}", wheel_sha256) is None:
              raise SystemExit("foundation wheel digest is not canonical sha256")
          wheel = re.fullmatch(
              rf"dotmac_deployment_foundation-{re.escape(version)}-[^-]+-[^-]+-[^-]+[.]whl",
              filename,
          )
          if wheel is None:
              raise SystemExit("wheel filename does not bind the exact foundation version")
          expected = {
              "schema_version": 1,
              "plan_digest": plan_digest,
              "artifacts": [{
                  "package_normalised_name": "dotmac-deployment-foundation",
                  "filename": filename,
                  "sha256": wheel_sha256,
              }],
          }
          output = Path(os.environ["RUNNER_TEMP"]) / "foundation-expected.json"
          output.write_text(json.dumps(expected, sort_keys=True, separators=(",", ":")) + "\n")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"path={output}\n")
          PY

      - name: Verify the foundation bundle and build an offline index
        id: bundle
        uses: michaelayoade/dotmac_starter_mt/.github/actions/verified-dependency-bundle@7ec614c7b8051e7d399d80381ffdb6344d50dbc6
        with:
          operation: verify-and-index
          expected-file: ${{ steps.expected.outputs.path }}
          producer-repository: ${{ github.repository }}
          producer-repository-id: ${{ github.repository_id }}
          producer-workflow-path: ${{ inputs.bundle-producer-workflow-path }}
          archive-artifact-name: ${{ inputs.bundle-archive-artifact-name }}
          sidecar-artifact-name: ${{ inputs.bundle-sidecar-artifact-name }}
          archive-artifact-id: ${{ inputs.bundle-archive-artifact-id }}
          run-id: ${{ inputs.bundle-run-id }}
          sidecar-artifact-id: ${{ inputs.bundle-sidecar-artifact-id }}
          github-token: ${{ github.token }}

      - name: Install the pinned foundation from the verified offline index
        env:
          FOUNDATION_VERSION: ${{ inputs.foundation-version }}
          BUNDLE_INDEX_ROOT: ${{ steps.bundle.outputs.index-root }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-index --no-deps \
            --find-links "$BUNDLE_INDEX_ROOT/simple/dotmac-deployment-foundation" \
            "dotmac-deployment-foundation==$FOUNDATION_VERSION"

      - name: Check out the evaluated product revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit the image the descriptor pins
        shell: bash --noprofile --norc -eo pipefail {0}
        env:
          DESCRIPTOR: ${{ inputs.descriptor }}
          STRICT_IMAGE_AUDIT: ${{ inputs.strict-image-audit }}
        run: |
          set -euo pipefail
          reference="$(python - <<'PY'
          import os
          from dotmac_deployment_foundation.spec import ProductDeploymentSpec
          print(ProductDeploymentSpec.load(os.environ["DESCRIPTOR"]).image)
          PY
          )"
          echo "descriptor pins $reference"
          audit_dir="${RUNNER_TEMP:-/tmp}/dotmac-image-audit"
          mkdir -p "$audit_dir"
          inspect_file="$audit_dir/inspect.json"
          history_file="$audit_dir/history.json"
          layers_file="$audit_dir/layers.txt"

          if ! docker image inspect "$reference" >/dev/null 2>&1; then
            if ! docker pull "$reference" >/dev/null 2>&1; then
              # An unbuilt image on a pull request is the normal case, not a
              # failure. It IS a failure in the release lane, and the flag
              # says which lane this is rather than the check quietly
              # deciding. Whichever way it goes, the outcome must be
              # UNMISTAKABLE: a non-strict skip must never read as a pass —
              # `::warning::` (not `::notice::`, which a quiet green run can
              # bury) on stdout AND a job-summary line, so both the log and
              # the run's summary page say SKIPPED rather than passed.
              if [ "$STRICT_IMAGE_AUDIT" = 'true' ]; then
                echo "::error::the pinned image is not available and strict-image-audit is on" >&2
                exit 1
              fi
              echo "::warning::image audit SKIPPED — the pinned image is not available. This is NOT a pass."
              {
                echo "### :warning: Image audit SKIPPED — NOT a pass"
                echo
                echo "The pinned image \`$reference\` could not be inspected or pulled, and"
                echo "\`strict-image-audit\` is off (the normal pull-request case, where the"
                echo "image has not been built yet). The hardened image contract was NOT"
                echo "checked. The release lane sets \`strict-image-audit: true\`, where the"
                echo "image exists and skipping would be a hole rather than a convenience."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi

          docker image inspect "$reference" > "$inspect_file"
          docker history --no-trunc --format '{{.CreatedBy}}' "$reference" \
            | python -c 'import json,sys; print(json.dumps(sys.stdin.read().splitlines()))' \
            > "$history_file"
          # Filesystem enumeration is INSPECTION, not the runtime security
          # context. Run this one-shot collector as uid/gid 0 so an otherwise
          # compliant image's numeric non-root USER cannot hide root-owned
          # base-image paths. `image-audit` still evaluates Config.User from
          # the inspect evidence and will refuse a root runtime declaration.
          #
          # Do not suppress `find` diagnostics or turn a failed, partial walk
          # into an empty file. An incomplete filesystem inventory is not
          # evidence; fail this gate explicitly and preserve both the partial
          # listing and Docker/find's stderr in the job log for diagnosis.
          if ! docker run --rm --user 0:0 --entrypoint sh "$reference" \
            -c 'find / -xdev -type f' > "$layers_file"; then
            echo "::error::filesystem inspection failed; image audit was not run against partial evidence" >&2
            exit 1
          fi

          dotmac-deploy image-audit "$reference" \
            --inspect "$inspect_file" \
            --history "$history_file" \
            --layers "$layers_file"
