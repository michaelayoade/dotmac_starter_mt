name: Learning qualification records (unqualified)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/learning-qualification-records.yml
      - .github/workflows/release-module.yml
      - .github/workflows/recover-module-release.yml
      - .github/release-modules.json
      - packages/dotmac-learning/pyproject.toml
      - packages/dotmac-fulfillment/pyproject.toml
      - packages/dotmac-template-studio/pyproject.toml

permissions:
  contents: read

jobs:
  generate-unqualified-records:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_PR_HEAD: ${{ github.event.pull_request.head.sha }}
      GIT_NO_LAZY_FETCH: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Run the canonical record owners on the actual checkout
        shell: bash --noprofile --norc -eo pipefail {0}
        run: |
          git merge-base --is-ancestor "$EXPECTED_PR_HEAD" HEAD
          python scripts/release_authority.py write
          python scripts/published_source_drift.py --write-baseline
      - name: Bind the two unqualified records to their source
        shell: bash --noprofile --norc -eo pipefail {0}
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          def git(*args):
              return subprocess.run(('git', *args), check=True, capture_output=True).stdout

          expected = os.environ['EXPECTED_PR_HEAD']
          if re.fullmatch(r'[0-9a-f]{40}', expected) is None:
              raise SystemExit('invalid GitHub head identity')
          paths = (
              'docs/inventories/release-authority.json',
              'tests/architecture/published_source_drift_baseline.json',
          )
          changed = set(git('diff', '--name-only', '--').decode().splitlines())
          if changed - set(paths):
              raise SystemExit('canonical writers changed unexpected paths')
          records = []
          for path in paths:
              before = git('show', 'HEAD:' + path)
              data = Path(path).read_bytes()
              if len(data) > 16384:
                  raise SystemExit('canonical record exceeds review bound')
              json.loads(data)
              records.append({
                  'path': path,
                  'before_sha256': hashlib.sha256(before).hexdigest(),
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'content_base64': base64.b64encode(data).decode('ascii'),
              })
          packet = {
              'schema_version': 1,
              'kind': 'unqualified_learning_qualification_records',
              'pr_head_sha': expected,
              'checkout_sha': git('rev-parse', 'HEAD').decode().strip(),
              'checkout_tree': git('rev-parse', 'HEAD^{tree}').decode().strip(),
              'checkout_parents': git('rev-list', '--parents', '-n', '1', 'HEAD').decode().split()[1:],
              'records': records,
          }
          encoded = json.dumps(packet, ensure_ascii=True, separators=(',', ':'))
          if len(encoded.encode('ascii')) > 49152:
              raise SystemExit('record review packet exceeds bound')
          Path('learning-qualification-records.json').write_text(encoded + '\n')
          print('BEGIN_UNQUALIFIED_LEARNING_RECORDS')
          print(encoded)
          print('END_UNQUALIFIED_LEARNING_RECORDS')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: unqualified-learning-records
          path: |
            docs/inventories/release-authority.json
            tests/architecture/published_source_drift_baseline.json
            learning-qualification-records.json
          if-no-files-found: error
          retention-days: 7

