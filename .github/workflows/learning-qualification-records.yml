name: Learning and Files release records (unqualified)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/learning-qualification-records.yml
      - .github/workflows/release-module.yml
      - .github/workflows/recover-module-release.yml
      - .github/release-modules.json
      - packages/dotmac-learning/pyproject.toml
      - packages/dotmac-fulfillment/pyproject.toml
      - packages/dotmac-template-studio/pyproject.toml

permissions:
  contents: read
  actions: read

jobs:
  generate-combined-records:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_PR_HEAD: ${{ github.event.pull_request.head.sha }}
      EXPECTED_MAIN: '19accb23ee10b16048088b3beb7e374d16ab31b4'
      GIT_NO_LAZY_FETCH: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Resolve isolated artifact directories
        shell: bash --noprofile --norc -eo pipefail {0}
        run: |
          printf 'LEARNING_ARTIFACT_DIR=%s/record-artifacts/learning\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'FILES_ARTIFACT_DIR=%s/record-artifacts/files\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Download the original verified Learning build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: '12134792719'
          run-id: '39123389198'
          github-token: ${{ github.token }}
          path: ${{ env.LEARNING_ARTIFACT_DIR }}
      - name: Download the original verified Files build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: '12136436013'
          run-id: '39126186137'
          github-token: ${{ github.token }}
          path: ${{ env.FILES_ARTIFACT_DIR }}
      - name: Run the canonical record owners on the actual checkout
        shell: bash --noprofile --norc -eo pipefail {0}
        run: |
          git merge-base --is-ancestor "$EXPECTED_PR_HEAD" HEAD
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_MAIN"
          test "$(git rev-parse HEAD^2)" = "$EXPECTED_PR_HEAD"
          python scripts/write_release_record.py \
            --distribution dotmac-learning --version 0.1.0a1 \
            --tag dotmac-learning-v0.1.0a1 --package-dir packages/dotmac-learning \
            --artifact-dir "$LEARNING_ARTIFACT_DIR" --expected-run-id 39123389198 \
            --expected-commit f674acc9e3235ac1b82bc10c37ba021191730a5b
          python scripts/write_release_record.py \
            --distribution dotmac-files --version 0.1.0a6 \
            --tag dotmac-files-v0.1.0a6 --package-dir packages/dotmac-files \
            --artifact-dir "$FILES_ARTIFACT_DIR" --expected-run-id 39126186137 \
            --expected-commit 19accb23ee10b16048088b3beb7e374d16ab31b4
          python scripts/released_lineage_coverage.py --write-baseline
      - name: Bind the five canonical records and compact patches to their source
        shell: bash --noprofile --norc -eo pipefail {0}
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import difflib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          def git(*args):
              return subprocess.run(('git', *args), check=True, capture_output=True).stdout

          expected = os.environ['EXPECTED_PR_HEAD']
          if re.fullmatch(r'[0-9a-f]{40}', expected) is None:
              raise SystemExit('invalid GitHub head identity')
          paths = (
              'docs/inventories/declared-publication-baseline.json',
              'docs/inventories/module-release-verifications.json',
              'tests/architecture/published_source_drift_baseline.json',
              'tests/architecture/released_lineage_coverage_baseline.json',
              'tests/architecture/test_released_migrations.py',
          )
          changed = set(git('diff', '--name-only', '--').decode().splitlines())
          if changed - set(paths):
              raise SystemExit('canonical writers changed unexpected paths')
          records = []
          for path in paths:
              before = git('show', 'HEAD:' + path)
              data = Path(path).read_bytes()
              if len(data) > 1048576:
                  raise SystemExit('canonical record exceeds source bound')
              if not before.endswith(b'\n') or not data.endswith(b'\n'):
                  raise SystemExit('canonical record lacks a final newline')
              if path.endswith('.json'):
                  json.loads(data)
              patch = ''.join(difflib.unified_diff(
                  before.decode().splitlines(keepends=True),
                  data.decode().splitlines(keepends=True),
                  fromfile=path, tofile=path,
              )).encode()
              records.append({
                  'path': path,
                  'before_sha256': hashlib.sha256(before).hexdigest(),
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'bytes': len(data),
                  'git_blob': git('hash-object', '--', path).decode().strip(),
                  'unified_diff_base64': base64.b64encode(patch).decode('ascii'),
              })
          packet = {
              'schema_version': 1,
              'kind': 'unqualified_learning_files_combined_release_records',
              'expected_main': os.environ['EXPECTED_MAIN'],
              'original_verification_runs': ['39123389198', '39126186137'],
              'pr_head_sha': expected,
              'checkout_sha': git('rev-parse', 'HEAD').decode().strip(),
              'checkout_tree': git('rev-parse', 'HEAD^{tree}').decode().strip(),
              'checkout_parents': git('rev-list', '--parents', '-n', '1', 'HEAD').decode().split()[1:],
              'records': records,
          }
          encoded = json.dumps(packet, ensure_ascii=True, separators=(',', ':'))
          if len(encoded.encode('ascii')) > 65536:
              raise SystemExit('record review packet exceeds bound')
          Path('learning-files-records.json').write_text(encoded + '\n')
          print('BEGIN_UNQUALIFIED_COMBINED_RELEASE_RECORDS')
          print(encoded)
          print('END_UNQUALIFIED_COMBINED_RELEASE_RECORDS')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: unqualified-learning-files-records
          path: |
            docs/inventories/declared-publication-baseline.json
            docs/inventories/module-release-verifications.json
            tests/architecture/published_source_drift_baseline.json
            tests/architecture/released_lineage_coverage_baseline.json
            tests/architecture/test_released_migrations.py
            learning-files-records.json
          if-no-files-found: error
          retention-days: 7

