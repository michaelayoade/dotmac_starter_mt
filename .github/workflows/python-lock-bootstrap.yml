name: Python lock proposal bootstrap

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - docs/inventories/python-lock-bootstrap/learning.json
      - .github/workflows/python-lock-bootstrap.yml
      - scripts/python_lock_bootstrap.py
      - tests/unit/test_python_lock_bootstrap.py

permissions:
  contents: read

jobs:
  generate-unqualified-lock:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Bind reviewed input bytes before tool installation
        run: python -m scripts.python_lock_bootstrap --validate
      - uses: ./.github/actions/setup-poetry
      - name: Generate a lock for a subsequent reviewed source commit
        run: python -m scripts.python_lock_bootstrap
      - name: Inspect the bounded unqualified lock artifact
        run: python -m scripts.python_lock_bootstrap --review
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-lock-proposal
          path: |
            python-lock-bootstrap-artifact/poetry.lock
            python-lock-bootstrap-artifact/manifest.json
          if-no-files-found: error
          retention-days: 7
