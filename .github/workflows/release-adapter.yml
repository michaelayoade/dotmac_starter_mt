name: Release adapter

# Publish ONE stateless protocol adapter to the PRIVATE Forgejo index at
# registry.dotmac.io. The same security sequence as `release-kernel.yml`,
# `release-ui.yml` and `release-module.yml` — build once on the exact current
# protected-main SHA -> inspect the bytes -> smoke them -> AWAIT environment
# approval -> re-assert the approved SHA is still main's tip -> publish THOSE
# SAME bytes -> install the published release from the index and verify -> tag
# only then.
#
# WHY A FOURTH LANE, rather than optional fields in `release-module.yml`
#
# ADR-0006's 2026-08-14 amendment added `stateless-protocol-adapter` for a
# distribution a product CALLS rather than installs: no `ModuleManifest`, no
# migration lineage, no `MIGRATION_OWNER_LEDGER` allocation, no persistence
# import. The module lane asserts three facts such a package does not have —
# `db_schema`, `manifest_attr`, `kernel_floor` — and its smoke registers a
# manifest through `NamespaceRegistry`, which there is nothing here to register.
#
# Making those three optional was the cheaper diff and the worse one, because
# optionality is not scoped to the package that needs it: once `db_schema` may
# be absent, a STATEFUL module whose schema was dropped in a bad merge stops
# being refused and starts being treated as an adapter, its namespace assertion
# silently skipped rather than failed. That is the same argument this repository
# already recorded about the kernel — "one workflow pretending to cover both
# would have to weaken whichever check the other cannot satisfy".
#
# So the module lane keeps all three MANDATORY, and this lane declares none of
# them. `scripts/release_adapter.py resolve` REFUSES an entry carrying any of
# them, and refuses any package whose `EXTRACTION.toml` classification is not
# `stateless-protocol-adapter` — so this lane cannot be used to publish a module
# while skipping the module lane's gates.
#
# NO COMPOSITION CHECK, and that is not a gap. The module lane's level 2
# installs a set beside one kernel and constructs a `NamespaceRegistry`, because
# two modules that each register alone can still collide on a schema, a prefix
# or a table. An adapter owns none of those and contests nothing. Its
# verification is the PUBLIC SURFACE proved against the installed bytes: it
# imports from site-packages, reports the released version, every `__all__` name
# resolves, no `ModuleManifest` exists, and importing it pulls in no ORM or
# database driver.
#
# ONE ADAPTER PER RUN, on purpose — the same reasoning as the module lane.
# Releasing two in a single dispatch would read as transactional when it is not.
#
# THE LANE IS CLOSED AND CURRENTLY SHUT. The target is resolved from
# `.github/release-adapters.json`, whose `adapters` object is EMPTY, so a
# dispatch today fails at the gate. `dotmac-auth-oidc` is merged and
# deliberately unlisted: absence is the safety mechanism until the
# `dotmac_workspace` pilot is green (see that file's header, and
# `packages/dotmac-auth-oidc/README.md` for how the pilot tests an EXACT-SHA
# local wheel before anything is published).
#
# `adapter` is a free-text input rather than a `choice` for one reason only: a
# `workflow_dispatch` choice must offer at least one option, and there is
# nothing to offer. The enforced layer was never the input anyway — it is
# `resolve`. `tests/architecture/test_adapter_release_lane.py` requires a
# `choice` list matching the allowlist exactly once the allowlist is non-empty,
# so the first entry cannot land without the UI layer following it.
#
# Credential: `FORGEJO_PUBLISH_TOKEN`, a protected `registry-release`
# environment secret whose canonical source is OpenBao
# (secret/dotmac/forgejo/ci-publisher-token). Third-party actions are pinned to
# the same reviewed full commit SHAs as the other release workflows.

on:
  workflow_dispatch:
    inputs:
      adapter:
        description: >-
          Which allowlisted stateless protocol adapter to publish. The lane is
          currently SHUT — `.github/release-adapters.json` lists none, so every
          value fails at the gate.
        required: true
        type: string
      version:
        description: "Version to publish (MUST equal the package's pyproject version)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      package_dir: ${{ steps.resolve.outputs.package_dir }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Fail closed unless THIS run is the exact current tip of protected main
      # (not merely an ancestor) — a stale or side-branch dispatch cannot publish.
      - name: Assert run is on the current protected main SHA
        run: bash scripts/assert_current_main.sh "${GITHUB_SHA}"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-poetry

      # THE GATE. Refuses an unallowlisted distribution, a pyproject whose name
      # disagrees with the dispatch, a version that was not typed exactly, an
      # entry carrying stateful-only facts, and a package whose dossier does not
      # declare the stateless classification. Everything after this step uses
      # only its output.
      - name: Resolve the allowlisted adapter
        id: resolve
        run: |
          python scripts/release_adapter.py resolve \
            "${{ inputs.adapter }}" --version "${{ inputs.version }}" \
            | tee -a "${GITHUB_OUTPUT}"

      - name: Build wheel + sdist
        working-directory: ${{ steps.resolve.outputs.package_dir }}
        run: poetry build

      # Wheel-content policy: the declared surface and py.typed present, no
      # assembly/test/tooling content, NO migration lineage anywhere under the
      # import package, dependency closure limited to the reviewed set, no
      # secret-shaped files.
      - name: Inspect artifacts
        run: |
          python scripts/release_adapter.py inspect "${{ inputs.adapter }}" \
            --dist "${{ steps.resolve.outputs.package_dir }}/dist"

      # Release-artifact smoke: install the freshly built wheel into a clean
      # venv and prove its public surface and its classification against the
      # installed bytes. No kernel artifact is built — an adapter floors on no
      # kernel and registers nothing.
      - name: Release wheel smoke
        run: |
          python scripts/release_adapter.py verify-wheel "${{ inputs.adapter }}" \
            --dist "${{ steps.resolve.outputs.package_dir }}/dist"

      - name: Upload built artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.adapter }}-dist
          path: ${{ steps.resolve.outputs.package_dir }}/dist/*
          retention-days: 90

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: registry-release    # protected: main-only + required review
    permissions:
      contents: read
    steps:
      # RE-check freshness AFTER the approval wait, before anything is
      # published. `build` proved this run was main's tip at dispatch time, but
      # a protected environment can sit pending for hours — and the approval is
      # a decision about a SHA, not about a run id. First step in the job, so it
      # fails before the artifact is fetched or the publish token is used.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Re-assert the approved SHA is still the current protected main
        run: bash scripts/assert_current_main.sh "${GITHUB_SHA}"

      # Defence in depth: the allowlist is re-checked on the publish side, so a
      # tampered `build` output cannot smuggle a target past the gate.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Re-assert the target is allowlisted
        run: |
          python scripts/release_adapter.py resolve \
            "${{ inputs.adapter }}" --version "${{ inputs.version }}" >/dev/null

      - name: Download the exact built bytes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.adapter }}-dist
          path: dist

      # Publish the SAME bytes `build` inspected and smoked — downloaded, never
      # rebuilt.
      - name: Publish to the Forgejo private index
        env:
          TWINE_USERNAME: ci-publisher
          TWINE_PASSWORD: ${{ secrets.FORGEJO_PUBLISH_TOKEN }}
        run: |
          python -m pip install --quiet twine
          python -m twine upload \
            --repository-url "https://registry.dotmac.io/api/packages/dotmac/pypi" dist/*

  verify:
    needs: [build, publish]
    runs-on: ubuntu-latest
    environment: registry-release
    permissions:
      contents: write                # create the post-verification tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # The index may lag a few seconds after publish.
      - name: Wait for the release on the Forgejo index
        env:
          IDX: https://ci-publisher:${{ secrets.FORGEJO_PUBLISH_TOKEN }}@registry.dotmac.io/api/packages/dotmac/pypi/simple/${{ inputs.adapter }}/
        run: |
          for i in $(seq 1 30); do
            if curl -sf "$IDX" | grep -q "${{ inputs.version }}"; then
              echo "available on the Forgejo index"; exit 0
            fi
            echo "not yet on the Forgejo index (attempt $i)…"; sleep 10
          done
          echo "::error::${{ inputs.adapter }} ${{ inputs.version }} did not appear in time"
          exit 1

      # Install the PUBLISHED release from the index into a clean venv and prove
      # its surface. Unlike the module lane this needs no published kernel: the
      # adapter depends on none. Its third-party dependencies come from the
      # public index, which is why both index flags are paired.
      - name: Install from the Forgejo registry and verify
        env:
          INDEX: https://ci-publisher:${{ secrets.FORGEJO_PUBLISH_TOKEN }}@registry.dotmac.io/api/packages/dotmac/pypi/simple
        run: |
          python scripts/release_adapter.py verify-registry \
            --index "${INDEX}" \
            --pin "${{ inputs.adapter }}==${{ inputs.version }}"

      # Only AFTER registry verification: tag the published SHA.
      - name: Tag the verified release
        run: |
          TAG="${{ needs.build.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" \
            -m "${{ inputs.adapter }} ${{ inputs.version }} (verified on the Forgejo registry; installed and public surface proved alone)" \
            "${GITHUB_SHA}"
          git push origin "${TAG}"
          echo "tagged ${TAG} on ${GITHUB_SHA}"
