name: CI
defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      allocation_base_sha:
        description: Immutable 40-character base SHA for the allocation gate
        required: true
        type: string

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `migration-gate` is the composed D1 gate (ADR-0006): it must reject a
        # duplicate revision / prefix / branch label / schema claim / table
        # ownership BEFORE `docker-build` produces an image, so it sits in this
        # cheap static matrix rather than anywhere near a database.
        #
        # This list must equal `make check`'s prerequisites exactly, and
        # `tests/architecture/test_ci_runs_canonical_check.py` fails the build
        # when it does not. It silently drifted once already: `ui-check` and the
        # formatting check were in `check` and in nobody's CI job, so committed
        # design-system assets and formatting were unenforced on every PR.
        target:
          [
            poetry-lock-check,
            lint,
            lint-imports,
            type-check,
            security,
            migration-gate,
            ui-check,
            module-catalog-check,
            native-check,
            # Offline and tag-free on purpose: it compares the checked-in
            # released-manifest ledger with the working tree, so it runs here
            # where `actions/checkout` fetches no tags. The tag cross-check that
            # keeps the ledger honest lives in the `unit` job, which has
            # `fetch-depth: 0`.
            manifest-digest-check,
            product-writer-check,
            rehearsal-status-check,
            # ADR-0070. Validates `deploy/product.toml` and proves the committed
            # rendered assets still match it. Offline and tag-free like the
            # ledger check above — it reads two checked-in files and compares
            # them, so it belongs in this cheap static matrix.
            deployment-check,
            format-check,
          ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-poetry
      # Native editable extensions live in package src trees, outside .venv.
      # Restoring only .venv would let Poetry skip a build whose .so is absent
      # in this checkout. Cache downloads, never incomplete editable installs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pypoetry/artifacts
          key: poetry-artifacts-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      # Poetry delegates venv creation to `virtualenv`, which on this runner
      # rejects the argv Poetry builds:
      #   virtualenv: error: argument dest: the destination . is not write-able at /
      # It fires only when the `.venv` cache MISSES — i.e. on any change to
      # poetry.lock — which is why it appeared the moment a version was bumped
      # and not before. Verified NOT to be our toolchain: poetry 2.4.1 +
      # virtualenv 21.7.1 + this exact lockfile installs cleanly in a
      # linux/amd64 python:3.12-slim container.
      #
      # The stdlib `venv` builds the same directory Poetry would adopt, and
      # sidesteps the delegation entirely. Guarded so a restored cache is never
      # clobbered.
      - run: '[ -d .venv ] || python -m venv .venv'
      - run: poetry install
      - run: make ${{ matrix.target }}

  allocation-gate:
    runs-on: ubuntu-latest
    # ADR-0006 D1, the SERIALIZATION half. `migration-gate` in the `quality`
    # matrix proves one composed tree is coherent; it cannot prove anything
    # about a tree it has never seen. Three unmerged trains each allocated
    # `prefix="sa"` and every one of them was green, because no check a branch
    # runs on itself can see a sibling branch.
    #
    # This job is the only one that compares against what is already MERGED: if
    # a branch changes a module's source, that module's ledger row must already
    # exist at the merge base. So an allocation must land on its own first,
    # where a duplicate is a conflict in one file rather than a surprise at
    # merge with a reviewed lineage to rename.
    #
    # Deliberately NOT in the `quality` matrix: that list must equal `make
    # check`'s prerequisites exactly (`test_ci_runs_canonical_check.py`), and
    # `check` must stay runnable offline, while this needs the base branch.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # MERGE-BASE EVIDENCE. A shallow checkout has no merge base with the
          # target branch, and the gate exits 2 rather than reporting a pass it
          # cannot justify — so this line is what makes the job meaningful.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # No Poetry install: the gate reads git, TOML and the syntax tree only.
      #
      # The base SHA, never the base REF. A branch ref moves, so gating
      # against it makes the answer depend on when the job ran: a module could
      # pass because somebody else's allocation landed on the base branch after
      # this PR was opened. base.sha is the immutable commit the PR targets.
      #
      # Passed through `env:` and quoted rather than interpolated into the
      # script line, so the value can never be parsed as shell.
      - name: Enforce allocation against the pull-request base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/check_allocation_serialized.py --base "$BASE_SHA"
      - name: Enforce allocation against the dispatched immutable base
        if: github.event_name == 'workflow_dispatch'
        env:
          BASE_SHA: ${{ inputs.allocation_base_sha }}
        run: python scripts/check_allocation_serialized.py --base "$BASE_SHA"

  # AGENTS.md rule 50. The window between a candidate BUILD and its PUBLICATION
  # is the only place four recurrences of one defect have ever been catchable,
  # and nothing was standing in it.
  #
  # `dotmac-deployment-foundation 0.4.0a1` is the fourth: run 33920058598 built
  # it from 753a004e on 2026-09-04, the receipt stayed in the run's artifacts,
  # and #628 and #631 then moved the facility's importable source under the
  # unchanged name. Every guard was green and every guard was right about the
  # records — the repository simply held no fact about the build.
  #
  # Not in the `quality` matrix, for the reasons `allocation-gate` is not either
  # and one more: that list must equal `make check`'s prerequisites exactly
  # (`test_ci_runs_canonical_check.py`) and `check` must stay runnable offline,
  # while this needs full history AND the Actions API. "Was a candidate built?"
  # is a claim about the build system, so per rule 30 it takes an external oracle
  # carrying immutable coordinates — the run id and the artifact id.
  #
  # Runs on push and pull_request alike. A pull request is where the source
  # actually moves and where a refusal is cheap; a push keeps `main` from being
  # the one branch nobody asks.
  candidate-window:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # REQUIRED, not tidiness: the runs and artifacts endpoints are what the
      # oracle is. Without it `gh api` gets 403, the guard exits 2, and this job
      # fails as indeterminate rather than passing — which is the intended
      # behaviour, because a guard that cannot see builds must not report none.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The comparison is between the src TREE OBJECT at a past candidate's
          # build commit and the one here. A shallow checkout does not have the
          # first, and the guard exits 2 rather than reporting a clean window it
          # cannot justify — so this line is what makes the job meaningful.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # No Poetry install: the guard reads git, TOML, JSON and the Actions API.
      #
      # `--builds-json` is deliberately absent. It exists so the sensitivity
      # proof can replay a past state offline, and passing it here would let the
      # gate be satisfied by a file in the repository instead of by the build
      # system. `test_candidate_window_binding.py` asserts this line does not
      # carry it.
      - name: Refuse a tree that has left a live candidate's bytes behind
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/candidate_source_binding.py --window --check

  module-release-append-only:
    # The tag inventory proves completeness; this separate history gate proves
    # an already accepted wheel hash cannot be edited or deleted by a PR.
    # `base.sha` and `before` are immutable commits, never a moving branch ref.
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Refuse module evidence rewrites against the immutable PR base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/check_module_release_verification_append_only.py --base "$BASE_SHA"
      - name: Refuse module evidence rewrites on main push
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
        run: python scripts/check_module_release_verification_append_only.py --base "$BASE_SHA"

  module-release-provenance:
    # Only NEW rows a PR/push appended are checked — an older row was already
    # proven when it was appended, and its run may since have expired or been
    # deleted from GitHub's retention window. PRs use the validated synthetic
    # merge's actual first parent: the event base SHA can predate that merge.
    # Pushes compare against the immutable event.before commit.
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Prove pull-request module release provenance against the actual immutable merge base
        if: github.event_name == 'pull_request'
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/module_release_provenance.py --pull-request-head "$PR_HEAD_SHA"
      - name: Prove main-push module release provenance
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/module_release_provenance.py --base "$BASE_SHA"

      - name: Derive canonical release authority ledger for review
        run: |
          preview_root="$(mktemp -d "$RUNNER_TEMP/release-authority-review.XXXXXX")"
          git archive --format=tar HEAD | tar -x -C "$preview_root"
          RELEASE_AUTHORITY_PREVIEW_ROOT="$preview_root" python - <<'PYCODE'
          import base64, hashlib, json, os, subprocess, sys
          from pathlib import Path
          archived = Path(os.environ["RELEASE_AUTHORITY_PREVIEW_ROOT"])
          artifact = Path(os.environ["RUNNER_TEMP"]) / "release-authority-review"
          artifact.mkdir(parents=True, exist_ok=True)
          ledger_rel = Path("docs/inventories/release-authority.json")
          generator_rel = Path("scripts/release_authority.py")
          original = ledger_rel.read_bytes()
          baseline_digest = hashlib.sha256(original).hexdigest()
          if hashlib.sha256((archived / ledger_rel).read_bytes()).hexdigest() != baseline_digest:
              raise SystemExit("Archived release authority ledger differs from checkout")
          subprocess.run([sys.executable, str(archived / generator_rel), "write"], cwd=archived, check=True)
          generated = (archived / ledger_rel).read_bytes()
          generated_document = json.loads(generated)
          if set(generated_document) != {"$comment", "schema", "active", "history"}:
              raise SystemExit("Unexpected canonical release authority ledger envelope")
          if ledger_rel.read_bytes() != original:
              raise SystemExit("Review derivation modified the checked-in ledger")
          (artifact / "release-authority.json").write_bytes(generated)
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          pull_request = event.get("pull_request", {})
          provenance = {
              "schema": "dotmac.release_authority.review.v1",
              "checked_out_sha": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "checked_out_tree": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip(),
              "github_sha": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "event_name": os.environ["GITHUB_EVENT_NAME"],
              "pull_request_head_sha": pull_request.get("head", {}).get("sha"),
              "pull_request_base_sha": pull_request.get("base", {}).get("sha"),
              "generator_path": str(generator_rel),
              "generator_sha256": hashlib.sha256((archived / generator_rel).read_bytes()).hexdigest(),
              "baseline_ledger_sha256": baseline_digest,
              "generated_ledger_path": str(ledger_rel),
              "generated_ledger_sha256": hashlib.sha256(generated).hexdigest(),
              "checked_in_ledger_unchanged": True,
          }
          provenance_bytes = (json.dumps(provenance, indent=2, sort_keys=True) + "\n").encode()
          (artifact / "provenance.json").write_bytes(provenance_bytes)
          # The framed payloads contain only the tracked path/digest ledger and its CI provenance.
          print("DOTMAC_RELEASE_AUTHORITY_REVIEW_V1:" + base64.b64encode(generated).decode())
          print("DOTMAC_RELEASE_AUTHORITY_PROVENANCE_V1:" + base64.b64encode(provenance_bytes).decode())
          PYCODE
      - name: Retain canonical release authority review artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-authority-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-authority-review/
          if-no-files-found: error

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # TAG EVIDENCE, not convenience. `tests/architecture/
          # test_declared_publication.py` decides whether a declared version was
          # ever published by asking for this repository's release TAGS, which a
          # default checkout does not fetch. Without them the sweep refuses and
          # the whole module used to skip — so the gate ran green, on every PR,
          # while checking nothing. The gate now FAILS on a refusal, which makes
          # this line load-bearing rather than optional.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-poetry
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pypoetry/artifacts
          key: poetry-artifacts-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      # Poetry delegates venv creation to `virtualenv`, which on this runner
      # rejects the argv Poetry builds:
      #   virtualenv: error: argument dest: the destination . is not write-able at /
      # It fires only when the `.venv` cache MISSES — i.e. on any change to
      # poetry.lock — which is why it appeared the moment a version was bumped
      # and not before. Verified NOT to be our toolchain: poetry 2.4.1 +
      # virtualenv 21.7.1 + this exact lockfile installs cleanly in a
      # linux/amd64 python:3.12-slim container.
      #
      # The stdlib `venv` builds the same directory Poetry would adopt, and
      # sidesteps the delegation entirely. Guarded so a restored cache is never
      # clobbered.
      - run: '[ -d .venv ] || python -m venv .venv'
      - run: poetry install
      - run: poetry run pytest tests/unit tests/architecture -q --cov=app --cov=dotmac_kernel --cov-report=term --junitxml=identity-unit.xml
        id: identity_unit
      # Ordinary unit/architecture collection does not include packages/*/tests.
      - name: Test FreeRADIUS package (hermetic; no live provider)
        id: freeradius_unit
        run: poetry run pytest packages/dotmac-connector-freeradius/tests -q --junitxml=freeradius-unit.xml
      - name: Require complete passing FreeRADIUS package collection
        if: always()
        env:
          PACKAGE_OUTCOME: ${{ steps.freeradius_unit.outcome }}
        run: |
          python - <<'PYCODE'
          import ast, json, os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          required = set()
          for path in Path("packages/dotmac-connector-freeradius/tests").glob("test_*.py"):
              required.update((path.stem, n.name) for n in ast.parse(path.read_text()).body
                              if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef)) and n.name.startswith("test_"))
          path = Path("freeradius-unit.xml")
          cases = list(ET.parse(path).iter("testcase")) if path.exists() else []
          collected = {(c.get("classname", "").rsplit(".", 1)[-1], c.get("name", "").split("[", 1)[0]) for c in cases}
          refused = [c.get("name", "") for c in cases if any(c.find(k) is not None for k in ("skipped", "failure", "error"))]
          missing = sorted(required - collected)
          receipt = {
              "status": "passed" if os.environ["PACKAGE_OUTCOME"] == "success" and required and not missing and not refused else "failed",
              "package_outcome": os.environ["PACKAGE_OUTCOME"],
              "run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "source_sha": os.environ["GITHUB_SHA"],
              "required_definition_count": len(required), "collected_case_count": len(cases),
              "missing_definitions": missing, "refused_cases": refused,
          }
          Path("freeradius-unit-collection.json").write_text(json.dumps(receipt, indent=2) + "\n")
          if receipt["status"] != "passed":
              raise SystemExit("Required FreeRADIUS package collection/pass evidence incomplete")
          PYCODE
      - name: Retain FreeRADIUS package test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: freeradius-unit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            freeradius-unit.xml
            freeradius-unit-collection.json
      - name: Require eight Kernel identity and all changed Learning unit modules
        id: identity_unit_collection
        if: always()
        env:
          UNIT_OUTCOME: ${{ steps.identity_unit.outcome }}
        run: |
          python - <<'PYCODE'
          import ast, json, os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          required = {
              "tests.unit.test_" + name for name in (
                  "audit_connection_writer", "authenticated_account_password_change",
                  "credential_account_reset", "credential_assignment", "identity_history",
                  "identity_history_composed_heads", "identity_history_verification",
                  "identity_provisioning",
              )
          }
          required.update(['tests.unit.test_learning_admission_enrollment', 'tests.unit.test_learning_delivery_migrations', 'tests.unit.test_learning_delivery_public_surface', 'tests.unit.test_learning_enrollment_initial_state', 'tests.unit.test_learning_invitation_assignment', 'tests.unit.test_learning_participation_models', 'tests.unit.test_learning_public_surface', 'tests.unit.test_learning_scheduling', 'tests.unit.test_learning_bank_lifecycle', 'tests.unit.test_learning_composable_terms'])
          path = Path("identity-unit.xml")
          cases = list(ET.parse(path).iter("testcase")) if path.exists() else []
          selected = [c for c in cases if any(c.get("classname", "") == m or c.get("classname", "").startswith(m + ".") for m in required)]
          seen = {m for m in required if any(c.get("classname", "") == m or c.get("classname", "").startswith(m + ".") for c in selected)}
          definitions = set()
          for module in required:
              module_source = Path(*module.split(".")).with_suffix(".py")
              for node in ast.parse(module_source.read_text()).body:
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name.startswith("test_"):
                      definitions.add((module, node.name))
                  elif isinstance(node, ast.ClassDef):
                      definitions.update((module + "." + node.name, n.name) for n in node.body if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef)) and n.name.startswith("test_"))
          collected = {(c.get("classname", ""), c.get("name", "").split("[", 1)[0]) for c in selected}
          missing = sorted(definitions - collected)
          refused = [c for c in selected if any(c.find(k) is not None for k in ("skipped", "failure", "error"))]
          receipt = {
              "status": "passed" if os.environ["UNIT_OUTCOME"] == "success" and seen == required and not missing and not refused else "failed",
              "unit_outcome": os.environ["UNIT_OUTCOME"],
              "run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "source_sha": os.environ["GITHUB_SHA"],
              "required_modules": sorted(required), "collected_modules": sorted(seen),
              "missing_definitions": missing,
              "required_nodes": [c.get("classname", "") + "::" + c.get("name", "") for c in selected],
              "unrelated_skips": [c.get("classname", "") + "::" + c.get("name", "") for c in cases if c not in selected and c.find("skipped") is not None],
          }
          Path("identity-unit-collection.json").write_text(json.dumps(receipt, indent=2) + "\n")
          if receipt["status"] != "passed":
              raise SystemExit("Required identity unit collection/pass evidence incomplete")
          PYCODE
      - name: Retain full unit and separate identity collection evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kernel-identity-unit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            identity-unit.xml
            identity-unit-collection.json


  # Slice 4's compatibility gate runs through Starter's own trusted reusable
  # workflow, pinned to the protected-main commit that introduced its
  # reviewed bytes.  Calling it at JOB level is the trust boundary: none of
  # this candidate branch's steps, PATH changes, Git wrappers or environment
  # setup run before the verifier.  The workflow owns its four immutable
  # checkouts (this revision plus the three public product revisions at the
  # exact commits the runner pins), its Python floor, and the SHA-pinned
  # runner action -- so nothing here may add a step, and an inline `run:`
  # cannot reach the gate.  The products are public: no credential, secret or
  # GitHub App is referenced or needed.
  #
  # NOTE: `tests/architecture/test_compatibility_gate.py`'s real-coordinate
  # assertion SKIPS when COMPAT_GATE_CLONE_* is unset, so it now skips inside
  # the `unit` job.  That is intentional only because the authority moved
  # here; the pytest-level skip is not evidence of anything and must never be
  # read as one.
  compatibility-gate:
    uses: michaelayoade/dotmac_starter_mt/.github/workflows/composition-compatibility.yml@883c0928c3fe75397b59cc3f72c427bb9f3b27aa

  integration:
    runs-on: ubuntu-latest
    # Single source of truth for the disposable CI Postgres. `make test-db-up`
    # brings up docker-compose.test.yml (compose up --wait) and runs
    # `alembic upgrade head` against it, then `make test-integration` composes
    # TEST_DATABASE_URL (app_user) and TEST_MIGRATION_DATABASE_URL (admin)
    # from these same TEST_DB_* values — identical to a local run.
    # NOTE: the `env:` context is not available in `jobs.<job>.services`, so
    # this job cannot use a `services:` block; docker-compose.test.yml (which
    # also sets POSTGRES_HOST_AUTH_METHOD: trust, for the same reason — the
    # initial Alembic migration creates `app_user` with LOGIN but no
    # password — trust auth is fine since this is a disposable,
    # localhost-only CI database) is the actual source of the Postgres
    # container instead.
    env:
      COMPOSE_PROJECT_NAME: starter-identity-${{ github.run_id }}-${{ github.run_attempt }}
      IDENTITY_REFERENCE_DB_NAME: starter_identity_reference_${{ github.run_id }}_${{ github.run_attempt }}
      IDENTITY_REFERENCE_DATABASE_URL: postgresql+psycopg://app_admin@localhost:5433/starter_identity_reference_${{ github.run_id }}_${{ github.run_attempt }}
      IDENTITY_GRAPH_DB_NAME: starter_identity_graph_${{ github.run_id }}_${{ github.run_attempt }}
      LEARNING_PAIR_DB_NAME: starter_learning_pair_${{ github.run_id }}_${{ github.run_attempt }}
      LEARNING_BASE_SHA: "2376d6cfa86b0578bc36b711c467995af6c5d24b"
      IDENTITY_INSTALLED_DB_NAME: starter_identity_installed_${{ github.run_id }}_${{ github.run_attempt }}
      IDENTITY_GRAPH_DATABASE_URL: postgresql+psycopg://app_admin@localhost:5433/starter_identity_graph_${{ github.run_id }}_${{ github.run_attempt }}
      IDENTITY_INSTALLED_DATABASE_URL: postgresql+psycopg://app_admin@localhost:5433/starter_identity_installed_${{ github.run_id }}_${{ github.run_attempt }}
      TEST_DB_PORT: "5433"
      TEST_DB_HOST: localhost
      TEST_DB_NAME: starter_test
      TEST_DB_ADMIN_USER: postgres
      TEST_DB_ADMIN_PASSWORD: postgres
      TEST_DB_USER: app_user
      TEST_DB_PASSWORD: app_user
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The real-PostgreSQL Approvals upgrade proofs reconstruct each
          # published ap_0001 byte set with `git show <tag>:<path>`. A shallow
          # checkout makes every case fail before it reaches PostgreSQL.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-poetry
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pypoetry/artifacts
          key: poetry-artifacts-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      # Poetry delegates venv creation to `virtualenv`, which on this runner
      # rejects the argv Poetry builds:
      #   virtualenv: error: argument dest: the destination . is not write-able at /
      # It fires only when the `.venv` cache MISSES — i.e. on any change to
      # poetry.lock — which is why it appeared the moment a version was bumped
      # and not before. Verified NOT to be our toolchain: poetry 2.4.1 +
      # virtualenv 21.7.1 + this exact lockfile installs cleanly in a
      # linux/amd64 python:3.12-slim container.
      #
      # The stdlib `venv` builds the same directory Poetry would adopt, and
      # sidesteps the delegation entirely. Guarded so a restored cache is never
      # clobbered.
      - run: '[ -d .venv ] || python -m venv .venv'
      - run: poetry install
      - run: make test-db-up
        id: identity_shared_prepare
      - run: make test-identity-reference-db-create
        id: identity_reference_create
      - name: Migrate actual four-lineage reference as its owner
        id: identity_reference_migrate
        run: |
          set -o pipefail
          make test-identity-reference-db-migrate 2>&1 | tee identity-reference-migrations.log
      - run: make test-identity-graph-db-create
        id: identity_graph_create
      - name: Prove bootstrap cancellation and custody before the full integration suite
        id: identity_bootstrap_preflight
        run: |
          PYTEST_ADDOPTS='-k "test_actual_postgresql_owner_denial_cancellation_and_custody or test_safe_exception_stage_excludes_material_and_bounds_chains"' \
            make test-integration INTEGRATION_JUNIT=identity-bootstrap-preflight.xml
      - name: Full ordinary integration suite including identity graph
        id: identity_integration
        run: make test-integration
      - name: Require Kernel identity and Learning integration nodes without required skips
        id: identity_collection
        if: always()
        run: |
          python - <<'PYCODE'
          import ast, json, re
          import xml.etree.ElementTree as ET
          from pathlib import Path
          required = {
              "tests.test_" + name for name in (
                  "audit_connection_writer", "credential_tenant_key", "identity_history",
                  "identity_history_composed_graph", "identity_history_verification",
                  "identity_provisioning", "identity_storage", "platform_session_provenance",
              )
          }
          required.update(['tests.test_learning_results', 'tests.test_learning_progress', 'tests.test_learning_completion', 'tests.test_learning_account_selection', 'tests.test_learning_admission_enrollment', 'tests.test_learning_audience_commands', 'tests.test_learning_bulk_role_authority', 'tests.test_learning_catalog_lookups', 'tests.test_learning_catalog_reads', 'tests.test_learning_certificate_read', 'tests.test_learning_cohort_commands', 'tests.test_learning_enrollment_state_migration', 'tests.test_learning_entitlements', 'tests.test_learning_gradebook_reports', 'tests.test_learning_insights', 'tests.test_learning_instructor_cohort_read', 'tests.test_learning_instructor_reads', 'tests.test_learning_invitation_assignment', 'tests.test_learning_learner_dashboard', 'tests.test_learning_participation_catalog', 'tests.test_learning_recipient_relation', 'tests.test_learning_roster_commands', 'tests.test_learning_scheduling', 'tests.test_learning_success_queue', 'tests.test_learning_support_reads', 'tests.test_learning_support_report_reads', 'tests.test_learning_bank_lifecycle', 'tests.test_learning_bank_migration', 'tests.test_learning_bank_transfer_v6', 'tests.test_learning_composable_settings_migration', 'tests.test_learning_prerequisite_conditions'])
          document = ET.parse("identity-integration.xml")
          cases = list(document.iter("testcase"))
          selected = [c for c in cases if any(c.get("classname", "") == m or c.get("classname", "").startswith(m + ".") for m in required)]
          seen = {m for m in required if any(c.get("classname", "") == m or c.get("classname", "").startswith(m + ".") for c in selected)}
          definitions = set()
          for module in required:
              path = Path(*module.split(".")).with_suffix(".py")
              for node in ast.parse(path.read_text()).body:
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name.startswith("test_"):
                      definitions.add((module, node.name))
                  elif isinstance(node, ast.ClassDef):
                      definitions.update((module + "." + node.name, n.name) for n in node.body if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef)) and n.name.startswith("test_"))
          collected = {(c.get("classname", ""), c.get("name", "").split("[", 1)[0]) for c in selected}
          missing = sorted(definitions - collected)
          observations = [p.get("value", "") for p in document.iter("property") if p.get("name") == "genuine_executed_revisions"]
          graph_observed = len(observations) == 1 and all(re.fullmatch(r"[^:;]+:[0-9a-f]{64}", item) for item in observations[0].split(";"))
          graph_observed = graph_observed and all(name + ":" in observations[0] for name in ("0030_credential_tenant_key", "lr_0006_delivery_support", "lr_0007_enrollment_state_policy", "lr_0008_prerequisite_conditions", "lr_0009_composable_policies", "lr_0010_question_bank_versions", "a001_identity_extensions", "a002_later"))
          refused = [c for c in selected if any(c.find(k) is not None for k in ("skipped", "failure", "error"))]
          unrelated_skips = [c.get("classname", "") + "::" + c.get("name", "") for c in cases if c.find("skipped") is not None and c.get("classname") not in required]
          receipt = {
              "status": "passed" if seen == required and not missing and not refused and graph_observed else "failed",
              "required_modules": sorted(required), "collected_modules": sorted(seen),
              "required_nodes": [c.get("classname", "") + "::" + c.get("name", "") for c in selected],
              "unrelated_skips": unrelated_skips, "missing_definitions": missing,
              "genuine_graph_revision_observation": graph_observed,
          }
          Path("identity-collection.json").write_text(json.dumps(receipt, indent=2) + "\n")
          if receipt["status"] != "passed":
              raise SystemExit("Required identity collection/pass evidence incomplete")
          PYCODE
      - run: make test-identity-installed-db-create
        id: identity_installed_create
      - name: Build and exercise exact candidate wheel outside checkout
        id: identity_installed
        env:
          IDENTITY_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          probe_dir=$(mktemp -d "$RUNNER_TEMP/kernel-identity.XXXXXXXX")
          echo "IDENTITY_PROBE_DIR=$probe_dir" >> "$GITHUB_ENV"
          export IDENTITY_EXPECTED_VERSION=$(python -c 'import tomllib; print(tomllib.load(open("packages/dotmac-kernel/pyproject.toml", "rb"))["tool"]["poetry"]["version"])')
          echo "IDENTITY_EXPECTED_VERSION=$IDENTITY_EXPECTED_VERSION" >> "$GITHUB_ENV"
          poetry -C "$GITHUB_WORKSPACE/packages/dotmac-kernel" build -f wheel
          shopt -s nullglob
          wheels=(packages/dotmac-kernel/dist/*.whl)
          test "${#wheels[@]}" -eq 1
          cp "${wheels[0]}" "$probe_dir/"
          cp scripts/verify_kernel_identity_installed.py "$probe_dir/probe.py"
          wheel="$probe_dir/$(basename "${wheels[0]}")"
          export IDENTITY_WHEEL_PATH="$wheel"
          export IDENTITY_WHEEL_SHA256=$(sha256sum "$wheel" | cut -d ' ' -f 1)
          echo "IDENTITY_WHEEL_PATH=$IDENTITY_WHEEL_PATH" >> "$GITHUB_ENV"
          echo "IDENTITY_WHEEL_SHA256=$IDENTITY_WHEEL_SHA256" >> "$GITHUB_ENV"
          export IDENTITY_INSTALLED_RECEIPT="$probe_dir/installed-identity.json"
          python -m venv "$probe_dir/venv"
          "$probe_dir/venv/bin/python" -m pip install "$wheel" alembic 'psycopg[binary]'
          cd "$probe_dir"
          env -u PYTHONPATH "$probe_dir/venv/bin/python" -I "$probe_dir/probe.py"
      - run: make test-learning-pair-db-create
        id: learning_pair_create
      - name: Build Learning once and exercise the exact installed pair
        id: learning_installed
        timeout-minutes: 10
        run: |
          set -euo pipefail
          probe_dir=$(mktemp -d "$RUNNER_TEMP/learning-pair.XXXXXXXX")
          echo "LEARNING_PROBE_DIR=$probe_dir" >> "$GITHUB_ENV"
          export LEARNING_EXPECTATION_PATH="$probe_dir/source-expectation.json"
          python scripts/verify_learning_installed.py --write-expectation "$LEARNING_EXPECTATION_PATH" --checkout "$GITHUB_WORKSPACE"
          test -f "$IDENTITY_WHEEL_PATH"
          test "$(sha256sum "$IDENTITY_WHEEL_PATH" | cut -d ' ' -f 1)" = "$IDENTITY_WHEEL_SHA256"
          poetry -C "$GITHUB_WORKSPACE/packages/dotmac-learning" build -f wheel
          poetry run python scripts/release_module.py inspect dotmac-learning --dist packages/dotmac-learning/dist
          shopt -s nullglob
          wheels=(packages/dotmac-learning/dist/*.whl)
          test "${#wheels[@]}" -eq 1
          cp "${wheels[0]}" "$probe_dir/"
          cp scripts/verify_learning_installed.py "$probe_dir/probe.py"
          export LEARNING_WHEEL_PATH="$probe_dir/$(basename "${wheels[0]}")"
          export LEARNING_WHEEL_SHA256=$(sha256sum "$LEARNING_WHEEL_PATH" | cut -d ' ' -f 1)
          export LEARNING_INSTALLED_RECEIPT="$probe_dir/installed-learning-pair.json"
          python -m venv "$probe_dir/venv"
          "$probe_dir/venv/bin/python" -m pip install "$IDENTITY_WHEEL_PATH" "$LEARNING_WHEEL_PATH" alembic 'psycopg[binary]'
          cd "$probe_dir"
          env -u PYTHONPATH "$probe_dir/venv/bin/python" -I "$probe_dir/probe.py"
      - name: Tear down all run-owned database volumes
        id: identity_cleanup
        if: always()
        run: make test-db-down
      - name: Record separate qualification and cleanup outcomes
        if: always()
        env:
          SHARED_PREPARE_OUTCOME: ${{ steps.identity_shared_prepare.outcome }}
          REFERENCE_CREATE_OUTCOME: ${{ steps.identity_reference_create.outcome }}
          REFERENCE_MIGRATE_OUTCOME: ${{ steps.identity_reference_migrate.outcome }}
          GRAPH_CREATE_OUTCOME: ${{ steps.identity_graph_create.outcome }}
          INSTALLED_CREATE_OUTCOME: ${{ steps.identity_installed_create.outcome }}
          INTEGRATION_OUTCOME: ${{ steps.identity_integration.outcome }}
          COLLECTION_OUTCOME: ${{ steps.identity_collection.outcome }}
          INSTALLED_OUTCOME: ${{ steps.identity_installed.outcome }}
          LEARNING_CREATE_OUTCOME: ${{ steps.learning_pair_create.outcome }}
          LEARNING_INSTALLED_OUTCOME: ${{ steps.learning_installed.outcome }}
          CLEANUP_OUTCOME: ${{ steps.identity_cleanup.outcome }}
        run: |
          python - <<'PYCODE'
          import json, os
          from pathlib import Path
          keys = ("SHARED_PREPARE_OUTCOME", "REFERENCE_CREATE_OUTCOME", "REFERENCE_MIGRATE_OUTCOME", "GRAPH_CREATE_OUTCOME", "INSTALLED_CREATE_OUTCOME", "INTEGRATION_OUTCOME", "COLLECTION_OUTCOME", "INSTALLED_OUTCOME", "LEARNING_CREATE_OUTCOME", "LEARNING_INSTALLED_OUTCOME", "CLEANUP_OUTCOME")
          status = {k: os.environ[k] for k in keys}
          status.update(run_id=os.environ["GITHUB_RUN_ID"], run_attempt=os.environ["GITHUB_RUN_ATTEMPT"], source_sha=os.environ["GITHUB_SHA"])
          membership = Path("identity-membership-cleanup.json")
          status["MEMBERSHIP_CLEANUP"] = json.loads(membership.read_text()) if membership.exists() else {"status": "not_observed"}
          Path("identity-status.json").write_text(json.dumps(status, indent=2) + "\n")
          if any(status[k] != "success" for k in keys) or status["MEMBERSHIP_CLEANUP"]["status"] != "success":
              raise SystemExit("Identity preparation, qualification or cleanup incomplete")
          PYCODE
      - name: Retain candidate-only identity evidence even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kernel-identity-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            identity-integration.xml
            identity-bootstrap-preflight.xml
            identity-collection.json
            identity-status.json
            identity-membership-cleanup.json
            identity-reference-catalog.json
            identity-reference-migrations.log
            ${{ env.IDENTITY_PROBE_DIR }}/installed-identity.json
            ${{ env.LEARNING_PROBE_DIR }}/installed-learning-pair.json
            ${{ env.LEARNING_PROBE_DIR }}/source-expectation.json

  consumer-boot:
    runs-on: ubuntu-latest
    # K4 empty-consumer WHEEL proof: build the kernel wheel, install it into a
    # CLEAN virtualenv (NOT the repo venv), and prove an external consumer that
    # imports only the public kernel surface boots and serves the DB-free
    # /health from the installed wheel — no workspace `app/` on sys.path. The
    # clean consumer pins FastAPI 0.140.13 and proves lazy included routers
    # cannot hide permission/capability guards; `kernel-floors` separately
    # proves 0.111. Needs no Postgres: the consumer boots with a deliberately
    # unreachable DATABASE_URL and /health never touches the DB. Poetry is
    # installed only as the wheel BUILD tool; the consumer venv is separate.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-poetry
      - run: bash scripts/consumer_boot_check.sh

  ui-artifact:
    runs-on: ubuntu-latest
    # The dotmac-ui counterpart of `consumer-boot`, and it exists because the
    # release lane cannot prove itself. `release-ui.yml` is a protected,
    # main-only `workflow_dispatch`, so its artifact proof runs for the first
    # time DURING the irreversible publish. Until this job existed, the only
    # pull-request evidence that the proof still worked was an architecture
    # test reading it as TEXT — which cannot tell a working proof from a
    # syntactically valid broken one.
    #
    # So this builds the wheel, installs it into a CLEAN virtualenv (never the
    # repo venv, never the checkout), and runs the EXACT script the release
    # lane runs. Jinja is installed separately, as a host would, so it never
    # becomes a dotmac-ui runtime dependency. The script itself refuses to
    # measure a source checkout, so a green run here means the installed
    # artifact really was the subject.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-poetry
      - name: Build the dotmac-ui wheel
        working-directory: packages/dotmac-ui
        run: poetry build
      - name: Prove the installed artifact with the release lane's own script
        run: |
          python -m venv /tmp/uiartifact
          /tmp/uiartifact/bin/pip install --quiet --no-deps \
            "$(ls packages/dotmac-ui/dist/*.whl)"
          /tmp/uiartifact/bin/pip install --quiet "jinja2==3.1.6"
          /tmp/uiartifact/bin/python scripts/verify_ui_release_artifact.py

  host-attester-install-artifact:
    runs-on: ubuntu-latest
    # `scripts/host_attester_install.py::download_verify_install_and_attest`
    # names a wheel filename it reads from its download location and never
    # regenerates — the prior shape reconstructed `{facility}-{version}.whl`,
    # silently dropping the mandatory python/abi/platform tags, and real pip
    # refuses that filename outright (`InvalidWheelFilename`) before looking
    # at a single byte. `tests/unit/test_host_attester_install.py` injects a
    # FAKE installer, by design (no test in that suite may shell out to pip
    # or create a venv) — which is exactly the shape that let the original
    # defect ship undetected: nothing ever asked real pip to parse the name.
    #
    # So this job is the second, independent oracle: build the real wheel,
    # install it into a CLEAN virtualenv (never the repo's own EDITABLE
    # checkout — `host_source.py` itself refuses to read an artifact digest
    # from one), and run `scripts/verify_host_attester_install_artifact.py`
    # from THAT venv's own python. It proves two things real pip must agree
    # with, not just this repository's own validator: a filename missing the
    # tags is refused by pip itself, and a genuine `pip install` followed by
    # a genuine re-read of that SAME interpreter's PEP 610 metadata produces
    # a signed observation naming the wheel's real sha256 — through a
    # function with no `metadata`/`installed` parameter for a caller to
    # substitute an answer.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-poetry
      - name: Build the dotmac-deployment-foundation wheel
        working-directory: packages/dotmac-deployment-foundation
        run: poetry build
      - name: Install the wheel into a clean, non-editable virtualenv
        run: |
          python -m venv /tmp/hostattester
          /tmp/hostattester/bin/pip install --quiet --no-deps \
            "$(ls packages/dotmac-deployment-foundation/dist/*.whl)"
      - name: Prove install-and-observe against real pip, from that venv
        run: |
          /tmp/hostattester/bin/python \
            scripts/verify_host_attester_install_artifact.py \
            "$(ls packages/dotmac-deployment-foundation/dist/*.whl)"

  kernel-floors:
    runs-on: ubuntu-latest
    # BOTH interpreters, because the products declare >=3.11 and the kernel now
    # does too: a floor proven only on 3.12 would leave the 3.11 half of that
    # claim untested, which is the same gap this job exists to close.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    # Proves the kernel's DECLARED dependency floor is real. Lowering a floor is
    # a support CLAIM, not a resolver convenience: without this job the widened
    # `fastapi>=0.111` / `pydantic>=2.7.4` range would move a clean
    # resolve-time failure into a runtime one for a consumer at the floor — and
    # the products the widening exists to unblock (dotmac_sub, dotmac_erp) sit
    # exactly there. Required, for the same reason.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The floor pydantic (2.7.4) predates 3.13 wheels and its Rust build
          # refuses 3.13 — the floor must be tested on interpreters it
          # supports, not on the newest available.
          python-version: ${{ matrix.python-version }}
      - uses: ./.github/actions/setup-poetry
      - env:
          FLOOR_PYTHON: python${{ matrix.python-version }}
        run: bash scripts/kernel_floor_check.sh
      # The other half of the same claim. The step above proves the KERNEL's
      # declared third-party floors are real; this proves a MODULE's declared
      # kernel floor is real — sufficient AT the floor, and necessary, by
      # failing against the previous PUBLISHED kernel. Two modules shipped
      # three releases each with floors seventeen versions too low, because
      # nothing ever compared a floor against anything but itself.
      - env:
          FLOOR_PYTHON: python${{ matrix.python-version }}
          MODULE_FLOOR_EVIDENCE_DIR: ${{ runner.temp }}/module-floor-evidence
        run: bash scripts/module_floor_check.sh
      - name: Retain module floor wheels and receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: module-floor-evidence-${{ matrix.python-version }}
          path: ${{ runner.temp }}/module-floor-evidence/
          if-no-files-found: error

  native-compute:
    uses: ./.github/workflows/native-compute.yml

  docker-build:
    runs-on: ubuntu-latest
    # ADR-0006 D1: the composed migration gate must REJECT an incoherent
    # composition before an image exists at all — an image whose lineages
    # collide is an image that corrupts a database on deploy. `quality` carries
    # the `migration-gate` matrix entry, so gating on it is the enforcement.
    needs: [quality, native-compute]
    # Builds the prod image and health-gates it before merge. Port/tag are
    # job-local env, not magic numbers, so they can be bumped in one place.
    env:
      APP_PORT: "8000"
      IMAGE_TAG: "starter:ci"
      SMOKE_CONTAINER: "smoke"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The deployment renderer emits TEXT. Nothing in `make check` can say
      # whether an engine loads that text — and `make check` must stay
      # Docker-free and offline, so it never will. This is the only job in
      # REQUIRED PR CI with a Docker daemon, which makes it the only place the
      # question can be asked before merge.
      #
      # It is asked here rather than only in `deployment-conformance.yml`
      # because that workflow is `workflow_call`-only and its single caller,
      # `deployment-adopter.yml`, is `workflow_dispatch`-only. The reusable
      # check is what every CONSUMING product runs; this is what THIS
      # repository runs on every pull request. Both are kept:
      # `tests/architecture/test_engine_parse_is_required_ci.py` fails the
      # build if either disappears.
      #
      # Real defect this exists for: `pids_limit` was emitted beside a
      # `deploy.resources.limits` block listing only cpus and memory, and
      # because those two keys are ALIASES, Compose rejected every project the
      # facility rendered. Sixty-six unit tests asserting rendered keys could
      # not see it; the first disposable-host rehearsal found it 45 minutes in.
      #
      # `config` parses, interpolates and validates WITHOUT starting anything:
      # no pull, no container, no network. Runtime variables are interpolated
      # with the literal string "ci-placeholder" because interpolation fails
      # closed on an unset variable, and that error would mask the structural
      # verdict this step exists for. Placeholder VALUES leak nothing — a real
      # value never reaches a rendered asset, which is what `secrets_guard`
      # enforces.
      - name: The rendered compose file parses on the engine CI runs
        shell: bash --noprofile --norc -eo pipefail {0}
        run: |
          set -euo pipefail
          compose="deploy/rendered/docker-compose.yml"
          if [ ! -f "${compose}" ]; then
            echo "::error::no rendered compose file at ${compose}"
            exit 1
          fi
          docker version --format 'engine {{.Server.Version}}'
          docker compose version --short | sed 's/^/compose /'
          env_args=()
          while read -r name; do
            [ -n "${name}" ] || continue
            env_args+=("${name}=ci-placeholder")
          done < <(grep -oE '\$\{[A-Z_][A-Z0-9_]*' "${compose}" | sed 's/\${//' | sort -u)
          echo "interpolating ${#env_args[@]} runtime variable(s) with placeholders"
          env "${env_args[@]}" docker compose -f "${compose}" config >/dev/null
          echo "the engine on this runner accepts the rendered project"

      - run: docker build --build-arg APP_PORT=${{ env.APP_PORT }} -t ${{ env.IMAGE_TAG }} .
      - name: Verify final runtime entrypoints and native closure
        env:
          NATIVE_IMAGE: ${{ env.IMAGE_TAG }}
        run: |
          docker run --rm "$NATIVE_IMAGE" alembic --version
          docker run --rm "$NATIVE_IMAGE" python -c 'import dotmac_positioning._native, dotmac_network_topology._native, dotmac_fiber_plant._native, dotmac_media_observations._native, dotmac_imports._native, dotmac_web_analytics._native, dotmac_forms._native, dotmac_surveys._native, dotmac_inventory._native, dotmac_finance._native'
      - run: |
          docker run -d --name ${{ env.SMOKE_CONTAINER }} -p ${{ env.APP_PORT }}:${{ env.APP_PORT }} \
            -e DATABASE_URL=postgresql+psycopg://x:x@localhost/x ${{ env.IMAGE_TAG }}
          for i in $(seq 1 15); do
            curl -sf http://localhost:${{ env.APP_PORT }}/health && exit 0; sleep 2;
          done
          docker logs ${{ env.SMOKE_CONTAINER }}; exit 1
