name: CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `migration-gate` is the composed D1 gate (ADR-0006): it must reject a
        # duplicate revision / prefix / branch label / schema claim / table
        # ownership BEFORE `docker-build` produces an image, so it sits in this
        # cheap static matrix rather than anywhere near a database.
        #
        # This list must equal `make check`'s prerequisites exactly, and
        # `tests/architecture/test_ci_runs_canonical_check.py` fails the build
        # when it does not. It silently drifted once already: `ui-check` and the
        # formatting check were in `check` and in nobody's CI job, so committed
        # design-system assets and formatting were unenforced on every PR.
        target:
          [
            lint,
            lint-imports,
            type-check,
            security,
            migration-gate,
            ui-check,
            format-check,
          ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-poetry
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      - run: poetry install
      - run: make ${{ matrix.target }}

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-poetry
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      - run: poetry install
      - run: poetry run pytest tests/unit tests/architecture -q --cov=app --cov=dotmac_kernel --cov-report=term

  integration:
    runs-on: ubuntu-latest
    # Single source of truth for the disposable CI Postgres. `make test-db-up`
    # brings up docker-compose.test.yml (compose up --wait) and runs
    # `alembic upgrade head` against it, then `make test-integration` composes
    # TEST_DATABASE_URL (app_user) and TEST_MIGRATION_DATABASE_URL (admin)
    # from these same TEST_DB_* values — identical to a local run.
    # NOTE: the `env:` context is not available in `jobs.<job>.services`, so
    # this job cannot use a `services:` block; docker-compose.test.yml (which
    # also sets POSTGRES_HOST_AUTH_METHOD: trust, for the same reason — the
    # initial Alembic migration creates `app_user` with LOGIN but no
    # password — trust auth is fine since this is a disposable,
    # localhost-only CI database) is the actual source of the Postgres
    # container instead.
    env:
      TEST_DB_PORT: "5433"
      TEST_DB_HOST: localhost
      TEST_DB_NAME: starter_test
      TEST_DB_ADMIN_USER: postgres
      TEST_DB_ADMIN_PASSWORD: postgres
      TEST_DB_USER: app_user
      TEST_DB_PASSWORD: app_user
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-poetry
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      - run: poetry install
      - run: make test-db-up
      - run: make test-integration
      - run: make test-db-down
        if: always()

  consumer-boot:
    runs-on: ubuntu-latest
    # K4 empty-consumer WHEEL proof: build the kernel wheel, install it into a
    # CLEAN virtualenv (NOT the repo venv), and prove an external consumer that
    # imports only the public kernel surface boots and serves the DB-free
    # /health from the installed wheel — no workspace `app/` on sys.path. The
    # clean consumer pins FastAPI 0.140.13 and proves lazy included routers
    # cannot hide permission/capability guards; `kernel-floors` separately
    # proves 0.111. Needs no Postgres: the consumer boots with a deliberately
    # unreachable DATABASE_URL and /health never touches the DB. Poetry is
    # installed only as the wheel BUILD tool; the consumer venv is separate.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-poetry
      - run: bash scripts/consumer_boot_check.sh

  kernel-floors:
    runs-on: ubuntu-latest
    # BOTH interpreters, because the products declare >=3.11 and the kernel now
    # does too: a floor proven only on 3.12 would leave the 3.11 half of that
    # claim untested, which is the same gap this job exists to close.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    # Proves the kernel's DECLARED dependency floor is real. Lowering a floor is
    # a support CLAIM, not a resolver convenience: without this job the widened
    # `fastapi>=0.111` / `pydantic>=2.7.4` range would move a clean
    # resolve-time failure into a runtime one for a consumer at the floor — and
    # the products the widening exists to unblock (dotmac_sub, dotmac_erp) sit
    # exactly there. Required, for the same reason.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The floor pydantic (2.7.4) predates 3.13 wheels and its Rust build
          # refuses 3.13 — the floor must be tested on interpreters it
          # supports, not on the newest available.
          python-version: ${{ matrix.python-version }}
      - uses: ./.github/actions/setup-poetry
      - env:
          FLOOR_PYTHON: python${{ matrix.python-version }}
        run: bash scripts/kernel_floor_check.sh

  docker-build:
    runs-on: ubuntu-latest
    # ADR-0006 D1: the composed migration gate must REJECT an incoherent
    # composition before an image exists at all — an image whose lineages
    # collide is an image that corrupts a database on deploy. `quality` carries
    # the `migration-gate` matrix entry, so gating on it is the enforcement.
    needs: quality
    # Builds the prod image and health-gates it before merge. Port/tag are
    # job-local env, not magic numbers, so they can be bumped in one place.
    env:
      APP_PORT: "8000"
      IMAGE_TAG: "starter:ci"
      SMOKE_CONTAINER: "smoke"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --build-arg APP_PORT=${{ env.APP_PORT }} -t ${{ env.IMAGE_TAG }} .
      - run: |
          docker run -d --name ${{ env.SMOKE_CONTAINER }} -p ${{ env.APP_PORT }}:${{ env.APP_PORT }} \
            -e DATABASE_URL=postgresql+psycopg://x:x@localhost/x ${{ env.IMAGE_TAG }}
          for i in $(seq 1 15); do
            curl -sf http://localhost:${{ env.APP_PORT }}/health && exit 0; sleep 2;
          done
          docker logs ${{ env.SMOKE_CONTAINER }}; exit 1
