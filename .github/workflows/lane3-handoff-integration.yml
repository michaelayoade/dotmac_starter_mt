name: Lane 3 handoff integration
defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

# Hosted Linux integration for the Lane 3 same-job broker handoff controller
# (design rows "Local socket/files", "DNS/network", "Firewall/lifecycle").
#
# Each suite runs as root inside a DISPOSABLE network namespace on a hosted
# runner: its own nftables, synthetic documentation addresses, a synthetic TCP
# DNS server, generated throwaway TLS material and generated test identities.
# Nothing here contacts OpenBao, a fleet host, a self-hosted runner or the
# GitHub API, and nothing dispatches a protected workflow. No secret is used.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: lane3-handoff-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  style:
    name: Lane 3 handoff style (format diff + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the hash-pinned linter (version from the root lock)
        run: |
          printf '%s\n' \
            'ruff==0.6.9 --hash=sha256:a67267654edc23c97335586774790cde402fb6bbdb3c2314f1fc087dee320bfa' \
            > "$RUNNER_TEMP/lint-requirements.txt"
          python -m pip install --no-deps --only-binary :all: --require-hashes \
            -r "$RUNNER_TEMP/lint-requirements.txt"
      - name: Show any formatting difference and lint the handoff sources
        run: |
          files=(
            scripts/lane3_handoff_[a-z]*.py
            tests/unit/test_lane3_handoff_protocol.py
            tests/unit/test_lane3_handoff_controller.py
            tests/unit/test_lane3_handoff_coordinator.py
            tests/unit/test_lane3_handoff_resolver.py
            tests/lane3_handoff_integration
          )
          python -m ruff format --diff "${files[@]}"
          python -m ruff check "${files[@]}"

  integration:
    name: Lane 3 handoff integration (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [local_socket_files, dns_network, firewall_lifecycle]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the hash-pinned test runner (versions from the root lock)
        run: |
          printf '%s\n' \
            'pytest==8.4.2 --hash=sha256:872f880de3fc3a5bdc88a11b39c9710c3497a547cfa9320bc3c5e62fbf272e79' \
            'iniconfig==2.3.0 --hash=sha256:f631c04d2c48c52b84d0d0549c99ff3859c98df65b3101406327ecc7d53fbf12' \
            'packaging==26.2 --hash=sha256:5fc45236b9446107ff2415ce77c807cee2862cb6fac22b8a73826d0693b0980e' \
            'pluggy==1.6.0 --hash=sha256:e920276dd6813095e9377c0bc5566d94c932c33b27a3e3945d8389c374dd4746' \
            'pygments==2.20.0 --hash=sha256:81a9e26dd42fd28a23a2d169d86d7ac03b46e2f8b59ed4698fb4785f946d0176' \
            > "$RUNNER_TEMP/test-requirements.txt"
          python -m pip install --no-deps --only-binary :all: --require-hashes \
            -r "$RUNNER_TEMP/test-requirements.txt"
      - name: Install nftables and confirm the host tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q nftables
          command -v nft setpriv unshare openssl useradd
          test "$(stat -fc %T /sys/fs/cgroup)" = cgroup2fs
      - name: Run the suite as root in a disposable network namespace
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          python_bin="$(command -v python)"
          sudo LANE3_HANDOFF_IT=1 unshare --net -- \
            "$python_bin" -B -m pytest -p no:cacheprovider -v \
            --confcutdir=tests/lane3_handoff_integration \
            "tests/lane3_handoff_integration/test_${SUITE}.py"
