name: Release kernel

# This workflow owns BUILD and PUBLISH only. It cannot tag, open a release
# record, or call the independent verifier. Publication proves that the upload
# request succeeded; adoption waits for verify-kernel-release.yml to read the
# named bytes back, clean-install both, and create or reconcile the tag.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact allocated kernel version to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Assert run is on the current protected main SHA
        run: bash scripts/assert_current_main.sh "$GITHUB_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Bind build to the allocated release lifecycle
        run: >-
          python scripts/kernel_release_authorization.py verify-release
          --phase build --version "$RELEASE_VERSION"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - uses: ./.github/actions/setup-poetry
      - name: Assert version input matches package metadata
        working-directory: packages/dotmac-kernel
        run: |
          PKG_VERSION="$(poetry version --short)"
          if [ "$RELEASE_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::input version does not match package metadata"
            exit 1
          fi
          echo "version matches package metadata"
      - name: Build CSS
        run: npm ci && npm run css:build
      - name: Build wheel and sdist once
        working-directory: packages/dotmac-kernel
        run: poetry build
      - name: Inspect artifacts
        run: >-
          bash packages/dotmac-kernel/scripts/inspect_dist.sh
          packages/dotmac-kernel/dist
      - name: Smoke the built wheel
        run: >-
          bash scripts/consumer_boot_check.sh --wheel
          packages/dotmac-kernel/dist
      - name: Upload the exact built bytes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dotmac-kernel-dist
          path: packages/dotmac-kernel/dist/*
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: registry-release
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Assert publish starts on the current protected main SHA
        run: bash scripts/assert_current_main.sh "$GITHUB_SHA"
      - name: Download the exact built bytes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dotmac-kernel-dist
          path: dist
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the hash-locked publisher tool
        run: >-
          python -m pip install --isolated --disable-pip-version-check
          --require-hashes --no-deps
          -r scripts/requirements/twine.txt
      - name: Bind publish to the allocated release lifecycle
        run: >-
          python scripts/kernel_release_authorization.py verify-release
          --phase publish --version "$RELEASE_VERSION"
      - name: Re-assert exact protected main immediately before upload
        run: bash scripts/assert_current_main.sh "$GITHUB_SHA"
      - name: Upload the exact wheel and sdist
        env:
          TWINE_USERNAME: ci-publisher
          TWINE_PASSWORD: ${{ secrets.FORGEJO_PUBLISH_TOKEN }}
        run: |
          python -m twine upload \
            --repository-url "https://registry.dotmac.io/api/packages/dotmac/pypi" \
            "dist/dotmac_kernel-${RELEASE_VERSION}-py3-none-any.whl" \
            "dist/dotmac_kernel-${RELEASE_VERSION}.tar.gz"
