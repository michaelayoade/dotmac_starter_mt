# PUBLISH a ceremony-signed candidate envelope. It never signs.
#
# Ruling Q5-B (2026-11-18; PRE-E11 design 2.5): the candidate-release signature
# is made once, in the operator's ceremony session, by an OpenBao transit key
# (`transit-a2-candidate/`, `candidate-release-v1`, non-exportable). This
# workflow takes the finished envelope as an input, verifies it, and uploads it.
# No private key exists in GitHub: there is no signing step, no PEM, and this
# file references no secret. `scripts/candidate_attestation_signer.py` has
# `render` / `assemble` / `verify` and no key path at all;
# `tests/architecture/test_candidate_attestation_signer.py` proves both.
#
# ## Why this is a separate workflow from `foundation-candidate.yml`
#
# `foundation-candidate.yml` is proved, by
# `tests/architecture/test_candidate_lane_cannot_publish.py`, to be structurally
# incapable of publishing: NO job in that file may declare `environment:`.
# This lane publishes an attestation artifact, so it cannot live in that file.
#
# ## What this lane consumes
#
# An ALREADY-COMMITTED `CandidateArtifact.v1` receipt
# (`docs/inventories/foundation-candidate-<version>.json`, resolved through
# `scripts/release_facility.py resolve-candidate`), the exact artifact fetched by
# run + artifact id (never "latest") and refused with `verify-candidate` unless
# byte-identical to the receipt, and the dispatch inputs `envelope` (the
# assembled envelope JSON) and `public_key_base64` (the PUBLIC key; checked
# against the pinned fingerprint). It rebuilds nothing.
#
# ## The pinned public identity (repository variables, no secrets)
#
#   FOUNDATION_CANDIDATE_SIGNING_KEY_ID
#   FOUNDATION_CANDIDATE_PUBLIC_KEY_FINGERPRINT
#   FOUNDATION_CANDIDATE_TRUST_ROOT_VERSION   (the enrolment UUID)
#
# An empty variable fails the run. `verify` refuses on any binding that differs
# from the pin, on a bad or absent signature, on an expired envelope, and on a
# subject that is not exactly the committed receipt's.
#
# ## What it does with the result
#
# Uploads the envelope and the bound receipt as workflow artifacts. It declares
# `contents: read`, never `contents: write`, and contains no `git commit`,
# `git push`, `gh pr create` or equivalent: committing the envelope is a
# separate reviewed change. Verifying and publishing does not admit anything
# (ADR-0070, 2026-09-08 amendment, decision 5).
#
# The `environment: foundation-candidate-signing` reference is kept. That
# environment does not exist yet and holds no secret this workflow reads; it
# must be created (main-only branch policy) before the first dispatch, and the
# three pinned variables set from Control's enrolment read-back.

name: Foundation candidate attestation
defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

on:
  workflow_dispatch:
    inputs:
      facility:
        description: >-
          Which allowlisted universal facility's committed candidate receipt
          the envelope attests. Enforced by `scripts/release_facility.py resolve`.
        required: true
        type: choice
        options:
          - dotmac-deployment-foundation
      version:
        description: >-
          Exact candidate version. Must name an already-committed
          CandidateArtifact.v1 receipt under docs/inventories/.
        required: true
        type: string
      envelope:
        description: >-
          The ceremony-signed, assembled candidate envelope (JSON). Verified
          here, never produced here.
        required: true
        type: string
      public_key_base64:
        description: >-
          The candidate-release PUBLIC key (raw ed25519, base64). Must hash to
          the pinned fingerprint repository variable.
        required: true
        type: string
      scope:
        description: >-
          `candidate` (the default) publishes the ordinary-audience envelope,
          exactly as before. `production` publishes the envelope whose audience
          a production-class target's admission policy requires, and is
          refused unless every adoption condition blocking production on this
          version has a verified, committed DrillClearance.v1.
        required: false
        default: candidate
        type: choice
        options:
          - candidate
          - production

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: foundation-candidate-signing
    permissions:
      actions: read # read another run's artifact metadata and bytes
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Publishing a candidate attestation is itself a protected-main-only act,
      # the same discipline `foundation-candidate.yml` applies to building one.
      - name: Assert this run is the current protected main SHA
        run: bash scripts/assert_current_main.sh "${GITHUB_SHA}"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: ./.github/actions/setup-poetry

      # dotmac-deployment-foundation is a path dependency (develop = true) —
      # this is a build-runner CI job importing its typed contract classes
      # directly, exactly the consumer ADR-0070 § 1 names ("consumed by CI,
      # build runners, provisioning workers and deployment hosts"). It is NOT
      # the editable-install shape `trusted_host_source.py`'s decision 4
      # refuses: nothing here calls `require_host_source`, and this job
      # installs the facility to construct typed values, not to claim it is
      # the installed artifact on a deployment host.
      - name: Install the facility from source
        run: poetry install --with dev --no-interaction

      - name: Resolve the allowlisted facility
        env:
          FACILITY: ${{ inputs.facility }}
        run: |
          python scripts/release_facility.py resolve "${FACILITY}"

      # THE CANDIDATE'S COORDINATES, READ FROM THE COMMITTED RECEIPT — never
      # from a dispatch input naming a run or artifact id directly. Identical
      # idiom to `release-facility.yml`'s publish job.
      - name: Resolve the committed candidate receipt
        id: candidate
        env:
          FACILITY: ${{ inputs.facility }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python scripts/release_facility.py resolve-candidate \
            "${FACILITY}" --version "${VERSION}" \
            | tee -a "${GITHUB_OUTPUT}"

      # Fetch by run + artifact ID, never by "latest".
      - name: Fetch the candidate artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ steps.candidate.outputs.candidate_repository }}
          ARTIFACT_ID: ${{ steps.candidate.outputs.candidate_artifact_id }}
        run: |
          set -euo pipefail
          mkdir -p candidate-dist
          gh api "/repos/${REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > candidate.zip
          python -c "import sys,zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" \
            candidate.zip candidate-dist
          ls -l candidate-dist

      # THE DIGEST GATE, before the envelope is verified or published. A
      # mismatched artifact must fail here.
      - name: Refuse anything that is not the recorded candidate
        env:
          FACILITY: ${{ inputs.facility }}
          VERSION: ${{ inputs.version }}
        run: |
          python scripts/release_facility.py verify-candidate \
            "${FACILITY}" --version "${VERSION}" \
            --dist candidate-dist

      # PRODUCTION SCOPE ONLY. Runs before the envelope is verified, so a
      # production-scope envelope is never authenticated, let alone uploaded,
      # while a blocking adoption condition has no clearance. The clearance is
      # read from the protected-main tree (this run is asserted to be the
      # current main SHA above), never from a dispatch input. The default scope
      # skips this step entirely.
      - name: Require the adoption clearance for production scope
        if: ${{ inputs.scope == 'production' }}
        env:
          FACILITY: ${{ inputs.facility }}
          VERSION: ${{ inputs.version }}
        run: |
          python3 -I scripts/foundation_adoption_gate.py require-adoptable \
            "${FACILITY}" --version "${VERSION}" --scope production

      # Authenticate the ceremony-signed envelope against the pinned public
      # identity and the committed receipt. Inputs travel through env, never
      # interpolated into the script.
      - name: Verify the ceremony-signed candidate envelope
        env:
          ENVELOPE_JSON: ${{ inputs.envelope }}
          PUBLIC_KEY_BASE64: ${{ inputs.public_key_base64 }}
          KEY_ID: ${{ vars.FOUNDATION_CANDIDATE_SIGNING_KEY_ID }}
          FINGERPRINT: ${{ vars.FOUNDATION_CANDIDATE_PUBLIC_KEY_FINGERPRINT }}
          TRUST_ROOT_VERSION: ${{ vars.FOUNDATION_CANDIDATE_TRUST_ROOT_VERSION }}
          RECEIPT: ${{ steps.candidate.outputs.candidate_receipt }}
          SCOPE: ${{ inputs.scope }}
        run: |
          set -euo pipefail
          for name in KEY_ID FINGERPRINT TRUST_ROOT_VERSION; do
            if [ -z "${!name}" ]; then
              echo "::error::the pinned repository variable for ${name} is unset; the candidate public identity must be pinned before this lane can publish." >&2
              exit 1
            fi
          done
          # The raw dispatch text is parse input only; what is uploaded is the
          # canonical record `verify --out` writes after verification succeeds.
          printf '%s' "${ENVELOPE_JSON}" > "${RUNNER_TEMP}/candidate-envelope-input.json"
          python scripts/candidate_attestation_signer.py verify \
            --envelope "${RUNNER_TEMP}/candidate-envelope-input.json" \
            --out candidate-attestation.json \
            --receipt "${RECEIPT}" \
            --public-key-base64 "${PUBLIC_KEY_BASE64}" \
            --key-id "${KEY_ID}" \
            --public-key-fingerprint "${FINGERPRINT}" \
            --trust-root-version "${TRUST_ROOT_VERSION}" \
            --summary "${GITHUB_STEP_SUMMARY}" \
            --scope "${SCOPE}"

      # Uploaded, NOT committed. A separate, reviewed change moves this into
      # `docs/inventories/` under a name a human chose, exactly as every
      # existing `foundation-candidate-<version>.json` got there.
      - name: Upload the verified candidate attestation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.facility }}-${{ inputs.scope == 'production' && 'production' || 'candidate' }}-attestation
          path: candidate-attestation.json
          retention-days: 90
          if-no-files-found: error

      # The exact CandidateArtifact.v1 receipt this attestation's subject was
      # built from, re-emitted byte-for-byte alongside the signed envelope —
      # so the later record change can bind "this attestation" to "this
      # receipt" without re-deriving either from run history.
      - name: Upload the bound candidate receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.facility }}-candidate-attestation-receipt
          path: ${{ steps.candidate.outputs.candidate_receipt }}
          retention-days: 90
          if-no-files-found: error
