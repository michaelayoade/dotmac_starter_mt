name: Install pinned Poetry
description: >-
  Install a pinned, hash-locked Poetry without a third-party action. Drop-in
  replacement for snok/install-poetry, which resolved from a MUTABLE tag in CI
  and downloaded an installer from the public network on every job.

# Scope is deliberately identical to what it replaces: install Poetry and set
# the two virtualenv options. It does NOT run actions/setup-python — call sites
# already do that explicitly, and the kernel-floors matrix must choose the
# version per job. Absorbing it here would hide that choice.
#
# Why this exists, in two parts:
#
# 1. Supply chain. `@v1` is a mutable tag; whoever controls it controls code
#    executing in CI. A local composite action has no external reference that
#    can move under it, and what it installs is pinned by hash.
#
# 2. Reliability. The old action fetched install.python-poetry.org on every
#    run, putting runner egress in the critical path of every job. It reset
#    twice within one hour on 2026-08-04 in the sibling vendor repo, both times
#    before any repository code ran. Hash pinning secures CONTENTS but does not
#    remove cold-cache network dependence, so this adds a wheel cache and
#    bounded retries.
#
# ONE LOCK PER PYTHON MINOR, and that is not incidental. pip resolves a
# different dependency SET per interpreter: on 3.11 Poetry additionally needs
# backports.tarfile, importlib_metadata and zipp, and does not need packaging.
# A single 3.12 lock used on 3.11 fails `--require-hashes` with a missing
# requirement — fails closed, but it would break the kernel-floors matrix,
# which deliberately runs BOTH interpreters.
#
# Regenerate with .github/bootstrap/regenerate.sh.

runs:
  using: composite
  steps:
    - name: Select the lock for this interpreter
      id: lock
      shell: bash
      run: |
        set -euo pipefail
        py="$(python -c 'import sys; print(f"{sys.version_info.major}{sys.version_info.minor}")')"
        req=".github/bootstrap/poetry-requirements-py${py}.txt"
        if [ ! -f "$req" ]; then
          echo "::error::no hash-locked Poetry bootstrap for Python ${py} (looked for ${req}). Generate one with .github/bootstrap/regenerate.sh — do NOT reuse another interpreter's lock, the dependency set differs."
          exit 1
        fi
        echo "req=${req}" >> "$GITHUB_OUTPUT"
        echo "using ${req}"

    # Cache pip's wheel cache, keyed on the SELECTED lock: a regenerated
    # bootstrap must MISS, or a stale entry could serve wheels the new pin no
    # longer names. (pip re-verifies hashes on install regardless, so this is a
    # latency optimisation, not a trust boundary.)
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/pip
        key: poetry-bootstrap-${{ runner.os }}-${{ hashFiles(steps.lock.outputs.req) }}

    - name: Install pinned Poetry (hash-locked)
      shell: bash
      run: |
        set -euo pipefail
        req="${{ steps.lock.outputs.req }}"
        # Bounded retries: a cold cache still needs the network, and one reset
        # should not fail a run. Bounded, because retrying forever converts a
        # real outage into a timeout with no diagnosis.
        #
        # A HASH MISMATCH is not transient and must never be retried into
        # submission. pip exits non-zero for both causes, so the attempt count
        # is low, the backoff short, and the final message points explicitly at
        # regeneration so a genuine pin failure is not misread as flakiness.
        for attempt in 1 2 3; do
          if python -m pip install --disable-pip-version-check \
               --require-hashes --only-binary=:all: -r "$req"; then
            poetry --version
            poetry config virtualenvs.create true
            poetry config virtualenvs.in-project true
            exit 0
          fi
          echo "::warning::poetry bootstrap attempt ${attempt} failed"
          sleep $((attempt * 5))
        done
        echo "::error::poetry bootstrap failed after 3 attempts — if pip reported HASH MISMATCH this is NOT a network fault; regenerate ${req} with .github/bootstrap/regenerate.sh"
        exit 1
