name: Set up the pinned native toolchain
description: Install the repository-pinned Rust compiler for native domain builds
runs:
  using: composite
  steps:
    - name: Install the pinned Rust toolchain
      shell: bash
      run: |
        set -euo pipefail
        version="$(python -c 'import tomllib; print(tomllib.load(open("scripts/native-build.toml", "rb"))["rust"])')"
        # Git-hosted runners provide rustup; no mutable installer script.
        if ! command -v rustup >/dev/null; then
          echo '::error::rustup is required; native builds run on Git-hosted runners'
          exit 1
        fi
        rustup toolchain install "$version" --profile minimal
        rustup component add rustfmt --toolchain "$version"
        rustup default "$version"
        echo "RUSTUP_TOOLCHAIN=$version" >> "$GITHUB_ENV"
        rustc --version
